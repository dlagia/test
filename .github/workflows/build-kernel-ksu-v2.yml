# ============================================================
#
# Lanjutan dari Fase 1 (build-kernel-ksu-v2.yml) yang SUDAH TERBUKTI
# BOOT NORMAL. File ini menambahkan NoMount (github.com/maxsteeel/nomount)
# di atas basis yang sama persis.
#
# NoMount: framework redirect path level VFS kernel (bukan mount --bind),
# jadi /proc/self/mountinfo tetap stock. Workflow ini mengambil IMPLEMENTASI
# resmi branch `experimental/hookless` milik maxsteeel/nomount.
#
# Branch tersebut menyediakan integrasi kernel 4.14 minimal: fs/Kconfig +
# fs/Makefile, lalu source fs/nomount.c + fs/nomount.h ditanam sebagai
# nomount.o. Tidak lagi memakai patch manual ke fs/namei.c, fs/dcache.c,
# fs/readdir.c, fs/stat.c, fs/proc/task_mmu.c, atau fs/statfs.c.
# Userspace CLI `nm` juga diambil dari branch yang sama agar API kernel/CLI
# tetap sinkron.
#
# CATATAN: branch ini diberi label experimental/hookless; tetap test lewat
# OrangeFox (backup Boot dulu) sebelum dianggap final.
#
# WAJIB: test lewat OrangeFox (backup Boot dulu!) sebelum dianggap final,
# SAMA seperti Fase 1. Kernel ini basis sama dengan yang sudah terbukti
# boot, tapi NoMount menyentuh VFS inti - tetap test dulu.
#
# ReSukiSU diintegrasikan mengikuti setup.sh resmi branch main.
# Untuk kernel 4.14 digunakan CONFIG_KSU_MANUAL_HOOK=y dan manual hooks
# yang diwajibkan oleh manual_hook_check.mk. Hook otomatis LSM hanya dipakai
# untuk input/setuid/initrc sesuai kemampuan kernel 4.14.
# Patch lain (NoMount/Re:Kernel/CVE/Baseband) tetap dipisahkan dari ReSukiSU.
#
# Re:Kernel (github.com/Sakion-Team/Re-Kernel): membuka netlink server
# supaya tombstone/freezer di userspace tahu kapan binder call atau
# signal (SIGKILL/SIGTERM/SIGABRT/SIGQUIT) menyasar proses yang sedang
# di-freeze cgroup, jadi bisa di-unfreeze tepat waktu (kurangi ANR).
# Ditanam manual sesuai Integrate/README.md repo tsb (mode <=5.4).
#
# CATATAN JUJUR: BEDA dari ReSukiSU/NoMount di atas, hook Re:Kernel ini
# TIDAK diverifikasi baris-per-baris ke source dlagia/android_kernel_
# xiaomi_rosemary (repo itu tidak ditemukan publik untuk dicek manual).
# Anchor pakai pola toleran-spasi + pengecekan "match harus tepat 1x"
# sebelum menyisipkan kode (lihat step-nya) - kalau struktur binder.c/
# signal.c di source ini beda dari referensi AOSP-style Re-Kernel, step
# ini GAGAL dengan pesan jelas, bukan diam-diam menghasilkan kernel yang
# rusak. Kalau gagal, kirim balik isi fungsi binder_transaction(),
# binder_alloc_new_buf_locked(), dan do_send_sig_info() dari source asli
# supaya anchor-nya disesuaikan.
# ============================================================

on:
  workflow_dispatch: {}
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Pasang dependency build
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl flex git kmod \
            libelf-dev libssl-dev zip zlib1g-dev \
            libtinfo5 libncurses5 gcc-aarch64-linux-gnu

      - name: Clone source kernel (dlagia/android_kernel_xiaomi_rosemary @ rosemary-13)
        run: |
          git clone --depth=1 -b rosemary-13 \
            https://github.com/dlagia/android_kernel_xiaomi_rosemary.git kernel

      - name: Samakan SUBLEVEL dengan versi stock (4.14.186) - hasil temuan fsck.f2fs
        working-directory: kernel
        run: |
          # fsck.f2fs vendor Xiaomi (biner terpisah, di luar build ini) hardcode
          # "4.14.186-perf" sebagai versi kernel yang ia harapkan. Supaya uname -r
          # kernel custom ini SAMA PERSIS dengan itu (bukan cuma LOCALVERSION-nya,
          # tapi angka SUBLEVEL asli di Makefile), ubah di sini SEBELUM apa pun
          # lain dibangun - supaya konsisten di seluruh proses compile & versi
          # LINUX_VERSION_CODE yang dipakai kode sumber (masih di rentang 4.14.x
          # yang sama, jadi tidak mempengaruhi cabang kondisional versi manapun
          # di patch ReSukiSU/NoMount/Re-Kernel/CVE).
          grep -n '^SUBLEVEL = ' Makefile
          sed -i 's/^SUBLEVEL = .*/SUBLEVEL = 186/' Makefile
          grep -n '^SUBLEVEL = ' Makefile

      - name: Integrasikan ReSukiSU resmi (branch main)
        working-directory: kernel
        run: |
          # Gunakan setup.sh RESMI ReSukiSU tanpa branch Manual Hook.
          # setup.sh resmi saat ini:
          #   - clone https://github.com/ReSukiSU/ReSukiSU -> KernelSU
          #   - checkout main
          #   - symlink drivers/kernelsu -> KernelSU/kernel
          #   - menambahkan Kconfig/Makefile integration
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

          test -d KernelSU || {
            echo "ERROR: direktori KernelSU tidak ditemukan"
            exit 1
          }
          test -L drivers/kernelsu || {
            echo "ERROR: drivers/kernelsu bukan symlink hasil setup.sh resmi"
            exit 1
          }

          echo "==================== ReSukiSU SOURCE ===================="
          cd KernelSU
          echo "branch : $(git branch --show-current)"
          echo "commit : $(git rev-parse HEAD)"
          echo "short  : $(git rev-parse --short HEAD)"
          echo "date   : $(git log -1 --format=%ci)"
          echo "subject: $(git log -1 --format=%s)"
          test "$(git branch --show-current)" = "main" || {
            echo "ERROR: ReSukiSU harus berasal dari branch main resmi"
            exit 1
          }
          cd ..

          echo "ReSukiSU official main source: OK"
          readlink -f drivers/kernelsu

      - name: Terapkan Manual Hook ReSukiSU untuk kernel 4.14
        working-directory: kernel
        run: |
          # ReSukiSU resmi TIDAK memakai Manual Hook branch di sini.
          # manual_hook_check.mk akan memeriksa hook yang diwajibkan.
          #
          # Untuk kernel 4.14 rosemary ini, hook yang wajib dipasang manual:
          #   fs/stat.c      : ksu_handle_stat
          #                    ksu_handle_newfstat_ret
          #                    ksu_handle_fstat64_ret
          #   fs/exec.c      : ksu_handle_execveat
          #   fs/open.c      : ksu_handle_faccessat
          #   kernel/reboot.c: ksu_handle_sys_reboot
          #
          # Input/setuid/initrc dapat menggunakan LSM auto hooks pada kernel
          # lama, sehingga diaktifkan lewat CONFIG_KSU_MANUAL_HOOK_AUTO_*.
          #
          # Pola patch di bawah mengikuti dokumentasi resmi ReSukiSU
          # manual-integrate dan gagal keras bila anchor source berubah.

          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != 1:
                  raise SystemExit(
                      f"ERROR: anchor {label!r} di {path} ditemukan {n} kali; "
                      "source kernel berbeda dari layout yang diharapkan."
                  )
              p.write_text(s.replace(old, new, 1))

          # ------------------------------------------------------------
          # fs/stat.c
          # ------------------------------------------------------------
          replace_once(
              "fs/stat.c",
              """SYSCALL_DEFINE2(newlstat, const char __user *, filename,
                          struct stat __user *, statbuf)
          {""",
              """#ifdef CONFIG_KSU_MANUAL_HOOK
          __attribute__((hot))
          extern int ksu_handle_stat(int *dfd, const char __user **filename_user,
                                      int *flags);
          extern void ksu_handle_newfstat_ret(unsigned int *fd,
                                               struct stat __user **statbuf_ptr);
          #if defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_COMPAT_STAT64)
          extern void ksu_handle_fstat64_ret(unsigned long *fd,
                                              struct stat64 __user **statbuf_ptr);
          #endif
          #endif

          SYSCALL_DEFINE2(newlstat, const char __user *, filename,
                          struct stat __user *, statbuf)
          {""",
              "stat declarations",
          )

          replace_once(
              "fs/stat.c",
              """\terror = vfs_fstatat(dfd, filename, &stat, flag);
          \tif (error)
          \t\treturn error;
          \treturn cp_new_stat(&stat, statbuf);
          }
          #endif""",
              """#ifdef CONFIG_KSU_MANUAL_HOOK
          \tksu_handle_stat(&dfd, &filename, &flag);
          #endif
          \terror = vfs_fstatat(dfd, filename, &stat, flag);
          \tif (error)
          \t\treturn error;
          \treturn cp_new_stat(&stat, statbuf);
          }
          #endif""",
              "newfstatat hook",
          )

          replace_once(
              "fs/stat.c",
              """\tif (!error)
          \t\terror = cp_new_stat(&stat, statbuf);

          \treturn error;
          }

          #if defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_COMPAT_STAT64)""",
              """\tif (!error)
          \t\terror = cp_new_stat(&stat, statbuf);

          #ifdef CONFIG_KSU_MANUAL_HOOK
          \tksu_handle_newfstat_ret(&fd, &statbuf);
          #endif
          \treturn error;
          }

          #if defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_COMPAT_STAT64)""",
              "newfstat return hook",
          )

          replace_once(
              "fs/stat.c",
              """\tif (!error)
          \t\terror = cp_new_stat64(&stat, statbuf);

          \treturn error;
          }

          SYSCALL_DEFINE4(fstatat64, int, dfd, const char __user *, filename,""",
              """\tif (!error)
          \t\terror = cp_new_stat64(&stat, statbuf);

          #ifdef CONFIG_KSU_MANUAL_HOOK
          \tksu_handle_fstat64_ret(&fd, &statbuf);
          #endif
          \treturn error;
          }

          SYSCALL_DEFINE4(fstatat64, int, dfd, const char __user *, filename,""",
              "fstat64 return hook",
          )

          replace_once(
              "fs/stat.c",
              """\terror = vfs_fstatat(dfd, filename, &stat, flag);
          \tif (error)
          \t\treturn error;
          \treturn cp_new_stat64(&stat, statbuf);
          }
          #endif /* __ARCH_WANT_STAT64 || __ARCH_WANT_COMPAT_STAT64 */""",
              """#ifdef CONFIG_KSU_MANUAL_HOOK
          \tksu_handle_stat(&dfd, &filename, &flag);
          #endif
          \terror = vfs_fstatat(dfd, filename, &stat, flag);
          \tif (error)
          \t\treturn error;
          \treturn cp_new_stat64(&stat, statbuf);
          }
          #endif /* __ARCH_WANT_STAT64 || __ARCH_WANT_COMPAT_STAT64 */""",
              "fstatat64 hook",
          )

          # ------------------------------------------------------------
          # fs/exec.c — kernel 3.14+ variant: ksu_handle_execveat
          # ------------------------------------------------------------
          replace_once(
              "fs/exec.c",
              """int do_execve(struct filename *filename,
          \tconst char __user *const __user *__argv,""",
              """#ifdef CONFIG_KSU_MANUAL_HOOK
          __attribute__((hot))
          extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,
                                          void *argv, void *envp, int *flags);
          #endif

          int do_execve(struct filename *filename,
          \tconst char __user *const __user *__argv,""",
              "execve declaration",
          )

          replace_once(
              "fs/exec.c",
              """\tstruct user_arg_ptr argv = { .ptr.native = __argv };
          \tstruct user_arg_ptr envp = { .ptr.native = __envp };
          \treturn do_execveat_common(AT_FDCWD, filename, argv, envp, 0);
          }""",
              """\tstruct user_arg_ptr argv = { .ptr.native = __argv };
          \tstruct user_arg_ptr envp = { .ptr.native = __envp };
          #ifdef CONFIG_KSU_MANUAL_HOOK
          \tksu_handle_execveat((int *)AT_FDCWD, &filename, &argv, &envp, 0);
          #endif
          \treturn do_execveat_common(AT_FDCWD, filename, argv, envp, 0);
          }""",
              "execve hook",
          )

          replace_once(
              "fs/exec.c",
              """\tstruct user_arg_ptr envp = {
          \t\t.is_compat = true,
          \t\t.ptr.compat = __envp,
          \t};
          \treturn do_execveat_common(AT_FDCWD, filename, argv, envp, 0);
          }""",
              """\tstruct user_arg_ptr envp = {
          \t\t.is_compat = true,
          \t\t.ptr.compat = __envp,
          \t};
          #ifdef CONFIG_KSU_MANUAL_HOOK
          \tksu_handle_execveat((int *)AT_FDCWD, &filename, &argv, &envp, 0);
          #endif
          \treturn do_execveat_common(AT_FDCWD, filename, argv, envp, 0);
          }""",
              "compat execve hook",
          )

          # ------------------------------------------------------------
          # fs/open.c — 4.19- variant
          # ------------------------------------------------------------
          replace_once(
              "fs/open.c",
              """/* 
           * access() needs to use the real uid/gid, not the effective uid/gid.""",
              """#ifdef CONFIG_KSU_MANUAL_HOOK
          __attribute__((hot))
          extern int ksu_handle_faccessat(int *dfd,
                                           const char __user **filename_user,
                                           int *mode, int *flags);
          #endif

          /*
           * access() needs to use the real uid/gid, not the effective uid/gid.""",
              "faccessat declaration",
          )

          replace_once(
              "fs/open.c",
              """SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)
          {
          \tconst struct cred *old_cred;""",
              """SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)
          {
          #ifdef CONFIG_KSU_MANUAL_HOOK
          \tksu_handle_faccessat(&dfd, &filename, &mode, NULL);
          #endif
          \tconst struct cred *old_cred;""",
              "faccessat hook",
          )

          # ------------------------------------------------------------
          # kernel/reboot.c — kernel 3.12+ variant
          # ------------------------------------------------------------
          replace_once(
              "kernel/reboot.c",
              """static DEFINE_MUTEX(reboot_mutex);

          /*
           * Reboot system call:""",
              """static DEFINE_MUTEX(reboot_mutex);

          #ifdef CONFIG_KSU_MANUAL_HOOK
          extern int ksu_handle_sys_reboot(int magic1, int magic2,
                                           unsigned int cmd, void __user **arg);
          #endif

          /*
           * Reboot system call:""",
              "reboot declaration",
          )

          replace_once(
              "kernel/reboot.c",
              """\tchar buffer[256];
          \tint ret = 0;

          \t/* We only trust the superuser with rebooting the system. */""",
              """\tchar buffer[256];
          \tint ret = 0;

          #ifdef CONFIG_KSU_MANUAL_HOOK
          \tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);
          #endif

          \t/* We only trust the superuser with rebooting the system. */""",
              "reboot hook",
          )

          print("ReSukiSU manual hooks: all required 4.14 anchors patched exactly once.")
          PY

          echo "==================== VERIFY ReSukiSU MANUAL HOOKS ===================="
          for f in fs/stat.c fs/exec.c fs/open.c kernel/reboot.c; do
            test -f "$f"
          done
          grep -n "ksu_handle_stat" fs/stat.c
          grep -n "ksu_handle_newfstat_ret" fs/stat.c
          grep -n "ksu_handle_fstat64_ret" fs/stat.c
          grep -n "ksu_handle_execveat" fs/exec.c
          grep -n "ksu_handle_faccessat" fs/open.c
          grep -n "ksu_handle_sys_reboot" kernel/reboot.c

      - name: Integrasikan NoMount (experimental/hookless)
        working-directory: kernel
        run: |
          # NoMount branch: maxsteeel/nomount experimental/hookless
          # Ikuti struktur resmi branch ini untuk kernel 4.14:
          #   fs/nomount -> ../NoMount/kernel/src
          #   fs/Kconfig -> source "fs/nomount/Kconfig"
          #   fs/Makefile -> obj-$(CONFIG_NOMOUNT) += nomount/
          # Tidak menyalin nomount.c/nomount.h langsung ke fs/.
          # Tidak menyuntik hook manual ke fs/namei.c, fs/dcache.c,
          # fs/readdir.c, fs/stat.c, fs/proc/task_mmu.c, atau fs/statfs.c.

          rm -rf NoMount
          git clone --depth=1 -b experimental/hookless \
            https://github.com/maxsteeel/nomount.git NoMount

          # Pastikan source branch yang dipakai benar-benar memiliki
          # layout kernel/src yang diharapkan oleh patch 4.14.
          test -s NoMount/kernel/src/Kconfig
          test -s NoMount/kernel/src/Makefile
          test -s NoMount/kernel/src/nomount.c
          test -s NoMount/kernel/src/nomount.h

          # fs/nomount adalah symlink ke kernel/src, sesuai setup.sh resmi.
          rm -rf fs/nomount
          ln -s ../NoMount/kernel/src fs/nomount

          # Terapkan patch integrasi resmi 4.14 dari branch experimental/hookless.
          git apply --verbose NoMount/kernel/patches/nomount_4.14_kernel_integration.patch

          echo "==================== NoMount HOOKLESS ===================="
          echo "NoMount source: $(readlink -f fs/nomount)"
          echo "NoMount commit: $(git -C NoMount rev-parse --short HEAD)"
          echo ""
          echo "== fs/Kconfig =="
          grep -nF 'source "fs/nomount/Kconfig"' fs/Kconfig
          echo "== fs/Makefile =="
          grep -nF 'obj-$(CONFIG_NOMOUNT) += nomount/' fs/Makefile
          echo "== NoMount source =="
          test -L fs/nomount
          test -s fs/nomount/Kconfig
          test -s fs/nomount/Makefile
          test -s fs/nomount/nomount.c
          test -s fs/nomount/nomount.h
          grep -n '^config NOMOUNT' fs/nomount/Kconfig
          grep -n 'obj-$(CONFIG_NOMOUNT).*nomount.o' fs/nomount/Makefile

          # Pastikan hook NoMount lama TIDAK ikut masuk ke source kernel.
          if grep -R -nE 'nomount_hooks.patch|nomount_handle_(getname|permission|dpath|iterate_dir|getattr)|nomount_spoof_(mmap_metadata|statfs)' \
              fs/namei.c fs/dcache.c fs/readdir.c fs/stat.c fs/proc/task_mmu.c fs/statfs.c 2>/dev/null; then
            echo "ERROR: hook NoMount lama masih terdeteksi di source kernel"
            exit 1
          fi

          echo "NoMount experimental/hookless: integration OK"

      - name: Tambal CVE-2026-43499 (GhostLock, rtmutex/futex UAF -> local root exploit)
        working-directory: kernel
        run: |
          # Bug nyata 15 tahun di kernel Linux (rt_mutex/futex remove_waiter()),
          # dipakai UNTUK dapat root tanpa privilese - berbahaya buat SEMUA app
          # yg jalan di HP ini, bukan cuma kita. Backport diverifikasi manual dari
          # commit upstream 3bfdc63936dd, disesuaikan ke struktur kernel 4.14 kita
          # (source modern pakai rt_mutex_base/scoped_guard yg belum ada di 4.14).
          echo "" | base64 -d > /tmp/cve-2026-43499-ghostlock.patch
          git apply --verbose /tmp/cve-2026-43499-ghostlock.patch
          grep -c CVE-2026-43499 kernel/locking/rtmutex.c

      - name: Integrasikan Re:Kernel (Sakion-Team) - notifikasi freeze binder/signal
        working-directory: kernel
        run: |
          # https://github.com/Sakion-Team/Re-Kernel
          # CATATAN JUJUR: beda dari ReSukiSU/NoMount di atas, hook ini TIDAK
          # divalidasi baris-per-baris ke source dlagia/android_kernel_xiaomi_rosemary
          # (repo itu tidak ditemukan publik untuk dicek manual). Dipakai pencocokan
          # pola toleran-spasi + validasi "match harus tepat 1x" SEBELUM menyisipkan
          # kode (lihat apply_rekernel_hooks.pl) - kalau anchor tidak ketemu persis
          # 1x, step ini GAGAL dengan pesan jelas, bukan diam-diam korup file.
          mkdir -p drivers/rekernel
          echo "" | base64 -d > drivers/rekernel/rekernel.h
          echo "" | base64 -d > drivers/rekernel/rekernel.c
          echo "b2JqLSQoQ09ORklHX1JFS0VSTkVMKSArPSByZWtlcm5lbC5vCg==" | base64 -d > drivers/rekernel/Makefile
          echo "" | base64 -d > drivers/rekernel/Kconfig

          grep -q 'rekernel/' drivers/Makefile || echo 'obj-y += rekernel/' >> drivers/Makefile
          grep -q 'rekernel/Kconfig' drivers/Kconfig || echo 'source "drivers/rekernel/Kconfig"' >> drivers/Kconfig

          sed -i '1i #include "../rekernel/rekernel.h"' drivers/android/binder.c
          sed -i '1i #include "../rekernel/rekernel.h"' drivers/android/binder_alloc.c
          sed -i '1i #include "../drivers/rekernel/rekernel.h"' kernel/signal.c

          echo "" | base64 -d > /tmp/apply_rekernel_hooks.pl
          perl /tmp/apply_rekernel_hooks.pl

          grep -c 'rekernel_start_server' drivers/android/binder.c drivers/android/binder_alloc.c kernel/signal.c

      - name: Integrasikan Baseband-guard (LSM anti-tulis baseband/boot chain)
        working-directory: kernel
        run: |
          # https://github.com/vc-teahouse/Baseband-guard
          # LSM ringan yang memblokir tulisan tak sah ke partisi/device node kritis
          # (baseband, boot chain) di level kernel. Dipasang via setup.sh resmi milik
          # proyek ini sendiri (pola sama seperti setup.sh ReSukiSU) - bukan patch
          # tertanam manual, jadi selalu ambil versi terbaru tiap build.
          wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash

          # LSM baru harus didaftarkan ke daftar default LSM stack di security/Kconfig
          # supaya benar-benar aktif tanpa perlu di-set manual lewat cmdline kernel.
          # Ini command RESMI dari README proyek, khusus untuk build otomatis/CI
          # (peringatan resmi: setup.sh --cleanup akan menghapus semua default LSM
          # Kconfig kalau dijalankan, makanya proyeknya sendiri menyarankan sed
          # langsung ini untuk skrip build otomatis, bukan menjalankan --cleanup).
          grep -q 'baseband_guard' security/Kconfig && echo "baseband_guard: sudah terdaftar di default LSM list" || \
            sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig
          grep -n 'baseband_guard' security/Kconfig || echo "baseband_guard: PERINGATAN - tidak ketemu di security/Kconfig setelah sed, cek manual"

      - name: Pra-compile - perbaikan build source MTK (verified reusable)
        working-directory: kernel
        run: |
          # 1) buang -Werror standalone dari Makefile/Kbuild (per-folder MTK), jaga -Werror=/-Werror- yg sah
          grep -rlZ --include=Makefile --include=Kbuild --include='*.mk' -e '-Werror' . 2>/dev/null \
            | xargs -0 -r sed -i -E -e 's/-Werror=[A-Za-z0-9_-]+//g' -e 's/(-Werror)([[:space:]]|$)/\2/g' || true
          # 2) buang atribut no_sanitize("...") yg tak dikenal GCC 4.9 (harmless)
          grep -rlZ 'no_sanitize(' . 2>/dev/null \
            | xargs -0 -r sed -i -E 's/__attribute__\(\(no_sanitize\("[^"]*"\)\)\)//g' || true
          # 3) buang 'inline' dari fungsi ber-EXPORT yg body-nya out-of-line
          sed -i 's/inline void ksm_flock(/void ksm_flock(/' include/linux/keyslot-manager.h block/keyslot-manager.c || true
          sed -i 's/^inline void blk_crypto_flock(/void blk_crypto_flock(/' include/linux/blk-crypto.h block/blk-crypto.c || true
          sed -i 's/inline int typec_pd_start_entry(/int typec_pd_start_entry(/' drivers/misc/mediatek/typec/tcpc/inc/tcpci_typec.h drivers/misc/mediatek/typec/tcpc/tcpci_typec.c || true
          # 4) touch Focaltech: stub firmware yg hilang di SEMUA folder driver focaltech
          find drivers/input/touchscreen -name focaltech_config.h -printf '%h\n' 2>/dev/null | while read d; do
            mkdir -p "$d/include/firmware"
            printf '0x00\n' > "$d/include/firmware/fw_sample.i"
            echo "stub firmware -> $d/include/firmware/fw_sample.i"
          done
          # 5) bq2597x: izinkan FP di file ini saja kalau ada (sudah dibungkus kernel_neon_begin/end)
          grep -rl 'bq2597x_charger.o' --include=Makefile . 2>/dev/null | while read mk; do
            echo 'CFLAGS_REMOVE_bq2597x_charger.o += -mgeneral-regs-only' >> "$mk"
            echo "CFLAGS_REMOVE ditambah ke: $mk"
          done
          echo '== cek sisa =='
          echo -n 'no_sanitize( tersisa: '; grep -rl 'no_sanitize(' --include='*.h' --include='*.c' . 2>/dev/null | wc -l

      - name: Aktifkan KSU di defconfig
        working-directory: kernel
        run: |
          DEF=arch/arm64/configs/rosemary_defconfig
          {
            echo ""
            echo "# Penamaan versi kernel - samakan dengan string vendor stock (fsck.f2fs: 4.14.186-perf)."
            echo "# Angka SUBLEVEL sudah diubah ke 186 di Makefile (step lebih awal);"
            echo "# di sini cuma tinggal set suffix '-perf' supaya uname -r jadi '4.14.186-perf' persis."
            echo 'CONFIG_LOCALVERSION="-perf"'
            echo "CONFIG_LOCALVERSION_AUTO=n"
            echo ""
            echo "# ReSukiSU Manual Hook"
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_TRACEPOINT_HOOK=n"
            echo "CONFIG_KSU_MANUAL_HOOK=y"
            echo "CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK=y"
            echo "CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK=y"
            echo "CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK=y"
            echo "CONFIG_KSU_SUSFS=n"
            echo "CONFIG_KALLSYMS=y"
            echo "CONFIG_KALLSYMS_ALL=y"
            echo ""
            echo "# NoMount"
            echo "CONFIG_NOMOUNT=y"
            echo ""
            echo "# Re:Kernel"
            echo "CONFIG_REKERNEL=y"
            echo ""
            echo "# Baseband-guard"
            echo "CONFIG_BBG=y"
            echo ""
          } >> "$DEF"
          tail -25 "$DEF"

      - name: Ambil toolchain proton-clang (dipakai penulis kernel ini di b.sh)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang-proton

      - name: Compile kernel
        working-directory: kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang-proton/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER=build
          export KBUILD_BUILD_HOST=kernel
          # Timestamp build ditetapkan manual (bukan waktu build CI sebenarnya) supaya
          # cocok dengan tanggal pembaruan keamanan yang ditampilkan di HP (2024-07-01).
          # Format persis output 'date' asli Linux: nama hari/bulan singkatan 3 huruf,
          # tanggal di-pad SPASI (bukan nol) kalau <10 - 1 Juli 2024 jatuh hari SENIN,
          # bukan Sabtu, supaya hari & tanggal tetap konsisten satu sama lain.
          export KBUILD_BUILD_TIMESTAMP="Mon Jul  1 17:32:55 CST 2024"
          make O=out rosemary_defconfig

          echo ""
          echo "==================== RESOLVED ReSukiSU CONFIG ===================="
          grep -E '^(CONFIG_KSU|CONFIG_KALLSYMS)' out/.config || true

          grep -q '^CONFIG_KSU=y$' out/.config || {
            echo "ERROR: CONFIG_KSU tidak resolve ke y"
            exit 1
          }
          grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' out/.config || {
            echo "ERROR: CONFIG_KSU_MANUAL_HOOK tidak resolve ke y"
            exit 1
          }
          grep -q '^CONFIG_KALLSYMS=y$' out/.config || {
            echo "ERROR: CONFIG_KALLSYMS tidak resolve ke y"
            exit 1
          }
          grep -q '^CONFIG_KALLSYMS_ALL=y$' out/.config || {
            echo "ERROR: CONFIG_KALLSYMS_ALL tidak resolve ke y"
            exit 1
          }

          if grep -q '^CONFIG_KSU_TRACEPOINT_HOOK=y$' out/.config; then
            echo "ERROR: CONFIG_KSU_TRACEPOINT_HOOK=y aktif; kernel 4.14 harus memakai Manual Hook"
            exit 1
          fi

          if grep -q '^CONFIG_KSU_SUSFS=y$' out/.config; then
            echo "ERROR: CONFIG_KSU_SUSFS=y aktif; build ini ditujukan untuk Manual Hook tanpa SUSFS"
            exit 1
          fi

          grep -q '^CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK=y$' out/.config || {
            echo "ERROR: CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK tidak resolve ke y"
            exit 1
          }
          grep -q '^CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK=y$' out/.config || {
            echo "ERROR: CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK tidak resolve ke y"
            exit 1
          }
          grep -q '^CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK=y$' out/.config || {
            echo "ERROR: CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK tidak resolve ke y"
            exit 1
          }

          echo "ReSukiSU official main + Manual Hook: CONFIG OK"

          set -o pipefail
          if ! make -k O=out -j"$(nproc)" \
                ARCH=arm64 \
                CC=clang \
                AR=llvm-ar \
                NM=llvm-nm \
                OBJCOPY=llvm-objcopy \
                OBJDUMP=llvm-objdump \
                STRIP=llvm-strip \
                CROSS_COMPILE=aarch64-linux-gnu- \
                CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                CONFIG_SECTION_MISMATCH_WARN_ONLY=y \
                KCFLAGS="-Wno-error" 2>&1 | tee /tmp/build.log; then
            echo ""
            echo "==================== BARIS ERROR (kirim ini) ===================="
            grep -niE "error:|fatal error|undefined reference|No such file|multiple definition|recipe for target|Error [0-9]" /tmp/build.log | tail -120 || true
            echo "==================== KONTEKS TIAP KEGAGALAN (kirim ini juga) ===================="
            for L in $(grep -n 'Error 1' /tmp/build.log | head -3 | cut -d: -f1); do
              S=$((L-40)); [ $S -lt 1 ] && S=1
              echo "----- konteks baris $S s/d $L -----"
              sed -n "${S},${L}p" /tmp/build.log
            done
            echo "==================== 50 BARIS TERAKHIR ===================="
            tail -50 /tmp/build.log
            echo ""
            echo ">>> BUILD GAGAL. Salin blok BARIS ERROR di atas dan kirim balik."
            exit 1
          fi
          ls -la out/arch/arm64/boot/
          echo ""
          echo "==================== VERIFIKASI ReSukiSU MANUAL HOOK ===================="
          grep -iE "manual_hook|You lost|You should integrate|incompatible hook" /tmp/build.log || true
          echo ""
          echo "Jika ada 'You lost ... hook', build dihentikan oleh manual_hook_check.mk."

      - name: Compile nm (NoMount userspace CLI dari experimental/hookless)
        run: |
          rm -rf nm-src
          git clone --depth=1 -b experimental/hookless \
            https://github.com/maxsteeel/nomount.git /tmp/nomount-userspace
          mkdir -p nm-src
          cp /tmp/nomount-userspace/userspace/src/nm.c nm-src/nm.c
          cp /tmp/nomount-userspace/userspace/src/nm.h nm-src/nm.h
          cd nm-src
          aarch64-linux-gnu-gcc -nostdlib -static -Os -fno-builtin -Wl,-e,_start -o nm nm.c
          aarch64-linux-gnu-strip nm
          ls -la nm
      - name: Tentukan file kernel hasil
        id: kimg
        run: |
          FOUND=""
          for f in Image.gz-dtb Image.gz Image; do
            p="kernel/out/arch/arm64/boot/$f"
            if [ -f "$p" ]; then
              echo "path=$p" >> "$GITHUB_OUTPUT"
              echo "name=$f" >> "$GITHUB_OUTPUT"
              FOUND=1
              break
            fi
          done
          [ -n "$FOUND" ] || { echo "Kernel image tidak ditemukan"; exit 1; }
          DTBO="kernel/out/arch/arm64/boot/dtbo.img"
          if [ -f "$DTBO" ]; then
            echo "dtbo=$DTBO" >> "$GITHUB_OUTPUT"
            echo "dtbo.img ditemukan: $DTBO"
          fi

      - name: Rakit paket AnyKernel3 (template asli fjrXTR)
        run: |
          git clone --depth=1 https://github.com/fjrXTR/AnyKernel3.git AnyKernel3
          rm -rf AnyKernel3/.git

          echo "" | base64 -d > AnyKernel3/anykernel.sh
          echo "== anykernel.sh =="; cat AnyKernel3/anykernel.sh

          cp "${{ steps.kimg.outputs.path }}" "AnyKernel3/${{ steps.kimg.outputs.name }}"

          ( cd AnyKernel3 && zip -r9 "../$ZIP" . -x '.git*' )
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          unzip -l "$ZIP" | head -20

      - name: Upload paket + kernel mentah + dtbo + nm CLI
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: warn
          path: |
            ${{ env.ZIP }}
            ${{ steps.kimg.outputs.path }}
            ${{ steps.kimg.outputs.dtbo }}
            nm-src/nm
            kernel/out/.config
