name: Test SUSFS 4.14 - Rosemary

on:
  workflow_dispatch:
  push:
    branches:
      - rosemary-13

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Install tools
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git curl ca-certificates

      - name: Clone kernel rosemary-13
        run: |
          set -eux
          git clone --depth=1 --single-branch -b rosemary-13 \
            https://github.com/dlagia/android_kernel_xiaomi_rosemary.git kernel

      - name: Show exact kernel commit
        working-directory: kernel
        run: |
          set -eux
          echo "KERNEL HEAD:"
          git rev-parse HEAD
          git log -1 --oneline --decorate
          echo
          echo "KERNEL VERSION:"
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION) =' Makefile || true

      - name: Download SUSFS patch
        run: |
          set -eux
          mkdir -p test-output
          curl -fL --retry 3 --retry-all-errors \
            'https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/Patch/susfs_patch_to_4.14.patch' \
            -o test-output/susfs_patch_to_4.14.patch
          sha256sum test-output/susfs_patch_to_4.14.patch

      - name: SUSFS TEST - git apply check
        working-directory: kernel
        run: |
          set -o pipefail
          echo '=================================================='
          echo 'TEST: git apply --check'
          echo '=================================================='
          git apply --check --verbose ../test-output/susfs_patch_to_4.14.patch 2>&1 | \
            tee ../test-output/git-apply-check.log

      - name: SUSFS TEST - apply patch in disposable runner
        working-directory: kernel
        run: |
          set -eux
          git apply --verbose ../test-output/susfs_patch_to_4.14.patch
          git diff --check
          echo
          echo 'PATCH APPLIED OK'
          echo 'Files changed:'
          git status --short
          echo
          echo 'Diffstat:'
          git diff --stat

      - name: SUSFS TEST - script syntax
        run: |
          set -eux
          curl -fL --retry 3 --retry-all-errors \
            'https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/susfs_inline_hook_patches.sh' \
            -o test-output/susfs_inline_hook_patches.sh
          bash -n test-output/susfs_inline_hook_patches.sh
          echo 'INLINE SCRIPT: bash -n PASS'

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: susfs-4.14-test
          path: test-output/
          if-no-files-found: warn
