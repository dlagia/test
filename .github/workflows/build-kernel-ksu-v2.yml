# ============================================================
# Workflow GitHub Actions: Build Kernel Xiaomi Rosemary (kernel 4.14)
# Integrasi KernelSU & SuSFS menggunakan dlagia/Build-Kernel_scripts
# (https://github.com/dlagia/Build-Kernel_scripts)
#
# Fitur yang terpasang:
# 1. ReSukiSU + SuSFS (via dlagia/Build-Kernel_scripts integrate_ksu_susfs.sh)
# 2. Defconfig SuSFS lengkap (via dlagia/Build-Kernel_scripts ksu-susfs_defconfig)
# 3. NoMount (branch dev milik maxsteeel/nomount) + compiler biner CLI nm
# 4. Re:Kernel (Sakion-Team, binder/signal unfreeze notifier)
# 5. Baseband-guard (vc-teahouse, LSM anti-overwrite baseband)
# 6. Toolchain: proton-clang (kdrag0n) + cross-compile GCC
# 7. Packaging: AnyKernel3 zip flashable (template fjrXTR)
#
# CATATAN PERBAIKAN (versi ini):
# - fs/proc/task_mmu.c: patch SUSFS 4.14 upstream tidak cocok dengan source
#   rosemary-13 (sudah di-backport gaya 4.19+). 3 hunk gagal dan 1 hunk salah
#   mendarat. Diperbaiki otomatis oleh step "Perbaiki hasil patch SUSFS".
# - Step Re:Kernel dulu terduplikasi 6x dan blok ulangannya menulis script Perl
#   ke drivers/rekernel/rekernel.c. Sekarang satu blok saja.
# - rekernel.c: nlmsg_put() hilang sehingga nlhdr dipakai tanpa diinisialisasi.
# - #include rekernel.h dulu disisipkan di baris 1 sehingga bentrok dgn pr_fmt.
#
# PENYEMPURNAAN (revisi audit ke-2):
# - Cache proton-clang + ccache: run berulang jauh lebih cepat, dgn fallback
#   clone/clang polos kalau cache rusak atau ccache tidak ada.
# - AnyKernel3 di-pin ke branch mt6781. Branch DEFAULT repo itu 'ruby', jadi
#   sebelumnya isi paket bisa berubah diam-diam.
# - Verifikasi Baseband-guard eksplisit, termasuk symlink bbg_tracing.h yang
#   hanya dibuat pada jalur patch SELinux pra-5.1 (kernel 4.14 masuk sini).
# - Commit tiap komponen dicatat ke ringkasan run untuk reproduksi.
# - concurrency: run lama otomatis dibatalkan kalau tersalip run baru.
#
# PENYEMPURNAAN (revisi audit ke-3, 2026-09-07):
# - Empat sumber yang sebelumnya di-fetch dari branch bergerak (main/dev) kini
#   di-pin ke commit SHA spesifik, supaya kalau upstream mengubah isi script
#   (bukan cuma driver yang diintegrasikan), build ini tidak berubah perilaku
#   atau gagal diam-diam di run berikutnya:
#     dlagia/Build-Kernel_scripts@main -> 10f1480b39418e885d4402e78a5ec7721d5040d3
#     maxsteeel/nomount@dev            -> 0c4b2dbd113b267b673cd7925cd80736658d7a62
#     vc-teahouse/Baseband-guard@main  -> a54e0dc6cf0aff4dd87fec49644a02d2eb612905
#   Catatan: pin ini hanya membekukan VERSI SCRIPT/DEFCONFIG yang diunduh, bukan
#   kode driver yang nanti di-clone SENDIRI oleh script tsb (KernelSU/SuSFS,
#   NoMount, Baseband-guard tetap mengambil versi terbaru sesuai logika masing-
#   masing script) - sama seperti filosofi pin branch AnyKernel3 di atas.
#   Untuk memperbarui pin: cek commit terbaru tiap repo lalu ganti SHA di atas
#   dan di step terkait, atau minta di-refresh lagi.
#
# PENYEMPURNAAN (revisi audit ke-4, 2026-09-08):
# - KBUILD_BUILD_TIMESTAMP tidak lagi di-hardcode ke tanggal tetap (Mon Jul 1
#   2024); sekarang diisi $(date -u) saat step "Compile kernel" berjalan,
#   supaya banner versi kernel mencerminkan waktu build sebenarnya.
# - (KOREKSI) Sempat menghapus blok KERNEL_VERSION/VERSION/PATCHLEVEL karena
#   dikira dead code (tidak dipakai di script ini). Ternyata SALAH: variabel
#   ini dibaca oleh integrate_ksu_susfs.sh (diwariskan via export, bukan
#   argumen) dan script itu jalan dengan "set -u", jadi build langsung gagal
#   dengan "KERNEL_VERSION: unbound variable". Sudah dikembalikan.
# - Dicocokkan ulang terhadap repo resmi https://github.com/Sakion-Team/Re-Kernel
#   (folder Integrate/README.md): 3 titik hook manual yang di-embed di sini
#   (binder_transaction, binder_alloc_new_buf_locked, do_send_sig_info) memang
#   persis sama dengan panduan integrasi manual resminya untuk kernel <=5.4.
#   README itu juga mencatat known issue: sebagian backport cgroup freezer v2
#   butuh #include <linux/sched/jobctl.h> di rekernel.h supaya JOBCTL_TRAP_FREEZE
#   dikenali - include ini sudah ditambahkan ke drivers/rekernel/rekernel.h.
#   Re:Kernel tetap berupa blob statis (bukan git clone) karena upstream tidak
#   menyediakan setup.sh; tool otomatisnya ("Kernel Modifier") berbasis Java 17+
#   dan tidak cocok dijalankan sebagai curl|bash di CI.
# ============================================================

name: Build Kernel Rosemary (KSU + SuSFS dlagia)

on:
  workflow_dispatch: {}
  push:
    branches: [ main, master ]

concurrency:
  group: build-rosemary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Pasang dependency build
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl flex git kmod \
            libelf-dev libssl-dev zip zlib1g-dev xxd python3 \
            libtinfo5 libncurses5 gcc-aarch64-linux-gnu

      - name: Clone source kernel (dlagia/android_kernel_xiaomi_rosemary @ rosemary-13)
        run: |
          git clone --depth=1 -b rosemary-13 \
            https://github.com/dlagia/android_kernel_xiaomi_rosemary.git kernel
          echo "KERNEL_SHA=$(git -C kernel rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "Kernel source commit: $(git -C kernel rev-parse HEAD)"

      - name: Integrasikan ReSukiSU & SuSFS (dlagia/Build-Kernel_scripts)
        working-directory: kernel
        run: |
          export KERNEL_DIR=$(pwd)
          VERSION=$(grep -w '^VERSION' Makefile | tr -d ' ' | cut -d= -f2 || echo "")
          PATCHLEVEL=$(grep -w '^PATCHLEVEL' Makefile | tr -d ' ' | cut -d= -f2 || echo "")
          export KERNEL_VERSION="${VERSION}.${PATCHLEVEL}"
          echo "Kernel version detected: $KERNEL_VERSION"

          # Repo kernel ini SUDAH membawa file *.rej sendiri (mis.
          # drivers/misc/mediatek/lcm/mt65xx_lcm_list.c.rej) yang ter-commit dan
          # tidak ada hubungannya dgn SUSFS. Dicatat dulu supaya tidak dikira
          # kegagalan patch.
          find . -name '*.rej' -printf '%P\n' 2>/dev/null | sort > /tmp/rej_before.txt
          echo "== Reject bawaan repo (diabaikan): $(wc -l < /tmp/rej_before.txt) file =="
          cat /tmp/rej_before.txt || true

          # Dipin ke commit tertentu (bukan 'main') supaya perubahan script upstream
          # tidak diam-diam mengubah cara integrasi KSU/SuSFS di run berikutnya.
          echo "[+] Mengunduh integrate_ksu_susfs.sh dari dlagia/Build-Kernel_scripts (pinned commit)..."
          curl -fLSs "https://raw.githubusercontent.com/dlagia/Build-Kernel_scripts/10f1480b39418e885d4402e78a5ec7721d5040d3/scripts/integrate_ksu_susfs.sh" -o integrate_ksu_susfs.sh
          chmod +x integrate_ksu_susfs.sh

          # </dev/null: script punya prompt interaktif "read -t 10" utk penanganan
          # reject. Di runner tidak ada tty, jadi dipaksa non-interaktif supaya
          # tidak menggantung 10 detik dan hasilnya deterministik.
          bash integrate_ksu_susfs.sh < /dev/null
          rm -f integrate_ksu_susfs.sh

          echo ""
          echo "== AUDIT REJECT PATCH SUSFS =="
          # Script dlagia menelan kegagalan patch (patch ... || true) lalu
          # memindahkan .rej ke patch_rejects/ dan tetap lanjut. Kalau tidak
          # diaudit, build gagal jauh di belakang dgn error yang membingungkan.
          # Script dlagia memindahkan semua *.rej ke patch_rejects/ (termasuk yg
          # bawaan repo), jadi kumpulkan dari dua tempat lalu kurangi daftar
          # bawaan tadi. Sisanya = reject yang benar-benar dari patch SUSFS.
          { find patch_rejects -name '*.rej' -printf '%P\n' 2>/dev/null; \
            find . -path ./patch_rejects -prune -o -name '*.rej' -printf '%P\n' 2>/dev/null; } \
            | sort -u > /tmp/rej_after.txt
          REJ=$(comm -13 /tmp/rej_before.txt /tmp/rej_after.txt)

          if [ -n "$REJ" ]; then
            echo "Reject baru dari patch SUSFS:"
            echo "$REJ"
          else
            echo "Tidak ada reject baru dari patch SUSFS."
          fi

          # fs/proc/task_mmu.c.rej memang diharapkan gagal (hunk #1/#5/#6) dan
          # ditangani step berikutnya. Selain itu, berhenti.
          UNEXPECTED=$(echo "$REJ" | grep -v '^fs/proc/task_mmu\.c\.rej$' | grep -v '^$' || true)
          if [ -n "$UNEXPECTED" ]; then
            echo ""
            echo "ERROR: ada reject SUSFS di file yang belum ditangani:"
            echo "$UNEXPECTED"
            echo "Isi reject:"
            for f in $UNEXPECTED; do
              echo "----- $f"
              cat "patch_rejects/$f" 2>/dev/null || cat "$f" 2>/dev/null || true
            done
            exit 1
          fi

          echo "$REJ" | grep -q '^fs/proc/task_mmu\.c\.rej$' \
            && echo "OK: hanya fs/proc/task_mmu.c yang reject (sudah diantisipasi)" \
            || echo "CATATAN: task_mmu.c tidak reject - patch upstream mungkin sudah diperbaiki"

          echo ""
          echo "== PERBAIKAN OTOMATIS: bug deteksi versi utk security/selinux/hooks.c (kernel 4.14) =="
          if grep -q 'ksu_hide_setprocattr(name, value, size);' security/selinux/hooks.c \
             && ! grep -q 'extern int ksu_hide_setprocattr' security/selinux/hooks.c; then
            echo "Terdeteksi: pemanggilan ksu_hide_setprocattr ada, tapi extern declaration hilang."
            if grep -qF 'static int selinux_setprocattr(struct task_struct *p,' security/selinux/hooks.c; then
              sed -i '/static int selinux_setprocattr(struct task_struct \*p,/i\#ifdef CONFIG_KSU\nextern int ksu_hide_setprocattr(const char *name, void *value, size_t size);\n#endif\n' security/selinux/hooks.c
              grep -q 'extern int ksu_hide_setprocattr' security/selinux/hooks.c && \
                echo "OK: extern ksu_hide_setprocattr berhasil ditambal manual."
            fi
          else
            echo "Tidak perlu ditambal."
          fi

          echo ""
          echo "== Verifikasi integrasi KernelSU & SuSFS =="
          test -d KernelSU || { echo "ERROR: direktori KernelSU tidak ditemukan"; exit 1; }
          for f in fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h; do
            test -s "$f" || { echo "ERROR: $f tidak ada setelah patch SUSFS"; exit 1; }
            echo "OK: $f ada"
          done
          grep -q 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' fs/Makefile || {
            echo "ERROR: fs/Makefile tidak berisi entry susfs.o"
            exit 1
          }
          echo "OK: fs/Makefile berisi obj-\$(CONFIG_KSU_SUSFS) += susfs.o"

          echo ""
          echo "== Verifikasi hook inline SuSFS (syarat ReSukiSU inline_hook_check.mk) =="
          for pair in \
            "ksu_handle_execveat:fs/exec.c" \
            "ksu_handle_faccessat:fs/open.c" \
            "ksu_handle_sys_read:fs/read_write.c" \
            "ksu_handle_stat:fs/stat.c" \
            "ksu_handle_sys_reboot:kernel/reboot.c" \
            "ksu_handle_input_handle_event:drivers/input/input.c" \
            "ksu_handle_setresuid:kernel/sys.c" ; do
            sym="${pair%%:*}"; file="${pair##*:}"
            grep -q "$sym" "$file" || { echo "ERROR: hook $sym tidak ada di $file"; exit 1; }
            echo "OK: $sym ada di $file"
          done

          echo "KSU_SHA=$(git -C KernelSU rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "ReSukiSU commit: $(git -C KernelSU rev-parse HEAD)"
          echo "Integrasi KernelSU + SuSFS via dlagia/Build-Kernel_scripts: SUKSES"

      - name: Perbaiki hasil patch SUSFS di fs/proc/task_mmu.c
        working-directory: kernel
        run: |
          echo "" | base64 -d > /tmp/fix_susfs_task_mmu.py
          python3 /tmp/fix_susfs_task_mmu.py
          rm -f fs/proc/task_mmu.c.rej patch_rejects/fs/proc/task_mmu.c.rej

          echo ""
          echo "== Ringkasan hunk task_mmu.c =="
          grep -c 'SUSFS_IS_INODE_SUS_MAP' fs/proc/task_mmu.c || true
          grep -n 'susfs_def.h' fs/proc/task_mmu.c || true

      - name: Commit ReSukiSU + bersihkan dirty
        working-directory: kernel
        run: |
          echo "==================== Cek status KernelSU sebelum commit ===================="
          cd KernelSU
          git status --porcelain || true
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -A
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Apply custom integration (remove dirty)"
            echo "Commit berhasil dilakukan di KernelSU"
          else
            echo "KernelSU sudah clean, tidak ada yang perlu di-commit"
          fi

          echo ""
          echo "==================== Status setelah commit ===================="
          git status
          git diff-index --quiet HEAD && echo ">>> KernelSU CLEAN (tidak ada dirty)" || echo ">>> MASIH DIRTY!"

          cd ..

          if [ -f scripts/setlocalversion ]; then
            sed -i 's/-dirty//g' scripts/setlocalversion
            echo "scripts/setlocalversion sudah dibersihkan dari -dirty"
          fi

          find . -name setlocalversion -exec sed -i 's/-dirty//g' {} + 2>/dev/null || true

          if [ -f KernelSU/kernel/Kbuild ]; then
            sed -i 's/KSU_COMMIT_SHA  := \$(KSU_COMMIT_SHA)-dirty/KSU_COMMIT_SHA  := \$(KSU_COMMIT_SHA)/' KernelSU/kernel/Kbuild || true
            echo "Pengecekan -dirty di KernelSU/kernel/Kbuild sudah dinetralisir"
          fi

      - name: Integrasikan NoMount (setup.sh resmi -s dev)
        working-directory: kernel
        run: |
          rm -rf NoMount fs/nomount
          # setup.sh di-pin ke commit tertentu (bukan refs/heads/dev) supaya isi
          # script itu sendiri stabil; branch driver "dev" tetap dipilih lewat
          # argumen "-s dev" di bawah, terlepas dari pin ini.
          curl -LSs "https://raw.githubusercontent.com/maxsteeel/nomount/0c4b2dbd113b267b673cd7925cd80736658d7a62/kernel/setup.sh" | bash -s dev

          test -d NoMount || {
            echo "ERROR: direktori NoMount tidak ditemukan setelah setup.sh"
            exit 1
          }

          echo "NoMount commit dipakai (kernel + nm): $(git -C NoMount rev-parse --short HEAD)"
          cd NoMount
          test "$(git branch --show-current)" = "dev" || {
            echo "ERROR: NoMount bukan branch dev setelah setup.sh -s dev"
            exit 1
          }
          cd ..

          test -L fs/nomount || {
            echo "ERROR: symlink fs/nomount tidak dibuat oleh setup.sh"
            exit 1
          }
          test -s fs/nomount/Kconfig
          test -s fs/nomount/Makefile
          test -s fs/nomount/nomount.c
          test -s fs/nomount/nomount.h

          echo ""
          echo "== PERBAIKAN bug duplikasi fs/Kconfig upstream =="
          python3 - << 'PYEOF'
          path = "fs/Kconfig"
          target = 'source "fs/nomount/Kconfig"\n'

          with open(path) as f:
              lines = f.readlines()

          idxs = [i for i, l in enumerate(lines) if l == target]
          print(f"Ditemukan {len(idxs)} baris '{target.strip()}' di fs/Kconfig")

          if len(idxs) == 0:
              print("ERROR: baris source fs/nomount/Kconfig tidak ditemukan sama sekali")
              raise SystemExit(1)
          elif len(idxs) == 1:
              print("OK: cuma 1 baris kali ini - tidak perlu diperbaiki")
          else:
              endmenu_idxs = [i for i, l in enumerate(lines) if l.strip() == "endmenu"]
              if not endmenu_idxs:
                  print("ERROR: tidak ada baris endmenu di fs/Kconfig - struktur tidak dikenal")
                  raise SystemExit(1)
              last_endmenu = endmenu_idxs[-1]
              keep_idx = last_endmenu - 1 if (last_endmenu - 1) in idxs else idxs[-1]
              new_lines = [l for i, l in enumerate(lines) if l != target or i == keep_idx]
              with open(path, "w") as f:
                  f.writelines(new_lines)
              sisa = new_lines.count(target)
              print(f"Diperbaiki: {len(idxs)} -> {sisa} baris (dipertahankan indeks {keep_idx}, tepat sebelum endmenu top-level)")
              if sisa != 1:
                  print("ERROR: perbaikan gagal, jumlah baris akhir bukan 1")
                  raise SystemExit(1)
          PYEOF

          echo ""
          echo "==================== NoMount (branch dev, via setup.sh resmi) ===================="
          echo "NoMount source: $(readlink -f fs/nomount)"
          grep -nF 'source "fs/nomount/Kconfig"' fs/Kconfig || true
          test "$(grep -cF 'source "fs/nomount/Kconfig"' fs/Kconfig)" = "1" || {
            echo "ERROR: fs/Kconfig masih mengandung duplikasi setelah perbaikan"
            exit 1
          }
          grep -q 'nomount_srcu' fs/nomount/nomount.c || {
            echo "ERROR: fs/nomount/nomount.c tidak mengandung nomount_srcu"
            exit 1
          }
          echo "NOMOUNT_SHA=$(git -C NoMount rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "NoMount branch dev: OK"

      - name: Integrasikan Re:Kernel (Sakion-Team) - notifikasi freeze binder/signal
        working-directory: kernel
        run: |
          rm -rf drivers/rekernel
          mkdir -p drivers/rekernel
          echo "" | base64 -d > drivers/rekernel/rekernel.h
          echo "" | base64 -d > drivers/rekernel/rekernel.c
          echo "b2JqLSQoQ09ORklHX1JFS0VSTkVMKSArPSByZWtlcm5lbC5vCg==" | base64 -d > drivers/rekernel/Makefile
          echo "" | base64 -d > drivers/rekernel/Kconfig

          grep -q 'rekernel/' drivers/Makefile || echo 'obj-y += rekernel/' >> drivers/Makefile
          if ! grep -q 'rekernel/Kconfig' drivers/Kconfig; then
            # sed '/^endmenu/i' menyisip sebelum SETIAP endmenu; pastikan cuma ada satu.
            NEM=$(grep -c '^endmenu' drivers/Kconfig)
            test "$NEM" = "1" || { echo "ERROR: drivers/Kconfig punya $NEM baris endmenu, penyisipan tidak aman"; exit 1; }
            sed -i '/^endmenu/i source "drivers/rekernel/Kconfig"' drivers/Kconfig
          fi

          echo "" | base64 -d > /tmp/rekernel_hooks.py
          python3 /tmp/rekernel_hooks.py

          echo ""
          echo "==================== VERIFIKASI Re:Kernel ===================="
          head -1 drivers/rekernel/rekernel.c | grep -q '^/\*' || {
            echo "ERROR: drivers/rekernel/rekernel.c bukan file C yang valid"
            exit 1
          }
          grep -q 'nlmsg_put' drivers/rekernel/rekernel.c || {
            echo "ERROR: rekernel.c tidak memanggil nlmsg_put - nlhdr akan dipakai tanpa inisialisasi"
            exit 1
          }
          grep -c 'rekernel_start_server' drivers/android/binder.c drivers/android/binder_alloc.c kernel/signal.c || true
          for f in drivers/android/binder.c drivers/android/binder_alloc.c kernel/signal.c; do
            n=$(grep -c 'rekernel/rekernel.h' "$f")
            test "$n" = "1" || { echo "ERROR: include rekernel.h di $f ada $n kali (harus tepat 1)"; exit 1; }
          done
          echo "Re:Kernel: OK"

      - name: Integrasikan Baseband-guard (LSM anti-tulis baseband/boot chain)
        working-directory: kernel
        run: |
          # Dipin ke commit tertentu (bukan 'main') dgn alasan yang sama seperti
          # integrate_ksu_susfs.sh di atas.
          wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/a54e0dc6cf0aff4dd87fec49644a02d2eb612905/setup.sh | bash
          grep -q 'baseband_guard' security/Kconfig && echo "baseband_guard: sudah terdaftar di default LSM list" || \
            sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig
          grep -n 'baseband_guard' security/Kconfig || echo "baseband_guard: tidak ada blok config LSM di kernel ini"

          echo ""
          echo "== Verifikasi integrasi Baseband-guard =="
          # setup.sh memakai tanda hubung (baseband-guard), bukan garis bawah.
          test -L security/baseband-guard || { echo "ERROR: symlink security/baseband-guard tidak dibuat"; exit 1; }
          grep -q 'baseband-guard/' security/Makefile || { echo "ERROR: security/Makefile tidak berisi entry baseband-guard"; exit 1; }
          grep -q 'security/baseband-guard/Kconfig' security/Kconfig || { echo "ERROR: security/Kconfig tidak source baseband-guard"; exit 1; }
          # Kernel 4.14 belum punya DEFINE_LSM, jadi setup.sh menempuh jalur patch
          # SELinux dan membuat symlink bbg_tracing.h. Kalau hilang, build gagal jauh
          # di belakang dgn error include yang membingungkan.
          if ! grep -q '#define DEFINE_LSM(lsm)' include/linux/lsm_hooks.h; then
            test -L security/selinux/include/bbg_tracing.h || {
              echo "ERROR: bbg_tracing.h tidak dibuat padahal kernel ini butuh jalur patch SELinux"
              exit 1
            }
            echo "OK: jalur patch SELinux pra-5.1 terpasang (bbg_tracing.h ada)"
          fi
          echo "BBG_SHA=$(git -C Baseband-guard rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "Baseband-guard commit: $(git -C Baseband-guard rev-parse HEAD)"
          echo "Baseband-guard: OK"

      - name: Pra-compile - perbaikan build source MTK (verified reusable)
        working-directory: kernel
        run: |
          grep -rlZ --include=Makefile --include=Kbuild --include='*.mk' --exclude-dir=.git \
            -e '-Werror' . 2>/dev/null \
            | xargs -0 -r sed -i -E -e 's/-Werror=[A-Za-z0-9_-]+//g' -e 's/(-Werror)([[:space:]]|$)/\2/g' || true
          # WAJIB dibatasi ke *.c/*.h dan exclude .git: tanpa itu grep -rl juga
          # mencocokkan objek pack biner di .git dan sed akan merusaknya.
          grep -rlZ --include='*.c' --include='*.h' --exclude-dir=.git --exclude-dir=patch_rejects \
            'no_sanitize(' . 2>/dev/null \
            | xargs -0 -r sed -i -E 's/__attribute__\(\(no_sanitize\("[^"]*"\)\)\)//g' || true
          sed -i 's/inline void ksm_flock(/void ksm_flock(/' include/linux/keyslot-manager.h block/keyslot-manager.c || true
          sed -i 's/^inline void blk_crypto_flock(/void blk_crypto_flock(/' include/linux/blk-crypto.h block/blk-crypto.c || true
          sed -i 's/inline int typec_pd_start_entry(/int typec_pd_start_entry(/' drivers/misc/mediatek/typec/tcpc/inc/tcpci_typec.h drivers/misc/mediatek/typec/tcpc/tcpci_typec.c || true
          find drivers/input/touchscreen -name focaltech_config.h -printf '%h\n' 2>/dev/null | while read d; do
            mkdir -p "$d/include/firmware"
            printf '0x00\n' > "$d/include/firmware/fw_sample.i"
            echo "stub firmware -> $d/include/firmware/fw_sample.i"
          done
          grep -rl 'bq2597x_charger.o' --include=Makefile . 2>/dev/null | while read mk; do
            echo 'CFLAGS_REMOVE_bq2597x_charger.o += -mgeneral-regs-only' >> "$mk"
            echo "CFLAGS_REMOVE ditambah ke: $mk"
          done
          echo '== cek sisa =='
          echo -n 'no_sanitize( tersisa: '; grep -rl 'no_sanitize(' --include='*.h' --include='*.c' . 2>/dev/null | wc -l

      - name: Aktifkan KSU & SuSFS di defconfig (termasuk dlagia ksu-susfs_defconfig)
        working-directory: kernel
        run: |
          DEF=arch/arm64/configs/rosemary_defconfig

          echo "[+] Mengunduh dan menggabungkan ksu-susfs_defconfig dari dlagia/Build-Kernel_scripts (pinned commit)..."
          curl -fsSL "https://raw.githubusercontent.com/dlagia/Build-Kernel_scripts/10f1480b39418e885d4402e78a5ec7721d5040d3/defconfig/ksu-susfs_defconfig" >> "$DEF"

          {
            echo ""
            echo 'CONFIG_LOCALVERSION="-perf"'
            echo "CONFIG_LOCALVERSION_AUTO=n"
            echo ""
            echo "CONFIG_NOMOUNT=y"
            echo ""
            echo "CONFIG_REKERNEL=y"
            echo ""
            echo "CONFIG_BBG=y"
            echo ""
          } >> "$DEF"
          tail -30 "$DEF"

      - name: Cache toolchain proton-clang
        id: tc-cache
        uses: actions/cache@v6
        with:
          path: clang-proton
          key: proton-clang-master-v1

      - name: Ambil toolchain proton-clang (dipakai penulis kernel ini di b.sh)
        run: |
          # Cache dipakai kalau utuh; kalau tidak, clone ulang. Jangan pernah
          # lanjut dgn toolchain setengah jadi - error-nya akan menyesatkan.
          if [ -x clang-proton/bin/clang ]; then
            echo "Toolchain dari cache."
          else
            echo "Cache kosong/rusak, clone ulang."
            rm -rf clang-proton
            git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang-proton
          fi
          clang-proton/bin/clang --version | head -2

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: ccache-rosemary-${{ github.run_id }}
          restore-keys: |
            ccache-rosemary-

      - name: Compile kernel
        working-directory: kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang-proton/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER=build
          export KBUILD_BUILD_HOST=kernel
          export KBUILD_BUILD_TIMESTAMP="$(date -u)"

          # ccache mempercepat run berikutnya secara signifikan. Kalau binernya
          # tidak ada, jatuh balik ke clang polos supaya build tetap jalan.
          if command -v ccache >/dev/null 2>&1; then
            export CCACHE_DIR="$HOME/.ccache"
            export CCACHE_MAXSIZE=2G
            export CCACHE_COMPILERCHECK=content
            export CCACHE_NOHASHDIR=true
            ccache -M "$CCACHE_MAXSIZE" >/dev/null
            ccache -z >/dev/null
            CC_CMD="ccache clang"
            echo "ccache aktif."
          else
            CC_CMD="clang"
            echo "ccache tidak tersedia, pakai clang polos."
          fi

          make O=out rosemary_defconfig

          echo ""
          echo "==================== RESOLVED ReSukiSU & SuSFS CONFIG ===================="
          grep -E '^(CONFIG_KSU|CONFIG_KALLSYMS)' out/.config || true

          grep -q '^CONFIG_KSU=y$' out/.config || { echo "ERROR: CONFIG_KSU tidak resolve ke y"; exit 1; }
          grep -q '^CONFIG_KALLSYMS=y$' out/.config || { echo "ERROR: CONFIG_KALLSYMS tidak resolve ke y"; exit 1; }
          grep -q '^CONFIG_KALLSYMS_ALL=y$' out/.config || { echo "ERROR: CONFIG_KALLSYMS_ALL tidak resolve ke y"; exit 1; }

          if grep -q '^CONFIG_KSU_TRACEPOINT_HOOK=y$' out/.config; then
            echo "ERROR: CONFIG_KSU_TRACEPOINT_HOOK=y aktif; kernel non-GKI 4.14 tidak mendukung tracepoint hook"
            exit 1
          fi

          grep -q '^CONFIG_KSU_SUSFS=y$' out/.config || {
            echo "ERROR: CONFIG_KSU_SUSFS tidak resolve ke y - integrasi SUSFS (patch dasar + inline hook) tidak akan berfungsi"
            exit 1
          }
          echo ""
          echo "== Fitur SuSFS yang aktif =="
          grep -E '^CONFIG_KSU_SUSFS_' out/.config || true

          for opt in CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK; do
            if grep -q "^${opt}=y\$" out/.config; then
              echo "ERROR: ${opt}=y aktif berbarengan dengan SuSFS Inline Hook - akan menghasilkan hook ganda (LSM auto-hook + patch manual). Set ke n di defconfig."
              exit 1
            fi
          done

          echo ""
          echo "==================== RESOLVED NoMount CONFIG ===================="
          grep -E '^CONFIG_NOMOUNT' out/.config || true
          grep -q '^CONFIG_NOMOUNT=y$' out/.config || { echo "ERROR: CONFIG_NOMOUNT tidak resolve ke y"; exit 1; }

          echo ""
          echo "==================== RESOLVED Re:Kernel CONFIG ===================="
          grep -E '^CONFIG_REKERNEL' out/.config || true
          grep -q '^CONFIG_REKERNEL=y$' out/.config || { echo "ERROR: CONFIG_REKERNEL tidak resolve ke y"; exit 1; }

          echo ""
          echo "==================== RESOLVED Baseband-guard CONFIG ===================="
          grep -E '^CONFIG_BBG' out/.config || true
          grep -q '^CONFIG_BBG=y$' out/.config || { echo "ERROR: CONFIG_BBG tidak resolve ke y"; exit 1; }

          set -o pipefail
          if ! make -k O=out -j"$(nproc)" \
                ARCH=arm64 \
                CC="$CC_CMD" \
                AR=llvm-ar \
                NM=llvm-nm \
                OBJCOPY=llvm-objcopy \
                OBJDUMP=llvm-objdump \
                STRIP=llvm-strip \
                CROSS_COMPILE=aarch64-linux-gnu- \
                CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                CONFIG_SECTION_MISMATCH_WARN_ONLY=y \
                KCFLAGS="-Wno-error" 2>&1 | tee /tmp/build.log; then
            echo ""
            echo "==================== BARIS ERROR (kirim ini) ===================="
            grep -niE "error:|fatal error|undefined reference|No such file|multiple definition|recipe for target|Error [0-9]" /tmp/build.log | tail -120 || true
            echo "==================== KONTEKS TIAP KEGAGALAN ===================="
            for L in $(grep -n 'Error 1' /tmp/build.log | head -3 | cut -d: -f1); do
              S=$((L-40)); [ $S -lt 1 ] && S=1
              echo "----- konteks baris $S s/d $L -----"
              sed -n "${S},${L}p" /tmp/build.log
            done
            tail -50 /tmp/build.log
            echo ">>> BUILD GAGAL."
            exit 1
          fi
          ls -la out/arch/arm64/boot/
          command -v ccache >/dev/null 2>&1 && ccache -s | head -8 || true

      - name: Compile nm (NoMount userspace CLI, commit sama dgn kernel)
        run: |
          NM_SRC="kernel/NoMount/userspace/src"
          test -d "$NM_SRC" || { echo "ERROR: $NM_SRC tidak ada - step Integrasikan NoMount gagal?"; exit 1; }

          NOMOUNT_COMMIT=$(git -C kernel/NoMount rev-parse --short HEAD)
          echo "NoMount commit dipakai: $NOMOUNT_COMMIT"

          mkdir -p nm-src
          cp "$NM_SRC/nm.c" "$NM_SRC/nm.h" nm-src/
          ( cd nm-src && \
            aarch64-linux-gnu-gcc -nostdlib -static -Os -fno-builtin -Wl,-e,_start -o nm nm.c && \
            aarch64-linux-gnu-strip nm )
          file nm-src/nm
          test -s nm-src/nm || { echo "ERROR: nm gagal dikompilasi"; exit 1; }

      - name: Tentukan file kernel hasil
        id: kimg
        run: |
          FOUND=""
          for f in Image.gz-dtb Image.gz Image; do
            p="kernel/out/arch/arm64/boot/$f"
            if [ -f "$p" ]; then
              echo "path=$p" >> "$GITHUB_OUTPUT"
              echo "name=$f" >> "$GITHUB_OUTPUT"
              FOUND=1
              break
            fi
          done
          [ -n "$FOUND" ] || { echo "Kernel image tidak ditemukan"; exit 1; }
          DTBO="kernel/out/arch/arm64/boot/dtbo.img"
          if [ -f "$DTBO" ]; then
            echo "dtbo=$DTBO" >> "$GITHUB_OUTPUT"
            echo "dtbo.img ditemukan: $DTBO"
          fi

      - name: Rakit paket AnyKernel3 (template asli fjrXTR)
        run: |
          # PENTING: branch default repo ini adalah 'ruby', bukan 'master'. Tanpa -b
          # isi paket ikut berubah diam-diam kalau pemilik repo ganti default.
          # mt6781 = SoC rosemary. tools/ak3-core.sh identik di kedua branch.
          git clone --depth=1 -b mt6781 https://github.com/fjrXTR/AnyKernel3.git AnyKernel3
          echo "AnyKernel3 commit: $(git -C AnyKernel3 rev-parse HEAD)"
          test -f AnyKernel3/tools/ak3-core.sh || { echo "ERROR: tools/ak3-core.sh tidak ada di AnyKernel3"; exit 1; }
          rm -rf AnyKernel3/.git

          echo "" | base64 -d > AnyKernel3/anykernel.sh

          cp "${{ steps.kimg.outputs.path }}" "AnyKernel3/${{ steps.kimg.outputs.name }}"

          ZIP="rosemary-ksu-susfs-nomount-rekernel-bbg-$(date +%Y%m%d-%H%M%S).zip"

          ( cd AnyKernel3 && zip -r9 "../$ZIP" . -x '.git*' )
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          unzip -l "$ZIP" | head -20

      - name: Ringkasan build
        if: always()
        run: |
          {
            echo "## Build kernel Rosemary"
            echo ""
            echo "| Komponen | Commit |"
            echo "|---|---|"
            echo "| Kernel (rosemary-13) | \`${KERNEL_SHA:-?}\` |"
            echo "| ReSukiSU | \`${KSU_SHA:-?}\` |"
            echo "| NoMount (dev) | \`${NOMOUNT_SHA:-?}\` |"
            echo "| Baseband-guard | \`${BBG_SHA:-?}\` |"
            echo "| Re:Kernel | _embedded statis di YAML, bukan git clone - tidak ada commit SHA_ |"
            echo ""
            echo "Paket: \`${ZIP:-belum terbentuk}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload paket + kernel mentah + dtbo + nm CLI
        uses: actions/upload-artifact@v7
        with:
          name: rosemary-kernel-build
          if-no-files-found: warn
          path: |
            ${{ env.ZIP }}
            ${{ steps.kimg.outputs.path }}
            ${{ steps.kimg.outputs.dtbo }}
            nm-src/nm
            kernel/out/.config
