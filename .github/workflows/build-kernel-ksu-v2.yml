# ============================================================
# Workflow GitHub Actions: Build Kernel Xiaomi Rosemary (kernel 4.14)
# Integrasi KernelSU & SuSFS menggunakan dlagia/Build-Kernel_scripts
# (https://github.com/dlagia/Build-Kernel_scripts)
#
# Fitur yang terpasang:
# 1. ReSukiSU + SuSFS (via dlagia/Build-Kernel_scripts integrate_ksu_susfs.sh)
# 2. Defconfig SuSFS lengkap (via dlagia/Build-Kernel_scripts ksu-susfs_defconfig)
# 3. NoMount (branch dev milik maxsteeel/nomount) + compiler biner CLI nm
# 4. Re:Kernel (Sakion-Team, binder/signal unfreeze notifier)
# 5. Baseband-guard (vc-teahouse, LSM anti-overwrite baseband)
# 6. Toolchain: proton-clang (kdrag0n) + cross-compile GCC
# 7. Packaging: AnyKernel3 zip flashable (template fjrXTR)
#
# CATATAN PERBAIKAN (versi ini):
# - fs/proc/task_mmu.c: patch SUSFS 4.14 upstream tidak cocok dengan source
#   rosemary-13 (sudah di-backport gaya 4.19+). 3 hunk gagal dan 1 hunk salah
#   mendarat. Diperbaiki otomatis oleh step "Perbaiki hasil patch SUSFS".
# - Step Re:Kernel dulu terduplikasi 6x dan blok ulangannya menulis script Perl
#   ke drivers/rekernel/rekernel.c. Sekarang satu blok saja.
# - rekernel.c: nlmsg_put() hilang sehingga nlhdr dipakai tanpa diinisialisasi.
# - #include rekernel.h dulu disisipkan di baris 1 sehingga bentrok dgn pr_fmt.
#
# PENYEMPURNAAN (revisi audit ke-2):
# - Cache proton-clang + ccache: run berulang jauh lebih cepat, dgn fallback
#   clone/clang polos kalau cache rusak atau ccache tidak ada.
# - AnyKernel3 di-pin ke branch mt6781. Branch DEFAULT repo itu 'ruby', jadi
#   sebelumnya isi paket bisa berubah diam-diam.
# - Verifikasi Baseband-guard eksplisit, termasuk symlink bbg_tracing.h yang
#   hanya dibuat pada jalur patch SELinux pra-5.1 (kernel 4.14 masuk sini).
# - Commit tiap komponen dicatat ke ringkasan run untuk reproduksi.
# - concurrency: run lama otomatis dibatalkan kalau tersalip run baru.
#
# PENYEMPURNAAN (revisi audit ke-3, 2026-09-07):
# - Empat sumber yang sebelumnya di-fetch dari branch bergerak (main/dev) kini
#   di-pin ke commit SHA spesifik, supaya kalau upstream mengubah isi script
#   (bukan cuma driver yang diintegrasikan), build ini tidak berubah perilaku
#   atau gagal diam-diam di run berikutnya:
#     dlagia/Build-Kernel_scripts@main -> 10f1480b39418e885d4402e78a5ec7721d5040d3
#     maxsteeel/nomount@dev            -> 0c4b2dbd113b267b673cd7925cd80736658d7a62
#     vc-teahouse/Baseband-guard@main  -> a54e0dc6cf0aff4dd87fec49644a02d2eb612905
#   Catatan: pin ini hanya membekukan VERSI SCRIPT/DEFCONFIG yang diunduh, bukan
#   kode driver yang nanti di-clone SENDIRI oleh script tsb (KernelSU/SuSFS,
#   NoMount, Baseband-guard tetap mengambil versi terbaru sesuai logika masing-
#   masing script) - sama seperti filosofi pin branch AnyKernel3 di atas.
#   Untuk memperbarui pin: cek commit terbaru tiap repo lalu ganti SHA di atas
#   dan di step terkait, atau minta di-refresh lagi.
#
# PENYEMPURNAAN (revisi audit ke-4, 2026-09-08):
# - KBUILD_BUILD_TIMESTAMP tidak lagi di-hardcode ke tanggal tetap (Mon Jul 1
#   2024); sekarang diisi $(date -u) saat step "Compile kernel" berjalan,
#   supaya banner versi kernel mencerminkan waktu build sebenarnya.
# - (KOREKSI) Sempat menghapus blok KERNEL_VERSION/VERSION/PATCHLEVEL karena
#   dikira dead code (tidak dipakai di script ini). Ternyata SALAH: variabel
#   ini dibaca oleh integrate_ksu_susfs.sh (diwariskan via export, bukan
#   argumen) dan script itu jalan dengan "set -u", jadi build langsung gagal
#   dengan "KERNEL_VERSION: unbound variable". Sudah dikembalikan.
# - Dicocokkan ulang terhadap repo resmi https://github.com/Sakion-Team/Re-Kernel
#   (folder Integrate/README.md): 3 titik hook manual yang di-embed di sini
#   (binder_transaction, binder_alloc_new_buf_locked, do_send_sig_info) memang
#   persis sama dengan panduan integrasi manual resminya untuk kernel <=5.4.
#   README itu juga mencatat known issue: sebagian backport cgroup freezer v2
#   butuh #include <linux/sched/jobctl.h> di rekernel.h supaya JOBCTL_TRAP_FREEZE
#   dikenali - include ini sudah ditambahkan ke drivers/rekernel/rekernel.h.
#   Re:Kernel tetap berupa blob statis (bukan git clone) karena upstream tidak
#   menyediakan setup.sh; tool otomatisnya ("Kernel Modifier") berbasis Java 17+
#   dan tidak cocok dijalankan sebagai curl|bash di CI.
#
# PENYEMPURNAAN (revisi audit ke-5, 2026-09-08):
# - Cek ulang commit terbaru semua sumber terhadap pin yang dipakai:
#     dlagia/Build-Kernel_scripts@10f1480  -> MASIH commit terbaru (fix unbound
#       variable, 2026-08-10). Tidak ada perubahan.
#     vc-teahouse/Baseband-guard@a54e0dc   -> MASIH commit terbaru (2026-07-26).
#       Tidak ada perubahan.
#     maxsteeel/nomount@dev                -> ada commit lebih baru (f7f7caaf,
#       "replace RBTree with Adaptive Radix Tree", 2026-09-08) TAPI cuma menyentuh
#       kernel/src/nomount.{c,h}; kernel/setup.sh IDENTIK dgn pin 0c4b2db. Pin
#       setup.sh sengaja DIPERTAHANKAN (membekukan versi script). Kode driver ART
#       yang baru itu tetap ikut terambil otomatis lewat argumen "-s dev" saat
#       setup.sh clone repo - sesuai filosofi pin di revisi ke-3.
#     actions/cache@v6 & actions/upload-artifact@v7 -> tag major masih valid
#       (rilis terkini v6.1.0 & v7.0.1). Tidak diubah.
# - Diverifikasi ulang bahwa integrate_ksu_susfs.sh (pin 10f1480) jalan dgn
#   "set -euo pipefail" dan HANYA membaca env KERNEL_DIR + KERNEL_VERSION; kedua-
#   duanya sudah di-export di step integrasi. VERSION/PATCHLEVEL cuma variabel
#   shell lokal untuk menyusun KERNEL_VERSION, jadi tidak perlu di-export -
#   tidak ada lagi risiko "unbound variable".
# - BUG DEPENDENCY: step Compile mengoper CROSS_COMPILE_ARM32=arm-linux-gnueabi-
#   (dipakai kernel arm64 utk vDSO 32-bit kalau CONFIG_COMPAT_VDSO=y), tapi paket
#   gcc-arm-linux-gnueabi belum ikut diinstal (hanya gcc-aarch64-linux-gnu). Kini
#   ditambahkan ke step "Pasang dependency build". Kalau COMPAT_VDSO mati paket
#   ini tidak terpakai (tidak ada efek samping); kalau hidup, mencegah kegagalan
#   "arm-linux-gnueabi-gcc: command not found" jauh di tengah build.
#
# PENYEMPURNAAN (revisi audit ke-6, 2026-09-10):
# A. BUG NYATA - anchor extern ksu_hide_setprocattr TIDAK PERNAH COCOK.
#    Blok "PERBAIKAN OTOMATIS ... security/selinux/hooks.c" memakai anchor
#    'static int selinux_setprocattr(struct task_struct *p,'. Di rosemary-13
#    signature aslinya adalah:
#        static int selinux_setprocattr(const char *name, void *value, size_t size)
#    (dicek langsung ke source: 1 kemunculan, di awal baris). Jadi anchor lama
#    cocok 0 kali, `if grep -qF ...` gagal, dan karena TIDAK ADA `else` di dalam
#    -> step mencetak "extern declaration hilang" lalu DIAM-DIAM tidak menambal
#    apa pun. Kalau kondisi itu benar-benar terjadi, build baru mati jauh di
#    belakang dengan "implicit declaration of function 'ksu_hide_setprocattr'".
#    Sekarang: anchor dicocokkan ke nama fungsi saja (apa pun argumennya),
#    jumlah kemunculan divalidasi harus 1, dan hasil tambalan diverifikasi -
#    gagal = berhenti dengan pesan jelas, bukan lolos diam-diam.
#    Catatan: upstream susfs_inline_hook_patches.sh (JackA1ltman) sebenarnya
#    SUDAH menangani kedua bentuk signature, jadi jalur ini murni jaring
#    pengaman - tapi jaring pengaman yang bolong sama saja tidak ada.
# B. BUG NYATA - anykernel.sh memakai is_slot_device=1 di device A-only.
#    tools/ak3-core.sh (fungsi setup_ak) punya:
#        if [ ! "$slot" -a "$is_slot_device" == 1 ]; then
#          abort "Unable to determine active slot. Aborting...";
#    Keluarga MT6781 (rosemary/fleur/sea/ocean/miel/secret/maltose) A-only:
#    tidak ada ro.boot.slot_suffix maupun androidboot.slot, jadi $slot kosong
#    dan zip ABORT sebelum menyentuh partisi boot. Diganti ke is_slot_device=auto
#    yang tetap mendeteksi slot kalau ada, tapi lanjut normal kalau tidak ada.
# C. fix_susfs_task_mmu.py: verifikasi akhir memakai s.index() dua kali.
#    (a) kalau salah satu penanda hilang -> ValueError/traceback mentah, bukan
#    pesan yang bisa dibaca; (b) kalau penanda akhir kebetulan berada SEBELUM
#    penanda awal, slicing Python menghasilkan string kosong TANPA error, jadi
#    cek "return 0;" lolos diam-diam - persis kegagalan yang mau dicegah.
#    Diganti find() + validasi urutan eksplisit.
# D. Kegagalan unduh tertelan pipeline. `curl -LSs URL | bash -s dev` (NoMount)
#    dan `wget -O- URL | bash` (Baseband-guard) berjalan tanpa `set -o pipefail`
#    dan tanpa curl `-f`, jadi HTTP 404/500 tidak membuat step gagal di titik
#    kejadian. Ditambahkan pipefail + `curl -fLSs` + cek exit wget eksplisit.
# E. Entry NoMount di fs/Makefile tidak pernah diverifikasi. setup.sh melewati
#    penambahan kalau `grep -q "nomount" fs/Makefile` sudah true karena sebab
#    lain; akibatnya CONFIG_NOMOUNT=y tapi objeknya tidak pernah dikompilasi.
#    Sekarang dicek eksplisit.
# F. CONFIG_CGROUP_FREEZER tidak diverifikasi. Re:Kernel mendeteksi proses beku
#    lewat frozen()/freezing(); keduanya baru mencerminkan pembekuan APLIKASI
#    kalau CGROUP_FREEZER=y (kalau hanya PM_SLEEP, FREEZER=y tapi cuma untuk
#    suspend, dan Re:Kernel tidak pernah melapor). rosemary_defconfig tidak
#    menyetelnya dan init/Kconfig tidak men-default-kannya ke y. Ditambah
#    PERINGATAN non-fatal di ringkasan config (bukan error: kalau memang mati,
#    build tetap sah, cuma fitur Re:Kernel jadi mubazir).
# G. /tmp/build.log hilang saat build gagal. Ditambah step upload artifact
#    ber-`if: failure()` supaya log lengkap bisa diunduh.
#
# CEK PEMBARUAN UPSTREAM (per 2026-09-10):
#   dlagia/Build-Kernel_scripts@10f1480 -> MASIH HEAD main (2026-08-10). Tetap.
#   vc-teahouse/Baseband-guard@a54e0dc  -> MASIH HEAD main (2026-07-26). Tetap.
#   maxsteeel/nomount@0c4b2db (setup.sh) -> HEAD dev kini 4463f16c (2026-09-09),
#     tapi kernel/setup.sh terakhir berubah 2026-08-24 (26417ca5) dan isinya
#     BYTE-IDENTIK dengan yang di pin. Jadi pin setup.sh tetap valid; 11 commit
#     driver baru (ART rewrite + "fix ART child removal", "batch rule clearing",
#     "only change d_flags if its our file", dll) tetap ikut terambil otomatis
#     lewat argumen "-s dev". Diverifikasi ulang: nomount_srcu masih ada di
#     kernel/src/nomount.c (grep penjaga di bawah masih sahih), userspace/src
#     masih hanya nm.c + nm.h, dan _start masih didefinisikan via inline asm di
#     nm.h (jadi -Wl,-e,_start masih benar).
#   actions/cache@v6 (rilis v6.1.0) & actions/upload-artifact@v7 (v7.0.1) ->
#     tag major masih ada dan valid. Tetap.
#   fjrXTR/AnyKernel3@mt6781 -> a9fe54fa, tidak berubah sejak 2023. Tetap.
#   kdrag0n/proton-clang@master -> 9fb011b1, tidak berubah sejak 2021. Tetap.
#   Sakion-Team/Re-Kernel -> KOREKSI CATATAN revisi ke-4. Upstream SEKARANG
#     menyediakan otomatisasi: Integrate/patches.sh + Integrate/rekernel/
#     {rekernel.c,rekernel.h,Kconfig,Makefile} (jalur versi 11.6, 2026-09-07).
#     TETAPI sengaja TIDAK dipakai di sini: rekernel.h upstream yang baru
#     memakai frozen_task_group() = jobctl_frozen() || cgroup_freezing(), dan
#     jobctl_frozen() butuh JOBCTL_TRAP_FREEZE yang hanya ada di kernel dengan
#     backport cgroup freezer v2 (mainline 5.15+). rosemary-13 adalah 4.14
#     standar tanpa backport itu, jadi sumber upstream yang baru TIDAK AKAN
#     COMPILE di sini. Blob statis di bawah (pakai frozen()/freezing() pada
#     group_leader, jalur cgroup freezer v1) tetap yang benar untuk 4.14.
#     Catatan tambahan: contoh do_send_sig_info() di Integrate/README.md
#     upstream memeriksa line_is_frozen(current) lalu melaporkan killer=p /
#     dst=current - tertukar. Versi di bawah memeriksa p (target yang dibekukan)
#     dan melaporkan killer=current / dst=p, yang sesuai maksud fiturnya, jadi
#     sengaja dipertahankan.
#
# PENYEMPURNAAN (revisi audit ke-7, 2026-09-10) - fokus: STUCK DI LOGO.
#   Gejala: kernel ter-build & ter-flash sukses tapi macet di logo Redmi (crash
#   SEBELUM framebuffer, jadi bukan kegagalan build).
#
#   TEMUAN VERIFIKASI (menjawab kekhawatiran AI lain soal task_mmu.c &
#   security/selinux/hooks.c):
#   - Source rosemary-13 asli + patch SUSFS mainline (kini v2.3.0) di-REPRODUKSI
#     ulang: patch task_mmu.c gagal di hunk #1/#4/#5/#6 persis seperti dulu, lalu
#     fix_susfs_task_mmu.py memperbaikinya. Hasil akhirnya diperiksa baris demi
#     baris: SEMUA guard SUS_MAP mendarat di fungsi yang benar - `return;` di
#     show_map_vma() (void), `return 0;` di show_smap() (int), `goto` di
#     pagemap_read() (ssize_t), dan smap_gather_stats() (void) BERSIH dari
#     `return 0;`. Jadi hook task_mmu.c BENAR secara semantik, bukan penyebab.
#   - security/selinux/hooks.c: signature asli rosemary-13 adalah
#     selinux_setprocattr(const char *name, void *value, size_t size) dan
#     susfs_inline_hook_patches.sh (JackA1ltman) memang menyisipkan extern +
#     panggilan ksu_hide_setprocattr() lewat cabang signature-baru yang cocok.
#     Ini hook KSU standar yang juga jalan di build yang DULU boot. Bukan
#     penyebab. (Jaring pengaman manual di step integrasi tetap dipertahankan.)
#
#   AKAR MASALAH YANG SEBENARNYA - dependency yang MENGAMBANG di HEAD:
#     Build ini punya 3 sumber DRIVER yang tidak di-pin dan berubah TEPAT setelah
#     build terakhir yang boot:
#       * SUSFS (JackA1ltman mainline) -> naik ke v2.3.0 pada 2026-09-04.
#       * NoMount dev -> di-rewrite total RBTree => Adaptive Radix Tree
#         (f7f7caaf, 2026-09-08) + rentetan commit "fix ..." susulan. Kode ini
#         jalan di jalur d_revalidate + iterate_dir SEJAK filesystem pertama
#         diakses saat boot; bug di sana = crash awal = stuck di logo. INI
#         tersangka terkuat karena paling banyak diaduk & paling dekat ke boot.
#       * ReSukiSU (KernelSU) -> tetap di-clone dari main HEAD.
#     Itu sebabnya build "yang tadinya jalan" bisa mati sendiri tanpa ganti YAML.
#
#   PERBAIKAN DI REVISI INI:
#   1. NoMount driver DI-PIN ke commit stabil terakhir SEBELUM rewrite ART
#      (166f7b7c, 2026-09-06). setup.sh menerima <commit> sbagai argumen, jadi
#      `bash -s <sha>` meng-checkout commit itu (detached HEAD); verifikasi
#      diganti dari cek nama-branch ke cek SHA.
#   2. Tiga add-on (NoMount / Re:Kernel / Baseband-guard) kini bisa DIMATIKAN
#      lewat input workflow_dispatch untuk BISECT: build KSU+SUSFS murni dulu,
#      lalu nyalakan satu per satu sampai ketemu yang bikin macet. Step integrasi
#      di-guard `if:`, dan fragment defconfig + cek config saat compile ikut
#      kondisional supaya tidak ada CONFIG_* menunjuk driver yang tak diintegrasi.
#   3. Ringkasan run diberi perintah ambil log crash asli (pstore console-ramoops
#      / last_kmsg) - itu satu-satunya cara memastikan penyebab tanpa menebak.
#
#   CATATAN: kalau dengan SEMUA add-on OFF pun masih stuck, tersangka bergeser ke
#   inti KSU+SUSFS - kemungkinan besar SUSFS v2.3.0. Karena dlagia integrate.sh
#   meng-hardcode fetch SUSFS dari branch 'mainline' (tak bisa di-pin dari luar
#   tanpa fork), langkah lanjutannya adalah pin/ganti sumber SUSFS - lapor lagi
#   kalau bisect menunjuk ke sana.
# ============================================================

name: Build Kernel Rosemary (KSU + SuSFS dlagia)

on:
  workflow_dispatch:
    inputs:
      build_nomount:
        description: "Sertakan NoMount (matikan dulu untuk BISECT stuck-at-logo)"
        type: boolean
        default: true
      build_rekernel:
        description: "Sertakan Re:Kernel"
        type: boolean
        default: true
      build_baseband_guard:
        description: "Sertakan Baseband-guard"
        type: boolean
        default: true
  push:
    branches: [ main, master ]

concurrency:
  group: build-rosemary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    # Toggle komponen add-on untuk BISECT boot hang (stuck di logo). Trigger
    # 'push' tidak punya inputs, jadi default-nya 'true' (build lengkap).
    # workflow_dispatch: boolean input diteruskan sebagai string "true"/"false".
    env:
      BUILD_NOMOUNT: ${{ github.event.inputs.build_nomount || 'true' }}
      BUILD_REKERNEL: ${{ github.event.inputs.build_rekernel || 'true' }}
      BUILD_BBG: ${{ github.event.inputs.build_baseband_guard || 'true' }}

    steps:
      - name: Pasang dependency build
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl flex git kmod \
            libelf-dev libssl-dev zip zlib1g-dev xxd python3 \
            libtinfo5 libncurses5 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Clone source kernel (dlagia/android_kernel_xiaomi_rosemary @ rosemary-13)
        run: |
          git clone --depth=1 -b rosemary-13 \
            https://github.com/dlagia/android_kernel_xiaomi_rosemary.git kernel
          echo "KERNEL_SHA=$(git -C kernel rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "Kernel source commit: $(git -C kernel rev-parse HEAD)"

      - name: Integrasikan ReSukiSU & SuSFS (dlagia/Build-Kernel_scripts)
        working-directory: kernel
        run: |
          export KERNEL_DIR=$(pwd)
          VERSION=$(grep -w '^VERSION' Makefile | tr -d ' ' | cut -d= -f2 || echo "")
          PATCHLEVEL=$(grep -w '^PATCHLEVEL' Makefile | tr -d ' ' | cut -d= -f2 || echo "")
          export KERNEL_VERSION="${VERSION}.${PATCHLEVEL}"
          echo "Kernel version detected: $KERNEL_VERSION"

          # Repo kernel ini SUDAH membawa file *.rej sendiri (mis.
          # drivers/misc/mediatek/lcm/mt65xx_lcm_list.c.rej) yang ter-commit dan
          # tidak ada hubungannya dgn SUSFS. Dicatat dulu supaya tidak dikira
          # kegagalan patch.
          find . -path ./.git -prune -o -name '*.rej' -printf '%P\n' 2>/dev/null | sort > /tmp/rej_before.txt
          echo "== Reject bawaan repo (diabaikan): $(wc -l < /tmp/rej_before.txt) file =="
          cat /tmp/rej_before.txt || true

          # Dipin ke commit tertentu (bukan 'main') supaya perubahan script upstream
          # tidak diam-diam mengubah cara integrasi KSU/SuSFS di run berikutnya.
          echo "[+] Mengunduh integrate_ksu_susfs.sh dari dlagia/Build-Kernel_scripts (pinned commit)..."
          curl -fLSs "https://raw.githubusercontent.com/dlagia/Build-Kernel_scripts/10f1480b39418e885d4402e78a5ec7721d5040d3/scripts/integrate_ksu_susfs.sh" -o integrate_ksu_susfs.sh
          chmod +x integrate_ksu_susfs.sh

          # ----- PIN SUMBER PATCH SUSFS (revisi ke-9, 2026-09-10) -----
          # integrate_ksu_susfs.sh mengunduh susfs_inline_hook_patches.sh dan
          # susfs_patch_to_${KERNEL_VERSION}.patch dari branch 'mainline' milik
          # JackA1ltman yang TIDAK di-pin. Branch itu berubah dua kali hari ini:
          #   103d85d2cd (11:57Z) "merged latest commits"  -> patch tercemar diff
          #                        direktori .git/ DAN kurang satu '}' di section
          #                        fs/notify/fdinfo.c (blok CONFIG_KSU_SUSFS_SUS_MOUNT)
          #   58568ef1fc (12:19Z) "fix: susfs patches apply incorrect" -> dua-duanya beres
          # Build yang gagal (rosemary-build-log.zip) memakai versi 11:57Z. Sumber
          # dipaku ke commit hasil perbaikan supaya build bisa diulang (reproducible)
          # dan tidak ikut berubah lagi kalau upstream mengedit branch.
          SUSFS_PIN="58568ef1fcea20ba73d8f02a914ecf9fc03313d5"
          sed -i "s|refs/heads/mainline|${SUSFS_PIN}|g" integrate_ksu_susfs.sh
          echo "[+] Sumber SUSFS di-PIN ke JackA1ltman@58568ef1fc ($(grep -c "$SUSFS_PIN" integrate_ksu_susfs.sh) URL dialihkan)"

          # ----- SANITASI PATCH SUSFS (revisi ke-8, 2026-09-10) -----
          # BUG BARU (log rosemary-build-log.zip): susfs_patch_to_4.14.patch dari
          # JackA1ltman branch 'mainline' kini TERCEMAR diff direktori .git/
          # (.git/ORIG_HEAD, .git/index, .git/logs/HEAD, .git/objects/*) milik repo
          # scratch pembuatnya (crdroidandroid .._sm8150). Saat 'patch -p1', file
          # .git/* jadi target, gagal, lalu meninggalkan .git/logs/HEAD.rej -> audit
          # menganggapnya reject tak tertangani -> build berhenti exit 1.
          # CATATAN revisi ke-9: setelah sumber di-PIN ke 58568ef1fc di atas, patch
          # yang diunduh SUDAH bersih dari .git/ (sudah diverifikasi: daftar
          # 'diff --git' hanya berisi fs/, kernel/, mm/, include/, security/). Filter
          # di bawah kini berfungsi sebagai jaring pengaman - kalau pin dinaikkan
          # nanti dan upstream mencemari patch lagi, build tetap selamat.
          # Perbaikan lapis-1 (mencegah di sumber): sisipkan filter awk yang membuang
          # SEMUA section 'diff --git ...' yang menyasar .git/ SEBELUM patch
          # diterapkan; section file kernel (fs/, kernel/, mm/, security/, include/)
          # tetap utuh. Script sudah di-PIN, jadi teks baris apply-nya stabil.
          printf '%s\n' '#!/bin/bash' 'P="$1"' \
            'awk '\''/^diff --git /{d=($0 ~ /[ab]\/\.git\//)} !d'\'' "$P" > "$P.ng" && mv "$P.ng" "$P"' \
            'echo "[+] (sanitasi) section .git/ dibuang dari patch sebelum apply"' \
            'patch -p1 < "$P"' > /tmp/susfs_apply.sh
          sed -i 's|patch -p1 < "susfs_patch_to_${KERNEL_VERSION}.patch"|bash /tmp/susfs_apply.sh "susfs_patch_to_${KERNEL_VERSION}.patch"|' integrate_ksu_susfs.sh
          grep -q 'susfs_apply.sh' integrate_ksu_susfs.sh \
            && echo "OK: apply patch SUSFS dialihkan ke filter anti-.git" \
            || echo "CATATAN: baris apply tak ditemukan (script upstream berubah?) - pengaman audit .git di bawah tetap aktif"

          # </dev/null: script punya prompt interaktif "read -t 10" utk penanganan
          # reject. Di runner tidak ada tty, jadi dipaksa non-interaktif supaya
          # tidak menggantung 10 detik dan hasilnya deterministik.
          bash integrate_ksu_susfs.sh < /dev/null
          rm -f integrate_ksu_susfs.sh

          echo ""
          echo "== AUDIT REJECT PATCH SUSFS =="
          # Script dlagia menelan kegagalan patch (patch ... || true) lalu
          # memindahkan .rej ke patch_rejects/ dan tetap lanjut. Kalau tidak
          # diaudit, build gagal jauh di belakang dgn error yang membingungkan.
          # Script dlagia memindahkan semua *.rej ke patch_rejects/ (termasuk yg
          # bawaan repo), jadi kumpulkan dari dua tempat lalu kurangi daftar
          # bawaan tadi. Sisanya = reject yang benar-benar dari patch SUSFS.
          # Pengaman lapis-2: kalau toh ada .rej nyasar di dalam .git/ (mis. dari
          # run lama atau bila sanitasi lapis-1 terlewat), buang dulu - itu bukan
          # file kernel dan tidak boleh membuat audit gagal.
          find . -path '*/.git/*' -name '*.rej' -delete 2>/dev/null || true
          { find patch_rejects -path '*/.git/*' -prune -o -name '*.rej' -printf '%P\n' 2>/dev/null; \
            find . \( -path ./patch_rejects -o -path ./.git \) -prune -o -name '*.rej' -printf '%P\n' 2>/dev/null; } \
            | sort -u > /tmp/rej_after.txt
          REJ=$(comm -13 /tmp/rej_before.txt /tmp/rej_after.txt)

          if [ -n "$REJ" ]; then
            echo "Reject baru dari patch SUSFS:"
            echo "$REJ"
          else
            echo "Tidak ada reject baru dari patch SUSFS."
          fi

          # fs/proc/task_mmu.c.rej memang diharapkan gagal (hunk #1/#5/#6) dan
          # ditangani step berikutnya. Selain itu, berhenti.
          UNEXPECTED=$(echo "$REJ" | grep -v '^fs/proc/task_mmu\.c\.rej$' | grep -vE '(^|/)\.git/' | grep -v '^$' || true)
          if [ -n "$UNEXPECTED" ]; then
            echo ""
            echo "ERROR: ada reject SUSFS di file yang belum ditangani:"
            echo "$UNEXPECTED"
            echo "Isi reject:"
            for f in $UNEXPECTED; do
              echo "----- $f"
              cat "patch_rejects/$f" 2>/dev/null || cat "$f" 2>/dev/null || true
            done
            exit 1
          fi

          echo "$REJ" | grep -q '^fs/proc/task_mmu\.c\.rej$' \
            && echo "OK: hanya fs/proc/task_mmu.c yang reject (sudah diantisipasi)" \
            || echo "CATATAN: task_mmu.c tidak reject - patch upstream mungkin sudah diperbaiki"

          echo ""
          echo "== PERBAIKAN OTOMATIS: bug deteksi versi utk security/selinux/hooks.c (kernel 4.14) =="
          # CATATAN revisi ke-6: anchor lama adalah
          #   'static int selinux_setprocattr(struct task_struct *p,'
          # dan itu TIDAK PERNAH cocok di rosemary-13, karena signature aslinya
          #   static int selinux_setprocattr(const char *name, void *value, size_t size)
          # Karena `if` bagian dalam tidak punya `else`, step lama akan mencetak
          # "extern declaration hilang" lalu diam-diam TIDAK menambal apa pun,
          # dan build baru mati jauh di belakang dengan implicit declaration.
          # Sekarang: cocokkan nama fungsinya saja (apa pun bentuk argumennya).
          if grep -q 'ksu_hide_setprocattr(name, value, size);' security/selinux/hooks.c \
             && ! grep -q 'extern int ksu_hide_setprocattr' security/selinux/hooks.c; then
            echo "Terdeteksi: pemanggilan ksu_hide_setprocattr ada, tapi extern declaration hilang."
            N=$(grep -c '^static int selinux_setprocattr(' security/selinux/hooks.c || true)
            if [ "$N" != "1" ]; then
              echo "ERROR: anchor 'static int selinux_setprocattr(' ketemu $N kali (harus 1)."
              echo "Struktur security/selinux/hooks.c berubah; extern ksu_hide_setprocattr"
              echo "tidak bisa ditambal otomatis. Konteks di sekitarnya:"
              grep -n 'selinux_setprocattr' security/selinux/hooks.c || true
              exit 1
            fi
            sed -i '/^static int selinux_setprocattr(/i\#ifdef CONFIG_KSU\nextern int ksu_hide_setprocattr(const char *name, void *value, size_t size);\n#endif\n' security/selinux/hooks.c
            if grep -q 'extern int ksu_hide_setprocattr' security/selinux/hooks.c; then
              echo "OK: extern ksu_hide_setprocattr berhasil ditambal manual."
            else
              echo "ERROR: penyisipan extern ksu_hide_setprocattr GAGAL walau anchor cocok."
              exit 1
            fi
          else
            echo "Tidak perlu ditambal."
          fi

          echo ""
          echo "== Verifikasi integrasi KernelSU & SuSFS =="
          test -d KernelSU || { echo "ERROR: direktori KernelSU tidak ditemukan"; exit 1; }
          for f in fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h; do
            test -s "$f" || { echo "ERROR: $f tidak ada setelah patch SUSFS"; exit 1; }
            echo "OK: $f ada"
          done
          grep -q 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' fs/Makefile || {
            echo "ERROR: fs/Makefile tidak berisi entry susfs.o"
            exit 1
          }
          echo "OK: fs/Makefile berisi obj-\$(CONFIG_KSU_SUSFS) += susfs.o"

          echo ""
          echo "== Verifikasi hook inline SuSFS (syarat ReSukiSU inline_hook_check.mk) =="
          for pair in \
            "ksu_handle_execveat:fs/exec.c" \
            "ksu_handle_faccessat:fs/open.c" \
            "ksu_handle_sys_read:fs/read_write.c" \
            "ksu_handle_stat:fs/stat.c" \
            "ksu_handle_sys_reboot:kernel/reboot.c" \
            "ksu_handle_input_handle_event:drivers/input/input.c" \
            "ksu_handle_setresuid:kernel/sys.c" ; do
            sym="${pair%%:*}"; file="${pair##*:}"
            grep -q "$sym" "$file" || { echo "ERROR: hook $sym tidak ada di $file"; exit 1; }
            echo "OK: $sym ada di $file"
          done

          echo "KSU_SHA=$(git -C KernelSU rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "ReSukiSU commit: $(git -C KernelSU rev-parse HEAD)"
          echo "Integrasi KernelSU + SuSFS via dlagia/Build-Kernel_scripts: SUKSES"

      - name: Perbaiki hasil patch SUSFS di fs/proc/task_mmu.c
        working-directory: kernel
        run: |
          echo "" | base64 -d > /tmp/fix_susfs_task_mmu.py
          python3 /tmp/fix_susfs_task_mmu.py
          rm -f fs/proc/task_mmu.c.rej patch_rejects/fs/proc/task_mmu.c.rej

          echo ""
          echo "== Ringkasan hunk task_mmu.c =="
          grep -c 'SUSFS_IS_INODE_SUS_MAP' fs/proc/task_mmu.c || true
          grep -n 'susfs_def.h' fs/proc/task_mmu.c || true

      - name: Commit ReSukiSU + bersihkan dirty
        working-directory: kernel
        run: |
          echo "==================== Cek status KernelSU sebelum commit ===================="
          cd KernelSU
          git status --porcelain || true
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -A
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Apply custom integration (remove dirty)"
            echo "Commit berhasil dilakukan di KernelSU"
          else
            echo "KernelSU sudah clean, tidak ada yang perlu di-commit"
          fi

          echo ""
          echo "==================== Status setelah commit ===================="
          git status
          git diff-index --quiet HEAD && echo ">>> KernelSU CLEAN (tidak ada dirty)" || echo ">>> MASIH DIRTY!"

          cd ..

          if [ -f scripts/setlocalversion ]; then
            sed -i 's/-dirty//g' scripts/setlocalversion
            echo "scripts/setlocalversion sudah dibersihkan dari -dirty"
          fi

          find . -name setlocalversion -exec sed -i 's/-dirty//g' {} + 2>/dev/null || true

          if [ -f KernelSU/kernel/Kbuild ]; then
            sed -i 's/KSU_COMMIT_SHA  := \$(KSU_COMMIT_SHA)-dirty/KSU_COMMIT_SHA  := \$(KSU_COMMIT_SHA)/' KernelSU/kernel/Kbuild || true
            echo "Pengecekan -dirty di KernelSU/kernel/Kbuild sudah dinetralisir"
          fi

      - name: Integrasikan NoMount (setup.sh resmi, driver di-PIN)
        if: env.BUILD_NOMOUNT == 'true'
        working-directory: kernel
        run: |
          # ==== PIN DRIVER NoMount (revisi audit ke-7) ====
          # Sebelumnya `bash -s dev` = checkout branch dev + `git pull` -> SELALU
          # ambil HEAD dev. Itu berarti KODE DRIVER yang di-compile berubah tiap
          # run. Antara build terakhir yang boot (akhir Agustus) dan sekarang,
          # dev NoMount di-rewrite total: RBTree -> Adaptive Radix Tree
          # (f7f7caaf, 2026-09-08) plus serentetan commit "fix" susulan
          # ("fix ART child removal", "only change d_flags if its our file", dst).
          # Kode itu berjalan di jalur d_revalidate + iterate_dir SEJAK filesystem
          # pertama diakses saat boot; bug di sana = crash sebelum framebuffer =
          # STUCK DI LOGO. Karena setup.sh menerima argumen <commit-or-tag>
          # (bukan cuma nama branch), driver sekarang di-pin ke commit STABIL
          # TERAKHIR SEBELUM rewrite ART, supaya build reproducible dan tidak
          # ikut kode yang masih diaduk upstream. Untuk update: ganti SHA di
          # bawah setelah versi ART terbukti stabil.
          NOMOUNT_PIN="166f7b7c8cf99247c952201feb8211b42bc1692b"  # 2026-09-06, pre-ART (RBTree)

          # pipefail: tanpa ini, exit code pipeline = exit code `bash` saja,
          # sehingga HTTP 404/500 dari curl tidak pernah menggagalkan step.
          set -o pipefail
          rm -rf NoMount fs/nomount
          # setup.sh sendiri tetap di-pin ke commit tertentu (isi script stabil);
          # argumen $1 = commit driver yang mau di-checkout (detached HEAD).
          # -f: HTTP >=400 -> curl exit != 0 (tanpa -f, halaman error ikut ter-pipe
          # ke bash sebagai "script" dan bash keluar 0).
          curl -fLSs "https://raw.githubusercontent.com/maxsteeel/nomount/0c4b2dbd113b267b673cd7925cd80736658d7a62/kernel/setup.sh" | bash -s "$NOMOUNT_PIN"

          test -d NoMount || {
            echo "ERROR: direktori NoMount tidak ditemukan setelah setup.sh"
            exit 1
          }

          echo "NoMount commit dipakai (kernel + nm): $(git -C NoMount rev-parse HEAD)"
          # setup.sh mem-checkout SHA -> detached HEAD (bukan branch), jadi
          # verifikasinya adalah kecocokan commit, bukan nama branch.
          test "$(git -C NoMount rev-parse HEAD)" = "$NOMOUNT_PIN" || {
            echo "ERROR: NoMount tidak ter-checkout ke commit pin ($NOMOUNT_PIN)"
            echo "HEAD aktual: $(git -C NoMount rev-parse HEAD)"
            exit 1
          }

          test -L fs/nomount || {
            echo "ERROR: symlink fs/nomount tidak dibuat oleh setup.sh"
            exit 1
          }
          test -s fs/nomount/Kconfig
          test -s fs/nomount/Makefile
          test -s fs/nomount/nomount.c
          test -s fs/nomount/nomount.h

          echo ""
          echo "== PERBAIKAN bug duplikasi fs/Kconfig upstream =="
          python3 - << 'PYEOF'
          path = "fs/Kconfig"
          target = 'source "fs/nomount/Kconfig"\n'

          with open(path) as f:
              lines = f.readlines()

          idxs = [i for i, l in enumerate(lines) if l == target]
          print(f"Ditemukan {len(idxs)} baris '{target.strip()}' di fs/Kconfig")

          if len(idxs) == 0:
              print("ERROR: baris source fs/nomount/Kconfig tidak ditemukan sama sekali")
              raise SystemExit(1)
          elif len(idxs) == 1:
              print("OK: cuma 1 baris kali ini - tidak perlu diperbaiki")
          else:
              endmenu_idxs = [i for i, l in enumerate(lines) if l.strip() == "endmenu"]
              if not endmenu_idxs:
                  print("ERROR: tidak ada baris endmenu di fs/Kconfig - struktur tidak dikenal")
                  raise SystemExit(1)
              last_endmenu = endmenu_idxs[-1]
              keep_idx = last_endmenu - 1 if (last_endmenu - 1) in idxs else idxs[-1]
              new_lines = [l for i, l in enumerate(lines) if l != target or i == keep_idx]
              with open(path, "w") as f:
                  f.writelines(new_lines)
              sisa = new_lines.count(target)
              print(f"Diperbaiki: {len(idxs)} -> {sisa} baris (dipertahankan indeks {keep_idx}, tepat sebelum endmenu top-level)")
              if sisa != 1:
                  print("ERROR: perbaikan gagal, jumlah baris akhir bukan 1")
                  raise SystemExit(1)
          PYEOF

          echo ""
          echo "==================== NoMount (branch dev, via setup.sh resmi) ===================="
          echo "NoMount source: $(readlink -f fs/nomount)"
          grep -nF 'source "fs/nomount/Kconfig"' fs/Kconfig || true
          test "$(grep -cF 'source "fs/nomount/Kconfig"' fs/Kconfig)" = "1" || {
            echo "ERROR: fs/Kconfig masih mengandung duplikasi setelah perbaikan"
            exit 1
          }
          grep -q 'nomount_srcu' fs/nomount/nomount.c || {
            echo "ERROR: fs/nomount/nomount.c tidak mengandung nomount_srcu"
            exit 1
          }

          # Entry fs/Makefile. setup.sh menambahkannya dengan penjaga longgar:
          #     if ! grep -q "nomount" "$FS_MAKEFILE"; then
          #         printf "\nobj-\$(CONFIG_NOMOUNT) += nomount/\n" >> "$FS_MAKEFILE"
          # Artinya kalau kata "nomount" sudah muncul di fs/Makefile karena sebab
          # lain (sisa run sebelumnya, komentar, patch lain), penambahan DILEWATI
          # tanpa peringatan -> CONFIG_NOMOUNT=y tapi objeknya tidak pernah
          # dikompilasi, dan kegagalannya baru terasa saat runtime di HP.
          # Jadi entry-nya diverifikasi eksplisit di sini.
          grep -nF 'obj-$(CONFIG_NOMOUNT) += nomount/' fs/Makefile || true
          test "$(grep -cF 'obj-$(CONFIG_NOMOUNT) += nomount/' fs/Makefile)" = "1" || {
            echo "ERROR: fs/Makefile tidak berisi tepat satu 'obj-\$(CONFIG_NOMOUNT) += nomount/'"
            echo "Baris fs/Makefile yang menyebut nomount:"
            grep -n 'nomount' fs/Makefile || echo "  (tidak ada sama sekali)"
            exit 1
          }
          echo "OK: fs/Makefile berisi obj-\$(CONFIG_NOMOUNT) += nomount/"

          echo "NOMOUNT_SHA=$(git -C NoMount rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "NoMount branch dev: OK"

      - name: Integrasikan Re:Kernel (Sakion-Team) - notifikasi freeze binder/signal
        if: env.BUILD_REKERNEL == 'true'
        working-directory: kernel
        run: |
          rm -rf drivers/rekernel
          mkdir -p drivers/rekernel
          echo "" | base64 -d > drivers/rekernel/rekernel.h
          echo "" | base64 -d > drivers/rekernel/rekernel.c
          echo "b2JqLSQoQ09ORklHX1JFS0VSTkVMKSArPSByZWtlcm5lbC5vCg==" | base64 -d > drivers/rekernel/Makefile
          echo "" | base64 -d > drivers/rekernel/Kconfig

          grep -q 'rekernel/' drivers/Makefile || echo 'obj-y += rekernel/' >> drivers/Makefile
          if ! grep -q 'rekernel/Kconfig' drivers/Kconfig; then
            # sed '/^endmenu/i' menyisip sebelum SETIAP endmenu; pastikan cuma ada satu.
            NEM=$(grep -c '^endmenu' drivers/Kconfig)
            test "$NEM" = "1" || { echo "ERROR: drivers/Kconfig punya $NEM baris endmenu, penyisipan tidak aman"; exit 1; }
            sed -i '/^endmenu/i source "drivers/rekernel/Kconfig"' drivers/Kconfig
          fi

          echo "" | base64 -d > /tmp/rekernel_hooks.py
          python3 /tmp/rekernel_hooks.py

          echo ""
          echo "==================== VERIFIKASI Re:Kernel ===================="
          head -1 drivers/rekernel/rekernel.c | grep -q '^/\*' || {
            echo "ERROR: drivers/rekernel/rekernel.c bukan file C yang valid"
            exit 1
          }
          grep -q 'nlmsg_put' drivers/rekernel/rekernel.c || {
            echo "ERROR: rekernel.c tidak memanggil nlmsg_put - nlhdr akan dipakai tanpa inisialisasi"
            exit 1
          }
          grep -c 'rekernel_start_server' drivers/android/binder.c drivers/android/binder_alloc.c kernel/signal.c || true
          for f in drivers/android/binder.c drivers/android/binder_alloc.c kernel/signal.c; do
            n=$(grep -c 'rekernel/rekernel.h' "$f")
            test "$n" = "1" || { echo "ERROR: include rekernel.h di $f ada $n kali (harus tepat 1)"; exit 1; }
          done
          echo "Re:Kernel: OK"

      - name: Integrasikan Baseband-guard (LSM anti-tulis baseband/boot chain)
        if: env.BUILD_BBG == 'true'
        working-directory: kernel
        run: |
          # pipefail: tanpa ini, kegagalan wget (404/timeout) tertelan karena exit
          # code pipeline hanya diambil dari `bash` di ujung kanan.
          set -o pipefail
          # Dipin ke commit tertentu (bukan 'main') dgn alasan yang sama seperti
          # integrate_ksu_susfs.sh di atas.
          # wget default sudah keluar != 0 untuk HTTP >=400 (tidak perlu padanan
          # curl -f), tapi pipefail-lah yang membuat exit code itu terpakai.
          wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/a54e0dc6cf0aff4dd87fec49644a02d2eb612905/setup.sh | bash
          grep -q 'baseband_guard' security/Kconfig && echo "baseband_guard: sudah terdaftar di default LSM list" || \
            sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig
          grep -n 'baseband_guard' security/Kconfig || echo "baseband_guard: tidak ada blok config LSM di kernel ini"

          echo ""
          echo "== Verifikasi integrasi Baseband-guard =="
          # setup.sh memakai tanda hubung (baseband-guard), bukan garis bawah.
          test -L security/baseband-guard || { echo "ERROR: symlink security/baseband-guard tidak dibuat"; exit 1; }
          grep -q 'baseband-guard/' security/Makefile || { echo "ERROR: security/Makefile tidak berisi entry baseband-guard"; exit 1; }
          grep -q 'security/baseband-guard/Kconfig' security/Kconfig || { echo "ERROR: security/Kconfig tidak source baseband-guard"; exit 1; }
          # Kernel 4.14 belum punya DEFINE_LSM, jadi setup.sh menempuh jalur patch
          # SELinux dan membuat symlink bbg_tracing.h. Kalau hilang, build gagal jauh
          # di belakang dgn error include yang membingungkan.
          if ! grep -q '#define DEFINE_LSM(lsm)' include/linux/lsm_hooks.h; then
            test -L security/selinux/include/bbg_tracing.h || {
              echo "ERROR: bbg_tracing.h tidak dibuat padahal kernel ini butuh jalur patch SELinux"
              exit 1
            }
            echo "OK: jalur patch SELinux pra-5.1 terpasang (bbg_tracing.h ada)"
          fi
          echo "BBG_SHA=$(git -C Baseband-guard rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "Baseband-guard commit: $(git -C Baseband-guard rev-parse HEAD)"
          echo "Baseband-guard: OK"

      - name: Pra-compile - perbaikan build source MTK (verified reusable)
        working-directory: kernel
        run: |
          grep -rlZ --include=Makefile --include=Kbuild --include='*.mk' --exclude-dir=.git \
            -e '-Werror' . 2>/dev/null \
            | xargs -0 -r sed -i -E -e 's/-Werror=[A-Za-z0-9_-]+//g' -e 's/(-Werror)([[:space:]]|$)/\2/g' || true
          # WAJIB dibatasi ke *.c/*.h dan exclude .git: tanpa itu grep -rl juga
          # mencocokkan objek pack biner di .git dan sed akan merusaknya.
          grep -rlZ --include='*.c' --include='*.h' --exclude-dir=.git --exclude-dir=patch_rejects \
            'no_sanitize(' . 2>/dev/null \
            | xargs -0 -r sed -i -E 's/__attribute__\(\(no_sanitize\("[^"]*"\)\)\)//g' || true
          sed -i 's/inline void ksm_flock(/void ksm_flock(/' include/linux/keyslot-manager.h block/keyslot-manager.c || true
          sed -i 's/^inline void blk_crypto_flock(/void blk_crypto_flock(/' include/linux/blk-crypto.h block/blk-crypto.c || true
          sed -i 's/inline int typec_pd_start_entry(/int typec_pd_start_entry(/' drivers/misc/mediatek/typec/tcpc/inc/tcpci_typec.h drivers/misc/mediatek/typec/tcpc/tcpci_typec.c || true
          find drivers/input/touchscreen -name focaltech_config.h -printf '%h\n' 2>/dev/null | while read d; do
            mkdir -p "$d/include/firmware"
            printf '0x00\n' > "$d/include/firmware/fw_sample.i"
            echo "stub firmware -> $d/include/firmware/fw_sample.i"
          done
          grep -rl 'bq2597x_charger.o' --include=Makefile . 2>/dev/null | while read mk; do
            echo 'CFLAGS_REMOVE_bq2597x_charger.o += -mgeneral-regs-only' >> "$mk"
            echo "CFLAGS_REMOVE ditambah ke: $mk"
          done
          echo '== cek sisa =='
          echo -n 'no_sanitize( tersisa: '; grep -rl 'no_sanitize(' --include='*.h' --include='*.c' . 2>/dev/null | wc -l

      - name: Aktifkan KSU & SuSFS di defconfig (termasuk dlagia ksu-susfs_defconfig)
        working-directory: kernel
        run: |
          DEF=arch/arm64/configs/rosemary_defconfig

          echo "[+] Mengunduh dan menggabungkan ksu-susfs_defconfig dari dlagia/Build-Kernel_scripts (pinned commit)..."
          curl -fsSL "https://raw.githubusercontent.com/dlagia/Build-Kernel_scripts/10f1480b39418e885d4402e78a5ec7721d5040d3/defconfig/ksu-susfs_defconfig" >> "$DEF"

          {
            echo ""
            echo 'CONFIG_LOCALVERSION="-perf"'
            echo "CONFIG_LOCALVERSION_AUTO=n"
            echo ""
          } >> "$DEF"

          # Add-on config hanya di-set =y kalau komponennya memang di-build.
          # Kalau di-matikan untuk bisect, config-nya sengaja TIDAK ditulis
          # supaya tidak ada CONFIG_* menunjuk objek/driver yang tak diintegrasi.
          if [ "$BUILD_NOMOUNT" = "true" ]; then
            echo "" >> "$DEF"; echo "CONFIG_NOMOUNT=y" >> "$DEF"
            echo "[defconfig] CONFIG_NOMOUNT=y ditambahkan"
          else
            echo "[defconfig] NoMount dimatikan (BUILD_NOMOUNT=$BUILD_NOMOUNT) - CONFIG_NOMOUNT tidak ditulis"
          fi
          if [ "$BUILD_REKERNEL" = "true" ]; then
            echo "" >> "$DEF"; echo "CONFIG_REKERNEL=y" >> "$DEF"
            echo "[defconfig] CONFIG_REKERNEL=y ditambahkan"
          else
            echo "[defconfig] Re:Kernel dimatikan (BUILD_REKERNEL=$BUILD_REKERNEL) - CONFIG_REKERNEL tidak ditulis"
          fi
          if [ "$BUILD_BBG" = "true" ]; then
            echo "" >> "$DEF"; echo "CONFIG_BBG=y" >> "$DEF"
            echo "[defconfig] CONFIG_BBG=y ditambahkan"
          else
            echo "[defconfig] Baseband-guard dimatikan (BUILD_BBG=$BUILD_BBG) - CONFIG_BBG tidak ditulis"
          fi
          echo "" >> "$DEF"
          tail -30 "$DEF"

      - name: Cache toolchain proton-clang
        id: tc-cache
        uses: actions/cache@v6
        with:
          path: clang-proton
          key: proton-clang-master-v1

      - name: Ambil toolchain proton-clang (dipakai penulis kernel ini di b.sh)
        run: |
          # Cache dipakai kalau utuh; kalau tidak, clone ulang. Jangan pernah
          # lanjut dgn toolchain setengah jadi - error-nya akan menyesatkan.
          if [ -x clang-proton/bin/clang ]; then
            echo "Toolchain dari cache."
          else
            echo "Cache kosong/rusak, clone ulang."
            rm -rf clang-proton
            git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang-proton
          fi
          clang-proton/bin/clang --version | head -2

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: ccache-rosemary-${{ github.run_id }}
          restore-keys: |
            ccache-rosemary-

      - name: Compile kernel
        working-directory: kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang-proton/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER=build
          export KBUILD_BUILD_HOST=kernel
          export KBUILD_BUILD_TIMESTAMP="$(date -u)"

          # ccache mempercepat run berikutnya secara signifikan. Kalau binernya
          # tidak ada, jatuh balik ke clang polos supaya build tetap jalan.
          if command -v ccache >/dev/null 2>&1; then
            export CCACHE_DIR="$HOME/.ccache"
            export CCACHE_MAXSIZE=2G
            export CCACHE_COMPILERCHECK=content
            export CCACHE_NOHASHDIR=true
            ccache -M "$CCACHE_MAXSIZE" >/dev/null
            ccache -z >/dev/null
            CC_CMD="ccache clang"
            echo "ccache aktif."
          else
            CC_CMD="clang"
            echo "ccache tidak tersedia, pakai clang polos."
          fi

          make O=out rosemary_defconfig

          echo ""
          echo "==================== RESOLVED ReSukiSU & SuSFS CONFIG ===================="
          grep -E '^(CONFIG_KSU|CONFIG_KALLSYMS)' out/.config || true

          grep -q '^CONFIG_KSU=y$' out/.config || { echo "ERROR: CONFIG_KSU tidak resolve ke y"; exit 1; }
          grep -q '^CONFIG_KALLSYMS=y$' out/.config || { echo "ERROR: CONFIG_KALLSYMS tidak resolve ke y"; exit 1; }
          grep -q '^CONFIG_KALLSYMS_ALL=y$' out/.config || { echo "ERROR: CONFIG_KALLSYMS_ALL tidak resolve ke y"; exit 1; }

          if grep -q '^CONFIG_KSU_TRACEPOINT_HOOK=y$' out/.config; then
            echo "ERROR: CONFIG_KSU_TRACEPOINT_HOOK=y aktif; kernel non-GKI 4.14 tidak mendukung tracepoint hook"
            exit 1
          fi

          grep -q '^CONFIG_KSU_SUSFS=y$' out/.config || {
            echo "ERROR: CONFIG_KSU_SUSFS tidak resolve ke y - integrasi SUSFS (patch dasar + inline hook) tidak akan berfungsi"
            exit 1
          }
          echo ""
          echo "== Fitur SuSFS yang aktif =="
          grep -E '^CONFIG_KSU_SUSFS_' out/.config || true

          for opt in CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK; do
            if grep -q "^${opt}=y\$" out/.config; then
              echo "ERROR: ${opt}=y aktif berbarengan dengan SuSFS Inline Hook - akan menghasilkan hook ganda (LSM auto-hook + patch manual). Set ke n di defconfig."
              exit 1
            fi
          done

          if [ "$BUILD_NOMOUNT" = "true" ]; then
            echo ""
            echo "==================== RESOLVED NoMount CONFIG ===================="
            grep -E '^CONFIG_NOMOUNT' out/.config || true
            grep -q '^CONFIG_NOMOUNT=y$' out/.config || { echo "ERROR: CONFIG_NOMOUNT tidak resolve ke y"; exit 1; }
          else
            echo ""
            echo "==================== NoMount DIMATIKAN (bisect) ===================="
            grep -q '^CONFIG_NOMOUNT=y$' out/.config && { echo "ERROR: NoMount dimatikan tapi CONFIG_NOMOUNT=y bocor di .config"; exit 1; } || echo "OK: CONFIG_NOMOUNT tidak aktif"
          fi

          if [ "$BUILD_REKERNEL" = "true" ]; then
          echo ""
          echo "==================== RESOLVED Re:Kernel CONFIG ===================="
          grep -E '^CONFIG_REKERNEL' out/.config || true
          grep -q '^CONFIG_REKERNEL=y$' out/.config || { echo "ERROR: CONFIG_REKERNEL tidak resolve ke y"; exit 1; }
          # PERINGATAN (bukan error). rekernel_task_is_frozen() memakai
          # frozen()/freezing() dari <linux/freezer.h>. Di 4.14 keduanya membaca
          # flag PF_FROZEN / freezing_slow_path, yang mencerminkan pembekuan
          # APLIKASI hanya kalau cgroup freezer v1 aktif. Tanpa CGROUP_FREEZER,
          # jalur itu praktis cuma dipakai freezer suspend (PM_SLEEP), sehingga
          # Re:Kernel tidak akan pernah melapor apa pun walau CONFIG_REKERNEL=y.
          # rosemary_defconfig tidak menyetelnya dan init/Kconfig tidak
          # men-default-kannya ke y, jadi statusnya dicetak supaya kelihatan.
          # Sengaja TIDAK exit 1: kernelnya tetap sah, hanya fiturnya mubazir.
          grep -E '^(CONFIG_CGROUP_FREEZER|CONFIG_FREEZER)\b|^# CONFIG_CGROUP_FREEZER' out/.config || true
          if grep -q '^CONFIG_CGROUP_FREEZER=y$' out/.config; then
            echo "OK: CONFIG_CGROUP_FREEZER=y - Re:Kernel bisa mendeteksi proses beku."
          else
            echo "PERINGATAN: CONFIG_CGROUP_FREEZER tidak aktif."
            echo "  Re:Kernel akan ikut ter-compile dan netlink server tetap jalan,"
            echo "  tapi frozen()/freezing() tidak akan pernah true untuk aplikasi,"
            echo "  jadi notifikasi freeze binder/signal tidak akan pernah terkirim."
            echo "  Kalau memang mau dipakai, tambahkan CONFIG_CGROUP_FREEZER=y ke"
            echo "  fragment defconfig di step 'Siapkan defconfig'."
          fi
          else
            echo ""
            echo "==================== Re:Kernel DIMATIKAN (bisect) ===================="
            grep -q '^CONFIG_REKERNEL=y$' out/.config && { echo "ERROR: Re:Kernel dimatikan tapi CONFIG_REKERNEL=y bocor di .config"; exit 1; } || echo "OK: CONFIG_REKERNEL tidak aktif"
          fi

          if [ "$BUILD_BBG" = "true" ]; then
            echo ""
            echo "==================== RESOLVED Baseband-guard CONFIG ===================="
            grep -E '^CONFIG_BBG' out/.config || true
            grep -q '^CONFIG_BBG=y$' out/.config || { echo "ERROR: CONFIG_BBG tidak resolve ke y"; exit 1; }
          else
            echo ""
            echo "==================== Baseband-guard DIMATIKAN (bisect) ===================="
            grep -q '^CONFIG_BBG=y$' out/.config && { echo "ERROR: Baseband-guard dimatikan tapi CONFIG_BBG=y bocor di .config"; exit 1; } || echo "OK: CONFIG_BBG tidak aktif"
          fi

          set -o pipefail
          if ! make -k O=out -j"$(nproc)" \
                ARCH=arm64 \
                CC="$CC_CMD" \
                AR=llvm-ar \
                NM=llvm-nm \
                OBJCOPY=llvm-objcopy \
                OBJDUMP=llvm-objdump \
                STRIP=llvm-strip \
                CROSS_COMPILE=aarch64-linux-gnu- \
                CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                CONFIG_SECTION_MISMATCH_WARN_ONLY=y \
                KCFLAGS="-Wno-error" 2>&1 | tee /tmp/build.log; then
            echo ""
            echo "==================== BARIS ERROR (kirim ini) ===================="
            grep -niE "error:|fatal error|undefined reference|No such file|multiple definition|recipe for target|Error [0-9]" /tmp/build.log | tail -120 || true
            echo "==================== KONTEKS TIAP KEGAGALAN ===================="
            for L in $(grep -n 'Error 1' /tmp/build.log | head -3 | cut -d: -f1); do
              S=$((L-40)); [ $S -lt 1 ] && S=1
              echo "----- konteks baris $S s/d $L -----"
              sed -n "${S},${L}p" /tmp/build.log
            done
            tail -50 /tmp/build.log
            echo ">>> BUILD GAGAL."
            exit 1
          fi
          ls -la out/arch/arm64/boot/
          command -v ccache >/dev/null 2>&1 && ccache -s | head -8 || true

      - name: Compile nm (NoMount userspace CLI, commit sama dgn kernel)
        if: env.BUILD_NOMOUNT == 'true'
        run: |
          NM_SRC="kernel/NoMount/userspace/src"
          test -d "$NM_SRC" || { echo "ERROR: $NM_SRC tidak ada - step Integrasikan NoMount gagal?"; exit 1; }

          NOMOUNT_COMMIT=$(git -C kernel/NoMount rev-parse --short HEAD)
          echo "NoMount commit dipakai: $NOMOUNT_COMMIT"

          mkdir -p nm-src
          cp "$NM_SRC/nm.c" "$NM_SRC/nm.h" nm-src/
          ( cd nm-src && \
            aarch64-linux-gnu-gcc -nostdlib -static -Os -fno-builtin -Wl,-e,_start -o nm nm.c && \
            aarch64-linux-gnu-strip nm )
          file nm-src/nm
          test -s nm-src/nm || { echo "ERROR: nm gagal dikompilasi"; exit 1; }

      - name: Tentukan file kernel hasil
        id: kimg
        run: |
          FOUND=""
          for f in Image.gz-dtb Image.gz Image; do
            p="kernel/out/arch/arm64/boot/$f"
            if [ -f "$p" ]; then
              echo "path=$p" >> "$GITHUB_OUTPUT"
              echo "name=$f" >> "$GITHUB_OUTPUT"
              FOUND=1
              break
            fi
          done
          [ -n "$FOUND" ] || { echo "Kernel image tidak ditemukan"; exit 1; }
          DTBO="kernel/out/arch/arm64/boot/dtbo.img"
          if [ -f "$DTBO" ]; then
            echo "dtbo=$DTBO" >> "$GITHUB_OUTPUT"
            echo "dtbo.img ditemukan: $DTBO"
          fi

      - name: Rakit paket AnyKernel3 (template asli fjrXTR)
        run: |
          # PENTING: branch default repo ini adalah 'ruby', bukan 'master'. Tanpa -b
          # isi paket ikut berubah diam-diam kalau pemilik repo ganti default.
          # mt6781 = SoC rosemary. tools/ak3-core.sh identik di kedua branch.
          git clone --depth=1 -b mt6781 https://github.com/fjrXTR/AnyKernel3.git AnyKernel3
          echo "AnyKernel3 commit: $(git -C AnyKernel3 rev-parse HEAD)"
          test -f AnyKernel3/tools/ak3-core.sh || { echo "ERROR: tools/ak3-core.sh tidak ada di AnyKernel3"; exit 1; }
          rm -rf AnyKernel3/.git

          echo "" | base64 -d > AnyKernel3/anykernel.sh

          cp "${{ steps.kimg.outputs.path }}" "AnyKernel3/${{ steps.kimg.outputs.name }}"

          ZIP="rosemary-ksu-susfs-nomount-rekernel-bbg-$(date +%Y%m%d-%H%M%S).zip"

          ( cd AnyKernel3 && zip -r9 "../$ZIP" . -x '.git*' )
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          unzip -l "$ZIP" | head -20

      - name: Ringkasan build
        if: always()
        run: |
          {
            echo "## Build kernel Rosemary"
            echo ""
            echo "### Add-on aktif di build ini (bisect)"
            echo "| Add-on | Status |"
            echo "|---|---|"
            echo "| NoMount        | \`${BUILD_NOMOUNT:-true}\` |"
            echo "| Re:Kernel      | \`${BUILD_REKERNEL:-true}\` |"
            echo "| Baseband-guard | \`${BUILD_BBG:-true}\` |"
            echo ""
            echo "| Komponen | Commit |"
            echo "|---|---|"
            echo "| Kernel (rosemary-13) | \`${KERNEL_SHA:-?}\` |"
            echo "| ReSukiSU | \`${KSU_SHA:-?}\` |"
            echo "| NoMount (di-PIN, pre-ART) | \`${NOMOUNT_SHA:-dimatikan/?}\` |"
            echo "| Baseband-guard | \`${BBG_SHA:-dimatikan/?}\` |"
            echo "| Re:Kernel | _embedded statis di YAML, bukan git clone - tidak ada commit SHA_ |"
            echo ""
            echo "Paket: \`${ZIP:-belum terbentuk}\`"
            echo ""
            echo "### Kalau masih STUCK DI LOGO"
            echo "1. Ambil log crash sebenarnya dari HP (ini yang paling menentukan):"
            echo "   masuk fastboot -> \`fastboot oem console\` **atau** setelah reboot"
            echo "   paksa, boot ke sistem lama/TWRP lalu baca pstore:"
            echo '   ```'
            echo "   adb shell su -c 'cat /sys/fs/pstore/console-ramoops-0' > crash.txt"
            echo "   # (atau /proc/last_kmsg pada sebagian device)"
            echo '   ```'
            echo "   Kirim crash.txt - di situ kelihatan panic/hook yang menabrak."
            echo "2. BISECT lewat 'Run workflow': matikan **build_nomount** dulu."
            echo "   - Boot? berarti NoMount penyebabnya (driver ART / d_revalidate)."
            echo "   - Masih stuck? nyalakan lagi NoMount, matikan build_rekernel,"
            echo "     lalu build_baseband_guard, satu per satu."
            echo "   - Semua add-on OFF tapi tetap stuck = akarnya di inti"
            echo "     KernelSU+SUSFS (kemungkinan besar SUSFS upstream v2.3.0)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload paket + kernel mentah + dtbo + nm CLI
        uses: actions/upload-artifact@v7
        with:
          name: rosemary-kernel-build
          if-no-files-found: warn
          path: |
            ${{ env.ZIP }}
            ${{ steps.kimg.outputs.path }}
            ${{ steps.kimg.outputs.dtbo }}
            nm-src/nm
            kernel/out/.config

      # Kalau build gagal, step "Compile" hanya mencetak ~120 baris error +
      # 3 potongan konteks ke log Actions. /tmp/build.log yang lengkap ikut
      # hilang bersama runner. Step ini menyimpannya supaya bisa diunduh dan
      # ditelusuri penuh. `if: failure()` -> hanya jalan saat ada step gagal,
      # jadi tidak menambah artifact di build yang sukses.
      - name: Upload log build lengkap (hanya saat gagal)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rosemary-build-log
          if-no-files-found: warn
          retention-days: 7
          path: |
            /tmp/build.log
            kernel/out/.config
            kernel/patch_rejects/
