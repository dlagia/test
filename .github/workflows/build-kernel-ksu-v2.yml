#      userspace/ksud/Cargo.toml, userspace/ksud/Cargo.lock,
#      userspace/ksuinit/Cargo.toml, userspace/ksuinit/Cargo.lock
#    Nol berkas di kernel/. Artinya seluruh audit lama (Kconfig, Kbuild, hook,
#    sucompat, app_profile, TIF bit 61) tetap sahih tanpa diulang satu pun.
#    ksud dan ksuinit adalah binary userspace yang TIDAK ikut dikompilasi ke
#    kernel di workflow ini. Perlu dicatat: rev yang dipin di Cargo.toml TIDAK
#    berubah (mis. android_bootimg tetap 150425b0) - yang berpindah cuma nama
#    pemilik repo. Efek satu-satunya yang terlihat di build: KSU_VERSION naik
#    +1 karena `git rev-list --count HEAD` bertambah satu.
#    Pin baru terjangkau dari main (compare menjawab "ahead", bukan
#    "diverged") - pelajaran orphan revisi ke-22 tetap dijaga.
#
# 2. Tujuh pin lain persis di HEAD, tidak disentuh.
#
# 3. BUG NYATA di pin-watch.yml, ditambal: syarat "tidak usah lapor" dulu cuma
#    `ADA_DRIFT = 0`, padahal PERLU_AUDIT bisa menyala TANPA drift - lewat
#    POLA TAK KETEMU, GAGAL AMBIL, atau TAK BISA DIBANDINGKAN. Di keadaan itu
#    robot mencetak "Semua pin di HEAD", tidak membuka issue, DAN menutup issue
#    yang sedang terbuka. Jadi justru kegagalan yang paling perlu dilihat
#    manusia-lah yang paling rapi disembunyikan. GAGAL AMBIL bukan kasus
#    teoretis: saat audit ini berjalan, API commits untuk repo kernel meleset
#    sekali lalu normal di percobaan kedua.
#
# 4. Pesan ambigu di step patch selinux/hooks.c dipisah (lihat komentar
#    revisi ke-29 di sana): "pemanggilan + extern sudah ada" dan "pemanggilan
#    tidak ada sama sekali" dulu sama-sama mencetak "Tidak perlu ditambal."
#    Begitu dipisah, build 34842849770 langsung memperlihatkan bahwa build ini
#    SELALU berada di cabang kedua - dan penelusurannya menutup satu tanda
#    tanya lama: ReSukiSU tidak punya ksu_hide_setprocattr sama sekali (nol
#    kemunculan di seluruh pohon), ia memasang proteksi setprocattr lewat hook
#    LSM di kernel/feature/selinux_hide.c. susfs_inline_hook_patches.sh baris
#    243 memang sengaja melewati penambalan itu kalau simbolnya tak ada. Jadi
#    tidak ada yang rusak; cabang itu sekarang mencetak alasan sebenarnya dan
#    sekalian meng-assert keberadaan pengganti LSM-nya, supaya kalau ReSukiSU
#    suatu saat berubah bentuk, build berhenti alih-alih diam.
#
# 5. Delapan belas blok `run:` di file ini dibaca ulang satu per satu dan
#    tidak ada temuan baru: semua assert pin, sentinel _ran/_failed, audit
#    reject, dan kedelapan fixer Python masih berpasangan dengan anchor-nya.
#    Gerbang pra-push (preflight.sh) yang mati di revisi ke-26 dan diperbaiki
#    di revisi ke-28 sekarang benar-benar membaca pins.env - dipastikan lagi
#    di sini dengan menjalankannya sebelum push.
# ============================================================
# REVISI KE-29b (2026-09-14) - audit menyeluruh kedua di hari yang sama.
#
# 1. ReSukiSU bergerak lagi, 7e92d45e -> a5bb612a, TIGA commit: "manager: Add
#    floating navigation bar with a customization toggle (#334)", "manager:
#    update translations from Weblate (#404)", dan "ksubot: fix release".
#    Diverifikasi lewat API compare: 24 berkas, 23 di manager/ (Kotlin +
#    res/values-*/strings.xml) dan satu di scripts/ksubot.py. NOL di kernel/.
#    scripts/ksubot.py itu bot Telegram CI milik ReSukiSU sendiri; diff-nya dua
#    baris identik `if BRANCH != "main"` -> `if BRANCH != "main" and
#    GITHUB_REF_TYPE != "tag"`, murni soal caption pengumuman rilis mereka, dan
#    tidak pernah ikut ter-checkout ke pohon kernel ini. Efek di build: hanya
#    KSU_VERSION +3. Pin terjangkau (compare: ahead).
#
# 2. Tujuh pin lain tetap di HEAD.
#
# 3. Temuan proses, bukan kode: revisi ke-29 dan ke-29a DI-PUSH tapi TIDAK
#    pernah di-commit di repo arsip lokal - HEAD lokal masih tertinggal di
#    rev-28 (ecdf5e4) sementara dlagia/test sudah dua commit di depan. Push
#    lewat Git Data API memang tidak menyentuh index lokal, jadi kebiasaan
#    "push saja" diam-diam memecah riwayat. Ini persis kelas kegagalan yang
#    bikin tabel pin preflight.sh basi tanpa terlihat di revisi ke-26..28:
#    perubahan yang tidak masuk riwayat tidak bisa diaudit. Ikut dibereskan
#    sekalian: build-kernel-ksu-v2-19082026.yml yang dipindah ke SUSFS/ masih
#    tercatat sebagai "D + untracked" padahal isinya byte-identik (keduanya
#    hash ea6816ab) - sekarang dicatat sebagai rename.
#
# 4. REVISI KE-29c, beberapa jam kemudian: robot pantau pin dijalankan manual
#    untuk menyegarkan issue #1 yang masih memajang foto era rev-27, dan ia
#    justru menangkap ReSukiSU bergerak LAGI dalam ~45 menit: a5bb612a ->
#    833edb0e, satu commit "manager: Restrict floating bottom bar to Android
#    12+", dua berkas Kotlin di manager/, nol di kernel/. Vonis robot AMAN,
#    dinaikkan. Efek di build cuma KSU_VERSION +1.
#    Sekalian jadi uji hidup tambalan rev-29: robot mencetak "Issue #1
#    diperbarui" - bukan menutupnya - persis karena memang ADA drift. Jalur
#    "diam-diam menutup issue" yang ditambal itu belum teruji di sini; yang
#    teruji adalah jalur normalnya tetap utuh.
#    Catatan untuk pembaca berikutnya: manager/ adalah aplikasi Android
#    ReSukiSU dan TIDAK pernah ikut dikompilasi ke kernel, jadi rentetan
#    commit manager/ boleh dikumpulkan dulu - menaikkannya satu per satu cuma
#    menghabiskan satu build ~9 menit per commit tanpa mengubah satu byte pun
#    di Image.gz-dtb selain KSU_VERSION.
# ============================================================
# ============================================================
# REVISI KE-30 (2026-09-15) - "audit semua" sesudah rev-29d boot normal.
# Dua pin bergerak, enam tetap di HEAD, tidak ada yang ORPHAN (compare
# kedua-duanya 'ahead', behind=0 - jadi jalur fetch-by-SHA tidak terpakai).
#
# 1. ReSukiSU 833edb0e -> b22a46e6. DUA commit, TIGA berkas: satu Kotlin
#    (manager/.../ui/activity/component/NavigationBar.kt) dan dua workflow CI
#    milik ReSukiSU sendiri (build-manager.yml, lints-check.yml). NOL di
#    kernel/. Efek di build: KSU_VERSION +2, Image.gz-dtb sisanya identik.
#
# 2. SUSFS 57022dd5 -> 426ff004. TIGA commit, tapi untuk 4.14 hanya +3/-3
#    baris dan SEMUANYA di section fs/super.c: penjaga #include susfs_def.h
#    + jump_label.h dilonggarkan dari CONFIG_KSU_SUSFS_SUS_MOUNT menjadi
#    CONFIG_KSU_SUSFS. Isi section-nya (blok get_anon_bdev) tetap di bawah
#    SUS_MOUNT dan tidak berubah sebaris pun. Defconfig dlagia menyalakan
#    KEDUA symbol (CONFIG_KSU_SUSFS=y dan CONFIG_KSU_SUSFS_SUS_MOUNT=y),
#    jadi hasil akhirnya identik - pelonggaran itu baru terasa kalau
#    seseorang mematikan SUS_MOUNT sendirian.
#    Dua commit sisanya di luar jalur build ini: Bin/clean_hook.sh TIDAK
#    dipakai workflow ini sama sekali, dan susfs_inline_hook_patches.sh cuma
#    menaikkan PATCH_LEVEL "2.2.00" -> "2.3.00" plus satu baris komentar -
#    variabel itu hanya di-echo, tidak pernah dibandingkan dengan apa pun,
#    jadi daftar patch_files dan seluruh logika hook-nya utuh.
#
# 3. Disimulasikan di luar CI (template audit revisi ke-17) terhadap tree
#    602782da dengan patch LAMA dan patch BARU berdampingan: 20 berkas
#    ter-patch di kedua sisi, fuzz/offset identik baris per baris, reject
#    tetap HANYA fs/proc/task_mmu.c hunk #1/#5/#6, dan satu-satunya beda
#    hasil akhir adalah empat baris #ifdef di fs/super.c itu. Kedua fixer
#    Python yang tertanam di file ini lalu dijalankan atas KEDUA pohon:
#    vonisnya sama persis dan exit 0 - termasuk fixer #7, yang anchor-nya
#    (dev = ida_simple_get(&unnamed_dev_ida, DEFAULT_KSU_MNT_MINOR_DEV, ...))
#    duduk di dalam blok SUS_MOUNT dan tidak tersentuh perubahan penjaga.
#    Tidak ada assert di workflow ini yang menghitung jumlah section patch
#    atau membaca bentuk #ifdef di fs/super.c, jadi tak ada yang perlu
#    disesuaikan.
#
# 4. Kelima salinan tabel komponen (pins.env, pin-watch.yml, naikkan-pin.yml,
#    preflight.sh, daftar wajib-ada di loader step 00) dicek ulang: kedelapan
#    nama pin cocok di semua tempat. preflight bersih (actionlint 0, 18 blok
#    run shellcheck 0).
# ============================================================

name: Build Kernel Rosemary (KSU + SuSFS dlagia)

on:
  # Tidak ada lagi input toggle add-on (revisi ke-11): NoMount selalu ikut,
  # Re:Kernel & Baseband-guard sudah dicabut permanen.
  workflow_dispatch:
  push:
    branches: [ main, master ]
    # Revisi ke-24: dulu SETIAP push ke main menyalakan build kernel 9 menit -
    # termasuk push yang cuma menyentuh workflow lain (mis. pin-watch.yml) atau
    # berkas non-build. Sekarang dibatasi ke file build ini sendiri. Kalau perlu
    # membangun ulang tanpa mengubah apa pun, pakai tombol "Run workflow"
    # (workflow_dispatch) yang sudah ada di atas.
    paths:
      - '.github/workflows/build-kernel-ksu-v2.yml'
      # Revisi ke-26: pins.env ikut, supaya menyunting pin lewat web GitHub
      # langsung membangun. (Commit dari workflow "Naikkan pin" TIDAK memicu
      # push-event - itu aturan GitHub untuk mencegah rekursi - jadi workflow
      # itu memanggil build lewat workflow_dispatch, bukan lewat jalur ini.)
      - 'pins.env'

# Revisi ke-25: step terakhir menerbitkan Release, jadi token build butuh izin
# TULIS contents. Blok ini sengaja ditulis eksplisit - tanpa `permissions:`,
# izin default ikut setelan repo/akun dan bisa berubah diam-diam. `contents:
# write` sudah mencakup baca (checkout) sekaligus membuat release, dan tidak
# memberi akses ke issues, packages, maupun id-token.
permissions:
  contents: write

concurrency:
  group: build-rosemary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      # Step pertama, karena semua step sesudahnya bergantung padanya.
      #
      # Dibaca lewat API pada $GITHUB_SHA, BUKAN actions/checkout: job ini
      # sengaja tidak pernah punya .git di workspace (alasannya di revisi
      # ke-25a), dan membaca pada commit pemicu menjamin pin yang dipakai
      # persis milik commit itu - bukan HEAD branch yang bisa sudah bergerak
      # di tengah antrean build.
      - name: Muat pins.env
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # tr -d '\r': kalau pins.env pernah ter-commit dari Windows, tiap baris
          # berakhir CRLF dan penjaga bentuk di bawah menolaknya dengan pesan
          # "tidak berbentuk NAMA=<40 hex>" - keluhan tentang karakter yang tak
          # kelihatan. Dibuang saja di sini; CR tidak pernah sah di file ini.
          gh api "repos/${GITHUB_REPOSITORY}/contents/pins.env?ref=${GITHUB_SHA}" \
            --jq .content | base64 -d | tr -d '\r' > /tmp/pins.env

          # Isi pins.env disalin ke $GITHUB_ENV, jadi bentuknya diperiksa DULU.
          # Kelas karakter namanya WAJIB memuat angka: AK3_PIN punya "3", dan
          # dengan [A-Z_]+ saja ia ditolak di sini padahal sah. Ketahuan waktu
          # dry-run lokal; actionlint maupun pemeriksa YAML tidak melihatnya.
          # Baris yang berarti wajib persis NAMA=<40 hex kecil>; selain itu cuma
          # boleh baris kosong atau komentar. Apa pun di luar itu - spasi, kutip,
          # komentar di ujung baris, apalagi perintah - ditolak di sini, sebelum
          # sebaris pun sempat masuk ke lingkungan step berikutnya.
          if grep -nvE '^[[:space:]]*(#.*)?$|^[A-Z0-9_]+=[0-9a-f]{40}$' /tmp/pins.env; then
            echo "ERROR: baris di atas tidak berbentuk NAMA=<40 hex huruf kecil>"
            exit 1
          fi

          for n in KERNEL_PIN SCRIPTS_PIN KSU_PIN SUSFS_PIN \
                   NOMOUNT_PIN NOMOUNT_LOADER_PIN CLANG_PIN AK3_PIN; do
            grep -qE "^${n}=[0-9a-f]{40}$" /tmp/pins.env || {
              echo "ERROR: $n hilang atau cacat di pins.env"
              exit 1
            }
          done

          grep -E '^[A-Z0-9_]+=[0-9a-f]{40}$' /tmp/pins.env >> "$GITHUB_ENV"

          echo "== pin yang dipakai build ini =="
          grep -E '^[A-Z0-9_]+=[0-9a-f]{40}$' /tmp/pins.env | sed 's/^/  /'

          # Daftar delapan nilai yang diharapkan SUDAH DICABUT di revisi ke-27.
          # Ia hanya perlu sekali, untuk membuktikan revisi ke-26 memindahkan pin
          # tanpa mengubah satu huruf pun (terbukti di run 34772090899). Sejak
          # tombol "Naikkan pin" hidup, pins.env memang HARUS boleh berubah -
          # daftar itu justru akan menggagalkan setiap kenaikan yang sah.
          #
          # Yang menjaga kebenaran pin sekarang bukan daftar di sini, melainkan:
          #   - step triase di naikkan-pin.yml, yang menolak kenaikan menyentuh
          #     file sensitif sebelum sebaris pun ditulis ke pins.env;
          #   - assert per komponen di step-step di bawah (KERNEL_ACT vs
          #     KERNEL_PIN, SUSFS_HIT, self-heal clang/AK3, dan seterusnya).

      - name: Pasang dependency build
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl flex git kmod \
            libelf-dev libssl-dev zip zlib1g-dev xxd python3 \
            libtinfo5 libncurses5 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Clone source kernel (dlagia/android_kernel_xiaomi_rosemary @ rosemary-13)
        run: |
          git clone --depth=1 -b rosemary-13 \
            https://github.com/dlagia/android_kernel_xiaomi_rosemary.git kernel
          echo "KERNEL_SHA=$(git -C kernel rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "Kernel source commit: $(git -C kernel rev-parse HEAD)"

          # ----- ASSERT SHA SOURCE KERNEL (revisi ke-18, 2026-09-12) -----
          # Ini dependency terakhir yang masih MENGAMBANG: branch rosemary-13.
          # Semua patch SUSFS/KSU/NoMount di bawah, plus setiap fixer base64 di
          # workflow ini, diaudit terhadap ISI POHON commit di bawah (mis.
          # fs/statfs.c, fs/stat.c, fs/proc/fd.c). Kalau dlagia mendorong commit
          # baru yang menyentuh fs/, patch bisa ter-apply "bersih" tapi salah,
          # atau reject-nya berubah dan audit reject di bawah salah tuduh.
          # Jadi drift-nya dibuat KERAS, bukan diam-diam.
          # KERNEL_PIN dari pins.env (revisi ke-26).
          KERNEL_ACT="$(git -C kernel rev-parse HEAD)"
          test "$KERNEL_ACT" = "$KERNEL_PIN" || {
            echo "ERROR: source kernel bukan commit yang diaudit."
            echo "  diharapkan: $KERNEL_PIN"
            echo "  aktual    : $KERNEL_ACT"
            echo "Yang harus dilakukan sebelum menaikkan pin ini:"
            echo "  1) git log --stat $KERNEL_PIN..$KERNEL_ACT -- fs/ arch/arm64/configs/"
            echo "  2) kalau fs/ tersentuh: ulangi simulasi patch SUSFS (lihat blok"
            echo "     BUKTI SIMULASI di step integrasi) dan perbarui daftar reject"
            echo "     yang diharapkan."
            echo "  3) kalau rosemary_defconfig tersentuh: ulangi audit defconfig."
            exit 1
          }
          echo "OK: source kernel ter-pin di $KERNEL_PIN"

      - name: Integrasikan ReSukiSU & SuSFS (dlagia/Build-Kernel_scripts)
        working-directory: kernel
        run: |
          export KERNEL_DIR=$(pwd)
          VERSION=$(grep -w '^VERSION' Makefile | tr -d ' ' | cut -d= -f2 || echo "")
          PATCHLEVEL=$(grep -w '^PATCHLEVEL' Makefile | tr -d ' ' | cut -d= -f2 || echo "")
          export KERNEL_VERSION="${VERSION}.${PATCHLEVEL}"
          echo "Kernel version detected: $KERNEL_VERSION"

          # Repo kernel ini SUDAH membawa file *.rej sendiri (mis.
          # drivers/misc/mediatek/lcm/mt65xx_lcm_list.c.rej) yang ter-commit dan
          # tidak ada hubungannya dgn SUSFS. Dicatat dulu supaya tidak dikira
          # kegagalan patch.
          find . -path ./.git -prune -o -name '*.rej' -printf '%P\n' 2>/dev/null | sort > /tmp/rej_before.txt
          echo "== Reject bawaan repo (diabaikan): $(wc -l < /tmp/rej_before.txt) file =="
          cat /tmp/rej_before.txt || true

          # Dipin ke commit tertentu (bukan 'main') supaya perubahan script upstream
          # tidak diam-diam mengubah cara integrasi KSU/SuSFS di run berikutnya.
          echo "[+] Mengunduh integrate_ksu_susfs.sh dari dlagia/Build-Kernel_scripts (pinned commit)..."
          curl -fLSs "https://raw.githubusercontent.com/dlagia/Build-Kernel_scripts/${SCRIPTS_PIN}/scripts/integrate_ksu_susfs.sh" -o integrate_ksu_susfs.sh
          chmod +x integrate_ksu_susfs.sh

          # ----- PIN ReSukiSU (revisi ke-12; dinaikkan di revisi ke-14) -----
          # Baris 11 script ini menjalankan setup.sh ReSukiSU TANPA argumen, dan
          # setup.sh tanpa argumen = `git checkout main` + `git pull` = kode driver
          # KernelSU berubah tiap run. Itu dependency mengambang TERAKHIR di build
          # ini. setup.sh menerima <commit-or-tag> sebagai $1, jadi dua sed di
          # bawah memaku sumbernya tanpa perlu fork:
          #   (1) URL setup.sh: branch 'main' -> SHA
          #   (2) pemanggilan: `| bash` -> `| bash -s <SHA>` (argumen checkout)
          # DINAIKKAN di revisi ke-14 (2026-09-11): 246d3e52 -> 6930e97b, 4 commit.
          # DINAIKKAN LAGI di revisi ke-18 (2026-09-12): 6930e97b -> fa1da13f,
          # 3 commit, dan HANYA SATU yang menyentuh kernel/ (052ca27775):
          #   - kernel/feature/adb_root.c: +#include <linux/sched/task_stack.h>
          #     di balik `#if LINUX_VERSION_CODE >= KERNEL_VERSION(4,11,0)` -
          #     header itu ADA di 4.14 dan guard-nya benar.
          #   - kernel/feature/sucompat.c: set_thread_flag(TIF_PROC_IN_KSU_EXECVE)
          #     tidak lagi dikurung `#ifdef CONFIG_KSU_MANUAL_HOOK`, judul
          #     commitnya "compat for old version of susfs" - PERSIS kasus kita
          #     (SUSFS 4.14 backport), jadi ini justru perbaikan UNTUK build ini.
          #   - kernel/feature/sucompat.h: `#define TIF_PROC_IN_KSU_EXECVE 61`
          #     ditambahkan di cabang `#elif defined(CONFIG_KSU_SUSFS)`. Bit 61
          #     TIDAK bertabrakan: SUSFS memakai bit 33/34/35, dan 61-63 memang
          #     slot cadangan KSU di arm64 (64-bit flags word).
          # Dua commit lainnya (19b6f4213c, fa1da13f89) hanya manager/ (aplikasi
          # Android) - tidak ikut dikompilasi ke kernel. kernel/Kbuild dan
          # kernel/Kconfig TIDAK berubah di rentang ini, jadi semua audit
          # Kbuild/Kconfig di bawah tetap sahih, dan kernel/setup.sh juga
          # byte-identik sehingga mekanisme pin dua-sed di bawah tetap jalan.
          # Yang benar-benar menyentuh kode kernel cuma 7ad75c5df3 "get
          # session_keyring from key_permission LSM call" (kernel_compat.c/h,
          # init.c, lsm_hooks.c); 07a28eb8 & 4f27ee12 sekadar bump crate userspace
          # (ksud/ksuinit) yang tidak ikut dikompilasi ke kernel. 6930e97b menambah
          # 42 baris di setup.sh untuk perintah baru `--submodule`. Diverifikasi
          # langsung ke setup.sh versi BARU: baris 107-121 masih mengarahkan
          # argumen non-flag ke `setup_kernelsu "$@"` -> `git checkout "$1"`, dan
          # cabang --submodule pun `return 0` begitu GITHUB_ACTIONS=true. Jadi
          # mekanisme pin dua-sed di bawah tetap sahih.
          # DINAIKKAN LAGI di revisi ke-19 (2026-09-12): fa1da13f -> 3380d41f,
          # SATU commit: "ksud: sync upstream commit". Diverifikasi lewat API
          # compare, bukan dari judulnya: satu-satunya file yang disentuh adalah
          # userspace/ksud/src/android/susfs/cli.rs, 8 perubahan dan SEMUANYA
          # teks doc-comment Rust ("Only effective for umounted process with
          # uid >= 10000" -> "Effective for all processes with uid >= 10000").
          # Seluruh kernel/ BYTE-IDENTIK antara fa1da13f dan 3380d41f (setup.sh,
          # Kbuild, Kconfig, tools/inline_hook_check.mk, feature/*), jadi semua
          # audit Kconfig/Kbuild/hook di bawah tetap sahih tanpa diulang. ksud
          # adalah binary userspace yang TIDAK ikut dikompilasi ke kernel.
          # Efek satu-satunya yang terlihat di build: KSU_VERSION naik +1 karena
          # `git rev-list --count HEAD` bertambah satu. URL raw setup.sh untuk
          # pin baru sudah dicek HTTP 200.
          # DINAIKKAN LAGI di revisi ke-21 (2026-09-13): 3380d41f -> f4c4923e,
          # DUA commit ("manager: workaround for ListItem crash" dan "manager:
          # refine home page state get"). Diverifikasi lewat API compare, bukan
          # dari judulnya: 11 file berubah dan SEMUANYA di manager/ (kode Kotlin
          # aplikasi Android - KsuCli.kt, HomeViewModel.kt, MainScreen.kt, dst).
          # Tidak satu pun file di kernel/, jadi setup.sh, Kbuild, Kconfig dan
          # hook TIDAK berubah -> seluruh audit di atas tetap sahih. Efek di
          # build: KSU_VERSION +2 (rev-list count naik dua).
          # DINAIKKAN LAGI di revisi ke-22 (2026-09-13): f4c4923e -> c04159fc.
          # BUKAN karena ada fitur baru, tapi karena f4c4923e SUDAH TIDAK ADA di
          # main: upstream me-rebase branch itu ~2 jam setelah audit revisi ke-21,
          # sehingga commit pin jadi ORPHAN (isi yang sama sekarang bernama
          # 601f6d2a). Build 34760665407 GAGAL tepat di assert pin di bawah:
          # diharapkan f4c4923e, aktual c04159fc. Assert itu bekerja seperti
          # seharusnya - kode salah tidak ikut ter-compile.
          # c04159fc = main HEAD (2026-09-13T13:25Z, "manager: improve superuser
          # sort (#405)"). Dibanding 3380d41f yang TERBUKTI BOOT: 3 commit, 32
          # file, SEMUANYA di manager/ (Kotlin + strings.xml terjemahan). Nol file
          # di kernel/, jadi audit Kconfig/Kbuild/setup.sh/hook di atas tetap sahih
          # dan satu-satunya efek di build adalah KSU_VERSION +3.
          # KSU_PIN dari pins.env (revisi ke-26).
          sed -i "s|ReSukiSU/ReSukiSU/main/kernel/setup.sh|ReSukiSU/ReSukiSU/${KSU_PIN}/kernel/setup.sh|" integrate_ksu_susfs.sh
          sed -i "s#setup.sh\" | bash >#setup.sh\" | bash -s ${KSU_PIN} >#" integrate_ksu_susfs.sh
          # PENTING: URL dan `| bash >` ada di BARIS YANG SAMA (baris 11), jadi di sini
          # dipakai `grep -o | wc -l` (hitung KEMUNCULAN), bukan `grep -c` yang
          # menghitung BARIS dan akan selalu mengembalikan 1 lalu gagal palsu.
          KSU_HIT=$(grep -o "$KSU_PIN" integrate_ksu_susfs.sh | wc -l | tr -d ' ')
          if [ "$KSU_HIT" != "2" ]; then
            echo "ERROR: pin ReSukiSU gagal disisipkan (harus 2 kemunculan: URL + argumen, dapat $KSU_HIT)."
            echo "Struktur integrate_ksu_susfs.sh berubah? Baris yang menyebut ReSukiSU:"
            grep -n 'ReSukiSU' integrate_ksu_susfs.sh || true
            exit 1
          fi
          echo "[+] ReSukiSU di-PIN ke ${KSU_PIN} (URL setup.sh + argumen checkout)"

          # ----- PIN SUMBER PATCH SUSFS (revisi ke-9, 2026-09-10) -----
          # integrate_ksu_susfs.sh mengunduh susfs_inline_hook_patches.sh dan
          # susfs_patch_to_${KERNEL_VERSION}.patch dari branch 'mainline' milik
          # JackA1ltman yang TIDAK di-pin - dan branch itu pernah berubah DUA KALI
          # dalam hitungan jam (103d85d2cd 11:57Z mencemari patch dgn diff .git/
          # sekaligus menghilangkan satu '}' di fs/notify/fdinfo.c; 58568ef1fc
          # 12:19Z memperbaiki keduanya). Karena itu sumbernya dipaku ke SHA.
          #
          # DINAIKKAN di revisi ke-15 (2026-09-12): 58568ef1fc -> c6dcae264f,
          # 7 commit, dan ketujuhnya memperbaiki PERSIS cacat yang selama ini
          # ditambal sendiri oleh step "Perbaiki bug patch SUSFS untuk kernel
          # 4.14" (pemetaan commit -> cacat ada di blok CEK PEMBARUAN di kepala
          # file). Kedua patch sudah diunduh dan dibandingkan BYTE-PER-BYTE:
          # 6 dari 7 fixer otomatis jadi no-op, dan yang ke-7 (fix_stat_mnt_id)
          # sudah disesuaikan di step fixer supaya ikut no-op - upstream
          # MENGOMENTARI assignment stat->mnt_id, bukan menghapusnya.
          #
          # DINAIKKAN LAGI di revisi ke-21 (2026-09-13): f1004545 -> c231ef5d,
          # SATU commit "susfs_patches: merged latest commit" yang hanya menyentuh
          # kelima file patch (4.4/4.9/4.14/4.19/5.4), +47/-2 per file. Untuk
          # 4.14 isinya: (a) section BARU fs/super.c - get_anon_bdev() memberi
          # minor dev >= 4097 untuk mount milik domain ksu; (b) satu #define
          # DEFAULT_KSU_MNT_MINOR_DEV (1 << 12) di susfs_def.h. Kedua file patch
          # dibandingkan byte-per-byte: total beda 55 baris dan SEMUANYA di dua
          # tempat itu, sisanya identik -> keenam fixer 4.14 yang lama tidak
          # tersentuh. Patch BARU juga sudah disimulasikan di luar CI terhadap
          # tree 602782da: 20 file ter-patch, fs/super.c mendarat tanpa fuzz, dan
          # reject tetap HANYA fs/proc/task_mmu.c (hunk #1/#5/#6) seperti dulu.
          # Section baru itu membawa satu cacat 4.14 (ida_simple_get vs
          # unnamed_dev_lock) yang ditambal fixer #7 di step berikutnya.
          # SUSFS_PIN dari pins.env (revisi ke-26).
          sed -i "s|refs/heads/mainline|${SUSFS_PIN}|g" integrate_ksu_susfs.sh
          # Revisi ke-18: sed di atas dulu TANPA assert - kalau upstream mengubah
          # bentuk URL-nya (mis. memakai 'refs/tags/' atau URL penuh), sed jadi
          # no-op dan build diam-diam kembali memakai branch mengambang. Sekarang
          # dipaksa: HARUS 2 URL (hook script + patch) dan TIDAK BOLEH ada sisa
          # 'refs/heads/'.
          SUSFS_HIT=$(grep -o "$SUSFS_PIN" integrate_ksu_susfs.sh | wc -l | tr -d ' ')
          SUSFS_FLOAT=$(grep -c 'refs/heads/' integrate_ksu_susfs.sh || true)
          if [ "$SUSFS_HIT" != "2" ] || [ "$SUSFS_FLOAT" != "0" ]; then
            echo "ERROR: pin SUSFS gagal diterapkan (hit=$SUSFS_HIT harus 2, sisa refs/heads=$SUSFS_FLOAT harus 0)."
            echo "Script upstream dlagia berubah bentuk URL-nya - periksa manual:"
            grep -n 'raw.githubusercontent.com/JackA1ltman' integrate_ksu_susfs.sh || true
            exit 1
          fi
          echo "[+] Sumber SUSFS di-PIN ke JackA1ltman@${SUSFS_PIN} ($SUSFS_HIT URL dialihkan, 0 sisa branch mengambang)"

          # ----- SANITASI PATCH SUSFS (revisi ke-8, 2026-09-10) -----
          # BUG BARU (log rosemary-build-log.zip): susfs_patch_to_4.14.patch dari
          # JackA1ltman branch 'mainline' kini TERCEMAR diff direktori .git/
          # (.git/ORIG_HEAD, .git/index, .git/logs/HEAD, .git/objects/*) milik repo
          # scratch pembuatnya (crdroidandroid .._sm8150). Saat 'patch -p1', file
          # .git/* jadi target, gagal, lalu meninggalkan .git/logs/HEAD.rej -> audit
          # menganggapnya reject tak tertangani -> build berhenti exit 1.
          # CATATAN revisi ke-9: setelah sumber di-PIN ke 58568ef1fc di atas, patch
          # yang diunduh SUDAH bersih dari .git/ (sudah diverifikasi: daftar
          # 'diff --git' hanya berisi fs/, kernel/, mm/, include/, security/). Filter
          # di bawah kini berfungsi sebagai jaring pengaman - kalau pin dinaikkan
          # nanti dan upstream mencemari patch lagi, build tetap selamat.
          # Perbaikan lapis-1 (mencegah di sumber): sisipkan filter awk yang membuang
          # SEMUA section 'diff --git ...' yang menyasar .git/ SEBELUM patch
          # diterapkan; section file kernel (fs/, kernel/, mm/, security/, include/)
          # tetap utuh. Script sudah di-PIN, jadi teks baris apply-nya stabil.
          #
          # Lapis-2 (revisi ke-10): tiga baris di hunk fs/stat.c ditulis '++extern...'
          # dan '++#endif...' - tanda tambah ganda. 'patch' membacanya sebagai
          # "tambahkan baris yang isinya diawali '+'", jadi fs/stat.c mendapat baris C
          # tak sah '+extern bool ...' dan blok #ifdef-nya tak pernah ditutup
          # ("expected external declaration" x3 + "unterminated conditional directive").
          # sed di bawah menormalkan '^++' -> '^+' HANYA pada dua pola yang sudah
          # diverifikasi (extern / #endif), lalu memastikan tak ada '^++' tersisa.
          printf '%s\n' '#!/bin/bash' 'P="$1"' \
            'awk '\''/^diff --git /{d=($0 ~ /[ab]\/\.git\//)} !d'\'' "$P" > "$P.ng" && mv "$P.ng" "$P"' \
            'echo "[+] (sanitasi) section .git/ dibuang dari patch sebelum apply"' \
            'N=$(grep -cE "^\+\+(extern |#endif )" "$P" || true)' \
            'sed -i -E "s/^\+\+(extern |#endif )/+\1/" "$P"' \
            'echo "[+] (sanitasi) $N baris diff bertanda ganda (^++) dinormalkan jadi ^+"' \
            'if grep -qE "^\+\+[^+]" "$P"; then' \
            '  echo "GAGAL: masih ada baris ^++ tak dikenal di patch SUSFS:"; grep -nE "^\+\+[^+]" "$P"; touch /tmp/susfs_apply_failed; exit 1' \
            'fi' \
            'patch -p1 < "$P"' > /tmp/susfs_apply.sh
          # Revisi ke-18, dua lubang ditutup:
          # (a) Baris upstream-nya adalah `patch -p1 < "..." || true`. sed hanya
          #     mengganti bagian `patch -p1 < "..."`, jadi `|| true` tetap ada dan
          #     MENELAN `exit 1` sanitizer di atas. Karena itu sanitizer sekarang
          #     meninggalkan sentinel /tmp/susfs_apply_failed, dan sentinel itu
          #     diperiksa SESUDAH integrate selesai (di bawah). `|| true` sendiri
          #     tetap dibiarkan: exit code `patch` yang bukan-nol untuk reject
          #     yang MEMANG diharapkan (task_mmu.c) ditangani oleh audit reject.
          # (b) Pemeriksaan pengalihan dulu cuma `echo CATATAN` (tidak fatal),
          #     padahal kalau gagal, patch mentah ter-apply tanpa sanitasi ^++
          #     dan build baru mati jauh di belakang dgn error compiler aneh.
          #     Sekarang fatal, dan ditambah sentinel /tmp/susfs_apply_ran yang
          #     membuktikan filternya BENAR-BENAR dijalankan, bukan cuma tertulis.
          rm -f /tmp/susfs_apply_failed /tmp/susfs_apply_ran
          sed -i '2i touch /tmp/susfs_apply_ran' /tmp/susfs_apply.sh
          sed -i 's|patch -p1 < "susfs_patch_to_${KERNEL_VERSION}.patch"|bash /tmp/susfs_apply.sh "susfs_patch_to_${KERNEL_VERSION}.patch"|' integrate_ksu_susfs.sh
          if grep -q 'susfs_apply.sh' integrate_ksu_susfs.sh; then
            echo "OK: apply patch SUSFS dialihkan ke filter anti-.git"
          else
            echo "ERROR: baris apply patch SUSFS tak ditemukan - script upstream berubah."
            echo "Baris apply yang ada sekarang:"
            grep -n 'patch -p1' integrate_ksu_susfs.sh || true
            exit 1
          fi

          # </dev/null: script punya prompt interaktif "read -t 10" utk penanganan
          # reject. Di runner tidak ada tty, jadi dipaksa non-interaktif supaya
          # tidak menggantung 10 detik dan hasilnya deterministik.
          bash integrate_ksu_susfs.sh < /dev/null
          rm -f integrate_ksu_susfs.sh

          # Revisi ke-18: sentinel sanitizer (lihat penjelasan (a)/(b) di atas).
          if [ -f /tmp/susfs_apply_failed ]; then
            echo "ERROR: sanitizer patch SUSFS gagal (baris ^++ tak dikenal) -"
            echo "kegagalannya tadi ditelan oleh '|| true' milik script upstream."
            exit 1
          fi
          test -f /tmp/susfs_apply_ran || {
            echo "ERROR: /tmp/susfs_apply.sh tidak pernah dijalankan, jadi patch SUSFS"
            echo "ter-apply TANPA sanitasi .git//^++. Periksa baris apply di script upstream."
            exit 1
          }
          echo "OK: sanitizer patch SUSFS terbukti dijalankan, tanpa kegagalan keras"

          echo ""
          echo "== AUDIT REJECT PATCH SUSFS =="
          # Script dlagia menelan kegagalan patch (patch ... || true) lalu
          # memindahkan .rej ke patch_rejects/ dan tetap lanjut. Kalau tidak
          # diaudit, build gagal jauh di belakang dgn error yang membingungkan.
          # Script dlagia memindahkan semua *.rej ke patch_rejects/ (termasuk yg
          # bawaan repo), jadi kumpulkan dari dua tempat lalu kurangi daftar
          # bawaan tadi. Sisanya = reject yang benar-benar dari patch SUSFS.
          # Pengaman lapis-2: kalau toh ada .rej nyasar di dalam .git/ (mis. dari
          # run lama atau bila sanitasi lapis-1 terlewat), buang dulu - itu bukan
          # file kernel dan tidak boleh membuat audit gagal.
          find . -path '*/.git/*' -name '*.rej' -delete 2>/dev/null || true
          { find patch_rejects -path '*/.git/*' -prune -o -name '*.rej' -printf '%P\n' 2>/dev/null; \
            find . \( -path ./patch_rejects -o -path ./.git \) -prune -o -name '*.rej' -printf '%P\n' 2>/dev/null; } \
            | sort -u > /tmp/rej_after.txt
          REJ=$(comm -13 /tmp/rej_before.txt /tmp/rej_after.txt)

          if [ -n "$REJ" ]; then
            echo "Reject baru dari patch SUSFS:"
            echo "$REJ"
          else
            echo "Tidak ada reject baru dari patch SUSFS."
          fi

          # fs/proc/task_mmu.c.rej memang diharapkan gagal (hunk #1/#5/#6) dan
          # ditangani step berikutnya. Selain itu, berhenti.
          UNEXPECTED=$(echo "$REJ" | grep -v '^fs/proc/task_mmu\.c\.rej$' | grep -vE '(^|/)\.git/' | grep -v '^$' || true)
          if [ -n "$UNEXPECTED" ]; then
            echo ""
            echo "ERROR: ada reject SUSFS di file yang belum ditangani:"
            echo "$UNEXPECTED"
            echo "Isi reject:"
            for f in $UNEXPECTED; do
              echo "----- $f"
              cat "patch_rejects/$f" 2>/dev/null || cat "$f" 2>/dev/null || true
            done
            exit 1
          fi

          echo "$REJ" | grep -q '^fs/proc/task_mmu\.c\.rej$' \
            && echo "OK: hanya fs/proc/task_mmu.c yang reject (sudah diantisipasi)" \
            || echo "CATATAN: task_mmu.c tidak reject - patch upstream mungkin sudah diperbaiki"

          echo ""
          echo "== PERBAIKAN OTOMATIS: bug deteksi versi utk security/selinux/hooks.c (kernel 4.14) =="
          # CATATAN revisi ke-6: anchor lama adalah
          #   'static int selinux_setprocattr(struct task_struct *p,'
          # dan itu TIDAK PERNAH cocok di rosemary-13, karena signature aslinya
          #   static int selinux_setprocattr(const char *name, void *value, size_t size)
          # Karena `if` bagian dalam tidak punya `else`, step lama akan mencetak
          # "extern declaration hilang" lalu diam-diam TIDAK menambal apa pun,
          # dan build baru mati jauh di belakang dengan implicit declaration.
          # Sekarang: cocokkan nama fungsinya saja (apa pun bentuk argumennya).
          if grep -q 'ksu_hide_setprocattr(name, value, size);' security/selinux/hooks.c \
             && ! grep -q 'extern int ksu_hide_setprocattr' security/selinux/hooks.c; then
            echo "Terdeteksi: pemanggilan ksu_hide_setprocattr ada, tapi extern declaration hilang."
            N=$(grep -c '^static int selinux_setprocattr(' security/selinux/hooks.c || true)
            if [ "$N" != "1" ]; then
              echo "ERROR: anchor 'static int selinux_setprocattr(' ketemu $N kali (harus 1)."
              echo "Struktur security/selinux/hooks.c berubah; extern ksu_hide_setprocattr"
              echo "tidak bisa ditambal otomatis. Konteks di sekitarnya:"
              grep -n 'selinux_setprocattr' security/selinux/hooks.c || true
              exit 1
            fi
            sed -i '/^static int selinux_setprocattr(/i\#ifdef CONFIG_KSU\nextern int ksu_hide_setprocattr(const char *name, void *value, size_t size);\n#endif\n' security/selinux/hooks.c
            if grep -q 'extern int ksu_hide_setprocattr' security/selinux/hooks.c; then
              echo "OK: extern ksu_hide_setprocattr berhasil ditambal manual."
            else
              echo "ERROR: penyisipan extern ksu_hide_setprocattr GAGAL walau anchor cocok."
              exit 1
            fi
          elif grep -q 'ksu_hide_setprocattr(name, value, size);' security/selinux/hooks.c; then
            echo "Tidak perlu ditambal: pemanggilan DAN extern-nya sudah ada."
          else
            # Revisi ke-29: dulu kedua keadaan ini sama-sama mencetak "Tidak perlu
            # ditambal." - padahal artinya berbeda, dan yang ini yang sebenarnya
            # terjadi di build kita. Ditelusuri sampai sumbernya:
            #   susfs_inline_hook_patches.sh baris 243 menjaga seluruh penambalan
            #   dengan `grep -rq "ksu_hide_setprocattr" drivers/kernelsu/`, lalu
            #   mencetak "[-] KernelSU needn't ksu_hide_setprocattr, Skipped."
            #   kalau tidak ketemu. Seluruh pohon ReSukiSU 7e92d45e memang NOL
            #   kali menyebut ksu_hide_setprocattr: ia memasang proteksi yang
            #   sama lewat hook LSM (KSU_LSM_HOOK_INIT(setprocattr, ...) ->
            #   ksu_handle_selinux_setprocattr di kernel/feature/selinux_hide.c),
            #   bukan lewat panggilan yang disisipkan ke security/selinux/hooks.c
            #   seperti fork KernelSU lain. Jadi ketiadaannya BENAR, dan menambal
            #   extern ke fungsi yang tak pernah didefinisikan justru akan mati
            #   saat link.
            # Keluaran skrip SUSFS sendiri dibuang ke /dev/null oleh
            # integrate_ksu_susfs.sh, jadi baris inilah satu-satunya tempat
            # keadaan ini terlihat di log - dan sekarang ia sekalian membuktikan
            # penggantinya ada, bukan sekadar mengumumkan yang tidak ada.
            echo "Tidak perlu ditambal: ReSukiSU memakai hook LSM, bukan panggilan di hooks.c."
            if [ -d KernelSU/kernel ]; then
              grep -rq 'ksu_handle_selinux_setprocattr' KernelSU/kernel/ || {
                echo "ERROR: pemanggilan ksu_hide_setprocattr tidak ada DAN pengganti"
                echo "  LSM-nya (ksu_handle_selinux_setprocattr) juga tidak ada."
                echo "  Berarti tidak ada satu pun proteksi setprocattr yang terpasang -"
                echo "  ReSukiSU berubah bentuk, penambalan hooks.c perlu ditinjau ulang."
                exit 1
              }
              echo "OK: ksu_handle_selinux_setprocattr ada di KernelSU/kernel (pengganti yang sah)"
            else
              echo "CATATAN: KernelSU/kernel belum ada di titik ini, cek pengganti dilewati."
            fi
          fi

          echo ""
          echo "== Verifikasi integrasi KernelSU & SuSFS =="
          test -d KernelSU || { echo "ERROR: direktori KernelSU tidak ditemukan"; exit 1; }
          for f in fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h; do
            test -s "$f" || { echo "ERROR: $f tidak ada setelah patch SUSFS"; exit 1; }
            echo "OK: $f ada"
          done
          grep -q 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' fs/Makefile || {
            echo "ERROR: fs/Makefile tidak berisi entry susfs.o"
            exit 1
          }
          echo "OK: fs/Makefile berisi obj-\$(CONFIG_KSU_SUSFS) += susfs.o"

          echo ""
          echo "== Verifikasi hook inline SuSFS (syarat ReSukiSU inline_hook_check.mk) =="
          for pair in \
            "ksu_handle_execveat:fs/exec.c" \
            "ksu_handle_faccessat:fs/open.c" \
            "ksu_handle_sys_read:fs/read_write.c" \
            "ksu_handle_stat:fs/stat.c" \
            "ksu_handle_sys_reboot:kernel/reboot.c" \
            "ksu_handle_input_handle_event:drivers/input/input.c" \
            "ksu_handle_setresuid:kernel/sys.c" ; do
            sym="${pair%%:*}"; file="${pair##*:}"
            grep -q "$sym" "$file" || { echo "ERROR: hook $sym tidak ada di $file"; exit 1; }
            echo "OK: $sym ada di $file"
          done

          # Pin harus TERMATERIALISASI, bukan sekadar teks di script (revisi ke-12).
          # WAJIB, bukan formalitas: setup.sh ReSukiSU menutup checkout-nya dengan
          #     git checkout "$1" && echo ... || echo "[-] Checkout default branch"
          # sehingga checkout yang GAGAL tidak menghentikan script - ia diam-diam
          # lanjut memakai branch main. Assert di bawah ini satu-satunya yang
          # menangkap kondisi itu sebelum kode salah ikut ter-compile.
          KSU_HEAD="$(git -C KernelSU rev-parse HEAD)"
          # SELF-HEAL (revisi ke-22): jangan bergantung pada niat baik setup.sh.
          # Pada build 34760665407 checkout-nya gagal dalam diam karena commit pin
          # ter-rebase jadi orphan sehingga `git clone` biasa tidak membawanya.
          # GitHub tetap melayani fetch-by-sha untuk commit orphan (uploadpack
          # allowAnySHA1InWant) - SUDAH DIUJI di luar CI: `git fetch --depth 1
          # origin f4c4923e` atas commit orphan itu berhasil. Jadi kalau HEAD
          # tidak sama dengan pin, pin diambil sendiri dari sha-nya. Fetch
          # SENGAJA tanpa --depth: clone setup.sh penuh, dan KSU_VERSION =
          # 30000 + `git rev-list --count HEAD` + 700, jadi riwayat dangkal akan
          # memelintir angka versi. Kalau fetch juga gagal (commit benar-benar
          # dihapus), assert di bawah yang menghentikan build - bukan kompilasi
          # sumber yang salah.
          if [ "$KSU_HEAD" != "$KSU_PIN" ]; then
            echo "[!] KernelSU di $KSU_HEAD, bukan pin $KSU_PIN - setup.sh gagal checkout"
            echo "[!] coba ambil langsung per-sha (commit bisa orphan akibat rebase upstream)"
            git -C KernelSU fetch origin "$KSU_PIN" && git -C KernelSU checkout -q FETCH_HEAD || true
            KSU_HEAD="$(git -C KernelSU rev-parse HEAD)"
            echo "[+] KernelSU sekarang di $KSU_HEAD"
          fi
          test "$KSU_HEAD" = "$KSU_PIN" || {
            echo "ERROR: KernelSU tidak ter-checkout ke commit pin."
            echo "  diharapkan: $KSU_PIN"
            echo "  aktual    : $KSU_HEAD"
            echo "setup.sh mungkin gagal checkout (commit dihapus / force-push upstream)."
            exit 1
          }
          echo "OK: ReSukiSU ter-pin di $KSU_PIN"

          echo "KSU_SHA=$(git -C KernelSU rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "ReSukiSU commit: $(git -C KernelSU rev-parse HEAD)"
          echo "Integrasi KernelSU + SuSFS via dlagia/Build-Kernel_scripts: SUKSES"

      # ===== BUKTI SIMULASI (revisi ke-17, 2026-09-12) =====
      # Seluruh rantai di bawah direproduksi di luar CI: fs/proc/task_mmu.c
      # asli rosemary-13 + `patch -p1` (fuzz GNU default 2) + fixer ini, lalu
      # setiap penanda SUSFS dipetakan ke fungsi pembungkusnya. Hasilnya persis
      # seperti yang diasumsikan docstring fixer:
      #   hunk 1 GAGAL  (include susfs_def.h)            -> dipasang fixer
      #   hunk 2 fuzz 2 (extern spoof/open_redirect)     -> mendarat benar
      #   hunk 3 OK     (guard di show_map_vma, `return;`)-> void, sah
      #   hunk 4 fuzz 2 -> NYASAR ke smap_gather_stats() yang bertipe void,
      #                    membawa `return 0;` = error kompilasi. Fixer
      #                    mencabutnya lalu memasangnya di show_smap() (int).
      #   hunk 5,6 GAGAL (kosmetik baris kosong)         -> aman diabaikan
      #   hunk 7,8 OK    (pagemap_read: vma + goto bypass_orig_flow)
      # Sesudah fixer: include ADA; guard SUS_MAP ada di show_smap() dengan
      # `return 0;` yang cocok tipe; label bypass_orig_flow punya tepat satu
      # pemakai di fungsi yang sama; `struct vm_area_struct *vma;` di
      # pagemap_read() cuma satu (pagemap_read asli TIDAK punya vma, jadi tidak
      # ada deklarasi ganda). Jadi tiga reject yang tersisa memang cuma hunk
      # 1/5/6 dan ketiganya tertangani - bukan bug yang lolos diam-diam.
      - name: Perbaiki hasil patch SUSFS di fs/proc/task_mmu.c
        working-directory: kernel
        run: |
          echo "" | base64 -d > /tmp/fix_susfs_task_mmu.py
          python3 /tmp/fix_susfs_task_mmu.py
          rm -f fs/proc/task_mmu.c.rej patch_rejects/fs/proc/task_mmu.c.rej

          echo ""
          echo "== Ringkasan hunk task_mmu.c =="
          grep -c 'SUSFS_IS_INODE_SUS_MAP' fs/proc/task_mmu.c || true
          grep -n 'susfs_def.h' fs/proc/task_mmu.c || true

      - name: Perbaiki bug patch SUSFS untuk kernel 4.14 (stat/statfs/susfs/proc-fd/super/namespace)
        working-directory: kernel
        run: |
          # Patch SUSFS v2.3.0 ditulis untuk kernel 5.10+ lalu di-backport setengah
          # jalan ke 4.14, sehingga build sebelumnya berhenti dengan 30 error di
          # empat file. Semua ini cacat UPSTREAM (bukan salah workflow); script di
          # bawah memperbaikinya dengan anchor ketat + idempoten:
          #   fs/stat.c    stat->mnt_id      -> field itu baru ada di struct kstat
          #                                     sejak 5.10 (statx STATX_MNT_ID);
          #                                     dua assignment dibuang, result_mask
          #                                     tetap di-set jadi jalur spoof utuh.
          #   fs/stat.c +  filename_lookup() -> susfs_inline_hook_patches.sh menyisipkan
          #   fs/namei.c                        pemanggilannya, tapi penjaganya justru
          #                                     MELEWATI penyisipan deklarasi ketika
          #                                     fungsinya static (persis kasus 4.14).
          #                                     'static' dibuang di namei.c + extern
          #                                     dideklarasikan di stat.c.
          #   fs/statfs.c  extern SUS_KSTAT  -> blok extern ditaruh SESUDAH fungsi yang
          #                                     memakainya; deklarasi diulang di atas.
          #   fs/susfs.c   security_sb_statfs-> <linux/security.h> belum di-include.
          #   fs/susfs.c   mark_inode_sus_kstat -> satu call site ketinggalan argumen
          #                                     ke-3 (is_update) saat signature ditambah.
          #   fs/proc/fd.c brace             -> blok CONFIG_KSU_SUSFS_SUS_MOUNT kurang
          #                                     satu '}' sehingga sisa file tertelan ke
          #                                     dalam seq_show(). Bug sejenis yang baru
          #                                     upstream perbaiki di fs/notify/fdinfo.c
          #                                     tapi terlewat di sini.
          #   fs/super.c   ida_simple_get   -> hunk get_anon_bdev() yang ikut masuk
          #                                     bersama pin c231ef5d memakai
          #                                     ida_simple_get() pada unnamed_dev_ida,
          #                                     padahal IDA itu di 4.14 dilindungi
          #                                     unnamed_dev_lock sementara
          #                                     ida_simple_get() pakai simple_ida_lock
          #                                     sendiri -> dua lock untuk satu IDA.
          #                                     Panggilannya dibungkus lock yang benar.
          #   fs/namespace.c ida_simple_get -> cacat sejenis pada mnt_id_ida vs
          #                                     mnt_id_lock (sudah ada sejak pin lama).
          #                                     Di sini GFP_KERNEL boleh tidur, jadi
          #                                     bukan dibungkus lock melainkan ditulis
          #                                     ulang gaya 4.14: ida_pre_get di luar
          #                                     lock, ida_get_new_above di dalam lock.
          # (Baris diff bertanda ganda '^++' di fs/stat.c sudah ditangani lebih awal,
          #  di lapis-2 sanitizer /tmp/susfs_apply.sh.)
          echo "" | base64 -d > /tmp/fix_susfs_414.py
          python3 /tmp/fix_susfs_414.py

          echo ""
          echo "== Ringkasan perbaikan SUSFS 4.14 =="
          grep -c 'stat->mnt_id' fs/stat.c || true
          grep -n 'extern int filename_lookup' fs/stat.c || true
          grep -n '^int filename_lookup' fs/namei.c || true
          grep -n '#include <linux/security.h>' fs/susfs.c || true
          grep -n 'spin_lock(&unnamed_dev_lock);' fs/super.c | head -3 || true
          grep -c 'ida_simple_get' fs/super.c fs/namespace.c || true

      - name: Commit ReSukiSU + bersihkan dirty
        working-directory: kernel
        run: |
          echo "==================== Cek status KernelSU sebelum commit ===================="
          cd KernelSU
          git status --porcelain || true
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -A
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Apply custom integration (remove dirty)"
            echo "Commit berhasil dilakukan di KernelSU"
          else
            echo "KernelSU sudah clean, tidak ada yang perlu di-commit"
          fi

          echo ""
          echo "==================== Status setelah commit ===================="
          git status
          git diff-index --quiet HEAD && echo ">>> KernelSU CLEAN (tidak ada dirty)" || echo ">>> MASIH DIRTY!"

          cd ..

          if [ -f scripts/setlocalversion ]; then
            sed -i 's/-dirty//g' scripts/setlocalversion
            echo "scripts/setlocalversion sudah dibersihkan dari -dirty"
          fi

          find . -name setlocalversion -exec sed -i 's/-dirty//g' {} + 2>/dev/null || true

          # AUDIT RANTAI VERSI KSU (revisi ke-17, 2026-09-12), dibaca dari
          # KernelSU/kernel/Kbuild pin 3380d41f (Kbuild byte-identik dgn
          # fa1da13f dan 6930e97b - tidak berubah sejak revisi ke-14):
          #   KSU_VERSION = 30000 + `git rev-list --count HEAD` + 700. Aman:
          #   setup.sh meng-clone TANPA --depth (baris 53), dan Kbuild baris 75
          #   masih menjalankan `fetch --unshallow` kalau ../.git/shallow ada.
          #   Jadi angka versinya asli, bukan hasil clone dangkal.
          #   KSU_VERSION_FULL berasal dari CONFIG_KSU_FULL_NAME_FORMAT. Simbol
          #   itu TIDAK ada di defconfig kita, TAPI ia `string` ber-default
          #   "%TAG_NAME%-%COMMIT_SHA%@%REPO_NAME%" - dan Kconfig menerapkan
          #   default walau simbolnya tak disebut, jadi versinya TIDAK kosong.
          #   Sekaligus: sed di integrate_ksu_susfs.sh yang menimpa format itu
          #   dengan "...-t.me/noforce2pay" berada di cabang `elif` yang hanya
          #   menyala bila KernelSU/ SUDAH ada. Di alur kita integrate.sh yang
          #   MEMBUAT KernelSU/, jadi cabang itu tidak pernah jalan dan iklan
          #   Telegram milik dlagia tidak ikut ke kernel ini. Jangan "rapikan"
          #   urutan step sampai KernelSU/ ada lebih dulu - itu justru akan
          #   menyalakan branding tersebut.
          if [ -f KernelSU/kernel/Kbuild ]; then
            sed -i 's/KSU_COMMIT_SHA  := \$(KSU_COMMIT_SHA)-dirty/KSU_COMMIT_SHA  := \$(KSU_COMMIT_SHA)/' KernelSU/kernel/Kbuild || true
            echo "Pengecekan -dirty di KernelSU/kernel/Kbuild sudah dinetralisir"
          fi

      - name: Integrasikan NoMount (setup.sh resmi, driver di-PIN)
        working-directory: kernel
        run: |
          # ==== PIN DRIVER NoMount (revisi audit ke-7) ====
          # Sebelumnya `bash -s dev` = checkout branch dev + `git pull` -> SELALU
          # ambil HEAD dev. Itu berarti KODE DRIVER yang di-compile berubah tiap
          # run. Karena setup.sh menerima argumen <commit-or-tag> (bukan cuma
          # nama branch), driver dipaku ke SHA supaya build reproducible.
          #
          # DINAIKKAN di revisi ke-15 (2026-09-12): 166f7b7c -> 6d8871dc, 19 commit.
          # Pin lama sengaja dipilih PRA-rewrite ART (RBTree) waktu penyebab stuck
          # di logo belum ketahuan. Penyebabnya sudah ketemu dan BUKAN NoMount,
          # sementara sejak f7f7caaf ("replace RBTree with Adaptive Radix Tree",
          # 2026-09-08) upstream menumpuk ~8 commit perbaikan di atasnya ("fix ART
          # child removal", "manage ART nodes under the rules lock", "preserve
          # directory lifetimes during rule deletion", "only change d_flags if its
          # our file", dst) - jadi bertahan di pra-ART justru berarti memakai kode
          # yang perbaikan-perbaikan itu tidak ikut.
          # Penjaga di bawah DIUJI ULANG terhadap 6d8871dc sebelum dinaikkan:
          # nomount_srcu masih ada di kernel/src/nomount.c (8 kemunculan),
          # userspace/src masih hanya nm.c + nm.h, _start masih didefinisikan via
          # inline asm di nm.h (jadi -Wl,-e,_start di step "Compile nm" masih
          # benar), dan kernel/setup.sh di HEAD BYTE-IDENTIK dengan pin 0c4b2dbd
          # yang dipakai di bawah - jadi pin script itu tetap sahih.
          # CATATAN: ini kenaikan PALING BERISIKO dari semuanya, karena kodenya
          # jalan di d_revalidate + iterate_dir sejak filesystem pertama diakses.
          # Kalau stuck di logo kembali, INI tersangka pertama - turunkan dulu
          # ke 166f7b7c untuk membuktikan.
          #
          # DINAIKKAN LAGI di revisi ke-20 (2026-09-12): 6d8871dc -> 7919faf2,
          # SATU commit, SATU file, kernel/src/nomount.c +2/-2. Judulnya "kernel:
          # replace implicit initialization with memset for compatibility" dan
          # diff-nya diperiksa baris per baris, bukan dipercaya dari judul:
          #   nomount_generate_virtual_topology():  *irule = (struct nomount_rule){0};
          #   nm_alloc_rule():                      *rule  = (struct nomount_rule){0};
          # keduanya jadi memset(ptr, 0, sizeof(*ptr)).
          # PERILAKU TIDAK BERUBAH: struct nomount_rule berakhir dengan flexible
          # array member `char paths[]` (nomount.h:127), dan sizeof() TIDAK
          # menghitung FAM - jadi kedua bentuk membersihkan byte yang persis sama
          # (bagian tetap saja); isi paths[] tetap ditulis memcpy sesudahnya.
          # Yang didapat justru soal kompatibilitas: assignment compound literal
          # ke struct ber-FAM ditolak/diperingatkan sebagian compiler lama, dan
          # memset selalu sah. Aman untuk 4.14 + proton-clang, dan tetap sejajar
          # dengan upstream. Per 2026-09-12 branch dev DAN master sama-sama
          # menunjuk 7919faf2.
          # Keempat penjaga DIUJI ULANG terhadap 7919faf2 sebelum dinaikkan:
          # kernel/setup.sh md5 deb7713c88a51e4c37ed88411ca2b95a - BYTE-IDENTIK
          # dengan pin loader 016375cd di bawah; nomount_srcu 8 kemunculan;
          # userspace/src tetap hanya nm.c + nm.h; `_start` tetap inline asm di
          # nm.h:25 (arm64), jadi -nostdlib -static -Wl,-e,_start di step "Compile
          # nm" tetap sahih.
          # NOMOUNT_PIN dari pins.env (revisi ke-26). Nilai saat ini
          # 7919faf2 = HEAD dev & master (2026-09-12T14:32Z), ART + perbaikan
          # + memset-compat.

          # pipefail: tanpa ini, exit code pipeline = exit code `bash` saja,
          # sehingga HTTP 404/500 dari curl tidak pernah menggagalkan step.
          set -o pipefail
          rm -rf NoMount fs/nomount
          # setup.sh sendiri tetap di-pin ke commit tertentu (isi script stabil);
          # argumen $1 = commit driver yang mau di-checkout (detached HEAD).
          # -f: HTTP >=400 -> curl exit != 0 (tanpa -f, halaman error ikut ter-pipe
          # ke bash sebagai "script" dan bash keluar 0).
          # Revisi ke-21 (2026-09-13): pin loader dinaikkan 0c4b2dbd -> 016375cd
          # (HEAD master). kernel/setup.sh di kedua commit md5-nya sama
          # (deb7713c88a51e4c37ed88411ca2b95a) alias BYTE-IDENTIK, jadi ini murni
          # supaya URL tidak tertinggal di commit lama - nol perubahan perilaku.
          curl -fLSs "https://raw.githubusercontent.com/maxsteeel/nomount/${NOMOUNT_LOADER_PIN}/kernel/setup.sh" | bash -s "$NOMOUNT_PIN"

          test -d NoMount || {
            echo "ERROR: direktori NoMount tidak ditemukan setelah setup.sh"
            exit 1
          }

          echo "NoMount commit dipakai (kernel + nm): $(git -C NoMount rev-parse HEAD)"
          # setup.sh mem-checkout SHA -> detached HEAD (bukan branch), jadi
          # verifikasinya adalah kecocokan commit, bukan nama branch.
          test "$(git -C NoMount rev-parse HEAD)" = "$NOMOUNT_PIN" || {
            echo "ERROR: NoMount tidak ter-checkout ke commit pin ($NOMOUNT_PIN)"
            echo "HEAD aktual: $(git -C NoMount rev-parse HEAD)"
            exit 1
          }

          test -L fs/nomount || {
            echo "ERROR: symlink fs/nomount tidak dibuat oleh setup.sh"
            exit 1
          }
          test -s fs/nomount/Kconfig
          test -s fs/nomount/Makefile
          test -s fs/nomount/nomount.c
          test -s fs/nomount/nomount.h

          echo ""
          echo "== PERBAIKAN bug duplikasi fs/Kconfig upstream =="
          python3 - << 'PYEOF'
          path = "fs/Kconfig"
          target = 'source "fs/nomount/Kconfig"\n'

          with open(path) as f:
              lines = f.readlines()

          idxs = [i for i, l in enumerate(lines) if l == target]
          print(f"Ditemukan {len(idxs)} baris '{target.strip()}' di fs/Kconfig")

          if len(idxs) == 0:
              print("ERROR: baris source fs/nomount/Kconfig tidak ditemukan sama sekali")
              raise SystemExit(1)
          elif len(idxs) == 1:
              print("OK: cuma 1 baris kali ini - tidak perlu diperbaiki")
          else:
              endmenu_idxs = [i for i, l in enumerate(lines) if l.strip() == "endmenu"]
              if not endmenu_idxs:
                  print("ERROR: tidak ada baris endmenu di fs/Kconfig - struktur tidak dikenal")
                  raise SystemExit(1)
              last_endmenu = endmenu_idxs[-1]
              keep_idx = last_endmenu - 1 if (last_endmenu - 1) in idxs else idxs[-1]
              new_lines = [l for i, l in enumerate(lines) if l != target or i == keep_idx]
              with open(path, "w") as f:
                  f.writelines(new_lines)
              sisa = new_lines.count(target)
              print(f"Diperbaiki: {len(idxs)} -> {sisa} baris (dipertahankan indeks {keep_idx}, tepat sebelum endmenu top-level)")
              if sisa != 1:
                  print("ERROR: perbaikan gagal, jumlah baris akhir bukan 1")
                  raise SystemExit(1)
          PYEOF

          echo ""
          echo "==================== NoMount (branch dev, via setup.sh resmi) ===================="
          echo "NoMount source: $(readlink -f fs/nomount)"
          grep -nF 'source "fs/nomount/Kconfig"' fs/Kconfig || true
          test "$(grep -cF 'source "fs/nomount/Kconfig"' fs/Kconfig)" = "1" || {
            echo "ERROR: fs/Kconfig masih mengandung duplikasi setelah perbaikan"
            exit 1
          }
          grep -q 'nomount_srcu' fs/nomount/nomount.c || {
            echo "ERROR: fs/nomount/nomount.c tidak mengandung nomount_srcu"
            exit 1
          }

          # Entry fs/Makefile. setup.sh menambahkannya dengan penjaga longgar:
          #     if ! grep -q "nomount" "$FS_MAKEFILE"; then
          #         printf "\nobj-\$(CONFIG_NOMOUNT) += nomount/\n" >> "$FS_MAKEFILE"
          # Artinya kalau kata "nomount" sudah muncul di fs/Makefile karena sebab
          # lain (sisa run sebelumnya, komentar, patch lain), penambahan DILEWATI
          # tanpa peringatan -> CONFIG_NOMOUNT=y tapi objeknya tidak pernah
          # dikompilasi, dan kegagalannya baru terasa saat runtime di HP.
          # Jadi entry-nya diverifikasi eksplisit di sini.
          grep -nF 'obj-$(CONFIG_NOMOUNT) += nomount/' fs/Makefile || true
          test "$(grep -cF 'obj-$(CONFIG_NOMOUNT) += nomount/' fs/Makefile)" = "1" || {
            echo "ERROR: fs/Makefile tidak berisi tepat satu 'obj-\$(CONFIG_NOMOUNT) += nomount/'"
            echo "Baris fs/Makefile yang menyebut nomount:"
            grep -n 'nomount' fs/Makefile || echo "  (tidak ada sama sekali)"
            exit 1
          }
          echo "OK: fs/Makefile berisi obj-\$(CONFIG_NOMOUNT) += nomount/"

          echo "NOMOUNT_SHA=$(git -C NoMount rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "NoMount branch dev: OK"

      - name: Pastikan tidak ada residu Re:Kernel & Baseband-guard
        working-directory: kernel
        run: |
          # Revisi ke-11: kedua add-on ini dicabut permanen. Step ini yang
          # menjamin "tidak ada residu": apa pun sisa yang masih menempel di
          # pohon source - dari repo dasar rosemary-13, dari script integrasi
          # lain, atau dari cache runner - dibersihkan di sini, lalu hasilnya
          # di-assert. Kalau suatu saat ada yang menyusupkannya kembali, build
          # berhenti di titik ini dengan pesan jelas, bukan diam-diam ikut
          # ter-compile.
          echo "==================== Pembersihan residu ===================="

          # ---------- Re:Kernel ----------
          if [ -e drivers/rekernel ]; then
            echo "[bersih] menghapus drivers/rekernel/"
            rm -rf drivers/rekernel
          fi
          for f in drivers/Makefile drivers/Kconfig; do
            if grep -q 'rekernel' "$f"; then
              echo "[bersih] membuang entri rekernel dari $f:"
              grep -n 'rekernel' "$f"
              sed -i '/rekernel/d' "$f"
            fi
          done
          # Hook Re:Kernel disisipkan ke TENGAH fungsi binder/signal. Menghapusnya
          # dengan sed berarti menyunting jalur panas secara buta - lebih berbahaya
          # daripada gagal. Jadi di sini cuma dideteksi, tidak dibersihkan.
          for f in drivers/android/binder.c drivers/android/binder_alloc.c kernel/signal.c; do
            if grep -q 'rekernel' "$f"; then
              echo "ERROR: $f masih mengandung hook Re:Kernel:"
              grep -n 'rekernel' "$f"
              echo "Hook ini berada di tengah fungsi dan TIDAK dibersihkan otomatis."
              echo "Perbaiki sumber yang menyisipkannya, lalu jalankan ulang."
              exit 1
            fi
          done

          # ---------- Baseband-guard ----------
          for p in security/baseband-guard security/baseband_guard \
                   security/selinux/include/bbg_tracing.h Baseband-guard; do
            if [ -e "$p" ] || [ -L "$p" ]; then
              echo "[bersih] menghapus $p"
              rm -rf "$p"
            fi
          done
          for f in security/Makefile security/Kconfig; do
            if grep -qE 'baseband.guard|bbg_tracing' "$f"; then
              echo "[bersih] membereskan $f:"
              grep -nE 'baseband.guard|bbg_tracing' "$f"
              # Baris entri (obj-.. / source ..) dibuang seluruhnya, sedangkan
              # daftar `default "...,baseband_guard"` di config LSM cukup dicabut
              # token-nya supaya selinux dkk tetap terdaftar.
              sed -i -E '/^[[:space:]]*(obj-|source)/{ /baseband.guard/d }' "$f"
              sed -i -E 's/,baseband_guard//g; s/baseband_guard,//g' "$f"
              sed -i -E '/bbg_tracing/d' "$f"
            fi
          done

          echo ""
          echo "==================== Assert bersih ===================="
          RESIDU=0
          for p in drivers/rekernel security/baseband-guard security/baseband_guard \
                   security/selinux/include/bbg_tracing.h Baseband-guard; do
            if [ -e "$p" ] || [ -L "$p" ]; then
              echo "ERROR: $p masih ada"
              RESIDU=1
            fi
          done
          for f in drivers/Makefile drivers/Kconfig drivers/android/binder.c \
                   drivers/android/binder_alloc.c kernel/signal.c; do
            if grep -q 'rekernel' "$f"; then
              echo "ERROR: sisa 'rekernel' di $f:"
              grep -n 'rekernel' "$f"
              RESIDU=1
            fi
          done
          for f in security/Makefile security/Kconfig; do
            if grep -qE 'baseband.guard|bbg_tracing' "$f"; then
              echo "ERROR: sisa baseband-guard di $f:"
              grep -nE 'baseband.guard|bbg_tracing' "$f"
              RESIDU=1
            fi
          done
          if [ "$RESIDU" != "0" ]; then
            echo "Residu add-on yang sudah dicabut masih ada - build dihentikan."
            exit 1
          fi
          echo "OK: tidak ada residu Re:Kernel maupun Baseband-guard di pohon source."

      - name: Pra-compile - perbaikan build source MTK (verified reusable)
        working-directory: kernel
        run: |
          grep -rlZ --include=Makefile --include=Kbuild --include='*.mk' --exclude-dir=.git \
            -e '-Werror' . 2>/dev/null \
            | xargs -0 -r sed -i -E -e 's/-Werror=[A-Za-z0-9_-]+//g' -e 's/(-Werror)([[:space:]]|$)/\2/g' || true
          # WAJIB dibatasi ke *.c/*.h dan exclude .git: tanpa itu grep -rl juga
          # mencocokkan objek pack biner di .git dan sed akan merusaknya.
          grep -rlZ --include='*.c' --include='*.h' --exclude-dir=.git --exclude-dir=patch_rejects \
            'no_sanitize(' . 2>/dev/null \
            | xargs -0 -r sed -i -E 's/__attribute__\(\(no_sanitize\("[^"]*"\)\)\)//g' || true
          sed -i 's/inline void ksm_flock(/void ksm_flock(/' include/linux/keyslot-manager.h block/keyslot-manager.c || true
          sed -i 's/^inline void blk_crypto_flock(/void blk_crypto_flock(/' include/linux/blk-crypto.h block/blk-crypto.c || true
          sed -i 's/inline int typec_pd_start_entry(/int typec_pd_start_entry(/' drivers/misc/mediatek/typec/tcpc/inc/tcpci_typec.h drivers/misc/mediatek/typec/tcpc/tcpci_typec.c || true
          find drivers/input/touchscreen -name focaltech_config.h -printf '%h\n' 2>/dev/null | while read d; do
            mkdir -p "$d/include/firmware"
            printf '0x00\n' > "$d/include/firmware/fw_sample.i"
            echo "stub firmware -> $d/include/firmware/fw_sample.i"
          done
          grep -rl 'bq2597x_charger.o' --include=Makefile . 2>/dev/null | while read mk; do
            echo 'CFLAGS_REMOVE_bq2597x_charger.o += -mgeneral-regs-only' >> "$mk"
            echo "CFLAGS_REMOVE ditambah ke: $mk"
          done
          echo '== cek sisa =='
          # Revisi ke-17: grep ini dulu TIDAK memakai --exclude-dir, padahal sed
          # di atasnya memakai. Akibatnya hitungan 'tersisa' ikut mencacah file
          # di patch_rejects/ (dan blob di .git/) yang memang sengaja tidak
          # disunting - angkanya jadi > 0 dan menyesatkan pembaca log, seolah
          # pembersihan gagal. Sekarang cakupannya disamakan dengan sed-nya.
          # Revisi ke-23: dulu yang dicetak cuma cacahnya, sehingga "tersisa: 1"
          # tidak bisa diverifikasi pembaca log. Sisa itu selalu
          # include/linux/compiler-clang.h: di sana __no_sanitize_address ditulis
          # DUA BARIS dengan DUA argumen - __attribute__((no_sanitize("address",
          # "hwaddress"))) - sedangkan sed di atas satu baris satu string, jadi
          # tidak mungkin cocok. Aman: itu definisi makro, bukan pemakaian, dan
          # KASAN mati. Catatan: `#define __nocfi __attribute__((no_sanitize("cfi")))`
          # di file yang sama JUSTRU kena sed dan dikosongkan - tidak apa-apa
          # selama CONFIG_CFI_CLANG tidak dipakai (memang tidak ada di
          # rosemary_defconfig). Kalau CFI suatu saat dinyalakan, persempit dulu
          # sed-nya supaya tidak ikut menghapus definisi __nocfi.
          echo '== sisa no_sanitize( (diharapkan hanya include/linux/compiler-clang.h) =='
          grep -rl 'no_sanitize(' --include='*.h' --include='*.c' --exclude-dir=.git --exclude-dir=patch_rejects . 2>/dev/null | sed 's/^/  /'
          echo -n 'no_sanitize( tersisa: '; grep -rl 'no_sanitize(' --include='*.h' --include='*.c' --exclude-dir=.git --exclude-dir=patch_rejects . 2>/dev/null | wc -l

      - name: Aktifkan KSU & SuSFS di defconfig (termasuk dlagia ksu-susfs_defconfig)
        working-directory: kernel
        run: |
          DEF=arch/arm64/configs/rosemary_defconfig

          # ----- AUDIT STRUKTUR (revisi ke-16, 2026-09-12, pasca-boot rev-15) -----
          # Dibaca dari KernelSU/kernel/Kconfig pada pin ReSukiSU 3380d41f
          # (Kconfig byte-identik dgn fa1da13f dan 6930e97b yang diaudit di
          # revisi ke-16 - tidak ada perubahan Kconfig sejak saat itu):
          #
          # 1. CONFIG_KSU_SUSFS BUKAN bool bebas. Ia anggota sebuah blok
          #      choice / prompt "KernelSU Hooking Method" / depends on KSU
          #      default KSU_TRACEPOINT_HOOK
          #    beranggotakan TIGA simbol yang SALING MENIADAKAN:
          #      KSU_TRACEPOINT_HOOK (GKI2 / 5.10+)  <- default upstream
          #      KSU_MANUAL_HOOK     (3.4+)
          #      KSU_SUSFS           ("SUSFS Inline Hook", depends on
          #                           THREAD_INFO_IN_TASK && 64BIT)
          #    Menyetel CONFIG_KSU_SUSFS=y otomatis memaksa dua yang lain jadi n.
          #    Jadi assert "KSU_TRACEPOINT_HOOK bukan y" di step kompilasi
          #    sebenarnya adalah pemeriksaan integritas choice, dan loop
          #    KSU_MANUAL_HOOK_AUTO_* di sana dijamin lolos karena seluruh menu
          #    "KernelSU - Manual Hook Auto hook" ber-depends on KSU_MANUAL_HOOK
          #    yang kini n. Keduanya sabuk pengaman, bukan mubazir: kalau suatu
          #    saat defconfig ini menyetel dua anggota choice sekaligus, yang
          #    menang adalah baris TERAKHIR - dan assert-lah yang menangkapnya.
          #    Kekhawatiran sempat muncul bahwa KSU_SUSFS "depends on
          #    KSU_MANUAL_HOOK"; itu SALAH BACA - baris depends itu milik menu di
          #    bawah endchoice. KSU_SUSFS hanya bergantung THREAD_INFO_IN_TASK &&
          #    64BIT, dua-duanya menyala di arm64 4.14.
          #
          # 2. Berkas dlagia di bawah memuat 15 simbol. Empat belas cocok dengan
          #    Kconfig. SATU tidak: CONFIG_KSU_SUSFS_TRY_UMOUNT=y adalah BARIS
          #    MATI - di ReSukiSU tidak ada "config KSU_SUSFS_TRY_UMOUNT" (sembilan
          #    sub-opsi yang ada: SUS_PATH, SUS_MOUNT, SUS_KSTAT, SPOOF_UNAME,
          #    ENABLE_LOG, HIDE_KSU_SUSFS_SYMBOLS, SPOOF_CMDLINE_OR_BOOTCONFIG,
          #    OPEN_REDIRECT, SUS_MAP), dan tidak ada simbol pengganti bernama
          #    umount apa pun. Kconfig membuangnya diam-diam. TIDAK BERBAHAYA -
          #    try_umount di ReSukiSU tidak lagi digerbangi Kconfig - jadi dibiarkan
          #    apa adanya; jangan panik lagi kalau melihatnya hilang dari .config.
          #
          # 3. Kesembilan sub-opsi itu sudah "default y" begitu KSU_SUSFS menyala,
          #    jadi menyetelnya di defconfig bersifat mengulang tapi tidak merusak.
          #    Sebaliknya, TIDAK ADA satu pun CONFIG_ di seluruh rantai skrip
          #    integrasi (integrate_ksu_susfs.sh maupun susfs_inline_hook_patches.sh)
          #    yang menulis ke defconfig - keduanya hanya menambal source. Artinya
          #    berkas dlagia inilah SATU-SATUNYA sumber CONFIG_KSU_SUSFS=y.
          #
          # 4. SUSFS vs NoMount TIDAK menambal titik yang sama, jadi tidak ada hook
          #    ganda: SUSFS menambal CALL SITE di dalam fs/namei.c, fs/readdir.c,
          #    fs/stat.c, fs/statfs.c, fs/namespace.c, fs/proc/*, mm/memory.c;
          #    NoMount menukar POINTER di tabel operasi per-inode (i_op->lookup,
          #    f_op->iterate/iterate_shared, d_op->d_revalidate, getattr) dan selalu
          #    memanggil balik orig_iop. Beda lapisan, urutannya SUSFS sesudah
          #    NoMount. Satu catatan cakupan (bukan bug/crash): jalur nm_dir_lookup
          #    memanggil r_dir->i_op->lookup langsung sehingga tidak melewati
          #    saringan SUS_PATH di fs/namei.c - path yang disembunyikan SUSFS bisa
          #    tetap terlihat bila diakses lewat direktori hasil redirect NoMount.
          #    Sembunyikan path semacam itu lewat NoMount, bukan SUS_PATH.
          echo "[+] Mengunduh dan menggabungkan ksu-susfs_defconfig dari dlagia/Build-Kernel_scripts (pinned commit)..."
          curl -fsSL "https://raw.githubusercontent.com/dlagia/Build-Kernel_scripts/${SCRIPTS_PIN}/defconfig/ksu-susfs_defconfig" >> "$DEF"

          {
            echo ""
            echo 'CONFIG_LOCALVERSION="-perf"'
            echo "CONFIG_LOCALVERSION_AUTO=n"
            echo ""
          } >> "$DEF"

          # NoMount selalu ikut (revisi ke-11), jadi config-nya tidak kondisional.
          {
            echo ""
            echo "CONFIG_NOMOUNT=y"
          } >> "$DEF"
          echo "[defconfig] CONFIG_NOMOUNT=y ditambahkan"

          # ----- BBR + fq (revisi ke-12, 2026-09-11) -----
          # Tidak ada patch source sama sekali di sini: tcp_bbr.c dan sch_fq.c
          # SUDAH ada di pohon rosemary-13 (BBRv1 mainline sejak 4.9), cuma tidak
          # pernah dihidupkan karena rosemary_defconfig tidak menyetel satu pun
          # opsi TCP_CONG/NET_SCH.
          #   CONFIG_TCP_CONG_ADVANCED=y  membuka blok `if TCP_CONG_ADVANCED`
          #                               (net/ipv4/Kconfig 488-744); tanpa ini
          #                               TCP_CONG_BBR tidak pernah terlihat.
          #   CONFIG_TCP_CONG_CUBIC=y     jalan pulang: saat ADVANCED=y, definisi
          #                               wajib cubic (`depends on !TCP_CONG_ADVANCED`)
          #                               tidak berlaku lagi, jadi dipasang eksplisit
          #                               supaya bisa balik lewat sysctl tanpa rebuild.
          #   CONFIG_DEFAULT_BBR=y        -> DEFAULT_TCP_CONG jadi "bbr".
          #   CONFIG_NET_SCHED=y          menghidupkan subsistem qdisc (menuconfig,
          #                               default n) - syarat NET_SCH_FQ.
          #   CONFIG_NET_SCH_FQ=y         pacing untuk BBR. Tanpa fq, BBR cuma
          #                               mengandalkan internal pacing dan manfaatnya
          #                               berkurang.
          #   CONFIG_NET_SCH_DEFAULT=y    GERBANG yang terlewat di rev 12 dan
          #                               bikin build 2026-09-11 gagal: choice
          #                               "Default queuing discipline" dan
          #                               `config DEFAULT_NET_SCH` dibungkus
          #                               `if NET_SCH_DEFAULT`, dan simbol itu
          #                               default n. Tanpa baris ini DEFAULT_FQ
          #                               dibuang diam-diam dan DEFAULT_NET_SCH
          #                               tidak muncul sama sekali di .config.
          #                               HARUS sebelum CONFIG_DEFAULT_FQ=y.
          #   CONFIG_DEFAULT_FQ=y         fq jadi qdisc default dari kernel, jadi
          #                               tidak perlu net.core.default_qdisc=fq
          #                               lewat init.d/Magisk.
          {
            echo ""
            echo "CONFIG_TCP_CONG_ADVANCED=y"
            echo "CONFIG_TCP_CONG_CUBIC=y"
            echo "CONFIG_TCP_CONG_BBR=y"
            echo "CONFIG_DEFAULT_BBR=y"
            echo "CONFIG_NET_SCHED=y"
            echo "CONFIG_NET_SCH_FQ=y"
            echo "CONFIG_NET_SCH_DEFAULT=y"
            echo "CONFIG_DEFAULT_FQ=y"
          } >> "$DEF"
          echo "[defconfig] BBR + fq ditambahkan (ADVANCED/CUBIC/BBR/DEFAULT_BBR/NET_SCHED/NET_SCH_FQ/NET_SCH_DEFAULT/DEFAULT_FQ)"

          # Re:Kernel & Baseband-guard sudah dicabut. Kalau CONFIG-nya nyelip dari
          # rosemary_defconfig atau dari fragment ksu-susfs_defconfig, buang di
          # sini: CONFIG yang menunjuk driver tak terintegrasi bikin objeknya tidak
          # pernah ada, dan kegagalannya baru terasa jauh di belakang.
          RESIDU_RE='^(CONFIG_REKERNEL|CONFIG_BBG|CONFIG_BASEBAND_GUARD)\b|^# CONFIG_(REKERNEL|BBG|BASEBAND_GUARD) '
          if grep -qE "$RESIDU_RE" "$DEF"; then
            echo "[defconfig] membuang sisa CONFIG Re:Kernel/Baseband-guard:"
            grep -nE "$RESIDU_RE" "$DEF"
            sed -i -E "/$RESIDU_RE/d" "$DEF"
          else
            echo "[defconfig] OK: tidak ada CONFIG Re:Kernel/Baseband-guard"
          fi
          echo "" >> "$DEF"
          tail -30 "$DEF"

      - name: Cache toolchain proton-clang
        id: tc-cache
        uses: actions/cache@v6
        with:
          path: clang-proton
          # Revisi ke-23: key memuat SHA pin (lihat CLANG_PIN di step bawah), jadi
          # menaikkan pin otomatis jadi cache miss. Sebelumnya 'proton-clang-master-v1'
          # dan sinkronisasinya diserahkan ke ingatan manusia.
          key: proton-clang-9fb011b1

      - name: Ambil toolchain proton-clang (dipakai penulis kernel ini di b.sh)
        run: |
          # Cache dipakai kalau utuh; kalau tidak, clone ulang. Jangan pernah
          # lanjut dgn toolchain setengah jadi - error-nya akan menyesatkan.
          if [ -x clang-proton/bin/clang ]; then
            echo "Toolchain dari cache."
          else
            echo "Cache kosong/rusak, clone ulang."
            rm -rf clang-proton
            git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang-proton
          fi
          clang-proton/bin/clang --version | head -2

          # Pin toolchain (revisi ke-12). master kdrag0n/proton-clang tidak berubah
          # sejak 2021, tapi clone-nya `--depth=1 master` - kalau pemiliknya push,
          # compiler ikut berubah diam-diam di run berikutnya.
          # CLANG_PIN dari pins.env (revisi ke-26).
          if [ -d clang-proton/.git ]; then
            CLANG_SHA="$(git -C clang-proton rev-parse HEAD)"
            echo "proton-clang commit: $CLANG_SHA"
            # SELF-HEAL (revisi ke-23): pola yang sama dengan step 04. Clone di
            # atas `--depth=1` tanpa -b, jadi yang terbawa cuma HEAD branch
            # default. Begitu kdrag0n mendorong satu commit (atau me-rebase),
            # commit yang di-pin tidak ada di clone dan assert di bawah mati -
            # padahal isinya masih dilayani GitHub lewat fetch-by-sha. --depth=1
            # aman di sini: tidak ada rev-list --count yang bergantung riwayat.
            if [ "$CLANG_SHA" != "$CLANG_PIN" ]; then
              echo "HEAD bukan pin, menarik commit ter-pin langsung: $CLANG_PIN"
              git -C clang-proton fetch --depth=1 origin "$CLANG_PIN" \
                && git -C clang-proton checkout -q FETCH_HEAD || true
              CLANG_SHA="$(git -C clang-proton rev-parse HEAD)"
              echo "proton-clang commit setelah self-heal: $CLANG_SHA"
            fi
            test "$CLANG_SHA" = "$CLANG_PIN" || {
              echo "ERROR: proton-clang bukan commit yang di-pin, self-heal juga gagal."
              echo "  diharapkan: $CLANG_PIN"
              echo "  aktual    : $CLANG_SHA"
              echo "Berarti commit itu benar-benar tidak dilayani lagi oleh remote."
              echo "Kalau update ini disengaja: cukup ganti CLANG_PIN - key cache"
              echo "sudah memuat SHA pin sejak revisi ke-23, jadi ikut berganti sendiri."
              exit 1
            }
            echo "OK: proton-clang ter-pin di $CLANG_PIN"
          else
            echo "CATATAN: clang-proton dipulihkan dari cache tanpa .git - SHA tidak bisa diverifikasi."
          fi

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: ccache-rosemary-${{ github.run_id }}
          restore-keys: |
            ccache-rosemary-

      - name: Compile kernel
        working-directory: kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang-proton/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER=build
          export KBUILD_BUILD_HOST=kernel
          export KBUILD_BUILD_TIMESTAMP="$(date -u)"

          # ccache mempercepat run berikutnya secara signifikan. Kalau binernya
          # tidak ada, jatuh balik ke clang polos supaya build tetap jalan.
          if command -v ccache >/dev/null 2>&1; then
            export CCACHE_DIR="$HOME/.ccache"
            export CCACHE_MAXSIZE=2G
            export CCACHE_COMPILERCHECK=content
            export CCACHE_NOHASHDIR=true
            ccache -M "$CCACHE_MAXSIZE" >/dev/null
            ccache -z >/dev/null
            CC_CMD="ccache clang"
            echo "ccache aktif."
          else
            CC_CMD="clang"
            echo "ccache tidak tersedia, pakai clang polos."
          fi

          make O=out rosemary_defconfig

          echo ""
          echo "==================== RESOLVED ReSukiSU & SuSFS CONFIG ===================="
          grep -E '^(CONFIG_KSU|CONFIG_KALLSYMS)' out/.config || true

          grep -q '^CONFIG_KSU=y$' out/.config || { echo "ERROR: CONFIG_KSU tidak resolve ke y"; exit 1; }
          grep -q '^CONFIG_KALLSYMS=y$' out/.config || { echo "ERROR: CONFIG_KALLSYMS tidak resolve ke y"; exit 1; }
          grep -q '^CONFIG_KALLSYMS_ALL=y$' out/.config || { echo "ERROR: CONFIG_KALLSYMS_ALL tidak resolve ke y"; exit 1; }

          if grep -q '^CONFIG_KSU_TRACEPOINT_HOOK=y$' out/.config; then
            echo "ERROR: CONFIG_KSU_TRACEPOINT_HOOK=y aktif; kernel non-GKI 4.14 tidak mendukung tracepoint hook"
            exit 1
          fi

          grep -q '^CONFIG_KSU_SUSFS=y$' out/.config || {
            echo "ERROR: CONFIG_KSU_SUSFS tidak resolve ke y - integrasi SUSFS (patch dasar + inline hook) tidak akan berfungsi"
            exit 1
          }
          echo ""
          echo "== Fitur SuSFS yang aktif =="
          grep -E '^CONFIG_KSU_SUSFS_' out/.config || true

          for opt in CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK; do
            if grep -q "^${opt}=y\$" out/.config; then
              echo "ERROR: ${opt}=y aktif berbarengan dengan SuSFS Inline Hook - akan menghasilkan hook ganda (LSM auto-hook + patch manual). Set ke n di defconfig."
              exit 1
            fi
          done

          echo ""
          echo "==================== RESOLVED NoMount CONFIG ===================="
          grep -E '^CONFIG_NOMOUNT' out/.config || true
          grep -q '^CONFIG_NOMOUNT=y$' out/.config || { echo "ERROR: CONFIG_NOMOUNT tidak resolve ke y"; exit 1; }

          echo ""
          echo "==================== RESOLVED BBR + fq CONFIG ===================="
          # Kconfig bisa diam-diam menjatuhkan opsi kalau dependency-nya tidak
          # terpenuhi (mis. NET_SCH_FQ tanpa NET_SCHED). Karena itu hasil RESOLVE
          # yang diperiksa, bukan isi defconfig.
          grep -E '^(CONFIG_TCP_CONG_ADVANCED|CONFIG_TCP_CONG_BBR|CONFIG_TCP_CONG_CUBIC|CONFIG_DEFAULT_BBR|CONFIG_NET_SCHED|CONFIG_NET_SCH_FQ|CONFIG_NET_SCH_DEFAULT|CONFIG_DEFAULT_FQ|CONFIG_DEFAULT_TCP_CONG|CONFIG_DEFAULT_NET_SCH)=' out/.config || true
          for opt in CONFIG_TCP_CONG_ADVANCED CONFIG_TCP_CONG_BBR CONFIG_NET_SCHED CONFIG_NET_SCH_FQ CONFIG_NET_SCH_DEFAULT; do
            grep -q "^${opt}=y$" out/.config || {
              echo "ERROR: ${opt} tidak resolve ke y - BBR/fq tidak akan ikut terbangun."
              exit 1
            }
          done
          grep -q '^CONFIG_DEFAULT_TCP_CONG="bbr"$' out/.config || {
            echo "ERROR: congestion control default bukan bbr:"
            grep -n '^CONFIG_DEFAULT_TCP_CONG=' out/.config || true
            exit 1
          }
          grep -q '^CONFIG_DEFAULT_NET_SCH="fq"$' out/.config || {
            echo "ERROR: qdisc default bukan fq (BBR tanpa fq kehilangan pacing):"
            grep -n '^CONFIG_DEFAULT_NET_SCH=' out/.config || true
            echo "PETUNJUK: kalau grep di atas kosong, DEFAULT_NET_SCH tidak"
            echo "          didefinisikan - artinya CONFIG_NET_SCH_DEFAULT=n,"
            echo "          karena choice qdisc dibungkus \`if NET_SCH_DEFAULT\`."
            grep -n 'NET_SCH_DEFAULT' out/.config || true
            exit 1
          }
          echo "OK: BBR jadi congestion control default, fq jadi qdisc default."

          # Lapis kedua penjamin "tidak ada residu" (revisi ke-11): apa pun yang
          # lolos dari step pembersihan, ketahuan di sini setelah Kconfig
          # me-resolve seluruh dependency - sebelum satu objek pun di-compile.
          echo ""
          echo "==================== Assert add-on yang dicabut ===================="
          if grep -qE '^CONFIG_(REKERNEL|BBG|BASEBAND_GUARD)=' out/.config; then
            echo "ERROR: config add-on yang sudah dicabut masih aktif di .config:"
            grep -nE '^CONFIG_(REKERNEL|BBG|BASEBAND_GUARD)=' out/.config
            exit 1
          fi
          echo "OK: CONFIG_REKERNEL / CONFIG_BBG / CONFIG_BASEBAND_GUARD tidak ada di .config"

          set -o pipefail
          if ! make -k O=out -j"$(nproc)" \
                ARCH=arm64 \
                CC="$CC_CMD" \
                AR=llvm-ar \
                NM=llvm-nm \
                OBJCOPY=llvm-objcopy \
                OBJDUMP=llvm-objdump \
                STRIP=llvm-strip \
                CROSS_COMPILE=aarch64-linux-gnu- \
                CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                CONFIG_SECTION_MISMATCH_WARN_ONLY=y \
                KCFLAGS="-Wno-error" 2>&1 | tee /tmp/build.log; then
            echo ""
            echo "==================== BARIS ERROR (kirim ini) ===================="
            grep -niE "error:|fatal error|undefined reference|No such file|multiple definition|recipe for target|Error [0-9]" /tmp/build.log | tail -120 || true
            echo "==================== KONTEKS TIAP KEGAGALAN ===================="
            for L in $(grep -n 'Error 1' /tmp/build.log | head -3 | cut -d: -f1); do
              S=$((L-40)); [ $S -lt 1 ] && S=1
              echo "----- konteks baris $S s/d $L -----"
              sed -n "${S},${L}p" /tmp/build.log
            done
            tail -50 /tmp/build.log
            echo ">>> BUILD GAGAL."
            exit 1
          fi
          ls -la out/arch/arm64/boot/
          command -v ccache >/dev/null 2>&1 && ccache -s | head -8 || true

      - name: Compile nm (NoMount userspace CLI, commit sama dgn kernel)
        run: |
          NM_SRC="kernel/NoMount/userspace/src"
          test -d "$NM_SRC" || { echo "ERROR: $NM_SRC tidak ada - step Integrasikan NoMount gagal?"; exit 1; }

          NOMOUNT_COMMIT=$(git -C kernel/NoMount rev-parse --short HEAD)
          echo "NoMount commit dipakai: $NOMOUNT_COMMIT"

          mkdir -p nm-src
          cp "$NM_SRC/nm.c" "$NM_SRC/nm.h" nm-src/
          ( cd nm-src && \
            aarch64-linux-gnu-gcc -nostdlib -static -Os -fno-builtin -Wl,-e,_start -o nm nm.c && \
            aarch64-linux-gnu-strip nm )
          file nm-src/nm
          test -s nm-src/nm || { echo "ERROR: nm gagal dikompilasi"; exit 1; }

      - name: Tentukan file kernel hasil
        id: kimg
        run: |
          FOUND=""
          for f in Image.gz-dtb Image.gz Image; do
            p="kernel/out/arch/arm64/boot/$f"
            if [ -f "$p" ]; then
              echo "path=$p" >> "$GITHUB_OUTPUT"
              echo "name=$f" >> "$GITHUB_OUTPUT"
              FOUND=1
              break
            fi
          done
          [ -n "$FOUND" ] || { echo "Kernel image tidak ditemukan"; exit 1; }
          DTBO="kernel/out/arch/arm64/boot/dtbo.img"
          if [ -f "$DTBO" ]; then
            echo "dtbo=$DTBO" >> "$GITHUB_OUTPUT"
            echo "dtbo.img ditemukan: $DTBO"
          fi

      - name: Rakit paket AnyKernel3 (template asli fjrXTR -> vlxlxlv)
        run: |
          # PENTING: branch default repo ini adalah 'ruby', bukan 'master'. Tanpa -b
          # isi paket ikut berubah diam-diam kalau pemilik repo ganti default.
          # mt6781 = SoC rosemary. tools/ak3-core.sh identik di kedua branch.
          # Revisi ke-18: URL dipindah dari fjrXTR/ ke vlxlxlv/ (nama pemilik yang
          # SEKARANG). fjrXTR hanya HTTP 301 alias yang sudah ditinggalkan dan bisa
          # didaftarkan ulang orang lain; jangan menggantungkan clone pada redirect
          # milik nama kosong. SHA-nya sama (a9fe54fa, sudah diverifikasi di
          # vlxlxlv/AnyKernel3@mt6781), assert di bawah tidak berubah.
          git clone --depth=1 -b mt6781 https://github.com/vlxlxlv/AnyKernel3.git AnyKernel3
          echo "AnyKernel3 commit: $(git -C AnyKernel3 rev-parse HEAD)"
          # Pin AnyKernel3 (revisi ke-12, URL diperbaiki di revisi ke-18).
          # Isinya tetap diverifikasi lewat SHA, bukan lewat nama repo.
          # AK3_PIN dari pins.env (revisi ke-26).
          AK3_SHA="$(git -C AnyKernel3 rev-parse HEAD)"
          # SELF-HEAL (revisi ke-23), alasan sama dengan proton-clang & step 04:
          # `clone --depth=1 -b mt6781` cuma membawa HEAD branch, jadi satu commit
          # baru dari vlxlxlv sudah cukup membuat pin tak terjangkau di clone.
          if [ "$AK3_SHA" != "$AK3_PIN" ]; then
            echo "HEAD bukan pin, menarik commit ter-pin langsung: $AK3_PIN"
            git -C AnyKernel3 fetch --depth=1 origin "$AK3_PIN" \
              && git -C AnyKernel3 checkout -q FETCH_HEAD || true
            AK3_SHA="$(git -C AnyKernel3 rev-parse HEAD)"
            echo "AnyKernel3 commit setelah self-heal: $AK3_SHA"
          fi
          test "$AK3_SHA" = "$AK3_PIN" || {
            echo "ERROR: AnyKernel3 mt6781 bukan commit yang di-pin, self-heal juga gagal."
            echo "  diharapkan: $AK3_PIN"
            echo "  aktual    : $AK3_SHA"
            echo "Periksa dulu isi repo sebelum menaikkan pin - anykernel.sh di bawah"
            echo "menimpa template-nya, tapi tools/ak3-core.sh datang dari repo ini."
            exit 1
          }
          echo "OK: AnyKernel3 ter-pin di $AK3_PIN"
          test -f AnyKernel3/tools/ak3-core.sh || { echo "ERROR: tools/ak3-core.sh tidak ada di AnyKernel3"; exit 1; }
          rm -rf AnyKernel3/.git

          echo "" | base64 -d > AnyKernel3/anykernel.sh

          cp "${{ steps.kimg.outputs.path }}" "AnyKernel3/${{ steps.kimg.outputs.name }}"

          ZIP="rosemary-ksu-susfs-nomount-$(date +%Y%m%d-%H%M%S).zip"

          ( cd AnyKernel3 && zip -r9 "../$ZIP" . -x '.git*' )
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          unzip -l "$ZIP" | head -20

      - name: Ringkasan build
        if: always()
        run: |
          {
            echo "## Build kernel Rosemary"
            echo ""
            echo "### Add-on"
            echo "| Add-on | Status |"
            echo "|---|---|"
            echo "| NoMount        | aktif (selalu ikut) |"
            echo "| BBR + fq       | aktif (congestion control default \`bbr\`, qdisc default \`fq\`) |"
            echo "| Re:Kernel      | dicabut permanen (revisi ke-11) |"
            echo "| Baseband-guard | dicabut permanen (revisi ke-11) |"
            echo ""
            echo "| Komponen | Commit |"
            echo "|---|---|"
            echo "| Kernel (rosemary-13) | \`${KERNEL_SHA:-?}\` |"
            echo "| ReSukiSU (di-PIN) | \`${KSU_SHA:-?}\` |"
            echo "| NoMount (di-PIN, ART) | \`${NOMOUNT_SHA:-?}\` |"
            echo ""
            echo "Paket: \`${ZIP:-belum terbentuk}\`"
            echo ""
            echo "### Kalau masih STUCK DI LOGO"
            echo "1. Ambil log crash sebenarnya dari HP (ini yang paling menentukan):"
            echo "   masuk fastboot -> \`fastboot oem console\` **atau** setelah reboot"
            echo "   paksa, boot ke sistem lama/TWRP lalu baca pstore:"
            echo '   ```'
            echo "   adb shell su -c 'cat /sys/fs/pstore/console-ramoops-0' > crash.txt"
            echo "   # (atau /proc/last_kmsg pada sebagian device)"
            echo '   ```'
            echo "   Kirim crash.txt - di situ kelihatan panic/hook yang menabrak."
            echo "2. Tersisa satu add-on: NoMount, dan jalur kodenya (d_revalidate +"
            echo "   iterate_dir) aktif sejak filesystem pertama diakses - jadi itu"
            echo "   tersangka pertama. Untuk mengujinya, hapus sementara step"
            echo "   **Integrasikan NoMount**, baris \`CONFIG_NOMOUNT=y\` di step"
            echo "   defconfig, blok verifikasinya di step compile, dan step"
            echo "   **Compile nm**; lalu build ulang sebagai KSU+SuSFS murni."
            echo "   - Boot? berarti NoMount penyebabnya."
            echo "   - Masih stuck? akarnya di inti KernelSU+SUSFS."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload paket + kernel mentah + dtbo + nm CLI
        uses: actions/upload-artifact@v7
        with:
          name: rosemary-kernel-build
          if-no-files-found: warn
          path: |
            ${{ env.ZIP }}
            ${{ steps.kimg.outputs.path }}
            ${{ steps.kimg.outputs.dtbo }}
            nm-src/nm
            kernel/out/.config

      # actions/upload-artifact SELALU membungkus ulang isinya, jadi yang terunduh
      # di HP adalah zip-berisi-zip: harus dibongkar dulu baru bisa di-flash, dan
      # hangus begitu masa retensi habis. Release menyimpan zip AnyKernel3-nya apa
      # adanya - sekali unduh langsung flashable, tautannya permanen, dan muncul di
      # halaman depan repo alih-alih terkubur di dalam satu run Actions.
      # Hanya jalan untuk build yang sukses; `if: failure()` di step berikutnya
      # yang mengurus jalur gagal.
      - name: Terbitkan Release berisi zip siap-flash
        env:
          GH_TOKEN: ${{ github.token }}
          # WAJIB. Job ini tidak pernah `actions/checkout` - semua sumber
          # di-clone ke subfolder - jadi workspace-nya bukan repo git sama
          # sekali. Tanpa GH_REPO, `gh release create` mencoba menebak repo dari
          # remote git dan mati dengan "fatal: not a git repository" (persis yang
          # terjadi di run 34770523128; build-nya sendiri sukses, hanya step ini
          # yang gagal).
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          test -f "$ZIP" || { echo "ERROR: zip tidak ada: $ZIP"; exit 1; }

          TAG="build-$(date -u +%Y%m%d-%H%M%S)"
          {
            printf 'Build otomatis dari commit `%s`.\n\n' "${GITHUB_SHA:0:9}"
            printf -- '| bagian | commit |\n|---|---|\n'
            printf -- '| kernel | `%s` |\n' "$KERNEL_SHA"
            printf -- '| ReSukiSU | `%s` |\n' "$KSU_SHA"
            printf -- '| NoMount | `%s` |\n' "$NOMOUNT_SHA"
            printf -- '\n- run: %s/%s/actions/runs/%s\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf -- '- `%s` sudah berformat AnyKernel3: flash langsung lewat\n' "$ZIP"
            printf -- '  recovery/KernelSU, tidak perlu dibongkar dulu.\n'
          } > /tmp/notes.md

          # --target: tanpa repo git lokal, gh akan menempelkan tag ke HEAD
          # branch default. Kunci ke commit yang benar-benar dibangun.
          gh release create "$TAG" "$ZIP" \
            --title "$TAG" --notes-file /tmp/notes.md --target "$GITHUB_SHA"
          URL="$(gh release view "$TAG" --json url --jq .url)"
          {
            echo ""
            echo "### Unduh"
            echo "[$ZIP]($URL) - zip AnyKernel3 siap flash (bukan artifact dobel-zip)."
          } >> "$GITHUB_STEP_SUMMARY"

      # Kalau build gagal, step "Compile" hanya mencetak ~120 baris error +
      # 3 potongan konteks ke log Actions. /tmp/build.log yang lengkap ikut
      # hilang bersama runner. Step ini menyimpannya supaya bisa diunduh dan
      # ditelusuri penuh. `if: failure()` -> hanya jalan saat ada step gagal,
      # jadi tidak menambah artifact di build yang sukses.
      - name: Upload log build lengkap (hanya saat gagal)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rosemary-build-log
          if-no-files-found: warn
          retention-days: 7
          path: |
            /tmp/build.log
            kernel/out/.config
            kernel/patch_rejects/
