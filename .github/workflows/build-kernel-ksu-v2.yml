# 1. BBR DIAKTIFKAN TANPA PATCH SAMA SEKALI.
#    Pohon rosemary-13 SUDAH membawa net/ipv4/tcp_bbr.c dan net/sched/sch_fq.c
#    (BBRv1 masuk mainline sejak 4.9), tapi rosemary_defconfig (537 baris) tidak
#    menyetel SATU PUN opsi TCP_CONG/NET_SCH. Akibatnya selama ini:
#      - TCP_CONG_ADVANCED=n, sehingga seluruh blok `if TCP_CONG_ADVANCED`
#        (net/ipv4/Kconfig baris 488-744) tidak tersedia -> BBR tidak dibangun;
#      - DEFAULT_TCP_CONG jatuh ke "cubic" lewat definisi wajib
#        `config TCP_CONG_CUBIC / depends on !TCP_CONG_ADVANCED / default y`;
#      - NET_SCHED=n -> sch_fq.o tidak dibangun, qdisc tetap pfifo_fast.
#    Delapan baris defconfig di step "Aktifkan KSU & SuSFS di defconfig"
#    menyelesaikan semuanya. CONFIG_DEFAULT_FQ=y dipakai supaya `fq` jadi qdisc
#    default dari kernel (net/sched/Kconfig punya choice "Default queuing
#    discipline"), jadi TIDAK perlu `net.core.default_qdisc=fq` lewat init.d.
