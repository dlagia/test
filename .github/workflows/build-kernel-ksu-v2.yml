# ============================================================
# FASE 3 — Kernel rosemary (dlagia/sphinX) + ReSukiSU + NoMount + SUSFS v2.2.0 + AK3
#
# Lanjutan dari Fase 2 (build-kernel-ksu-v3.yml) yang SUDAH TERBUKTI BOOT.
# Menambahkan SUSFS v2.2.0 (backport non-GKI 4.14 dari JackA1ltman) di atas
# basis yang sama.
#
# Yang sudah diverifikasi manual, satu-satu, terhadap source asli:
#  - Patch utama susfs (18 file): 13 apply otomatis, 5 direkonsiliasi
#    manual krn bentrok dgn hook NoMount/ReSukiSU atau beda struktur MTK
#    (fs/readdir.c, fs/statfs.c, fs/proc/task_mmu.c, kernel/sys.c, mm/memory.c)
#  - fs/proc/task_mmu.c: show_map_vma & show_smap diadaptasi manual krn
#    kernel kita TIDAK punya parameter is_pid (fitur smaps_rollup lbh baru,
#    tidak ada di kernel MTK 4.14 ini)
#  - Script susfs_inline_hook_patches.sh dijalankan sungguhan (bukan simulasi)
#    thd source asli - otomatis skip file yg sudah ada hook ReSukiSU
#    (fs/exec.c, fs/open.c, fs/stat.c, kernel/reboot.c), berhasil patch
#    fs/read_write.c, drivers/input/input.c, security/selinux/hooks.c,
#    include/linux/seccomp.h. kernel/sys.c (setresuid) ditambal manual
#    krn perlu drivers/kernelsu/ nyata (dari setup.sh) utk terdeteksi benar.
#  - KONFIRMASI: ReSukiSU sudah punya CONFIG_KSU_SUSFS + semua sub-flag
#    bawaan di Kconfig driver-nya -> TIDAK perlu patch enable-KSU terpisah.
#
# WAJIB: test lewat OrangeFox (backup Boot dulu!). Ini integrasi paling
# kompleks sejauh ini - basis kernelnya sama dgn yg terbukti boot, tapi
# volume perubahan jauh lebih besar dari NoMount.
# ============================================================

name: Build rosemary kernel v4 (sphinX + ReSukiSU + NoMount + SUSFS + AK3)

on:
  workflow_dispatch: {}
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Pasang dependency build
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl flex git kmod \
            libelf-dev libssl-dev zip zlib1g-dev \
            libtinfo5 libncurses5 gcc-aarch64-linux-gnu

      - name: Clone source kernel (dlagia/android_kernel_xiaomi_rosemary @ rosemary-13)
        run: |
          git clone --depth=1 -b rosemary-13 \
            https://github.com/dlagia/android_kernel_xiaomi_rosemary.git kernel

      - name: Integrasikan ReSukiSU (setup.sh terbaru)
        working-directory: kernel
        run: |
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
          ls -d KernelSU* drivers/kernelsu 2>/dev/null || true

      - name: Terapkan manual-hook patch (tertanam, terverifikasi cocok source ini)
        working-directory: kernel
        run: |
          echo "" | base64 -d > /tmp/resukisu-hooks.patch
          git apply --verbose /tmp/resukisu-hooks.patch
          grep -c CONFIG_KSU_MANUAL_HOOK fs/stat.c fs/exec.c fs/open.c kernel/reboot.c

      - name: Integrasikan NoMount (kernel-side, tertanam & terverifikasi)
        working-directory: kernel
        run: |
          echo "" | base64 -d > fs/nomount.c
          echo "" | base64 -d > fs/nomount.h
          echo "" | base64 -d > /tmp/nomount-hooks.patch
          git apply --verbose /tmp/nomount-hooks.patch
          grep -c CONFIG_NOMOUNT fs/Kconfig fs/Makefile fs/namei.c fs/dcache.c fs/readdir.c fs/stat.c fs/proc/task_mmu.c fs/statfs.c

      - name: Integrasikan SUSFS v2.2.0 (patch utama + tambalan manual + inline hooks)
        working-directory: kernel
        run: |
          # 1) patch utama susfs (13 file auto + 5 sudah direkonsiliasi manual dlm patch ini)
          echo "" | base64 -d > /tmp/susfs_4.14.patch
          git apply --verbose /tmp/susfs_4.14.patch

          # 2) tambalan manual: fs/proc/task_mmu.c, kernel/sys.c, mm/memory.c
          #    (show_map_vma/show_smap diadaptasi tanpa is_pid; uname spoof;
          #     sus_map di __access_remote_vm - semua diverifikasi match source asli)
          echo "" | base64 -d > /tmp/susfs-manual-fixes.patch
          git apply --verbose /tmp/susfs-manual-fixes.patch

          # 3) script resmi inline-hook (fs/read_write.c, drivers/input/input.c,
          #    security/selinux/hooks.c, include/linux/seccomp.h) - otomatis skip
          #    file yg sudah ada hook ReSukiSU (exec.c/open.c/stat.c/reboot.c/sys.c)
          echo "" | base64 -d > susfs_inline_hook_patches.sh
          chmod +x susfs_inline_hook_patches.sh
          bash susfs_inline_hook_patches.sh
          rm -f susfs_inline_hook_patches.sh

          # FIX BUG SCRIPT: fs/read_write.c pakai guard CONFIG_KSU utk
          # ksu_is_init_rc_hook_enabled, padahal variabel itu cuma didefinisikan
          # kalau CONFIG_KSU_SUSFS aktif -> undefined reference kalau SUSFS mati.
          echo "" | base64 -d > /tmp/fix_readwrite_guard.py
          python3 /tmp/fix_readwrite_guard.py

          # FIX BUG SCRIPT #2: fs/exec.c dilewati sepenuhnya oleh script inline-hook
          # (karena sudah ada ksu_handle dari ReSukiSU), padahal potongan sucompat-nya
          # (ksu_su_compat_enabled, ksu_handle_execveat_sucompat) tidak pernah masuk.
          # Ini diduga penyebab "gagal memberikan akses root" - digabung manual,
          # dgn nama fungsi yg dikoreksi (susfs_is_current_proc_umounted_app, bukan
          # _umounted saja spt di script asli - typo/versi beda di script).
          echo "" | base64 -d > /tmp/fix_exec_sucompat.py
          python3 /tmp/fix_exec_sucompat.py

          # FIX BUG SCRIPT #3: drivers/input/input.c punya bug guard SAMA PERSIS
          # dgn fs/read_write.c (extern pakai CONFIG_KSU, definisi cuma ada di
          # CONFIG_KSU_SUSFS). Tidak mempengaruhi build SUSFS-aktif ini, tapi
          # diperbaiki demi konsistensi & mencegah masalah kalau susfs dimatikan lagi.
          echo "" | base64 -d > /tmp/fix_input_guard.py
          python3 /tmp/fix_input_guard.py

          echo "== cek jejak susfs masuk =="
          ls fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h
          grep -c KSU_SUSFS fs/proc/task_mmu.c kernel/sys.c mm/memory.c

      - name: Pra-compile - perbaikan build source MTK (verified reusable)
        working-directory: kernel
        run: |
          # 1) buang -Werror standalone dari Makefile/Kbuild (per-folder MTK), jaga -Werror=/-Werror- yg sah
          grep -rlZ --include=Makefile --include=Kbuild --include='*.mk' -e '-Werror' . 2>/dev/null \
            | xargs -0 -r sed -i -E -e 's/-Werror=[A-Za-z0-9_-]+//g' -e 's/(-Werror)([[:space:]]|$)/\2/g' || true
          # 2) buang atribut no_sanitize("...") yg tak dikenal GCC 4.9 (harmless)
          grep -rlZ 'no_sanitize(' . 2>/dev/null \
            | xargs -0 -r sed -i -E 's/__attribute__\(\(no_sanitize\("[^"]*"\)\)\)//g' || true
          # 3) buang 'inline' dari fungsi ber-EXPORT yg body-nya out-of-line
          sed -i 's/inline void ksm_flock(/void ksm_flock(/' include/linux/keyslot-manager.h block/keyslot-manager.c || true
          sed -i 's/^inline void blk_crypto_flock(/void blk_crypto_flock(/' include/linux/blk-crypto.h block/blk-crypto.c || true
          sed -i 's/inline int typec_pd_start_entry(/int typec_pd_start_entry(/' drivers/misc/mediatek/typec/tcpc/inc/tcpci_typec.h drivers/misc/mediatek/typec/tcpc/tcpci_typec.c || true
          # 4) touch Focaltech: stub firmware yg hilang di SEMUA folder driver focaltech
          find drivers/input/touchscreen -name focaltech_config.h -printf '%h\n' 2>/dev/null | while read d; do
            mkdir -p "$d/include/firmware"
            printf '0x00\n' > "$d/include/firmware/fw_sample.i"
            echo "stub firmware -> $d/include/firmware/fw_sample.i"
          done
          # 5) bq2597x: izinkan FP di file ini saja kalau ada (sudah dibungkus kernel_neon_begin/end)
          grep -rl 'bq2597x_charger.o' --include=Makefile . 2>/dev/null | while read mk; do
            echo 'CFLAGS_REMOVE_bq2597x_charger.o += -mgeneral-regs-only' >> "$mk"
            echo "CFLAGS_REMOVE ditambah ke: $mk"
          done
          echo '== cek sisa =='
          echo -n 'no_sanitize( tersisa: '; grep -rl 'no_sanitize(' --include='*.h' --include='*.c' . 2>/dev/null | wc -l

      - name: Aktifkan KSU di defconfig
        working-directory: kernel
        run: |
          DEF=arch/arm64/configs/rosemary_defconfig
          {
            echo ""
            echo "# ReSukiSU"
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_MANUAL_HOOK=y"
            echo "CONFIG_KALLSYMS_ALL=y"
            echo ""
            echo "# NoMount"
            echo "CONFIG_NOMOUNT=y"
            echo ""
            echo "# SUSFS v2.2.0 - AKTIF PENUH, cocok persis resep resmi JackA1ltman/NonGKI_Kernel_Build_2nd"
            echo "CONFIG_KSU_SUSFS=y"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y"
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
            echo "CONFIG_KSU_SUSFS_SUS_MAP=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
            echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y"
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y"
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y"
          } >> "$DEF"
          tail -8 "$DEF"

      - name: Ambil toolchain proton-clang (dipakai penulis kernel ini di b.sh)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang-proton

      - name: Compile kernel
        working-directory: kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang-proton/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER=github
          export KBUILD_BUILD_HOST=actions
          make O=out rosemary_defconfig

          echo "===== VERIFY SUSFS CONFIG ====="
          if [ -f out/.config ]; then
            required_configs=(
              CONFIG_KSU_SUSFS
              CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT
              CONFIG_KSU_SUSFS_OPEN_REDIRECT
              CONFIG_KSU_SUSFS_SPOOF_UNAME
              CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
              CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
            )
            for cfg in "${required_configs[@]}"; do
              grep -q "^${cfg}=y$" out/.config || { echo "::error::$cfg missing"; exit 1; }
            done
          fi

          set -o pipefail
          if ! make -k O=out -j"$(nproc)" \
                ARCH=arm64 \
                CC=clang \
                AR=llvm-ar \
                NM=llvm-nm \
                OBJCOPY=llvm-objcopy \
                OBJDUMP=llvm-objdump \
                STRIP=llvm-strip \
                CROSS_COMPILE=aarch64-linux-gnu- \
                CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                CONFIG_SECTION_MISMATCH_WARN_ONLY=y \
                KCFLAGS="-Wno-error" 2>&1 | tee /tmp/build.log; then
            echo ""
            echo "==================== BARIS ERROR (kirim ini) ===================="
            grep -niE "error:|fatal error|undefined reference|No such file|multiple definition|recipe for target|Error [0-9]" /tmp/build.log | tail -120 || true
            echo "==================== KONTEKS TIAP KEGAGALAN (kirim ini juga) ===================="
            for L in $(grep -n 'Error 1' /tmp/build.log | head -3 | cut -d: -f1); do
              S=$((L-40)); [ $S -lt 1 ] && S=1
              echo "----- konteks baris $S s/d $L -----"
              sed -n "${S},${L}p" /tmp/build.log
            done
            echo "==================== 50 BARIS TERAKHIR ===================="
            tail -50 /tmp/build.log
            echo ""
            echo ">>> BUILD GAGAL. Salin blok BARIS ERROR di atas dan kirim balik."
            exit 1
          fi
          ls -la out/arch/arm64/boot/

      - name: Compile nm (NoMount userspace CLI, tertanam & terverifikasi jalan)
        run: |
          mkdir -p nm-src && cd nm-src
          echo "" | base64 -d > nm.c
          echo "" | base64 -d > nm.h
          aarch64-linux-gnu-gcc -nostdlib -static -Os -fno-builtin -Wl,-e,_start -o nm nm.c
          aarch64-linux-gnu-strip nm
          ls -la nm

      - name: Tentukan file kernel hasil
        id: kimg
        run: |
          FOUND=""
          for f in Image.gz-dtb
          echo "===== VERIFY IMAGE ====="
          strings out/arch/arm64/boot/Image.gz-dtb | grep -iq susfs || { echo "::error::SUSFS not found in kernel image"; exit 1; }
 Image.gz Image; do
            p="kernel/out/arch/arm64/boot/$f"
            if [ -f "$p" ]; then
              echo "path=$p" >> "$GITHUB_OUTPUT"
              echo "name=$f" >> "$GITHUB_OUTPUT"
              FOUND=1
              break
            fi
          done
          [ -n "$FOUND" ] || { echo "Kernel image tidak ditemukan"; exit 1; }
          DTBO="kernel/out/arch/arm64/boot/dtbo.img"
          if [ -f "$DTBO" ]; then
            echo "dtbo=$DTBO" >> "$GITHUB_OUTPUT"
            echo "dtbo.img ditemukan: $DTBO"
          fi

      - name: Rakit paket AnyKernel3 (template asli fjrXTR)
        run: |
          git clone --depth=1 https://github.com/fjrXTR/AnyKernel3.git AnyKernel3
          rm -rf AnyKernel3/.git

          echo "" | base64 -d > AnyKernel3/anykernel.sh
          echo "== anykernel.sh =="; cat AnyKernel3/anykernel.sh

          cp "${{ steps.kimg.outputs.path }}" "AnyKernel3/${{ steps.kimg.outputs.name }}"

          ZIP="rosemary-sphinX-ReSukiSU-NoMount-SUSFS-fixed-AK3-${{ github.run_number }}.zip"
          ( cd AnyKernel3 && zip -r9 "../$ZIP" . -x '.git*' )
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          unzip -l "$ZIP" | head -20

      - name: Upload paket + kernel mentah + dtbo + nm CLI
        uses: actions/upload-artifact@v4
        with:
          name: rosemary-kernel-ksu-nomount-susfs-v4
          if-no-files-found: warn
          path: |
            ${{ env.ZIP }}
            ${{ steps.kimg.outputs.path }}
            ${{ steps.kimg.outputs.dtbo }}
            nm-src/nm
            kernel/out/.config
