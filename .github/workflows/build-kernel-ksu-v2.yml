# ============================================================
# FASE 2 — Kernel rosemary (dlagia/sphinX) + ReSukiSU + SUSFS + NoMount + Re-Kernel + AK3
#
# Lanjutan dari Fase 1 (build-kernel-ksu-v2.yml) yang SUDAH TERBUKTI
# BOOT NORMAL. File ini menambahkan NoMount (github.com/maxsteeel/nomount)
# di atas basis yang sama persis.
#
# NoMount: framework redirect path level VFS kernel (bukan mount --bind),
# jadi /proc/self/mountinfo tetap 100% stock. Dipakai lewat binary
# userspace `nm` (nm block <uid> untuk sembunyikan root dari app tertentu).
#
# CATATAN JUJUR dari penulis NoMount sendiri: "may contain bugs,
# for research and development, proceed with caution."
#
# Ke-8 titik hook (fs/Kconfig, fs/Makefile, fs/namei.c x4, fs/dcache.c,
# fs/readdir.c, fs/stat.c, fs/proc/task_mmu.c, fs/statfs.c) sudah
# diverifikasi manual satu-satu cocok dengan source dlagia/rosemary-13
# (BUKAN patch generik - anchor dicari langsung di source asli, lihat
# fs/dcache.c bukan fs/d_path.c, dan inode_permission2 bukan
# inode_permission, karena source ini pakai varian Android/MTK).
# Binary nm CLI sudah diverifikasi COMPILE dan JALAN (dites di qemu-aarch64).
#
# WAJIB: test lewat OrangeFox (backup Boot dulu!) sebelum dianggap final,
# SAMA seperti Fase 1. Kernel ini basis sama dengan yang sudah terbukti
# boot, tapi NoMount menyentuh VFS inti - tetap test dulu.
#
# SUSFS (gitlab.com/simonpunk/susfs4ksu, branch kernel-4.14): root hiding
# di level kernel untuk ReSukiSU. Patch resmi susfs4ksu diambil langsung
# dari sumbernya (BUKAN ditulis ulang manual - terlalu besar/berisiko).
# Patch non-GKI + skrip susfs_inline_hook_patches.sh (khusus untuk
# CONFIG_KSU_MANUAL_HOOK=y, sudah dipakai kernel ini) diambil dari
# github.com/dlagia/NonGKI_Kernel_Build_2nd, fallback ke upstream
# github.com/JackA1ltman/NonGKI_Kernel_Build_2nd kalau file belum ada
# di fork tsb. Kalau patch resmi tidak apply bersih (ada .rej), step
# GAGAL dengan menampilkan isi .rej - konflik manual itu WAJAR untuk
# source non-standar (dikonfirmasi dari laporan komunitas ReSukiSU+
# SUSFS lain), bukan tanda ada yang ditulis sembarangan di sini.
#
# Re:Kernel (github.com/Sakion-Team/Re-Kernel): membuka netlink server
# supaya tombstone/freezer di userspace tahu kapan binder call atau
# signal (SIGKILL/SIGTERM/SIGABRT/SIGQUIT) menyasar proses yang sedang
# di-freeze cgroup, jadi bisa di-unfreeze tepat waktu (kurangi ANR).
# Ditanam manual sesuai Integrate/README.md repo tsb (mode <=5.4).
#
# CATATAN JUJUR: BEDA dari ReSukiSU/NoMount di atas, hook Re:Kernel ini
# TIDAK diverifikasi baris-per-baris ke source dlagia/android_kernel_
# xiaomi_rosemary (repo itu tidak ditemukan publik untuk dicek manual).
# Anchor pakai pola toleran-spasi + pengecekan "match harus tepat 1x"
# sebelum menyisipkan kode (lihat step-nya) - kalau struktur binder.c/
# signal.c di source ini beda dari referensi AOSP-style Re-Kernel, step
# ini GAGAL dengan pesan jelas, bukan diam-diam menghasilkan kernel yang
# rusak. Kalau gagal, kirim balik isi fungsi binder_transaction(),
# binder_alloc_new_buf_locked(), dan do_send_sig_info() dari source asli
# supaya anchor-nya disesuaikan.
# ============================================================

name: Build rosemary kernel v3 (sphinX + ReSukiSU + SUSFS + NoMount + Re-Kernel + AK3)

on:
  workflow_dispatch: {}
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Pasang dependency build
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl flex git kmod \
            libelf-dev libssl-dev zip zlib1g-dev \
            libtinfo5 libncurses5 gcc-aarch64-linux-gnu

      - name: Clone source kernel (dlagia/android_kernel_xiaomi_rosemary @ rosemary-13)
        run: |
          git clone --depth=1 -b rosemary-13 \
            https://github.com/dlagia/android_kernel_xiaomi_rosemary.git kernel

      - name: Integrasikan ReSukiSU (setup.sh terbaru)
        working-directory: kernel
        run: |
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
          ls -d KernelSU* drivers/kernelsu 2>/dev/null || true

      - name: Terapkan manual-hook patch (tertanam, terverifikasi cocok source ini)
        working-directory: kernel
        run: |
          echo "" | base64 -d > /tmp/resukisu-hooks.patch
          git apply --verbose /tmp/resukisu-hooks.patch
          grep -c CONFIG_KSU_MANUAL_HOOK fs/stat.c fs/exec.c fs/open.c kernel/reboot.c
      - name: Integrasikan NoMount (kernel-side, tertanam & terverifikasi)
        working-directory: kernel
        run: |
          echo "" | base64 -d > fs/nomount.c
          echo "" | base64 -d > fs/nomount.h
          echo "" | base64 -d > /tmp/nomount-hooks.patch
          git apply --verbose /tmp/nomount-hooks.patch
          grep -c CONFIG_NOMOUNT fs/Kconfig fs/Makefile fs/namei.c fs/dcache.c fs/readdir.c fs/stat.c fs/proc/task_mmu.c fs/statfs.c

      - name: Integrasikan SUSFS (susfs4ksu, patch non-GKI dari NonGKI_Kernel_Build_2nd)
        working-directory: kernel
        run: |
          # Sumber resmi: https://gitlab.com/simonpunk/susfs4ksu (branch kernel-4.14)
          # Patch non-GKI + skrip inline-hook: dicoba dulu dari repo kamu sendiri
          # https://github.com/dlagia/NonGKI_Kernel_Build_2nd , fallback ke upstream
          # https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd kalau file belum
          # ada di fork kamu.
          #
          # CATATAN JUJUR: patch SUSFS resmi (ribuan baris, puluhan file) TIDAK ditulis
          # ulang manual di sini - diambil langsung dari sumber aslinya. Konflik/.rej
          # saat apply itu WAJAR untuk source non-standar - kalau itu terjadi, step ini
          # GAGAL dengan menampilkan isi .rej, bukan diam-diam lanjut build.
          #
          # PENTING: jangan pre-copy fs/susfs.c / include/linux/susfs*.h sebelum patch -
          # patch non-GKI itu sendiri yang membuat file itu. Pre-copy bikin "patch"
          # masuk mode tanya-interaktif dan bisa mengacak parsing hunk setelahnya.
          # File tambahan (mis. sus_su.c) yang TIDAK dibuat oleh patch baru dicopy
          # SETELAH patch berhasil, dengan cp -n (no-clobber).

          SUSFS_BRANCH="kernel-4.14"
          DLAGIA_BASE="https://raw.githubusercontent.com/dlagia/NonGKI_Kernel_Build_2nd/mainline"
          UPSTREAM_BASE="https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline"

          fetch_with_fallback() {
            local relpath="$1"
            local dest="$2"
            if curl -fLs -o "$dest" "${DLAGIA_BASE}/${relpath}"; then
              if [ -s "$dest" ] && ! grep -qi '<!DOCTYPE html>' "$dest"; then
                echo "susfs: dipakai dari dlagia/NonGKI_Kernel_Build_2nd -> $relpath"
                return 0
              fi
            fi
            echo "susfs: tidak ada di fork dlagia untuk '$relpath', coba upstream JackA1ltman..."
            if curl -fLs -o "$dest" "${UPSTREAM_BASE}/${relpath}"; then
              if [ -s "$dest" ] && ! grep -qi '<!DOCTYPE html>' "$dest"; then
                echo "susfs: dipakai dari upstream JackA1ltman/NonGKI_Kernel_Build_2nd -> $relpath"
                return 0
              fi
            fi
            echo "=================================================================="
            echo "susfs: GAGAL - '$relpath' tidak ditemukan di fork dlagia ATAU upstream."
            echo "Cek manual: ${DLAGIA_BASE}/${relpath}"
            echo "         atau: ${UPSTREAM_BASE}/${relpath}"
            echo "=================================================================="
            return 1
          }

          echo "== Clone susfs4ksu resmi (branch ${SUSFS_BRANCH}) =="
          rm -rf /tmp/susfs4ksu
          git clone -b "$SUSFS_BRANCH" --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs4ksu

          echo "== Ambil patch non-GKI untuk kernel 4.14 =="
          fetch_with_fallback "Patches/Patch/susfs_patch_to_4.14.patch" /tmp/susfs_patch_to_4.14.patch || exit 1

          echo "== Bersihkan .rej/.orig lama (kalau ada sisa dari source/percobaan sebelumnya) =="
          OLD_REJ=$(find . -name '*.rej')
          if [ -n "$OLD_REJ" ]; then
            echo "Ditemukan .rej LAMA (bukan dari patch ini, dibersihkan dulu supaya tidak salah dilaporkan):"
            echo "$OLD_REJ"
          fi
          find . -name '*.rej' -delete
          find . -name '*.orig' -delete

          echo "== Terapkan patch SUSFS (patch -p1 -f, fuzz diizinkan) =="
          # -f: jangan tanya interaktif (mencegah patch salah baca stdin/mengacak parsing).
          # Exit code ditangkap manual (via ||) supaya bash -e TIDAK langsung mematikan
          # step sebelum kita sempat melaporkan .rej dengan jelas.
          PATCH_EXIT=0
          patch -p1 -f --fuzz=3 --no-backup-if-mismatch < /tmp/susfs_patch_to_4.14.patch || PATCH_EXIT=$?


          echo "== Resolusi otomatis konflik yang sudah dikenal: NoMount vs SUSFS di show_map_vma() =="
          # NoMount menyisipkan nomount_spoof_mmap_metadata() di antara
          # "ino = inode->i_ino;" dan "pgoff = ...;" pada fs/proc/task_mmu.c,
          # yang membuat hunk asli SUSFS di fungsi show_map_vma() gagal cocok
          # konteks (lihat .rej di bawah kalau ini juga gagal). Skrip ini
          # menggabungkan KEDUA logika jadi satu blok - bukan mengabaikan salah satunya.
          if [ -f fs/proc/task_mmu.c.rej ] && grep -q "show_map_vma" fs/proc/task_mmu.c.rej; then
            echo "" | base64 -d > /tmp/merge_task_mmu.pl
            if perl /tmp/merge_task_mmu.pl; then
              rm -f fs/proc/task_mmu.c.rej fs/proc/task_mmu.c.orig
              # Satu-satunya penyebab exit code patch di atas bukan-0 sudah ditangani
              # manual - reset supaya tidak dianggap gagal kalau tidak ada .rej lain.
              PATCH_EXIT=0
            else
              echo "susfs: skrip resolusi manual GAGAL - lihat pesan di atas."
            fi
          fi

          # Hanya .rej BARU (hasil patch di atas) yang relevan - baseline lama sudah dibersihkan.
          REJ_FILES=$(find . -name '*.rej')
          if [ -n "$REJ_FILES" ] || [ "$PATCH_EXIT" -ne 0 ]; then
            echo "=================================================================="
            echo "susfs: GAGAL menerapkan patch (exit patch=$PATCH_EXIT)."
            echo "Ini WAJAR untuk source non-standar - perlu resolusi manual per file."
            if [ -n "$REJ_FILES" ]; then
              echo "Daftar & isi file .rej (kirim balik ini kalau minta bantuan lanjut):"
              for f in $REJ_FILES; do
                echo "---- $f ----"
                cat "$f"
              done
            else
              echo "Tidak ada file .rej tapi 'patch' tetap exit $PATCH_EXIT - kemungkinan"
              echo "ada file target yang tidak ditemukan sama sekali. Lihat log 'patching"
              echo "file ...' di atas, baris terakhir sebelum pesan ini adalah yang gagal."
            fi
            echo "=================================================================="
            exit 1
          fi
          find . -name '*.orig' -delete

          echo "== Lengkapi file susfs4ksu tambahan yang TIDAK dibuat oleh patch (cp -n) =="
          mkdir -p fs include/linux
          cp -vn /tmp/susfs4ksu/kernel_patches/fs/*.c fs/ 2>/dev/null || true
          cp -vn /tmp/susfs4ksu/kernel_patches/include/linux/*.h include/linux/ 2>/dev/null || true

          echo "== Ambil & jalankan susfs_inline_hook_patches.sh (untuk CONFIG_KSU_MANUAL_HOOK=y) =="
          fetch_with_fallback "Patches/susfs_inline_hook_patches.sh" ./susfs_inline_hook_patches.sh || exit 1
          chmod +x ./susfs_inline_hook_patches.sh
          ./susfs_inline_hook_patches.sh

          echo "== Verifikasi =="
          test -f fs/susfs.c && echo "fs/susfs.c ADA"
          test -f include/linux/susfs.h && echo "include/linux/susfs.h ADA"
          grep -c 'CONFIG_KSU_SUSFS' fs/Makefile

      - name: Tambal CVE-2026-43499 (GhostLock, rtmutex/futex UAF -> local root exploit)
        working-directory: kernel
        run: |
          # Bug nyata 15 tahun di kernel Linux (rt_mutex/futex remove_waiter()),
          # dipakai UNTUK dapat root tanpa privilese - berbahaya buat SEMUA app
          # yg jalan di HP ini, bukan cuma kita. Backport diverifikasi manual dari
          # commit upstream 3bfdc63936dd, disesuaikan ke struktur kernel 4.14 kita
          # (source modern pakai rt_mutex_base/scoped_guard yg belum ada di 4.14).
          echo "" | base64 -d > /tmp/cve-2026-43499-ghostlock.patch
          git apply --verbose /tmp/cve-2026-43499-ghostlock.patch
          grep -c CVE-2026-43499 kernel/locking/rtmutex.c

      - name: Integrasikan Re:Kernel (Sakion-Team) - notifikasi freeze binder/signal
        working-directory: kernel
        run: |
          # https://github.com/Sakion-Team/Re-Kernel
          # CATATAN JUJUR: beda dari ReSukiSU/NoMount di atas, hook ini TIDAK
          # divalidasi baris-per-baris ke source dlagia/android_kernel_xiaomi_rosemary
          # (repo itu tidak ditemukan publik untuk dicek manual). Dipakai pencocokan
          # pola toleran-spasi + validasi "match harus tepat 1x" SEBELUM menyisipkan
          # kode (lihat apply_rekernel_hooks.pl) - kalau anchor tidak ketemu persis
          # 1x, step ini GAGAL dengan pesan jelas, bukan diam-diam korup file.
          mkdir -p drivers/rekernel
          echo "" | base64 -d > drivers/rekernel/rekernel.h
          echo "" | base64 -d > drivers/rekernel/rekernel.c
          echo "b2JqLSQoQ09ORklHX1JFS0VSTkVMKSArPSByZWtlcm5lbC5vCg==" | base64 -d > drivers/rekernel/Makefile
          echo "" | base64 -d > drivers/rekernel/Kconfig

          grep -q 'rekernel/' drivers/Makefile || echo 'obj-y += rekernel/' >> drivers/Makefile
          grep -q 'rekernel/Kconfig' drivers/Kconfig || echo 'source "drivers/rekernel/Kconfig"' >> drivers/Kconfig

          sed -i '1i #include "../rekernel/rekernel.h"' drivers/android/binder.c
          sed -i '1i #include "../rekernel/rekernel.h"' drivers/android/binder_alloc.c
          sed -i '1i #include "../drivers/rekernel/rekernel.h"' kernel/signal.c

          echo "" | base64 -d > /tmp/apply_rekernel_hooks.pl
          perl /tmp/apply_rekernel_hooks.pl

          grep -c 'rekernel_start_server' drivers/android/binder.c drivers/android/binder_alloc.c kernel/signal.c

      - name: Pra-compile - perbaikan build source MTK (verified reusable)
        working-directory: kernel
        run: |
          # 1) buang -Werror standalone dari Makefile/Kbuild (per-folder MTK), jaga -Werror=/-Werror- yg sah
          grep -rlZ --include=Makefile --include=Kbuild --include='*.mk' -e '-Werror' . 2>/dev/null \
            | xargs -0 -r sed -i -E -e 's/-Werror=[A-Za-z0-9_-]+//g' -e 's/(-Werror)([[:space:]]|$)/\2/g' || true
          # 2) buang atribut no_sanitize("...") yg tak dikenal GCC 4.9 (harmless)
          grep -rlZ 'no_sanitize(' . 2>/dev/null \
            | xargs -0 -r sed -i -E 's/__attribute__\(\(no_sanitize\("[^"]*"\)\)\)//g' || true
          # 3) buang 'inline' dari fungsi ber-EXPORT yg body-nya out-of-line
          sed -i 's/inline void ksm_flock(/void ksm_flock(/' include/linux/keyslot-manager.h block/keyslot-manager.c || true
          sed -i 's/^inline void blk_crypto_flock(/void blk_crypto_flock(/' include/linux/blk-crypto.h block/blk-crypto.c || true
          sed -i 's/inline int typec_pd_start_entry(/int typec_pd_start_entry(/' drivers/misc/mediatek/typec/tcpc/inc/tcpci_typec.h drivers/misc/mediatek/typec/tcpc/tcpci_typec.c || true
          # 4) touch Focaltech: stub firmware yg hilang di SEMUA folder driver focaltech
          find drivers/input/touchscreen -name focaltech_config.h -printf '%h\n' 2>/dev/null | while read d; do
            mkdir -p "$d/include/firmware"
            printf '0x00\n' > "$d/include/firmware/fw_sample.i"
            echo "stub firmware -> $d/include/firmware/fw_sample.i"
          done
          # 5) bq2597x: izinkan FP di file ini saja kalau ada (sudah dibungkus kernel_neon_begin/end)
          grep -rl 'bq2597x_charger.o' --include=Makefile . 2>/dev/null | while read mk; do
            echo 'CFLAGS_REMOVE_bq2597x_charger.o += -mgeneral-regs-only' >> "$mk"
            echo "CFLAGS_REMOVE ditambah ke: $mk"
          done
          echo '== cek sisa =='
          echo -n 'no_sanitize( tersisa: '; grep -rl 'no_sanitize(' --include='*.h' --include='*.c' . 2>/dev/null | wc -l

      - name: Aktifkan KSU di defconfig
        working-directory: kernel
        run: |
          DEF=arch/arm64/configs/rosemary_defconfig
          {
            echo ""
            echo "# ReSukiSU"
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_MANUAL_HOOK=y"
            echo "CONFIG_KALLSYMS_ALL=y"
            echo ""
            echo "# NoMount"
            echo "CONFIG_NOMOUNT=y"
            echo ""
            echo "# Re:Kernel"
            echo "CONFIG_REKERNEL=y"
            echo ""
            echo "# SUSFS (susfs4ksu kernel-4.14, non-GKI patch)"
            echo "CONFIG_KSU_SUSFS=y"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y"
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
            echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y"
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y"
            echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y"
            echo "CONFIG_KSU_SUSFS_SUS_MAP=y"
          } >> "$DEF"
          tail -22 "$DEF"

      - name: Ambil toolchain proton-clang (dipakai penulis kernel ini di b.sh)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang-proton

      - name: Compile kernel
        working-directory: kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang-proton/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER=github
          export KBUILD_BUILD_HOST=actions
          make O=out rosemary_defconfig
          set -o pipefail
          if ! make -k O=out -j"$(nproc)" \
                ARCH=arm64 \
                CC=clang \
                AR=llvm-ar \
                NM=llvm-nm \
                OBJCOPY=llvm-objcopy \
                OBJDUMP=llvm-objdump \
                STRIP=llvm-strip \
                CROSS_COMPILE=aarch64-linux-gnu- \
                CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                CONFIG_SECTION_MISMATCH_WARN_ONLY=y \
                KCFLAGS="-Wno-error" 2>&1 | tee /tmp/build.log; then
            echo ""
            echo "==================== BARIS ERROR (kirim ini) ===================="
            grep -niE "error:|fatal error|undefined reference|No such file|multiple definition|recipe for target|Error [0-9]" /tmp/build.log | tail -120 || true
            echo "==================== KONTEKS TIAP KEGAGALAN (kirim ini juga) ===================="
            for L in $(grep -n 'Error 1' /tmp/build.log | head -3 | cut -d: -f1); do
              S=$((L-40)); [ $S -lt 1 ] && S=1
              echo "----- konteks baris $S s/d $L -----"
              sed -n "${S},${L}p" /tmp/build.log
            done
            echo "==================== 50 BARIS TERAKHIR ===================="
            tail -50 /tmp/build.log
            echo ""
            echo ">>> BUILD GAGAL. Salin blok BARIS ERROR di atas dan kirim balik."
            exit 1
          fi
          ls -la out/arch/arm64/boot/

      - name: Compile nm (NoMount userspace CLI, tertanam & terverifikasi jalan)
        run: |
          mkdir -p nm-src && cd nm-src
          echo "" | base64 -d > nm.c
          echo "" | base64 -d > nm.h
          aarch64-linux-gnu-gcc -nostdlib -static -Os -fno-builtin -Wl,-e,_start -o nm nm.c
          aarch64-linux-gnu-strip nm
          ls -la nm

      - name: Tentukan file kernel hasil
        id: kimg
        run: |
          FOUND=""
          for f in Image.gz-dtb Image.gz Image; do
            p="kernel/out/arch/arm64/boot/$f"
            if [ -f "$p" ]; then
              echo "path=$p" >> "$GITHUB_OUTPUT"
              echo "name=$f" >> "$GITHUB_OUTPUT"
              FOUND=1
              break
            fi
          done
          [ -n "$FOUND" ] || { echo "Kernel image tidak ditemukan"; exit 1; }
          DTBO="kernel/out/arch/arm64/boot/dtbo.img"
          if [ -f "$DTBO" ]; then
            echo "dtbo=$DTBO" >> "$GITHUB_OUTPUT"
            echo "dtbo.img ditemukan: $DTBO"
          fi

      - name: Rakit paket AnyKernel3 (template asli fjrXTR)
        run: |
          git clone --depth=1 https://github.com/fjrXTR/AnyKernel3.git AnyKernel3
          rm -rf AnyKernel3/.git

          echo "" | base64 -d > AnyKernel3/anykernel.sh
          echo "== anykernel.sh =="; cat AnyKernel3/anykernel.sh

          cp "${{ steps.kimg.outputs.path }}" "AnyKernel3/${{ steps.kimg.outputs.name }}"

          ZIP="rosemary-sphinX-ReSukiSU-SUSFS-NoMount-ReKernel-AK3-${{ github.run_number }}.zip"
          ( cd AnyKernel3 && zip -r9 "../$ZIP" . -x '.git*' )
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          unzip -l "$ZIP" | head -20

      - name: Upload paket + kernel mentah + dtbo + nm CLI
        uses: actions/upload-artifact@v4
        with:
          name: rosemary-kernel-ksu-susfs-nomount-rekernel-v3
          if-no-files-found: warn
          path: |
            ${{ env.ZIP }}
            ${{ steps.kimg.outputs.path }}
            ${{ steps.kimg.outputs.dtbo }}
            nm-src/nm
            kernel/out/.config
