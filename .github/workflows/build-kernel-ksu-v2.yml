# privat (app GitHub / browser yang sudah login; `gh release download`;
# tautan pra-tandatangan berumur pendek, dicetak saat mau dipakai), dan
# ringkasan build memperingatkan soal 404 itu alih-alih menyodorkan tautan
# seolah tanpa syarat. Id numerik aset baru ada SESUDAH rilis terbit, jadi
# catatannya dilengkapi lalu ditambal balik dengan `gh release edit`, dan
# id-nya diuji bentuk `^[0-9]+$` - pelajaran revisi ke-34 dipakai langsung
# pada kode baru, bukan cuma pada kode lama.
#
# Audit putaran ini: lint ketiga workflow 0 temuan, kedelapan pin masih di
# HEAD (pin = HEAD, jadi divergensi mustahil - ORPHAN nihil), step rilis
# dijalankan kering di luar CI dengan `gh` distub untuk melihat badan rilis
# yang benar-benar terkirim. Yang TIDAK dilakukan: membuat repo ini publik.
# Itu akan memberi tautan unduh permanen tanpa login - dan sekaligus
# membuka seluruh isi repo ke publik - jadi itu keputusan pemilik, bukan
# keputusan yang boleh diambil sendiri oleh alat.
# ============================================================
# REVISI KE-36 (2026-09-15) - pemilik menjawab "jadikan publik", dan repo ini
# jadi publik beberapa menit sesudah revisi ke-35 terbit. Yang diperiksa lebih
# dulu, karena publik itu tidak bisa betul-betul ditarik kembali (isi dan
# seluruh riwayat commit langsung bisa di-index dan di-cache): empat berkas
# yang terbuka tidak memuat token, kunci, maupun jalur lokal, dan dua issue
# isinya cuma tabel pin. Satu hal yang memang ikut terbuka dan pantas
# disebut: email author commit jadi terlihat publik. Sesudah diubah, tautan
# `browser_download_url` rilis build-20260915-153241 diuji tanpa autentikasi
# sama sekali: HTTP 200, 13.858.435 B - sama persis dengan ukuran aset, jadi
# keluhan "tidak bisa diunduh" selesai di akarnya.
#
# Tapi perubahan itu seketika membuat teks revisi ke-35 BOHONG: catatan rilis
# dan ringkasan build menghafal kalimat "Repo ini PRIVAT ... menjawab 404".
# Itu cacat yang sama dengan yang dicatat di kepala pin-watch.yml pada revisi
# ke-34 - salinan kedua yang basi, dan kali ini salinannya berupa PROSA, yang
# tidak dilihat actionlint maupun shellcheck. Privat/publik adalah setelan
# yang bisa berubah kapan saja di luar berkas ini, jadi sekarang tidak
# dihafal: step rilis menanyakannya saat run (`gh api repos/... --jq
# .private`) dan mencetak cabang yang sesuai. Jawaban yang tidak berbentuk
# `true|false` - badan error `gh api` di STDOUT, pelajaran revisi ke-34 -
# dianggap PRIVAT, karena memberi peringatan yang tidak perlu jauh lebih
# murah daripada menjanjikan unduhan yang menjawab 404.
#
# Diuji kering di luar CI untuk KEDUA nilai: private=false mencetak "Cara
# unduh" (tautan jalan tanpa login + `gh release download`), private=true
# mencetak "Kalau unduhannya 404" dengan tiga jalur seperti revisi ke-35.
# Dry-run itu juga menangkap kesalahan suntingan saya sendiri: penggantian
# blok menelan `}` penutup tapi meninggalkan `{` pembuka, dan step-nya mati
# dengan `syntax error: unexpected end of file`. actionlint tidak melihatnya
# karena run: tetap string yang sah; yang melihatnya hanya menjalankan
# skripnya. Itu alasan harness dry-run ini ada.
# ============================================================
# REVISI KE-40 (18 September 2026) - audit ulang: satu pin naik, tiga lubang
# "penjaga yang kelihatan bekerja padahal tidak" ditutup.
#
# PIN. ReSukiSU 6ec8d9a8 -> 487b32da. status=ahead, behind=0 (jadi TIDAK
# orphan), 2 commit / 12 berkas - jauh di bawah batas potong 300 berkas, jadi
# vonisnya sah. NOL berkas di bawah kernel/: dua commit itu menyentuh
# manager/ (nama paket & nama aplikasi bisa dikustom), userspace/ksud
# (backup stock image saat patch dari berkas), dan dua workflow CI milik
# ReSukiSU sendiri. Tidak satu pun dikompilasi ke dalam kernel ini, jadi
# seluruh audit Kconfig/Kbuild/hook sebelumnya tetap berlaku apa adanya;
# efek build satu-satunya KSU_VERSION +2. Tujuh pin lain persis di HEAD.
#
# SUSFS TETAP DITAHAN di 426ff004. HEAD upstream masih f15603b2 - SHA yang
# sama yang diaudit dan DITOLAK di revisi ke-38 karena __lookup_hash()
# membaca dentry->d_inode SEBELUM penjaga !IS_ERR(dentry) && dentry->d_inode,
# alias NULL-deref. Penahanannya terikat ke SHA itu, jadi begitu upstream
# bergerak ia kedaluwarsa sendiri. Alasan lengkapnya di pins.env; revisi ke-40b
# memperbaiki kalimatnya di sana karena versi lama ("setiap stat() path yang
# tidak ada") meremehkan: lewat filename_create() dentry negatif adalah jalur
# sukses normal mkdir/mknod/symlink/link, jadi radiusnya pembuatan berkas
# biasa, bukan cuma jalur error.
#
# (a) STEP "Muat pins.env" MENGEKSPOR NAMA APA PUN, bukan cuma delapan yang
#     diverifikasi. Penjaga bentuk menolak apa saja yang bukan
#     NAMA=<40 hex>, dan itu memang menahan injeksi perintah - nilai 40 hex
#     tidak bisa jadi perintah. Tapi bagian NAMA-nya tidak dibatasi sama
#     sekali: baris kesembilan macam PATH=<40 hex> lolos bentuk, lolos loop
#     "wajib ada persis satu" (loop itu cuma memeriksa delapan nama yang
#     dicarinya, tidak pernah melihat yang lain), lalu mendarat di
#     $GITHUB_ENV - yaitu di lingkungan SETIAP step sesudahnya. Sekarang
#     daftar delapan nama itu hidup di satu variabel $WAJIB yang dipakai dua
#     kali: sekali untuk menuntut tiap nama muncul persis sekali, sekali lagi
#     sebagai satu-satunya yang boleh diekspor. Baris berbentuk sah di luar
#     delapan itu bukan error - pins.env boleh lebih dulu memuat pin untuk
#     step yang belum ditulis - tapi dicetak sebagai CATATAN, karena
#     diabaikan diam-diam persis cara salinan kedua jadi basi (revisi
#     ke-26..28). Diuji kering: normal -> 8 baris diekspor; + PATH=<40 hex>
#     -> tetap 8, CATATAN muncul; nama ganda -> tetap ERROR; nilai bercelah
#     -> tetap ERROR.
#
# (b) STEP "Tentukan file kernel hasil" MENERIMA IMAGE TANPA DTB, DIAM-DIAM.
#     Loop-nya menerima Image.gz-dtb, lalu Image.gz, lalu Image - yang
#     pertama ada menang - dan tidak mengatakan apa pun tentang mana yang
#     menang. rosemary (MT6785) butuh dtb yang DI-APPEND ke image; setiap
#     revisi yang terbukti boot memakai Image.gz-dtb. Kalau
#     CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE hilang dari defconfig, target itu
#     tidak dibangun, `make` TETAP keluar 0, dan step ini akan mengemas
#     Image.gz tanpa dtb: zip-nya ter-flash mulus lalu bootloop. Satu siklus
#     flash terbuang untuk kesalahan yang sudah kelihatan di log CI. Simbol
#     itu tidak pernah di-assert di mana pun. Sekarang Image.gz-dtb WAJIB;
#     cadangannya tetap dideteksi, tapi hanya supaya pesan errornya bisa
#     menyebut apa yang sebenarnya ada, dan hasilnya fatal. Lima kasus diuji
#     kering (ada / ada+dtbo / cuma Image.gz dengan simbol / tanpa simbol /
#     kosong), termasuk memastikan `if` utuh dipakai di loop pendeteksi:
#     `[ -f x ] && VAR=...` sebagai perintah terakhir akan membunuh step di
#     bawah `bash -e` pada jalur "tidak ada" - jebakan yang sama seperti di
#     pin-watch.yml.
#
# (c) DI LUAR BERKAS INI: ~/bin/pincheck buta terhadap `# TAHAN`. Salinan
#     KELIMA dari tabel komponen, telat dua revisi - ia melaporkan SUSFS
#     TERTINGGAL setiap hari atas keputusan yang sudah diambil dan dicatat.
#     Laporan yang selalu merah sama tak bergunanya dengan laporan yang basi:
#     pembacanya belajar melewatinya, lalu suatu hari melewatkan ORPHAN.
#     Dicocokkan ke SHA seperti di naikkan-pin.yml, bukan ke nama komponen -
#     nama pendek di baris TAHAN ("SUSFS") bukan nama variabel ("SUSFS_PIN"),
#     jadi mengunci ke nama berarti menyalin tabel komponen untuk keenam
#     kalinya. Sekalian: hasil `gh api .../compare` di sana divonis lewat
#     `*)` -> "TERTINGGAL", padahal badan error `gh api` keluar di STDOUT dan
#     --jq .status atasnya menghasilkan "null" - jadi vonis ORPHAN/MUNDUR
#     hilang diam-diam justru waktu API bermasalah (aturan revisi ke-34,
#     belum pernah diterapkan ke panggilan KEDUA ini).
# ============================================================
# REVISI KE-40a (18 September 2026) - lanjutan langsung dari (b) di atas.
# Menolak image tanpa dtb di step pengemas memang menutup lubangnya, tapi
# menutupnya SEMBILAN MENIT terlambat: kegagalannya sudah pasti sejak Kconfig
# selesai resolve, namun baru diteriakkan sesudah seluruh kernel dikompilasi.
# Sekarang di-assert di step Compile, bersama assert KSU/SUSFS/BBR yang sudah
# ada, sedetik sesudah `make olddefconfig`.
#
# Dua simbol, dan ini bagian yang mengejutkan: hanya SATU dari keduanya yang
# benar-benar tertulis di defconfig.
#   - CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y ada di rosemary_defconfig.
#   - CONFIG_BUILD_ARM64_APPENDED_KERNEL_IMAGE_NAME - yang menentukan NAMA
#     berkas hasil - tidak ada di defconfig mana pun. Nilainya datang dari
#     `default "Image.gz-dtb" if IMG_GZ_DTB` di arch/arm64/Kconfig, dan
#     IMG_GZ_DTB sendiri sebuah pilihan yang juga tidak ditulis siapa pun.
# arch/arm64/Makefile memakai simbol kedua itu apa adanya sebagai target
# `all:`, jadi pergeseran diam-diam ke IMG_DTB akan menghasilkan Image-dtb -
# nama yang tidak dicari step pengemas - tanpa satu pun baris error. Yang
# di-pin di sini karena itu bukan cuma "dtb ikut", melainkan nama berkasnya.
#
# Diuji kering di luar CI atas empat .config: dua simbol benar -> keluar 0;
# append dimatikan -> keluar 1; nama bergeser ke "Image-dtb" -> keluar 1;
# simbol nama hilang sama sekali -> keluar 1.
# ============================================================

# REVISI KE-118 (16 November 2026) - permintaan pemilik: coba xxKSU.
# BakaSU dicabut, diganti backslashxx/KernelSU ("xxKSU"), dan SUBLEVEL
# kembali disamakan dengan kernel stok seperti workflow Agustus 2026.
#
# (a) SUSFS IKUT DICABUT, dan itu bukan pilihan gaya. xxKSU tidak membawa
#     dukungan SUSFS sama sekali: penulisnya menolak di issue #15 ("not my
#     problem"), dan build JackA1ltman sendiri berhenti dengan "xxksu doesn't
#     support SUSFS" kalau keduanya dinyalakan. Patch SUSFS 4.14 memanggil
#     fungsi yang hanya ada di KernelSU ber-SUSFS (BakaSU/SukiSU/KSUN), jadi
#     memasangnya di atas xxKSU berarti port tulisan sendiri tanpa satu pun
#     acuan upstream. Yang hilang bersama SUSFS: sus_path, sus_mount,
#     sus_kstat, spoof uname, spoof cmdline, open_redirect, sus_map, priority
#     uid filter - artinya modul BRENE kehilangan seluruh fitur kernelnya.
#     Step yang dicabut: integrasi dlagia/Build-Kernel_scripts, tiga fixer
#     SUSFS (task_mmu, 4.14, priority uid filter), commit KernelSU, dan
#     "Samakan /proc/version dengan uname palsu SUSFS". SUSFS_PIN dan
#     SCRIPTS_PIN dicabut dari pins.env dan dari kelima tabel kembarannya:
#     delapan pin jadi enam.
#
# (b) CARA HOOK: CONFIG_KSU_TAMPER_SYSCALL_TABLE=y, tanpa patch source.
#     Panduan xxKSU (issue #5, "READ THIS FIRST"): "on ARM / ARM64, enable
#     CONFIG_KSU_TAMPER_SYSCALL_TABLE=y and SKIP ALL manual hooks", dan
#     Kconfig-nya: "Verified on 3.0 ~ 7.1. Recommended for 3.0 ~ 4.14".
#     Driver menukar entri sys_reboot/execve/execveat/faccessat/newfstatat/
#     newfstat/read di sys_call_table dan compat_sys_call_table lewat alias
#     vmap (tabelnya rodata); sisanya lewat LSM (KSU_LSM_SECURITY_HOOKS,
#     default y: pembajakan anggota pertama list, jalur 4.2 - 6.8). Source
#     kernel karena itu TIDAK ditambal sebaris pun untuk KSU - step integrasi
#     menolak jalan kalau pohon kernel sudah berisi ksu_handle_ (hook manual
#     + tabel syscall = hook ganda). Tidak ada backport yang diwajibkan
#     (issue #4: path_umount dan selinux_inode opsional, ditangani driver).
#
# (c) SUBLEVEL 186. Stok Xiaomi = 4.14.186-perf; pohon dlagia = 4.14.332.
#     Dulu (Agustus 2026) angka itu disamakan lewat sed di Makefile, lalu
#     digantikan spoof_uname SUSFS. SUSFS hilang, jadi sed-nya kembali.
#     Yang diperiksa supaya ini bukan bug tersembunyi: Makefile pohon ini
#     menulis LINUX_VERSION_CODE dengan sublevel TETAP 255
#     (`expr VERSION * 65536 + PATCHLEVEL * 256 + 255`), jadi mengubah
#     SUBLEVEL hanya mengubah string (uname -r, /proc/version, vermagic) dan
#     tidak menggeser satu pun cabang `#if LINUX_VERSION_CODE`. Step-nya
#     meng-assert bentuk baris itu; kalau suatu saat hilang, ia jatuh ke
#     pemeriksaan kedua (tidak boleh ada KERNEL_VERSION(4, 14, >186) di
#     pohon). Step Compile lalu menuntut `make kernelrelease` persis
#     "4.14.186-perf" sebelum mengompilasi, dan banner yang sama di vmlinux
#     sesudahnya.
#
# (d) Yang TIDAK berubah dari titik AD: KERNEL_PIN, NoMount (driver +
#     loader), proton-clang, AnyKernel3, step memori, tambalan CVE rtmutex,
#     tambalan flush_work blk-core, BBR + fq, defconfig non-KSU (DEBUG_KERNEL,
#     KALLSYMS, KALLSYMS_ALL kini ditulis langsung, dulu datang dari fragmen
#     dlagia). NoMount tidak menyentuh KSU maupun SUSFS (nol rujukan di
#     kernel/src), dan setup.sh-nya disimulasikan lokal di atas pohon kernel
#     tanpa patch SUSFS.
#
# (e) Userspace yang ikut berubah (di luar workflow ini): manager BakaSU
#     tidak dikenali kernel ini. Koreksi revisi ke-118b: is_manager_apk()
#     di kernel/manager/apk_sign.c menerima paket me.weishu.kernelsu
#     dengan salah satu dari dua tanda tangan ini (plus dua fork lain):
#       - kunci rilis xxKSU  : size 0x363, sha256 4359c171f325...
#         = APK di halaman rilis backslashxx/KernelSU (diperiksa pada
#         KernelSU_v3.3.1-50_32730-release.apk: versi 32730 = KSU_VERSION
#         driver pin ini, uapi v6 = KERNEL_SU_UAPI_VERSION driver).
#       - KernelSU resmi     : size 0x033b, sha256 c371061b19d8...
#         (rilis resmi v3.3.1 masih uapi v5; driver pin ini uapi v6).
#     Jadi pasangan yang cocok = APK rilis xxKSU. Modul yang memanggil
#     ksu_susfs akan gagal dengan "not supported".
#
# Mundur: flash zip titik AD, lalu kembalikan berkas workflow ini dan
# pins.env ke commit 2e3265730 (cadangan lengkap di luar repo).
#
# Revisi ke-118 TERBUKTI BOOT: build-20261115-171120 diflash dan boot
# normal, dikonfirmasi pemilik 2026-11-16 = titik AE di pins.env.
# ============================================================

# REVISI KE-119 (16 November 2026) - audit sesudah titik AE.
#
# (a) NoMount naik ke HEAD: NOMOUNT_PIN bd5e2d11f -> 4a4b5645a (dev, maju
#     94 commit, driver "23", modul v2.3.0) dan NOMOUNT_LOADER_PIN
#     bf1847f98 -> 7914458ca (master; kernel/setup.sh tetap blob 766365013).
#     Audit bootloop-nya di blok NoMount pins.env. Tiga hal di workflow ini
#     ikut disesuaikan, karena tanpa itu build MERAH (disimulasikan lokal):
#       - guard 58b mencari "bool virtual = nm_inode_is_virtual(inode);".
#         Upstream kini memulangkan inode virtual di awal
#         nm_hijacked_evict_inode() (destroy + truncate_inode_pages_final +
#         clear_inode + return) sebelum evict_inode asli. Guard menerima
#         bentuk itu dan tetap menolak kalau cabang virtual menyentuh
#         orig_sop->evict_inode.
#       - resolver kini memegang ref leaf (atomic_inc(&out->leaf->refs));
#         guard menuntut pasangannya nm_leaf_put(rule_info->leaf) tepat satu
#         di nm_materialize_rule().
#       - nm (CLI) tidak lagi freestanding: sejak 1e800826e ia memakai libc
#         dan main(). Step "Compile nm" memilih bentuk dari isi nm.h, jadi
#         pin lama (ber-_start) tetap bisa dibangun saat mundur.
# (b) Pesan dan komentar yang masih menyebut SUSFS sebagai hal yang berlaku
#     (petunjuk error step clone kernel, catatan step "Muat pins.env",
#     ringkasan build) dibetulkan. Tidak ada kode kernel yang berubah
#     karenanya.
# (c) anykernel.sh: kernel.string tidak lagi "sphinX Kernel by fjrXTR"
#     (sisa template; kernel ini bukan sphinX). Daftar device dan versi
#     Android tidak diubah.
# Mundur: titik AE = kembalikan dua baris NOMOUNT di pins.env dan berkas ini
# ke commit e8cd3448c.
#
# REVISI KE-122 (17 November 2026) - audit: NOMOUNT_PIN 00e7c5d4f -> 215c7f59c.
#
# Upstream 215c7f59c (perbaikan nomount#121, panic ovl_encode_real_fh di
# GKI 6.6) membajak sb->s_export_op superblock yang dibajak NoMount dan
# SELALU memasang encode_fh = nm_encode_fh. Kalau export_operations asli
# tidak punya encode_fh, nm_encode_fh menjawab -EOPNOTSUPP. Di 4.14
# exportfs_encode_inode_fh() (fs/exportfs/expfs.c) justru jatuh ke
# export_encode_fh() generik (i_ino + i_generation) saat encode_fh NULL,
# dan ext4 serta f2fs pohon ini memang tanpa encode_fh. Akibatnya, begitu
# ada satu rule NoMount di /system, /vendor atau /product:
#   - name_to_handle_at() atas berkas ASLI di partisi itu gagal
#     EOPNOTSUPP, padahal di kernel stok berhasil (vektor deteksi);
#   - fdinfo inotify (fs/notify/fdinfo.c) memicu WARN_ONCE "Can't encode
#     file handler for inotify";
#   - copy-up overlayfs 4.14 dengan lower di partisi itu WARN_ON lalu -EIO.
# Bukan bootloop (tanpa rule NoMount tidak ada yang dibajak), tapi
# kemunduran di pohon ini. Tambalan di step NoMount: hook export hanya
# dipasang kalau export_operations asli punya encode_fh. Di ext4/f2fs
# pohon ini hook tidak pernah terpasang = perilaku driver titik AG.
# Dilewati kalau upstream tanpa hook export (pin lama) atau sudah
# memeriksanya sendiri; GAGAL kalau bentuk kodenya berubah.
# Mundur: titik AG = kembalikan KSU_PIN dan NOMOUNT_PIN titik AG di
# pins.env dan berkas ini ke commit 36c9640ed.
#
# REVISI KE-123 (17 November 2026) - NOMOUNT_PIN 215c7f59c -> e4f201e34.
# Upstream e4f201e34 ("preserve native file handle encoding") memasang
# penjaga yang SAMA PERSIS dengan tambalan revisi ke-122 (hook encode_fh
# hanya kalau encode_fh asli ada) dan memasang hook sesudah s_op tiruan
# terbit. Tambalan tetap di step NoMount, tapi di pin ini ia hanya
# memeriksa (tanpa mengubah berkas); ia baru menambal kalau pin mundur ke
# 215c7f59c.
#
# REVISI KE-124 (17 November 2026) - audit sesudah titik AH: tiga pin ke
# HEAD (KSU_PIN 9339aca93 -> e762d4b0e, NOMOUNT_PIN e4f201e34 -> 48e4b79a3,
# FGETPRIORITY_PIN 178dd7479 -> 9a38e02b0). Audit bootloop-nya di blok
# masing-masing pin di pins.env.
# Bug tersembunyi yang ikut dibetulkan: step "Integrasikan fgetpriority"
# menyalin daftar berkas yang ditulis tangan. Upstream 9a38e02b0 mengganti
# nama arm64_branch_insn.h -> arm64_branch_patch.h, jadi build GAGAL di
# step itu. Kini semua *.c/*.h di kernel/ upstream disalin dan setiap
# #include "..." lokal diperiksa ada (pin lama dan baru sama-sama lolos).
# Mundur: titik AH = kembalikan tiga baris pin titik AH di pins.env dan
# berkas ini ke commit 28f408ebc.
# ============================================================

name: Build Kernel Rosemary (xxKSU + NoMount)

on:
  # Tidak ada lagi input toggle add-on (revisi ke-11): NoMount selalu ikut,
  # Re:Kernel & Baseband-guard sudah dicabut permanen.
  workflow_dispatch:
  push:
    branches: [ main, master ]
    # Revisi ke-24: dulu SETIAP push ke main menyalakan build kernel 9 menit -
    # termasuk push yang cuma menyentuh workflow lain (mis. pin-watch.yml) atau
    # berkas non-build. Sekarang dibatasi ke file build ini sendiri. Kalau perlu
    # membangun ulang tanpa mengubah apa pun, pakai tombol "Run workflow"
    # (workflow_dispatch) yang sudah ada di atas.
    paths:
      - '.github/workflows/build-kernel-ksu-v2.yml'
      # Revisi ke-26: pins.env ikut, supaya menyunting pin lewat web GitHub
      # langsung membangun. (Commit dari workflow "Naikkan pin" TIDAK memicu
      # push-event - itu aturan GitHub untuk mencegah rekursi - jadi workflow
      # itu memanggil build lewat workflow_dispatch, bukan lewat jalur ini.)
      - 'pins.env'

# Revisi ke-25: step terakhir menerbitkan Release, jadi token build butuh izin
# TULIS contents. Blok ini sengaja ditulis eksplisit - tanpa `permissions:`,
# izin default ikut setelan repo/akun dan bisa berubah diam-diam. `contents:
# write` sudah mencakup baca (checkout) sekaligus membuat release, dan tidak
# memberi akses ke issues, packages, maupun id-token.
permissions:
  contents: write

concurrency:
  group: build-rosemary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Revisi ke-45. Push apa pun ke pins.env membangun ulang kernel dan
  # MENERBITKAN RILIS BARU - termasuk push yang cuma mengubah komentar. Itu
  # bukan sekadar boros lima menit CI: rilis paling atas jadi bukan rilis yang
  # tertulis TERBUKTI BOOT di kepala pins.env, padahal orang yang panik
  # mengambil rilis paling atas. Kelas yang sama dengan "kalimat basi lebih
  # berbahaya daripada tidak ada kalimat", cuma pindah ke halaman Releases.
  # Ketahuan di revisi ke-45 sendiri: satu push komentar, satu build penuh.
  #
  # Gerbang ini menjawab satu pertanyaan: adakah yang benar-benar berubah bagi
  # kernel hasil build? Yang dihitung cuma dua - berkas selain pins.env
  # (workflow ini sendiri termasuk) dan NILAI keenam SHA. Komentar pins.env
  # bukan salah satunya.
  #
  # SETIAP jalur ragu berakhir lanjut=1, tidak pernah 0: token gagal, compare
  # tak terbaca, daftar berkas terpotong di 300, rilis Latest tak terbaca.
  # Membangun tanpa perlu cuma boros; TIDAK membangun padahal perlu berarti
  # rilis tertinggal diam-diam, dan build yang tidak pernah jalan tidak
  # meninggalkan satu pun tanda merah.
  #
  # Revisi ke-73: pembandingnya COMMIT RILIS LATEST, bukan github.event.before.
  # Dengan event.before ada lubang nyata: push rev X (pin naik, build jalan),
  # lalu push rev Xb (cuma komentar) sebelum build X selesai. concurrency di
  # atas (cancel-in-progress) membatalkan build X - abu-abu, bukan merah - dan
  # gerbang Xb membandingkan X..Xb, melihat cuma komentar, lalu melewati
  # build. Pin X tidak pernah terbit sebagai rilis dan tidak ada yang tahu.
  # Hal yang sama terjadi kalau build X GAGAL lalu komentar menyusul. Pertanyaan
  # yang benar bukan "apa beda dari push sebelumnya" tapi "apa beda dari kernel
  # yang terakhir benar-benar terbit". Yang dihitung pun cuma dua: berkas
  # workflow build ini dan NILAI keenam SHA. Workflow robot (pin-watch,
  # naikkan-pin) tidak ikut mengompilasi, jadi tidak memicu rilis kembar.
  gerbang:
    # Revisi ke-55: 22.04 -> 24.04. ubuntu-22.04 mulai dipensiunkan
    # 2026-09-17 (brownout Maret-April 2027, pensiun 2027-04-17,
    # actions/runner-images#14254).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Revisi ke-108: izin minimum. Gerbang hanya MEMBACA (rilis Latest,
    # ref tag, compare, contents pins.env); contents: write cukup di job
    # build yang menerbitkan rilis.
    permissions:
      contents: read
    outputs:
      lanjut: ${{ steps.nilai.outputs.lanjut }}
    steps:
      - name: Perlu dibangun ulang?
        id: nilai
        env:
          GH_TOKEN: ${{ github.token }}
          PEMICU: ${{ github.event_name }}
        run: |
          # Sengaja TANPA set -e: gerbang yang mati di tengah harus tetap
          # pulang membawa lanjut=1, bukan menggagalkan job dan ikut mengubur
          # build. Revisi ke-73: Actions menjalankan step ini sebagai
          # `bash -e {0}` (lihat log), jadi "tanpa set -e" harus ditulis
          # eksplisit - `set -uo pipefail` saja tidak mematikan -e.
          set +e -uo pipefail

          lanjut=1
          alasan="pemicu '$PEMICU' bukan push - selalu dibangun"

          if [ "$PEMICU" = "push" ]; then
            alasan="ada yang berubah - dibangun"
            # Commit tempat tag rilis Latest menempel (dibuat dengan
            # --target "$GITHUB_SHA", jadi tag-nya tag ringan ke commit build).
            # Prerelease uji (--latest=false) sengaja tidak pernah jadi basis.
            # Satu kali ulang per panggilan, seperti robot pin-watch: API yang
            # berkedip sesaat (terlihat di uji lokal revisi ke-73) jatuh ke
            # "dibangun" dan menerbitkan rilis kembar di atas yang terbukti boot.
            TAG_LATEST=""; BASIS=""
            for coba in 1 2; do
              TAG_LATEST=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || true)
              if printf '%s' "$TAG_LATEST" | grep -qxE 'build-[0-9]{8}-[0-9]{6}'; then
                BASIS=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG_LATEST}" \
                          --jq 'select(.object.type=="commit") | .object.sha' 2>/dev/null || true)
              fi
              if printf '%s' "$BASIS" | grep -qxE '[0-9a-f]{40}'; then break; fi
              if [ "$coba" = 1 ]; then sleep 5; fi
            done
            if ! printf '%s' "$BASIS" | grep -qxE '[0-9a-f]{40}'; then
              alasan="commit rilis Latest tak terbaca (tag='${TAG_LATEST:0:60}') - dibangun"
            else
              SEBELUM="$BASIS"
              # gh api mencetak badan error (401/403/404/5xx) ke STDOUT dan kode
              # keluarnya tertelan $( ), jadi yang diperiksa BENTUKNYA, bukan
              # kosong-tidaknya. Badan error pun punya .status - isinya kode HTTP
              # sebagai string. Pelajaran revisi ke-34 dan ke-41.
              CMP=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${SEBELUM}...${GITHUB_SHA}" 2>/dev/null || true)
              WF_BUILD=".github/workflows/build-kernel-ksu-v2.yml"
              ST=$(printf '%s' "$CMP" | jq -r '.status // empty' 2>/dev/null || true)
              case "$ST" in
                ahead|behind|identical|diverged) ;;
                *) ST="" ;;
              esac
              if [ -z "$ST" ]; then
                alasan="compare tak terbaca - dibangun"
              elif [ "$ST" = "behind" ] || [ "$ST" = "diverged" ]; then
                # Arah behind: API mengembalikan NOL berkas, jadi workflow yang
                # berubah tak terlihat. diverged (force-push): daftar berkasnya
                # cuma merge-base -> HEAD. Dua-duanya tak bisa dinilai.
                alasan="HEAD $ST terhadap rilis ${TAG_LATEST} - dibangun"
              else
                N_BERKAS=$(printf '%s' "$CMP" | jq -r '.files | length' 2>/dev/null || echo 0)
                WF_BERUBAH=$(printf '%s' "$CMP" | jq -r '.files[].filename' 2>/dev/null | grep -cxF "$WF_BUILD" || true)
                if [ "${N_BERKAS:-0}" -ge 300 ]; then
                  alasan="daftar berkas terpotong di 300 oleh API - dibangun"
                elif [ "${WF_BERUBAH:-1}" != "0" ]; then
                  alasan="workflow build berubah sejak rilis ${TAG_LATEST} - dibangun"
                else
                  # Cuma pins.env yang tersentuh. Yang menentukan sekarang NILAI
                  # SHA-nya, bukan diff-nya: komentar boleh berubah sebanyak apa
                  # pun. Kedua sisi disaring pola yang SAMA dengan penjaga bentuk
                  # di step "Muat pins.env", lalu diurutkan supaya baris yang
                  # cuma pindah tempat tidak terbaca sebagai perubahan.
                  ambil() {
                    gh api "repos/${GITHUB_REPOSITORY}/contents/pins.env?ref=$1" --jq .content 2>/dev/null |
                      base64 -d 2>/dev/null |
                      tr -d '\r' |
                      grep -E '^[A-Z0-9_]+=[0-9a-f]{40}$' | sort
                  }
                  PIN_LAMA=$(ambil "$SEBELUM")
                  PIN_BARU=$(ambil "$GITHUB_SHA")
                  N_BARU=$(printf '%s\n' "$PIN_BARU" | grep -c . || true)
                  if [ "${N_BARU:-0}" -lt 7 ]; then
                    alasan="pins.env sesudah push cuma terbaca ${N_BARU:-0} baris pin - dibangun, biar step 'Muat pins.env' yang memvonis"
                  elif [ "$PIN_LAMA" = "$PIN_BARU" ]; then
                    lanjut=0
                    alasan="ketujuh SHA dan workflow build sama persis dengan rilis ${TAG_LATEST} (${SEBELUM:0:9}) - TIDAK dibangun"
                  else
                    alasan="nilai pin beda dari rilis ${TAG_LATEST} - dibangun"
                  fi
                fi
              fi
            fi
          fi

          echo "lanjut=$lanjut" >> "$GITHUB_OUTPUT"
          echo "[gerbang] $alasan"
          {
            printf '## Gerbang build\n\n'
            if [ "$lanjut" = "1" ]; then
              printf -- '- **DIBANGUN** - %s\n' "$alasan"
            else
              printf -- '- **DILEWATI** - %s\n' "$alasan"
              printf -- '- Rilis paling atas tetap rilis terakhir yang benar-benar dikompilasi.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: gerbang
    # '!cancelled()' + "bukan 0", bukan "sama dengan 1": kalau job gerbang
    # sendiri gagal, outputs.lanjut KOSONG - dan kosong harus berarti dibangun.
    # Dengan "== '1'" kegagalan gerbang justru mengubur build tanpa tanda merah.
    if: ${{ !cancelled() && needs.gerbang.outputs.lanjut != '0' }}
    # Revisi ke-55: 22.04 -> 24.04. ubuntu-22.04 mulai dipensiunkan
    # 2026-09-17 (brownout Maret-April 2027, pensiun 2027-04-17,
    # actions/runner-images#14254).
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      # Step pertama, karena semua step sesudahnya bergantung padanya.
      #
      # Dibaca lewat API pada $GITHUB_SHA, BUKAN actions/checkout: job ini
      # sengaja tidak pernah punya .git di workspace (alasannya di revisi
      # ke-25a), dan membaca pada commit pemicu menjamin pin yang dipakai
      # persis milik commit itu - bukan HEAD branch yang bisa sudah bergerak
      # di tengah antrean build.
      - name: Muat pins.env
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # tr -d '\r': kalau pins.env pernah ter-commit dari Windows, tiap baris
          # berakhir CRLF dan penjaga bentuk di bawah menolaknya dengan pesan
          # "tidak berbentuk NAMA=<40 hex>" - keluhan tentang karakter yang tak
          # kelihatan. Dibuang saja di sini; CR tidak pernah sah di file ini.
          gh api "repos/${GITHUB_REPOSITORY}/contents/pins.env?ref=${GITHUB_SHA}" \
            --jq .content | base64 -d | tr -d '\r' > /tmp/pins.env

          # Isi pins.env disalin ke $GITHUB_ENV, jadi bentuknya diperiksa DULU.
          # Kelas karakter namanya WAJIB memuat angka: AK3_PIN punya "3", dan
          # dengan [A-Z_]+ saja ia ditolak di sini padahal sah. Ketahuan waktu
          # dry-run lokal; actionlint maupun pemeriksa YAML tidak melihatnya.
          # Baris yang berarti wajib persis NAMA=<40 hex kecil>; selain itu cuma
          # boleh baris kosong atau komentar. Apa pun di luar itu - spasi, kutip,
          # komentar di ujung baris, apalagi perintah - ditolak di sini, sebelum
          # sebaris pun sempat masuk ke lingkungan step berikutnya.
          if grep -nvE '^[[:space:]]*(#.*)?$|^[A-Z0-9_]+=[0-9a-f]{40}$' /tmp/pins.env; then
            echo "ERROR: baris di atas tidak berbentuk NAMA=<40 hex huruf kecil>"
            exit 1
          fi

          # Bukan cuma "ada", tapi ADA PERSIS SATU. Kalau satu nama tertulis
          # dua kali - mudah terjadi lewat sunting tangan di web GitHub, dan
          # jalur itu memang sah (pins.env ada di paths:) - maka baris TERAKHIR
          # yang menang di $GITHUB_ENV, sedangkan preflight.sh dan ~/bin/pincheck
          # membacanya dengan `head -1` alias baris PERTAMA. Gerbang pra-push
          # jadi mengaudit SHA yang berbeda dari yang benar-benar dikompilasi,
          # dan dua-duanya tetap kelihatan hijau. Ketahuan di audit revisi ke-33.
          # Revisi ke-40: delapan nama ini dulu dieja di dua tempat - sekali di
          # kepala loop ini, sekali lagi (secara tersirat, sebagai pola
          # [A-Z0-9_]+) di baris yang mengekspor ke $GITHUB_ENV. Sekarang satu
          # daftar dipakai keduanya.
          # Revisi ke-120: tujuh nama (FGETPRIORITY_PIN ditambahkan; fgetpriority
          # built-in, hook getpriority/ioprio).
          # Revisi ke-118: enam nama (SCRIPTS_PIN dan SUSFS_PIN dicabut bersama
          # BakaSU + SUSFS).
          WAJIB="KERNEL_PIN KSU_PIN
                 NOMOUNT_PIN NOMOUNT_LOADER_PIN CLANG_PIN AK3_PIN
                 FGETPRIORITY_PIN"
          for n in $WAJIB; do
            N_BARIS="$(grep -cE "^${n}=[0-9a-f]{40}$" /tmp/pins.env || true)"
            if [ "$N_BARIS" != "1" ]; then
              echo "ERROR: $n muncul $N_BARIS kali di pins.env (wajib persis 1)"
              echo "       baris yang cocok:"
              grep -nE "^${n}=" /tmp/pins.env | sed 's/^/         /' || true
              exit 1
            fi
          done

          # Revisi ke-40: baris ini dulu menyalin SETIAP baris berbentuk
          # NAMA=<40 hex> ke $GITHUB_ENV - bukan cuma delapan nama yang barusan
          # diverifikasi. Penjaga bentuk di atas menahan injeksi perintah (nilai
          # 40 hex tidak bisa jadi perintah), tapi NAMA-nya tidak dibatasi sama
          # sekali, sehingga baris kesembilan macam PATH=<40 hex> ikut mendarat
          # di lingkungan SETIAP step sesudahnya. Daftarnya sudah ada di $WAJIB;
          # tidak ada alasan mengekspor di luar itu.
          : > /tmp/pins.export
          for n in $WAJIB; do
            grep -E "^${n}=[0-9a-f]{40}$" /tmp/pins.env >> /tmp/pins.export
          done

          # Baris yang lolos bentuk tapi bukan salah satu dari enam bukan
          # error - pins.env boleh lebih dulu memuat pin untuk step yang belum
          # ditulis - tapi WAJIB kelihatan. Diabaikan diam-diam persis cara
          # sebuah salinan kedua jadi basi tanpa ketahuan (revisi ke-26..28).
          if ASING="$(grep -E '^[A-Z0-9_]+=[0-9a-f]{40}$' /tmp/pins.env \
                      | grep -vxF -f /tmp/pins.export)"; then
            echo "CATATAN: baris berbentuk sah tapi DI LUAR tujuh nama - tidak diekspor:"
            printf '%s\n' "$ASING" | sed 's/^/  /'
          fi

          cat /tmp/pins.export >> "$GITHUB_ENV"

          echo "== pin yang dipakai build ini =="
          sed 's/^/  /' /tmp/pins.export

          # Daftar delapan nilai yang diharapkan SUDAH DICABUT di revisi ke-27.
          # Ia hanya perlu sekali, untuk membuktikan revisi ke-26 memindahkan pin
          # tanpa mengubah satu huruf pun (terbukti di run 34772090899). Sejak
          # tombol "Naikkan pin" hidup, pins.env memang HARUS boleh berubah -
          # daftar itu justru akan menggagalkan setiap kenaikan yang sah.
          #
          # Yang menjaga kebenaran pin sekarang bukan daftar di sini, melainkan:
          #   - step triase di naikkan-pin.yml, yang menolak kenaikan menyentuh
          #     file sensitif sebelum sebaris pun ditulis ke pins.env;
          #   - assert per komponen di step-step di bawah (KERNEL_ACT vs
          #     KERNEL_PIN, HEAD xxKSU dan NoMount vs pin, self-heal clang/AK3,
          #     dan seterusnya).

      - name: Pasang dependency build
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl flex git kmod \
            libelf-dev libssl-dev zip zlib1g-dev xxd python3 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libc6-dev-arm64-cross
          # Revisi ke-119: libc6-dev-arm64-cross WAJIB ditulis sendiri. Ia cuma
          # "Recommends" dari gcc-aarch64-linux-gnu, jadi --no-install-recommends
          # membuangnya; nm ber-libc (NoMount 1e800826e+) lalu gagal di
          # "bits/wordsize.h: No such file" (run 43782879394). nm freestanding
          # lama tidak butuh header libc, jadi selama ini tidak ketahuan.
          # Revisi ke-55: libtinfo5/libncurses5 dibuang - tidak ada di 24.04
          # dan tidak dibutuhkan (diuji: run 36085113472 sukses tanpa keduanya).
          # gcc-aarch64-linux-gnu kini gcc 13 (dulu 11); ia cuma dipakai
          # untuk nm, yang tidak ikut masuk zip flash.

      - name: Clone source kernel (dlagia/android_kernel_xiaomi_rosemary @ rosemary-13)
        run: |
          git clone --depth=1 -b rosemary-13 \
            https://github.com/dlagia/android_kernel_xiaomi_rosemary.git kernel
          echo "KERNEL_SHA=$(git -C kernel rev-parse --short=9 HEAD)" >> "$GITHUB_ENV"
          echo "Kernel source commit: $(git -C kernel rev-parse HEAD)"

          # ----- ASSERT SHA SOURCE KERNEL (revisi ke-18, 2026-09-12) -----
          # Ini dependency terakhir yang masih MENGAMBANG: branch rosemary-13.
          # Integrasi xxKSU/NoMount di bawah, plus setiap fixer Python di
          # workflow ini (memori, CVE rtmutex, flush_work), diaudit terhadap
          # ISI POHON commit di bawah. Kalau dlagia mendorong commit baru yang
          # menyentuh berkas yang ditambal, fixer bisa berhenti di anchor atau
          # - lebih buruk - cocok di tempat yang salah. Jadi drift-nya dibuat
          # KERAS, bukan diam-diam. (Sampai revisi ke-117 alasan utamanya
          # patch SUSFS 4.14 dan audit reject-nya.)
          # KERNEL_PIN dari pins.env (revisi ke-26).
          KERNEL_ACT="$(git -C kernel rev-parse HEAD)"
          test "$KERNEL_ACT" = "$KERNEL_PIN" || {
            echo "ERROR: source kernel bukan commit yang diaudit."
            echo "  diharapkan: $KERNEL_PIN"
            echo "  aktual    : $KERNEL_ACT"
            echo "Yang harus dilakukan sebelum menaikkan pin ini:"
            echo "  1) git log --stat $KERNEL_PIN..$KERNEL_ACT"
            echo "     (SELURUH pohon: Makefile untuk SUBLEVEL; mm/, kernel/sysctl.c dan"
            echo "     zram untuk step memori; kernel/locking/rtmutex.c; block/blk-core.c;"
            echo "     fs/ untuk NoMount; drivers/ dan security/ untuk xxKSU)"
            echo "  2) kalau berkas yang ditambal tersentuh: jalankan ulang fixer step itu"
            echo "     di pohon baru (semuanya ber-anchor dan berhenti kalau tidak cocok)."
            echo "  3) kalau rosemary_defconfig tersentuh: ulangi audit defconfig."
            exit 1
          }
          echo "OK: source kernel ter-pin di $KERNEL_PIN"

      # Revisi ke-118: BakaSU + SUSFS (dlagia/Build-Kernel_scripts) dicabut,
      # diganti xxKSU. Alasan dan batasnya di kepala berkas, REVISI KE-118.
      - name: Integrasikan xxKSU (backslashxx/KernelSU, setup.sh resmi, di-PIN)
        working-directory: kernel
        run: |
          set -euo pipefail

          # Pohon kernel harus masih polos. setup.sh menolak diam-diam
          # sebagian langkahnya kalau KernelSU/ sudah ada, dan symlink lama
          # akan menunjuk ke pohon yang bukan pin.
          for p in KernelSU drivers/kernelsu; do
            if [ -e "$p" ] || [ -L "$p" ]; then
              echo "ERROR: $p sudah ada sebelum integrasi - source kernel berubah."
              exit 1
            fi
          done

          # Build ini memakai hook TABEL SYSCALL (CONFIG_KSU_TAMPER_SYSCALL_TABLE).
          # Panduan xxKSU: "enable CONFIG_KSU_TAMPER_SYSCALL_TABLE=y and SKIP ALL
          # manual hooks". Kalau source kernel suatu saat membawa hook manual
          # sendiri (ksu_handle_* di fs/exec.c dkk) atau sisa SUSFS, hasilnya
          # hook ganda / simbol tak terdefinisi yang baru ketahuan di HP.
          SISA=$(grep -rIlE 'ksu_handle_|CONFIG_KSU|[Ss][Uu][Ss][Ff][Ss]' \
                   --include='*.c' --include='*.h' --include='Kconfig*' \
                   --include='Makefile' --include='*defconfig' \
                   --exclude-dir=.git . 2>/dev/null || true)
          if [ -n "$SISA" ]; then
            echo "ERROR: source kernel sudah berisi rujukan KSU/SUSFS sebelum integrasi:"
            printf '%s\n' "$SISA" | sed 's/^/  /'
            echo "Build ini mengandaikan pohon polos + hook tabel syscall."
            exit 1
          fi
          echo "OK: source kernel polos (nol ksu_handle_/CONFIG_KSU/susfs)"

          # setup.sh diambil dari commit pin yang sama, bukan dari branch.
          curl -fLSs "https://raw.githubusercontent.com/backslashxx/KernelSU/${KSU_PIN}/kernel/setup.sh" \
            -o /tmp/xxksu_setup.sh
          grep -q 'git clone https://github.com/backslashxx/KernelSU' /tmp/xxksu_setup.sh || {
            echo "ERROR: setup.sh xxKSU tidak lagi meng-clone backslashxx/KernelSU:"
            grep -n 'git clone' /tmp/xxksu_setup.sh || true
            exit 1
          }
          bash /tmp/xxksu_setup.sh "$KSU_PIN" < /dev/null
          rm -f /tmp/xxksu_setup.sh

          test -d KernelSU/.git || { echo "ERROR: KernelSU/ tidak dibuat setup.sh"; exit 1; }

          # setup.sh menelan kegagalan checkout ("|| echo Checkout default
          # branch"), jadi HEAD diperiksa di sini. Self-heal per-SHA untuk
          # commit yang jadi orphan sesudah force-push upstream.
          KSU_HEAD="$(git -C KernelSU rev-parse HEAD)"
          if [ "$KSU_HEAD" != "$KSU_PIN" ]; then
            echo "[!] KernelSU di $KSU_HEAD, bukan pin $KSU_PIN - ambil langsung per-sha"
            git -C KernelSU fetch origin "$KSU_PIN" && git -C KernelSU checkout -q FETCH_HEAD || true
            KSU_HEAD="$(git -C KernelSU rev-parse HEAD)"
          fi
          test "$KSU_HEAD" = "$KSU_PIN" || {
            echo "ERROR: xxKSU tidak ter-checkout ke commit pin."
            echo "  diharapkan: $KSU_PIN"
            echo "  aktual    : $KSU_HEAD"
            exit 1
          }
          if [ -n "$(git -C KernelSU status --porcelain)" ]; then
            echo "ERROR: pohon KernelSU tidak bersih sesudah checkout:"
            git -C KernelSU status --porcelain | head -20
            exit 1
          fi
          echo "OK: xxKSU ter-pin di $KSU_PIN, pohon bersih"

          # Tiga hal yang dikerjakan setup.sh, diperiksa satu per satu.
          test -L drivers/kernelsu || { echo "ERROR: symlink drivers/kernelsu tidak dibuat"; exit 1; }
          for f in Kconfig Makefile ksu.c hook/syscall_table_hook_arm64.c; do
            test -s "drivers/kernelsu/$f" || { echo "ERROR: drivers/kernelsu/$f tidak ada"; exit 1; }
          done
          N_MK=$(grep -cxF 'obj-$(CONFIG_KSU) += kernelsu/' drivers/Makefile || true)
          N_KC=$(grep -cxF 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig || true)
          if [ "$N_MK" != "1" ] || [ "$N_KC" != "1" ]; then
            echo "ERROR: entri kernelsu di drivers/Makefile=$N_MK, drivers/Kconfig=$N_KC (masing-masing wajib 1)."
            echo "  (setup.sh menyisipkan sebelum SETIAP 'endmenu' di drivers/Kconfig)"
            grep -n 'kernelsu' drivers/Makefile drivers/Kconfig || true
            exit 1
          fi
          echo "OK: symlink + drivers/Makefile + drivers/Kconfig"

          # Simbol yang ditulis step defconfig harus benar-benar ada di Kconfig
          # pin ini; simbol yang tidak dikenal dibuang Kconfig tanpa suara.
          for s in KSU KSU_TAMPER_SYSCALL_TABLE KSU_LSM_SECURITY_HOOKS; do
            N=$(grep -cE "^config ${s}\$" drivers/kernelsu/Kconfig || true)
            if [ "$N" != "1" ]; then
              echo "ERROR: 'config $s' ketemu $N kali di Kconfig xxKSU (wajib 1) - Kconfig upstream berubah."
              exit 1
            fi
          done
          if grep -rIqi 'susfs' KernelSU/kernel; then
            echo "ERROR: pohon xxKSU kini menyebut susfs - andaian revisi ke-118 (tanpa SUSFS) perlu ditinjau:"
            grep -rIli 'susfs' KernelSU/kernel | head
            exit 1
          fi

          # KSU_VERSION xxKSU konstanta di Makefile (bukan hitungan commit),
          # jadi tidak ada lagi syarat clone penuh maupun urusan "-dirty".
          KSU_VER=$(grep -oE 'DKSU_VERSION=[0-9]+' KernelSU/kernel/Makefile | head -1 | cut -d= -f2)
          printf '%s' "$KSU_VER" | grep -qE '^[0-9]{5}$' || {
            echo "ERROR: KSU_VERSION tak terbaca dari KernelSU/kernel/Makefile (dapat: '${KSU_VER:0:40}')"
            exit 1
          }
          echo "== manager yang dikenali kernel ini =="
          grep -E '^KSU_(PACKAGE_NAME|EXPECTED_SIZE|EXPECTED_HASH) :=' KernelSU/kernel/Makefile
          N_MGR=$(grep -cE '^KSU_(PACKAGE_NAME|EXPECTED_SIZE|EXPECTED_HASH) :=' KernelSU/kernel/Makefile || true)
          test "$N_MGR" = "3" || { echo "ERROR: identitas manager di Makefile xxKSU tak terbaca ($N_MGR dari 3 baris)"; exit 1; }

          echo "KSU_SHA=$(git -C KernelSU rev-parse --short=9 HEAD)" >> "$GITHUB_ENV"
          echo "KSU_VER=$KSU_VER" >> "$GITHUB_ENV"
          echo "xxKSU commit: $KSU_HEAD (KSU_VERSION $KSU_VER)"
          echo "Integrasi xxKSU: SUKSES"

      - name: Bersihkan -dirty dari setlocalversion
        working-directory: kernel
        run: |
          # Sama dengan bagian kedua step lama "Commit BakaSU + bersihkan
          # dirty". Bagian pertamanya (commit di KernelSU/ dan sed Kbuild)
          # tidak diperlukan lagi: tidak ada yang menyunting pohon xxKSU, dan
          # Makefile-nya tidak punya logika -dirty.
          if [ -f scripts/setlocalversion ]; then
            sed -i 's/-dirty//g' scripts/setlocalversion
            echo "scripts/setlocalversion sudah dibersihkan dari -dirty"
          fi

          find . -name setlocalversion -exec sed -i 's/-dirty//g' {} + 2>/dev/null || true

      - name: Integrasikan NoMount (setup.sh resmi, driver di-PIN)
        working-directory: kernel
        run: |
          # ==== PIN DRIVER NoMount (revisi audit ke-7) ====
          # Sebelumnya `bash -s dev` = checkout branch dev + `git pull` -> SELALU
          # ambil HEAD dev. Itu berarti KODE DRIVER yang di-compile berubah tiap
          # run. Karena setup.sh menerima argumen <commit-or-tag> (bukan cuma
          # nama branch), driver dipaku ke SHA supaya build reproducible.
          #
          # DINAIKKAN di revisi ke-15 (2026-09-12): 166f7b7c -> 6d8871dc, 19 commit.
          # Pin lama sengaja dipilih PRA-rewrite ART (RBTree) waktu penyebab stuck
          # di logo belum ketahuan. Penyebabnya sudah ketemu dan BUKAN NoMount,
          # sementara sejak f7f7caaf ("replace RBTree with Adaptive Radix Tree",
          # 2026-09-08) upstream menumpuk ~8 commit perbaikan di atasnya ("fix ART
          # child removal", "manage ART nodes under the rules lock", "preserve
          # directory lifetimes during rule deletion", "only change d_flags if its
          # our file", dst) - jadi bertahan di pra-ART justru berarti memakai kode
          # yang perbaikan-perbaikan itu tidak ikut.
          # Penjaga di bawah DIUJI ULANG terhadap 6d8871dc sebelum dinaikkan:
          # nomount_srcu masih ada di kernel/src/nomount.c (8 kemunculan),
          # userspace/src masih hanya nm.c + nm.h, _start masih didefinisikan via
          # inline asm di nm.h (jadi -Wl,-e,_start di step "Compile nm" masih
          # benar), dan kernel/setup.sh di HEAD BYTE-IDENTIK dengan pin 0c4b2dbd
          # yang dipakai di bawah - jadi pin script itu tetap sahih.
          # CATATAN: ini kenaikan PALING BERISIKO dari semuanya, karena kodenya
          # jalan di d_revalidate + iterate_dir sejak filesystem pertama diakses.
          # Kalau stuck di logo kembali, INI tersangka pertama - turunkan dulu
          # ke 166f7b7c untuk membuktikan.
          #
          # DINAIKKAN LAGI di revisi ke-20 (2026-09-12): 6d8871dc -> 7919faf2,
          # SATU commit, SATU file, kernel/src/nomount.c +2/-2. Judulnya "kernel:
          # replace implicit initialization with memset for compatibility" dan
          # diff-nya diperiksa baris per baris, bukan dipercaya dari judul:
          #   nomount_generate_virtual_topology():  *irule = (struct nomount_rule){0};
          #   nm_alloc_rule():                      *rule  = (struct nomount_rule){0};
          # keduanya jadi memset(ptr, 0, sizeof(*ptr)).
          # PERILAKU TIDAK BERUBAH: struct nomount_rule berakhir dengan flexible
          # array member `char paths[]` (nomount.h:127), dan sizeof() TIDAK
          # menghitung FAM - jadi kedua bentuk membersihkan byte yang persis sama
          # (bagian tetap saja); isi paths[] tetap ditulis memcpy sesudahnya.
          # Yang didapat justru soal kompatibilitas: assignment compound literal
          # ke struct ber-FAM ditolak/diperingatkan sebagian compiler lama, dan
          # memset selalu sah. Aman untuk 4.14 + proton-clang, dan tetap sejajar
          # dengan upstream. Per 2026-09-12 branch dev DAN master sama-sama
          # menunjuk 7919faf2.
          # Keempat penjaga DIUJI ULANG terhadap 7919faf2 sebelum dinaikkan:
          # kernel/setup.sh md5 deb7713c88a51e4c37ed88411ca2b95a - BYTE-IDENTIK
          # dengan pin loader 016375cd di bawah; nomount_srcu 8 kemunculan;
          # userspace/src tetap hanya nm.c + nm.h; `_start` tetap inline asm di
          # nm.h:25 (arm64), jadi -nostdlib -static -Wl,-e,_start di step "Compile
          # nm" tetap sahih.
          # DINAIKKAN LAGI di revisi ke-42 (2026-09-20): 7919faf2 -> d6cb7158,
          # 4 commit / 5 berkas. Yang masuk kernel cuma dua - kernel/src/nomount.c
          # (+35/-22) dan nomount.h (+1/-1); dua sisanya module/webroot (WebUI,
          # lokalisasi Arab) yang tidak pernah dikompilasi ke dalam Image. Robot
          # memvonisnya PERLU AUDIT karena keduanya kena ^kernel/src/. Auditnya
          # dikerjakan per commit, bukan dipercaya dari judulnya:
          #
          #   002157ad "kernel: initializate srcu struct manually"
          #     DEFINE_STATIC_SRCU(nomount_srcu) di nomount.h diganti
          #     `static struct srcu_struct nomount_srcu;`, dengan
          #     init_srcu_struct() di awal nomount_init() dan
          #     cleanup_srcu_struct() baik di jalur gagal register_key_type()
          #     maupun di nomount_exit(). Diperiksa untuk 4.14:
          #       - init_srcu_struct()/cleanup_srcu_struct() ada di 4.14 dan
          #         sah dipanggil dari fs_initcall - alokasi per-CPU yang
          #         dipakai TREE_SRCU sudah hidup jauh sebelum initcall itu;
          #       - nomount.h hanya di-include nomount.c (satu-satunya .c di
          #         kernel/src), jadi `static` di header tidak menggandakan
          #         struct;
          #       - pemakaian pertama nomount_srcu (srcu_read_lock di
          #         nomount_get_rule_info) baru terjangkau sesudah ada rule,
          #         jadi tidak ada jalur yang memakainya sebelum init.
          #     Yang benar-benar berubah: jaminannya pindah dari linker ke satu
          #     baris kode yang bisa hilang di kenaikan berikutnya. Penjaga
          #     `grep -q nomount_srcu` di bawah TIDAK melihat bedanya, karena
          #     kedua bentuk sama-sama memuat kata itu - jadi penjaganya
          #     ditambah, lihat blok "srcu" di step ini.
          #
          #   d6cb7158 "kernel: fix dcache invalidation and ghost files on exclusions"
          #     (a) nm_d_revalidate(): cek `!inode && has_rule` PINDAH dari
          #         cabang uid-normal ke cabang uid-diblokir. Di tempat lamanya
          #         ia KODE MATI - kalau has_rule true, blok `if (has_rule)` di
          #         atasnya sudah return atau goto lebih dulu, jadi baris itu
          #         tidak pernah dicapai dengan has_rule true. Di cabang
          #         diblokir ia justru hidup: dentry negatif yang punya rule
          #         di-drop supaya uid lain tetap melihat berkas injeksinya
          #         (inilah "ghost files on exclusions"). Perilaku uid normal
          #         TIDAK berubah sama sekali.
          #     (b) nomount_hijack_dentry_ops(): DCACHE_OP_REVALIDATE kini
          #         dipasang tanpa syarat, bukan cuma saat `injected`, dan
          #         jalur keluar-awal "d_op sudah milik kita" dibuang sehingga
          #         dentry yang sudah dibajak tetap kebagian flag-nya.
          #         Diperiksa: setiap cabang yang tersisa tetap menulis d_op ke
          #         nm_dops atau fake_dops SEBELUM flag dipasang, jadi flag itu
          #         tidak pernah menyala di dentry yang d_revalidate-nya bukan
          #         milik NoMount; d_flags tetap diubah di bawah d_lock; dan
          #         kelima pemanggilnya semuanya jalur lookup, bukan jalur yang
          #         sudah memegang d_lock, jadi hilangnya keluar-awal sebelum
          #         spin_lock() tidak menimbulkan deadlock.
          #     (c) shrink_dcache_parent() dipanggil sesudah hijack di
          #         nomount_generate_virtual_topology(). Ada di 4.14
          #         (include/linux/dcache.h:250, EXPORT_SYMBOL di fs/dcache.c)
          #         dan boleh tidur - fungsi pemanggilnya sudah memakai
          #         kern_path() dan kmalloc(GFP_KERNEL) di badan yang sama, jadi
          #         konteksnya memang konteks yang bisa tidur.
          #     DCACHE_DONTCACHE tetap tidak ada di 4.14, dan nomount.h masih
          #     menutupnya dengan `#ifndef DCACHE_DONTCACHE / #define ... 0`,
          #     jadi `d_flags |= DCACHE_DONTCACHE` tetap no-op seperti sebelum
          #     kenaikan ini - bukan perilaku baru yang menyelinap masuk.
          #
          # PALING BERISIKO di kenaikan ini, dan yang pertama dibatalkan kalau
          # boot gagal: (b). Ia MELEBARKAN cakupan d_revalidate - persis jalur
          # yang catatan revisi ke-15 di atas sebut sebagai tersangka pertama
          # kalau stuck di logo kembali. Mundurnya: NOMOUNT_PIN -> 7919faf2.
          # SUDAH DIUJI: rilis build-20260920-073811 diflash dan boot normal
          # (dikonfirmasi pemilik 2026-09-20), jadi (b) tidak terbukti merusak
          # boot di pohon ini. Catatan risikonya sengaja TIDAK dihapus - yang
          # dibuktikan flash itu satu SHA pada satu perangkat, bukan bahwa
          # jalur d_revalidate berhenti jadi tersangka di kenaikan berikutnya.
          # Keempat penjaga revisi ke-20 diuji ulang terhadap d6cb7158:
          # kernel/setup.sh md5 tetap deb7713c88a51e4c37ed88411ca2b95a alias
          # BYTE-IDENTIK dengan pin loader 016375cd; nomount_srcu tetap ada (11
          # kemunculan, dulu 8); userspace/src tetap cuma nm.c + nm.h dan tidak
          # tersentuh kenaikan ini sama sekali; `_start` tetap inline asm di
          # nm.h, jadi -nostdlib -static -Wl,-e,_start tetap sahih.
          #
          # NOMOUNT_PIN dari pins.env (revisi ke-26). Nilai saat ini
          # a8fe2f20 = HEAD dev (2026-09-24, revisi ke-52): d6cb7158 dinaikkan
          # 15 commit sesudah upstream memperbaiki kebocoran r_path (nomount#77).
          # Audit lengkapnya di blok NoMount pins.env. Penjaga SRCU di bawah
          # kini bersyarat, dan ada penjaga baru untuk jalur yang pernah bocor.
          # NOMOUNT_LOADER_PIN 2905772de = HEAD master (revisi ke-53);
          # kernel/setup.sh tetap blob 76636501 sejak 016375cd.
          # Revisi ke-53: dev 2905772de DITAHAN - clear_all-nya membebaskan
          # rule tanpa melepasnya dari children direktori (use-after-free).
          # SUDAH DIUJI (a8fe2f20): rilis build-20260924-011546 diflash dan
          # boot normal (dikonfirmasi pemilik 2026-09-24).
          # Revisi ke-54: upstream membatalkan 646b62e41 (305d2cb00,
          # nomount#79); NOMOUNT_PIN dan NOMOUNT_LOADER_PIN naik ke 46b7d582e.
          # SUDAH DIUJI: build-20260925-002642 boot normal (dikonfirmasi
          # pemilik 2026-09-25). Audit di blok NoMount pins.env; ketiga penjaga
          # NoMount di bawah disimulasikan atas 46b7d582e dan lolos.
          # Revisi ke-58: NOMOUNT_PIN naik ke 60073edc5 (HEAD dev), dengan
          # tambalan jalur cepat v_inode di bawah. BELUM DIUJI di HP.
          # Revisi ke-58b: tambalan kedua, evict inode virtual lewat jalur
          # generik lagi (lihat blok 58b di bawah).

          # pipefail: tanpa ini, exit code pipeline = exit code `bash` saja,
          # sehingga HTTP 404/500 dari curl tidak pernah menggagalkan step.
          set -o pipefail
          rm -rf NoMount fs/nomount
          # Revisi ke-78 - PIN NoMount YANG ORPHAN DULU MEMATIKAN BUILD. setup.sh
          # (set -eu) meng-clone repo, `git fetch --all --tags`, lalu
          # `git checkout "$1"` TANPA `||`. Commit yang sudah lepas dari cabang
          # (upstream force-push dev, sudah terjadi 2026-09-30 atas 88c5eccaf)
          # tidak ikut fetch itu, jadi checkout gagal: "fatal: unable to read
          # tree", exit 128 - disimulasikan 2026-10-03 dengan setup.sh
          # c5fad9d8f atas 88c5eccaf. KSU, clang dan AK3 menyembuhkan diri lewat
          # fetch-by-SHA; NoMount tidak, sehingga setiap build ulang - termasuk
          # mundur ke jaring lama di pins.env - mati sampai pin dinaikkan.
          # Obatnya tanpa menyentuh setup.sh: clone lebih dulu dan ambil SHA pin
          # per-hash (GitHub tetap melayaninya walau orphan). setup.sh melihat
          # NoMount/ sudah ada, melewati clone-nya sendiri, dan checkout-nya
          # menemukan objek itu secara lokal. Untuk pin yang masih di cabang,
          # fetch ini no-op.
          git clone -q https://github.com/maxsteeel/nomount NoMount
          git -C NoMount fetch -q origin "$NOMOUNT_PIN"
          # setup.sh sendiri tetap di-pin ke commit tertentu (isi script stabil);
          # argumen $1 = commit driver yang mau di-checkout (detached HEAD).
          # -f: HTTP >=400 -> curl exit != 0 (tanpa -f, halaman error ikut ter-pipe
          # ke bash sebagai "script" dan bash keluar 0).
          # Revisi ke-21 (2026-09-13): pin loader dinaikkan 0c4b2dbd -> 016375cd
          # (HEAD master). kernel/setup.sh di kedua commit md5-nya sama
          # (deb7713c88a51e4c37ed88411ca2b95a) alias BYTE-IDENTIK, jadi ini murni
          # supaya URL tidak tertinggal di commit lama - nol perubahan perilaku.
          curl -fLSs "https://raw.githubusercontent.com/maxsteeel/nomount/${NOMOUNT_LOADER_PIN}/kernel/setup.sh" | bash -s "$NOMOUNT_PIN"

          test -d NoMount || {
            echo "ERROR: direktori NoMount tidak ditemukan setelah setup.sh"
            exit 1
          }

          echo "NoMount commit dipakai (kernel + nm): $(git -C NoMount rev-parse HEAD)"
          # setup.sh mem-checkout SHA -> detached HEAD (bukan branch), jadi
          # verifikasinya adalah kecocokan commit, bukan nama branch.
          test "$(git -C NoMount rev-parse HEAD)" = "$NOMOUNT_PIN" || {
            echo "ERROR: NoMount tidak ter-checkout ke commit pin ($NOMOUNT_PIN)"
            echo "HEAD aktual: $(git -C NoMount rev-parse HEAD)"
            exit 1
          }

          test -L fs/nomount || {
            echo "ERROR: symlink fs/nomount tidak dibuat oleh setup.sh"
            exit 1
          }
          test -s fs/nomount/Kconfig
          test -s fs/nomount/Makefile
          test -s fs/nomount/nomount.c
          test -s fs/nomount/nomount.h

          echo ""
          echo "== PERBAIKAN bug duplikasi fs/Kconfig upstream =="
          python3 - << 'PYEOF'
          path = "fs/Kconfig"
          target = 'source "fs/nomount/Kconfig"\n'

          with open(path) as f:
              lines = f.readlines()

          idxs = [i for i, l in enumerate(lines) if l == target]
          print(f"Ditemukan {len(idxs)} baris '{target.strip()}' di fs/Kconfig")

          if len(idxs) == 0:
              print("ERROR: baris source fs/nomount/Kconfig tidak ditemukan sama sekali")
              raise SystemExit(1)
          elif len(idxs) == 1:
              print("OK: cuma 1 baris kali ini - tidak perlu diperbaiki")
          else:
              endmenu_idxs = [i for i, l in enumerate(lines) if l.strip() == "endmenu"]
              if not endmenu_idxs:
                  print("ERROR: tidak ada baris endmenu di fs/Kconfig - struktur tidak dikenal")
                  raise SystemExit(1)
              last_endmenu = endmenu_idxs[-1]
              keep_idx = last_endmenu - 1 if (last_endmenu - 1) in idxs else idxs[-1]
              new_lines = [l for i, l in enumerate(lines) if l != target or i == keep_idx]
              with open(path, "w") as f:
                  f.writelines(new_lines)
              sisa = new_lines.count(target)
              print(f"Diperbaiki: {len(idxs)} -> {sisa} baris (dipertahankan indeks {keep_idx}, tepat sebelum endmenu top-level)")
              if sisa != 1:
                  print("ERROR: perbaikan gagal, jumlah baris akhir bukan 1")
                  raise SystemExit(1)
          PYEOF

          echo ""
          echo "==================== NoMount (branch dev, via setup.sh resmi) ===================="
          echo "NoMount source: $(readlink -f fs/nomount)"
          grep -nF 'source "fs/nomount/Kconfig"' fs/Kconfig || true
          test "$(grep -cF 'source "fs/nomount/Kconfig"' fs/Kconfig)" = "1" || {
            echo "ERROR: fs/Kconfig masih mengandung duplikasi setelah perbaikan"
            exit 1
          }
          # Revisi ke-52: upstream d15d5404 membuang nomount_srcu seluruhnya
          # (pembaca rcu_read_lock() biasa, rule dibebaskan sesudah
          # synchronize_rcu()). Dulu kata nomount_srcu WAJIB ada; sekarang
          # dua keadaan yang sah: SRCU dipakai DAN diinisialisasi (blok di
          # bawah), atau SRCU tidak disebut sama sekali. Yang ditolak adalah
          # sisa srcu_read_lock/synchronize_srcu tanpa struct-nya.
          if grep -q 'nomount_srcu' fs/nomount/nomount.c fs/nomount/nomount.h; then
            NM_SRCU=1
          else
            NM_SRCU=0
            if grep -n 'srcu_read_lock\|synchronize_srcu\|srcu_struct' fs/nomount/nomount.c fs/nomount/nomount.h; then
              echo "ERROR: sisa SRCU di NoMount tanpa nomount_srcu - audit ulang"
              exit 1
            fi
          fi

          # Revisi ke-42: penjaga di atas cuma memastikan KATA nomount_srcu ada,
          # dan itu sudah tidak cukup sejak upstream 002157ad. Sampai 7919faf2
          # struct-nya dibuat DEFINE_STATIC_SRCU() - terinisialisasi saat link,
          # jadi tidak ada yang bisa lupa menginisialisasinya. Sekarang ia
          # `static struct srcu_struct nomount_srcu;` biasa yang bergantung pada
          # satu baris init_srcu_struct() di nomount_init(). Kedua bentuk lolos
          # penjaga di atas. Kalau baris init itu hilang di kenaikan berikutnya,
          # srcu_read_lock() atas struct yang belum diinisialisasi TIDAK gagal
          # saat kompilasi - ia merusak memori saat boot, dan gejalanya adalah
          # stuck di logo tanpa satu pun pesan yang menyebut SRCU. Jadi yang
          # di-assert adalah pertanyaan yang sebenarnya: siapa yang
          # menginisialisasi struct ini?
          if [ "$NM_SRCU" = "0" ]; then
            echo "OK: NoMount tidak memakai SRCU (RCU biasa sejak d15d5404)"
          elif grep -q 'DEFINE_STATIC_SRCU(nomount_srcu)' fs/nomount/nomount.h; then
            echo "OK: nomount_srcu statis (DEFINE_STATIC_SRCU) - init saat link"
          elif grep -q 'init_srcu_struct(&nomount_srcu)' fs/nomount/nomount.c; then
            echo "OK: nomount_srcu diinisialisasi manual (init_srcu_struct di nomount_init)"
          else
            echo "ERROR: nomount_srcu dipakai tapi tidak ada yang menginisialisasinya."
            echo "       Tidak ada DEFINE_STATIC_SRCU(nomount_srcu) di nomount.h DAN"
            echo "       tidak ada init_srcu_struct(&nomount_srcu) di nomount.c."
            echo "       Ini tidak akan gagal saat kompilasi - jadi dihentikan di sini."
            exit 1
          fi

          # Revisi ke-52: kebocoran r_path (nomount#77, diperbaiki upstream di
          # a8fe2f2). Di nomount_resolve_rule_dentry() hanya panggilan KEDUA
          # __nomount_get_rule_info() yang boleh get_path=true, dan itu satu-
          # satunya di seluruh berkas. Jumlah lain = kode berubah di jalur yang
          # pernah bocor, jadi audit ulang dulu sebelum membangun.
          # Guard NoMount (revisi ke-80): cek STRUKTUR refcount, bukan jumlah string.
          # Bentuk lama "tepat 1 &rule_info,true)" tetap diterima (titik B e2513c3ac).
          # NoMount 2.1 (594778b39, 7046c7ad3) lolos lewat struktur. Guard ini
          # cuma memastikan bentuknya; keamanan refcount-nya dari audit di
          # pins.env: atomic_inc refs dan path_get r_path di bagian RCU aman
          # (audit 2026-10-13 + revisi ke-81), boot terbukti di titik C.
          NM=fs/nomount/nomount.c
          N_GET_PATH="$(grep -c "&rule_info, true)" "$NM" || true)"
          if [ "$N_GET_PATH" = "1" ]; then
            echo "OK: bentuk lama (get_path tepat 1)"
          else
            # Revisi ke-87: sejak e077d8b68 resolver dipecah jadi
            # nm_resolve_rule_from_leaf / nm_resolve_rule_default; tiap resolver
            # tepat satu atomic_inc + satu path_get.
            # Revisi ke-113: sejak 3effd3810 resolver mengembalikan int (1 = ada
            # rule, 0 = tidak, <0 = -ENOMEM dari kmemdup nama). Bentuk int hanya
            # aman kalau SETIAP pemanggil mengembalikan ERR_PTR untuk nilai negatif
            # SEBELUM nm_materialize_rule() - kalau tidak, -ENOMEM dibaca "ketemu"
            # dan rule_info kosong ikut dimaterialisasi. Nama + saved_parent yang
            # dibawa resolver dilepas tepat sekali di nm_materialize_rule().
            N_RESOLVE="$(grep -cE "^static (bool|int) nm_resolve_rule(_from_leaf|_default)?\(" "$NM" || true)"
            N_RINT="$(grep -cE "^static int nm_resolve_rule(_from_leaf|_default)?\(" "$NM" || true)"
            N_INTOK=1
            if [ "$N_RINT" != "0" ]; then
              N_CALL="$(grep -cE "found = nm_resolve_rule(_from_leaf|_default)?\(" "$NM" || true)"
              N_NEG="$(grep -cF "if (found < 0) return ERR_PTR(found);" "$NM" || true)"
              N_SPUT="$(grep -cF "dput(rule_info->saved_parent)" "$NM" || true)"
              N_NFREE="$(grep -cF "kfree(rule_info->r_name)" "$NM" || true)"
              echo "Resolver int: pemanggil=$N_CALL cek-negatif=$N_NEG dput-saved_parent=$N_SPUT kfree-r_name=$N_NFREE"
              if [ "$N_CALL" -lt 1 ] || [ "$N_NEG" != "$N_CALL" ] || [ "$N_SPUT" != "1" ] || [ "$N_NFREE" != "1" ]; then
                N_INTOK=0
              fi
            fi
            N_INC="$(grep -c "atomic_inc(&out->this_dir->refs)" "$NM" || true)"
            N_PGET="$(grep -c "path_get(&out->r_path)" "$NM" || true)"
            N_MAT="$(grep -c "^static struct dentry \*nm_materialize_rule(" "$NM" || true)"
            N_DPUT="$(grep -c "nm_dir_put(rule_info->this_dir)" "$NM" || true)"
            N_PPUT="$(grep -c "path_put(&rule_info->r_path)" "$NM" || true)"
            # Revisi ke-119: sejak f18a7206e/7f732b6b8 resolver juga memegang
            # ref leaf untuk rule berkas; pasangannya nm_leaf_put() di
            # nm_materialize_rule(). Pin lama tidak punya keduanya (0 = 0).
            N_LINC="$(grep -cF "atomic_inc(&out->leaf->refs)" "$NM" || true)"
            N_LPUT="$(grep -cF "nm_leaf_put(rule_info->leaf)" "$NM" || true)"
            N_LEAFOK=1
            if [ "$N_LINC" != "0" ] || [ "$N_LPUT" != "0" ]; then
              echo "Ref leaf: inc=$N_LINC put=$N_LPUT"
              if [ "$N_LINC" != "$N_RESOLVE" ] || [ "$N_LPUT" != "1" ]; then
                N_LEAFOK=0
              fi
            fi
            if [ "$N_RESOLVE" -ge 1 ] && [ "$N_INC" = "$N_RESOLVE" ] && [ "$N_PGET" = "$N_RESOLVE" ] \
               && [ "$N_MAT" = "1" ] && [ "$N_DPUT" = "1" ] && [ "$N_PPUT" = "1" ] && [ "$N_INTOK" = "1" ] \
               && [ "$N_LEAFOK" = "1" ]; then
              echo "OK: struktur nm_resolve_rule + nm_materialize_rule (refs/r_path seimbang)"
              echo "Catatan: keamanan refcount nm_resolve_rule dari audit di pins.env, bukan dari guard ini"
            else
              echo "ERROR: guard NoMount gagal. get_path=$N_GET_PATH resolve=$N_RESOLVE inc=$N_INC pget=$N_PGET mat=$N_MAT dput=$N_DPUT pput=$N_PPUT int-ok=$N_INTOK leaf-ok=$N_LEAFOK"
              grep -n "__nomount_get_rule_info(" "$NM" || true
              exit 1
            fi
          fi

          # Revisi ke-53: upstream 646b62e41 membuat __nomount_clear_all()
          # membebaskan rule sesudah hash_del_rcu() saja, tanpa melepasnya dari
          # children direktori induk. Direktori asli yang dibajak lalu memegang
          # pointer ke rule yang sudah di-kfree (use-after-free di lookup
          # berikutnya), dan pemicunya `nm clear all` - dijalankan customize.sh
          # setiap update modul. Yang di-assert: badan fungsi itu melepas rule
          # dari children, lewat nm_detach_rule_locked() /
          # __nomount_delete_child_locked() (a8fe2f20) atau mengosongkan
          # ->children langsung (d6cb7158). Fungsi tidak ditemukan = gagal juga.
          # Revisi ke-87: fdaff1ed7 mengganti awalan nomount_ jadi nm_; fungsinya
          # kini nm_clear_state() dan melepas lewat nm_delete_child_locked(leaf, true).
          NM_CLEAR="$(awk '/^static void (__nomount_clear_all|nm_clear_state)\(/{f=1} f{print} f&&/^}/{exit}' fs/nomount/nomount.c)"
          N_CLEAR="$(printf '%s\n' "$NM_CLEAR" | grep -c 'nm_detach_rule_locked(\|__nomount_delete_child_locked(\|nm_delete_child_locked(\|->children, NULL)' || true)"
          test "$N_CLEAR" -ge 1 || {
            echo "ERROR: __nomount_clear_all() tidak melepas rule dari children direktori."
            echo "       Rule yang dibebaskan tetap ditunjuk dir_node->children: use-after-free"
            echo "       saat 'nm clear all'. Audit ulang NoMount sebelum membangun."
            exit 1
          }
          echo "OK: __nomount_clear_all() melepas rule dari children direktori"

          # Revisi ke-58: upstream 60073edc5 ("fix race condition in concurrent
          # virtual inode initialization") memberi dir_node->v_inode keadaan
          # ketiga, (struct inode *)-2L = "sedang diinisialisasi CPU lain",
          # lewat cmpxchg NULL -> -2L di jalur lambat
          # nomount_resolve_rule_dentry(). Pemenangnya mengisi inode lalu
          # smp_store_release(); yang kalah berputar sampai nilainya bukan -2L.
          # Tapi jalur CEPAT di awal fungsi yang sama cuma mengenal NULL dan
          # -1L: ia membaca v_inode, menolak -1L, lalu igrab() apa pun yang
          # lain - termasuk -2L. igrab() langsung spin_lock(&inode->i_lock) di
          # alamat 0xfffffffffffffffe, jadi oops di lookup. Sebelum 60073edc5
          # v_inode lompat NULL -> inode dalam satu cmpxchg, jadi jalur cepat
          # tidak pernah melihat nilai setengah jadi; commit itu mengubah
          # balapan yang tadinya jinak jadi fatal, tepat di skenario yang ingin
          # ia perbaiki. Tambalannya: jalur cepat meneruskan -2L ke jalur
          # lambat, yang memang sudah menunggunya. splice_inode yang tertinggal
          # berisi -2L selalu ditimpa di sana sebelum dipakai. Tambalan
          # melewatkan dirinya sendiri kalau upstream sudah menangani -2L di
          # jalur cepat, dan GAGAL kalau bentuk kodenya berubah (audit ulang).
          python3 - << 'PYEOF'
          path = "fs/nomount/nomount.c"
          with open(path) as f:
              src = f.read()
          sentinel = "(struct inode *)-2L"
          fast = ("if (rule_info.this_dir && (splice_inode = "
                  "smp_load_acquire(&rule_info.this_dir->v_inode))) {")
          fixed = ("if (rule_info.this_dir && (splice_inode = "
                   "smp_load_acquire(&rule_info.this_dir->v_inode)) && "
                   "splice_inode != " + sentinel + ") {")
          if sentinel not in src:
              print("OK: NoMount tidak memakai sentinel -2L - jalur cepat tidak perlu ditambal")
          elif src.count(fixed) == 1:
              print("OK: jalur cepat v_inode sudah menolak -2L (tambalan sudah terpasang)")
          else:
              n = src.count(fast)
              if n != 1:
                  print(f"ERROR: jalur cepat v_inode diharapkan tepat 1, aktual {n} - audit ulang")
                  raise SystemExit(1)
              i = src.index(fast)
              j = src.find("goto do_splice;", i)
              if j < 0:
                  print("ERROR: 'goto do_splice;' tidak ada sesudah jalur cepat - audit ulang")
                  raise SystemExit(1)
              if sentinel in src[i:j]:
                  print("OK: upstream sudah menangani -2L di jalur cepat - tambalan dilewati")
              else:
                  src = src.replace(fast, fixed)
                  with open(path, "w") as f:
                      f.write(src)
                  print("Ditambal: jalur cepat v_inode kini meneruskan -2L ke jalur lambat")
          PYEOF

          # Revisi ke-58b: upstream 53e4c93e4 memindahkan pembersihan inode ke
          # nomount_hijacked_evict_inode() dan sekaligus mengirim inode VIRTUAL
          # (nm_file_iops/nm_dir_iops) ke ->evict_inode ASLI milik fs, yaitu
          # f2fs_evict_inode()/ext4_evict_inode(). Sampai 46b7d582e inode
          # virtual selalu lewat truncate_inode_pages_final() + clear_inode()
          # generik - jalur yang terbukti boot sejak revisi ke-15.
          # Inode virtual dibuat new_inode() di superblock direktori yang
          # dibajak, tapi i_ino-nya = v_ino = nomor inode berkas modul ASLI,
          # dan ia tidak pernah punya inode on-disk sendiri. Selama i_nlink = 1
          # kedua fs mengambil jalur no_delete dan tidak menyentuh disk. Tapi
          # direktori asli yang dibajak tetap memakai ->unlink/->rename milik
          # fs-nya (NoMount hanya mengganti ->lookup), dan f2fs_unlink() tidak
          # mencocokkan nomor inode entri dengan inode dentry. Di direktori rw,
          # `rm` atas berkas yang ditimpa NoMount menjatuhkan i_nlink inode
          # virtual ke 0, lalu f2fs_evict_inode() menjalankan f2fs_truncate()
          # dan f2fs_remove_inode_page() atas nid = v_ino: inode berkas modul
          # asli dihapus dari disk sementara entri direktorinya tetap ada.
          # Sebelum 53e4c93e4 jalur generik tidak pernah menulis ke disk.
          # Tidak memicu bootloop di HP ini (partisi sistem ext4 read-only,
          # modul tidak membajak /data), tapi ini kerusakan data yang
          # diam-diam. Tambalannya mengembalikan jalur generik KHUSUS inode
          # virtual; inode asli yang dibajak tetap lewat evict_inode asli, dan
          # nm_destroy_virtual_inode() tetap dipanggil. Dilewati kalau
          # upstream masih di destroy_inode (pra-53e4c93e4) atau sudah
          # menanganinya; GAGAL kalau bentuk kodenya berubah (audit ulang).
          python3 - << 'PYEOF'
          path = "fs/nomount/nomount.c"
          with open(path) as f:
              src = f.read()
          virt = "inode->i_op != &nm_file_iops && inode->i_op != &nm_dir_iops && "
          orig = "if (nm_sop && nm_sop->orig_sop && nm_sop->orig_sop->evict_inode) {"
          fixed = "if (" + virt + orig[len("if ("):]
          # Revisi ke-87: fdaff1ed7 mengganti nama jadi nm_hijacked_evict_inode dan
          # memisahkan inode virtual lewat nm_inode_is_virtual() di nomount.h.
          with open("fs/nomount/nomount.h") as f:
              hdr = f.read()
          # Revisi ke-119: upstream (HEAD dev 4a4b5645a) tidak lagi memakai
          # variabel "bool virtual"; inode virtual dipulangkan di awal fungsi
          # lewat jalur generik, sebelum evict_inode asli sempat dipanggil.
          def pulang_awal():
              i = src.find("static void nm_hijacked_evict_inode(struct inode *inode)\n{")
              j = src.find("\n}\n", i)
              if i < 0 or j < 0:
                  return False
              body = src[i:j]
              a = body.find("if (nm_inode_is_virtual(inode)) {")
              b = body.find("return;", a)
              c = body.find("orig_sop->evict_inode")
              if a < 0 or b < 0 or c < 0 or not b < c:
                  return False
              cabang = body[a:b]
              return ("truncate_inode_pages_final(&inode->i_data);" in cabang
                      and "clear_inode(inode);" in cabang
                      and "orig_sop" not in cabang
                      and body.count("orig_sop->evict_inode(inode)") == 1
                      and "return inode->i_op == &nm_file_iops || inode->i_op == &nm_dir_iops;" in hdr)
          if ("nm_sop->fake_sop.evict_inode = nomount_hijacked_evict_inode;" not in src
                  and "nm_sop->fake_sop.evict_inode = nm_hijacked_evict_inode;" not in src):
              print("ERROR: evict_inode tidak lagi dibajak NoMount - audit ulang")
              raise SystemExit(1)
          if "nm_sop->fake_sop.destroy_inode = nomount_hijacked_destroy_inode;" in src:
              print("OK: NoMount masih membersihkan di destroy_inode - evict virtual tetap generik")
          elif "!virtual && nm_sop && nm_sop->orig_sop" in src and (
                  "bool virtual = inode->i_op == &nm_file_iops" in src
                  or ("bool virtual = nm_inode_is_virtual(inode);" in src
                      and "return inode->i_op == &nm_file_iops || inode->i_op == &nm_dir_iops;" in hdr)):
              print("OK: upstream sudah memisahkan inode virtual di hijacked_evict_inode() - tambalan tidak diperlukan")
          elif pulang_awal():
              print("OK: upstream memulangkan inode virtual lewat jalur generik di awal nm_hijacked_evict_inode() - tambalan tidak diperlukan")
          elif src.count(fixed) == 1:
              print("OK: evict inode virtual sudah lewat jalur generik (tambalan sudah terpasang)")
          else:
              i = src.find("static void nomount_hijacked_evict_inode(")
              j = src.find("\n}\n", i)
              if i < 0 or j < 0:
                  print("ERROR: bentuk hijacked_evict_inode() tidak dikenali (bukan nomount_ lama, "
                        "bukan 'bool virtual', bukan pulang-awal inode virtual) - audit ulang")
                  raise SystemExit(1)
              body = src[i:j]
              if body.count(orig) != 1:
                  print(f"ERROR: cabang evict_inode asli diharapkan tepat 1, aktual {body.count(orig)} - audit ulang")
                  raise SystemExit(1)
              if "truncate_inode_pages_final(&inode->i_data);" not in body or "clear_inode(inode);" not in body:
                  print("ERROR: cabang generik evict tidak ditemukan - audit ulang")
                  raise SystemExit(1)
              src = src[:i] + body.replace(orig, fixed) + src[j:]
              with open(path, "w") as f:
                  f.write(src)
              print("Ditambal: inode virtual kembali di-evict lewat jalur generik")
          PYEOF

          # Revisi ke-122: 215c7f59c memasang encode_fh = nm_encode_fh di
          # export_operations tiruan untuk SETIAP superblock yang dibajak,
          # yang menjawab -EOPNOTSUPP kalau aslinya tanpa encode_fh. 4.14
          # memakai export_encode_fh() generik untuk kasus itu (ext4 dan
          # f2fs pohon ini tanpa encode_fh), jadi hook hanya dipasang kalau
          # aslinya punya encode_fh. Rincian di kepala berkas, REVISI KE-122.
          python3 - << 'PYEOF'
          path = "fs/nomount/nomount.c"
          with open(path) as f:
              src = f.read()
          lama = "    if (!sb->s_export_op || nm_sop->orig_export_op) return;\n"
          baru = "    if (!sb->s_export_op || !sb->s_export_op->encode_fh || nm_sop->orig_export_op) return;\n"
          i = src.find("static void nm_install_export_hook(struct nm_sop *nm_sop)\n{")
          if i < 0:
              if "s_export_op" in src:
                  print("ERROR: NoMount menyentuh s_export_op tanpa nm_install_export_hook() - audit ulang")
                  raise SystemExit(1)
              print("OK: NoMount tidak membajak export_operations - tambalan encode_fh tidak diperlukan")
              raise SystemExit(0)
          j = src.find("\n}\n", i)
          body = src[i:j]
          if body.count("nm_sop->fake_export_op.encode_fh = nm_encode_fh;") != 1:
              print("ERROR: bentuk nm_install_export_hook() tidak dikenali - audit ulang")
              raise SystemExit(1)
          if src.count("&nm_sop->fake_export_op") != 2 or src.count("nm_install_export_hook(nm_sop);") != 2:
              print("ERROR: pemasang/pemulih export_operations berubah - audit ulang")
              raise SystemExit(1)
          if body.count(baru) == 1:
              print("OK: hook encode_fh hanya untuk FS ber-encode_fh (sudah di upstream sejak e4f201e34, atau tambalan sudah terpasang)")
          elif body.count(lama) == 1:
              src = src[:i] + body.replace(lama, baru) + src[j:]
              with open(path, "w") as f:
                  f.write(src)
              print("Ditambal: hook encode_fh NoMount dilewati untuk FS tanpa encode_fh (ext4/f2fs 4.14 tetap generik)")
          elif "->encode_fh" in body.split("nm_sop->orig_export_op = ")[0]:
              print("OK: upstream sudah memeriksa encode_fh asli sebelum memasang hook - tambalan tidak diperlukan")
          else:
              print("ERROR: penjaga awal nm_install_export_hook() berubah - audit ulang")
              raise SystemExit(1)
          PYEOF

          # Entry fs/Makefile. setup.sh menambahkannya dengan penjaga longgar:
          #     if ! grep -q "nomount" "$FS_MAKEFILE"; then
          #         printf "\nobj-\$(CONFIG_NOMOUNT) += nomount/\n" >> "$FS_MAKEFILE"
          # Artinya kalau kata "nomount" sudah muncul di fs/Makefile karena sebab
          # lain (sisa run sebelumnya, komentar, patch lain), penambahan DILEWATI
          # tanpa peringatan -> CONFIG_NOMOUNT=y tapi objeknya tidak pernah
          # dikompilasi, dan kegagalannya baru terasa saat runtime di HP.
          # Jadi entry-nya diverifikasi eksplisit di sini.
          grep -nF 'obj-$(CONFIG_NOMOUNT) += nomount/' fs/Makefile || true
          test "$(grep -cF 'obj-$(CONFIG_NOMOUNT) += nomount/' fs/Makefile)" = "1" || {
            echo "ERROR: fs/Makefile tidak berisi tepat satu 'obj-\$(CONFIG_NOMOUNT) += nomount/'"
            echo "Baris fs/Makefile yang menyebut nomount:"
            grep -n 'nomount' fs/Makefile || echo "  (tidak ada sama sekali)"
            exit 1
          }
          echo "OK: fs/Makefile berisi obj-\$(CONFIG_NOMOUNT) += nomount/"

          echo "NOMOUNT_SHA=$(git -C NoMount rev-parse --short=9 HEAD)" >> "$GITHUB_ENV"
          echo "NoMount branch dev: OK"

      - name: Integrasikan fgetpriority (hook getpriority/ioprio, built-in, di-PIN)
        working-directory: kernel
        run: |
          set -euo pipefail

          # fgetpriority = LKM kecil backslashxx (penulis xxKSU) yang menyaring
          # hasil sys_getpriority/setpriority/ioprio_get/ioprio_set, supaya proses
          # app tidak terdeteksi lewat prioritas. Pengganti SUSFS priority-uid-
          # filter yang hilang saat pindah ke xxKSU (revisi ke-118). Dikompilasi
          # BUILT-IN (CONFIG_FGETPRIORITY=y), bukan modul: jalur "just compile it
          # in" resmi penulisnya, jadi bebas masalah LKM (init_user_ns tidak
          # diekspor ke modul = issue #14, vermagic). FGETPRIORITY_PIN dari
          # pins.env (revisi ke-120).
          #
          # Dukungan 4.14 ADA tapi tidak diuji upstream (matriks DDK mulai 5.10).
          # Yang membuatnya jalan di 4.14 dijaga eksplisit di bawah; kalau
          # upstream refactor dan satu penjaga jatuh, build GAGAL di sini - bukan
          # diam-diam di HP. Jaring terakhir saat runtime: kalau patch cabang
          # B/BL gagal, init jatuh ke kprobe pada find_user.

          for p in fgetpriority drivers/fgetpriority; do
            if [ -e "$p" ] || [ -L "$p" ]; then
              echo "ERROR: $p sudah ada sebelum integrasi - source kernel berubah."
              exit 1
            fi
          done

          # Clone + ambil SHA pin per-hash (orphan-proof, pola sama NoMount).
          git clone -q https://github.com/aerath-stuff/fgetpriority fgp-src
          git -C fgp-src fetch -q origin "$FGETPRIORITY_PIN" || true
          git -C fgp-src checkout -q "$FGETPRIORITY_PIN"
          test "$(git -C fgp-src rev-parse HEAD)" = "$FGETPRIORITY_PIN" || {
            echo "ERROR: fgetpriority tidak ter-checkout ke pin $FGETPRIORITY_PIN"
            echo "HEAD aktual: $(git -C fgp-src rev-parse HEAD)"
            exit 1
          }

          # Unity build: hanya main.o; main.c meng-include routine_*.c + header.
          # Revisi ke-124: daftar berkas tidak lagi ditulis satu per satu.
          # Upstream 9a38e02b0 mengganti nama arm64_branch_insn.h menjadi
          # arm64_branch_patch.h, dan daftar lama membuat build GAGAL di sini.
          # Kini semua *.c dan *.h di kernel/ upstream disalin, lalu setiap
          # '#include "..."' lokal wajib ada di drivers/fgetpriority/. Kalau
          # upstream memindah header ke luar kernel/, build tetap berhenti di
          # sini dengan pesan jelas, bukan di tengah compile. Berlaku juga
          # saat pin mundur ke 178dd7479 (nama header lama).
          mkdir drivers/fgetpriority
          for f in main.c routine_kp.c routine_raw.c Makefile Kconfig; do
            test -s "fgp-src/kernel/$f" || { echo "ERROR: fgp-src/kernel/$f tidak ada - struktur upstream berubah"; exit 1; }
          done
          cp fgp-src/kernel/*.c fgp-src/kernel/*.h fgp-src/kernel/Makefile fgp-src/kernel/Kconfig drivers/fgetpriority/
          for f in drivers/fgetpriority/*.c drivers/fgetpriority/*.h; do
            sed -nE 's/^[[:space:]]*#[[:space:]]*include[[:space:]]+"([^"]+)".*/\1/p' "$f" | while IFS= read -r inc; do
              test -s "drivers/fgetpriority/$inc" || {
                echo "ERROR: $f meng-include \"$inc\" yang tidak ada di kernel/ upstream - audit ulang"
                exit 1
              }
            done
          done
          echo "OK: berkas fgetpriority disalin:" drivers/fgetpriority/*

          # Kconfig upstream: 'config FGETPRIORITY' tristate default m, depends on
          # ARM64 && KALLSYMS. Dipaksa =y lewat defconfig; pastikan simbolnya ada
          # supaya Kconfig tidak membuangnya diam-diam.
          test "$(grep -cxF 'config FGETPRIORITY' drivers/fgetpriority/Kconfig)" = "1" || {
            echo "ERROR: 'config FGETPRIORITY' tidak ketemu tepat 1x di Kconfig - audit ulang"
            exit 1
          }
          grep -qF 'obj-$(CONFIG_FGETPRIORITY) += fgetpriority.o' drivers/fgetpriority/Makefile || {
            echo "ERROR: Makefile fgetpriority tidak lagi membangun fgetpriority.o - audit ulang"
            exit 1
          }
          grep -qF 'fgetpriority-y := main.o' drivers/fgetpriority/Makefile || {
            echo "ERROR: Makefile fgetpriority tidak lagi unity (main.o) - audit ulang"
            exit 1
          }

          # Sambung ke drivers/Kconfig (sisip sebelum endmenu terakhir, idempoten).
          python3 - << 'PYEOF'
          p = "drivers/Kconfig"
          kc = 'source "drivers/fgetpriority/Kconfig"\n'
          with open(p) as f:
              lines = f.readlines()
          if kc in lines:
              print("OK: source fgetpriority/Kconfig sudah ada di drivers/Kconfig")
          else:
              idx = [i for i, l in enumerate(lines) if l.strip() == "endmenu"]
              if not idx:
                  print("ERROR: tidak ada 'endmenu' di drivers/Kconfig")
                  raise SystemExit(1)
              lines.insert(idx[-1], kc)
              with open(p, "w") as f:
                  f.writelines(lines)
              print("Disisipkan source fgetpriority/Kconfig sebelum endmenu terakhir")
          PYEOF

          # Sambung ke drivers/Makefile (idempoten).
          MK='obj-$(CONFIG_FGETPRIORITY) += fgetpriority/'
          if [ "$(grep -cxF "$MK" drivers/Makefile)" = "0" ]; then
            printf '\n%s\n' "$MK" >> drivers/Makefile
          fi

          KC='source "drivers/fgetpriority/Kconfig"'
          N_KC=$(grep -cxF "$KC" drivers/Kconfig || true)
          N_MK=$(grep -cxF "$MK" drivers/Makefile || true)
          if [ "$N_KC" != "1" ] || [ "$N_MK" != "1" ]; then
            echo "ERROR: entri fgetpriority drivers/Kconfig=$N_KC drivers/Makefile=$N_MK (masing-masing wajib 1)"
            grep -n fgetpriority drivers/Kconfig drivers/Makefile || true
            exit 1
          fi
          echo "OK: drivers/Kconfig + drivers/Makefile berisi tepat satu entri fgetpriority"

          # ---- PENJAGA 4.14 BUILT-IN (revisi ke-120) ----
          M=drivers/fgetpriority
          # (1) Nama syscall <4.17 pakai bentuk telanjang (sys_getpriority), bukan
          #     __arm64_sys_. Kernel 4.14 < 4.17, cabang ini WAJIB ada - kalau
          #     hilang, 4.14 mencari simbol __arm64_sys_* yang tidak ada.
          if ! grep -qF 'kallsyms_lookup_name("__arm64_" name)' "$M/routine_raw.c" \
             || ! grep -qF 'kallsyms_lookup_name(name)' "$M/routine_raw.c"; then
            echo "ERROR: syscall_lookup kehilangan cabang nama telanjang (<4.17) - audit ulang"
            exit 1
          fi
          # (2) copy_from_kernel_nofault punya fallback <5.8 (4.14 belum punya API-nya).
          grep -qF 'KERNEL_VERSION(5, 8, 0)' "$M/main.c" || {
            echo "ERROR: fallback copy_from_kernel_nofault (<5.8) hilang - 4.14 tidak punya simbol itu"
            exit 1
          }
          # (3) Keempat callsite syscall tetap di-hook.
          for s in sys_getpriority sys_setpriority sys_ioprio_set sys_ioprio_get; do
            grep -qF "syscall_lookup(\"$s\")" "$M/routine_raw.c" || {
              echo "ERROR: callsite $s tidak lagi di-hook - audit ulang"
              exit 1
            }
          done
          # (4) Jaring kprobe pada find_user tetap ada (kalau raw-patch gagal).
          grep -qF 'init_kprobe("find_user"' "$M/routine_kp.c" || {
            echo "ERROR: jaring kprobe find_user hilang - tidak ada fallback kalau raw-patch gagal"
            exit 1
          }
          echo "OK: penjaga 4.14 built-in lolos (nama syscall telanjang, fallback <5.8, 4 callsite, kprobe)"

          echo "FGP_SHA=$(git -C fgp-src rev-parse --short=9 HEAD)" >> "$GITHUB_ENV"
          rm -rf fgp-src
          echo "Integrasi fgetpriority: SUKSES (built-in)"

      - name: Pastikan tidak ada residu Re:Kernel & Baseband-guard
        working-directory: kernel
        run: |
          # Revisi ke-11: kedua add-on ini dicabut permanen. Step ini yang
          # menjamin "tidak ada residu": apa pun sisa yang masih menempel di
          # pohon source - dari repo dasar rosemary-13, dari script integrasi
          # lain, atau dari cache runner - dibersihkan di sini, lalu hasilnya
          # di-assert. Kalau suatu saat ada yang menyusupkannya kembali, build
          # berhenti di titik ini dengan pesan jelas, bukan diam-diam ikut
          # ter-compile.
          echo "==================== Pembersihan residu ===================="

          # ---------- Re:Kernel ----------
          if [ -e drivers/rekernel ]; then
            echo "[bersih] menghapus drivers/rekernel/"
            rm -rf drivers/rekernel
          fi
          for f in drivers/Makefile drivers/Kconfig; do
            if grep -q 'rekernel' "$f"; then
              echo "[bersih] membuang entri rekernel dari $f:"
              grep -n 'rekernel' "$f"
              sed -i '/rekernel/d' "$f"
            fi
          done
          # Hook Re:Kernel disisipkan ke TENGAH fungsi binder/signal. Menghapusnya
          # dengan sed berarti menyunting jalur panas secara buta - lebih berbahaya
          # daripada gagal. Jadi di sini cuma dideteksi, tidak dibersihkan.
          for f in drivers/android/binder.c drivers/android/binder_alloc.c kernel/signal.c; do
            if grep -q 'rekernel' "$f"; then
              echo "ERROR: $f masih mengandung hook Re:Kernel:"
              grep -n 'rekernel' "$f"
              echo "Hook ini berada di tengah fungsi dan TIDAK dibersihkan otomatis."
              echo "Perbaiki sumber yang menyisipkannya, lalu jalankan ulang."
              exit 1
            fi
          done

          # ---------- Baseband-guard ----------
          for p in security/baseband-guard security/baseband_guard \
                   security/selinux/include/bbg_tracing.h Baseband-guard; do
            if [ -e "$p" ] || [ -L "$p" ]; then
              echo "[bersih] menghapus $p"
              rm -rf "$p"
            fi
          done
          for f in security/Makefile security/Kconfig; do
            if grep -qE 'baseband.guard|bbg_tracing' "$f"; then
              echo "[bersih] membereskan $f:"
              grep -nE 'baseband.guard|bbg_tracing' "$f"
              # Baris entri (obj-.. / source ..) dibuang seluruhnya, sedangkan
              # daftar `default "...,baseband_guard"` di config LSM cukup dicabut
              # token-nya supaya selinux dkk tetap terdaftar.
              sed -i -E '/^[[:space:]]*(obj-|source)/{ /baseband.guard/d }' "$f"
              sed -i -E 's/,baseband_guard//g; s/baseband_guard,//g' "$f"
              sed -i -E '/bbg_tracing/d' "$f"
            fi
          done

          echo ""
          echo "==================== Assert bersih ===================="
          RESIDU=0
          for p in drivers/rekernel security/baseband-guard security/baseband_guard \
                   security/selinux/include/bbg_tracing.h Baseband-guard; do
            if [ -e "$p" ] || [ -L "$p" ]; then
              echo "ERROR: $p masih ada"
              RESIDU=1
            fi
          done
          for f in drivers/Makefile drivers/Kconfig drivers/android/binder.c \
                   drivers/android/binder_alloc.c kernel/signal.c; do
            if grep -q 'rekernel' "$f"; then
              echo "ERROR: sisa 'rekernel' di $f:"
              grep -n 'rekernel' "$f"
              RESIDU=1
            fi
          done
          for f in security/Makefile security/Kconfig; do
            if grep -qE 'baseband.guard|bbg_tracing' "$f"; then
              echo "ERROR: sisa baseband-guard di $f:"
              grep -nE 'baseband.guard|bbg_tracing' "$f"
              RESIDU=1
            fi
          done
          if [ "$RESIDU" != "0" ]; then
            echo "Residu add-on yang sudah dicabut masih ada - build dihentikan."
            exit 1
          fi
          echo "OK: tidak ada residu Re:Kernel maupun Baseband-guard di pohon source."

      # Revisi ke-118: kembali ke cara workflow Agustus 2026 (permintaan
      # pemilik). Diletakkan SESUDAH semua integrasi, supaya setup.sh xxKSU dan
      # NoMount membaca Makefile yang sama dengan build-build terbukti boot.
      - name: Samakan SUBLEVEL dengan versi stok (4.14.186)
        working-directory: kernel
        run: |
          set -euo pipefail

          # fsck.f2fs vendor Xiaomi dan vermagic modul stok mengharapkan
          # "4.14.186-perf". Angka SUBLEVEL diubah di Makefile; sufiks "-perf"
          # dari CONFIG_LOCALVERSION di step defconfig.
          N=$(grep -c '^SUBLEVEL = ' Makefile || true)
          test "$N" = "1" || { echo "ERROR: baris 'SUBLEVEL = ' ketemu $N kali di Makefile (wajib 1)"; exit 1; }
          ASLI=$(sed -n 's/^SUBLEVEL = //p' Makefile)
          printf '%s' "$ASLI" | grep -qE '^[0-9]+$' || { echo "ERROR: SUBLEVEL asli bukan angka: '$ASLI'"; exit 1; }

          # Mengubah SUBLEVEL hanya aman kalau tidak ada cabang kode yang ikut
          # bergeser. Pohon ini menulis LINUX_VERSION_CODE dengan sublevel
          # TETAP 255, jadi angka di Makefile cuma masuk ke string versi.
          if grep -qF '0$(PATCHLEVEL) \* 256 + 255)' Makefile; then
            echo "OK: LINUX_VERSION_CODE memakai sublevel tetap 255 - tidak bergantung SUBLEVEL"
          else
            echo "CATATAN: Makefile tidak lagi mengunci sublevel 255 di LINUX_VERSION_CODE;"
            echo "         memeriksa seluruh pohon untuk KERNEL_VERSION(4, 14, >186)..."
            TABRAK=$(grep -rIEn --include='*.c' --include='*.h' --exclude-dir=.git \
                       'KERNEL_VERSION *\( *4 *, *14 *, *(18[7-9]|19[0-9]|[2-9][0-9][0-9]) *\)' . || true)
            if [ -n "$TABRAK" ]; then
              echo "ERROR: ada cabang versi di antara 4.14.187 dan 4.14.$ASLI - SUBLEVEL 186 akan memilih cabang yang salah:"
              printf '%s\n' "$TABRAK" | head -40
              exit 1
            fi
            echo "OK: tidak ada KERNEL_VERSION(4, 14, >186) di pohon"
          fi

          sed -i 's/^SUBLEVEL = .*/SUBLEVEL = 186/' Makefile
          grep -qx 'SUBLEVEL = 186' Makefile || { echo "ERROR: SUBLEVEL gagal diubah"; exit 1; }
          echo "SUBLEVEL: $ASLI -> 186"

      - name: Pra-compile - perbaikan build source MTK (verified reusable)
        working-directory: kernel
        run: |
          grep -rlZ --include=Makefile --include=Kbuild --include='*.mk' --exclude-dir=.git \
            -e '-Werror' . 2>/dev/null \
            | xargs -0 -r sed -i -E -e 's/-Werror=[A-Za-z0-9_-]+//g' -e 's/(-Werror)([[:space:]]|$)/\2/g' || true
          # WAJIB dibatasi ke *.c/*.h dan exclude .git: tanpa itu grep -rl juga
          # mencocokkan objek pack biner di .git dan sed akan merusaknya.
          grep -rlZ --include='*.c' --include='*.h' --exclude-dir=.git --exclude-dir=patch_rejects \
            'no_sanitize(' . 2>/dev/null \
            | xargs -0 -r sed -i -E 's/__attribute__\(\(no_sanitize\("[^"]*"\)\)\)//g' || true
          sed -i 's/inline void ksm_flock(/void ksm_flock(/' include/linux/keyslot-manager.h block/keyslot-manager.c || true
          sed -i 's/^inline void blk_crypto_flock(/void blk_crypto_flock(/' include/linux/blk-crypto.h block/blk-crypto.c || true
          sed -i 's/inline int typec_pd_start_entry(/int typec_pd_start_entry(/' drivers/misc/mediatek/typec/tcpc/inc/tcpci_typec.h drivers/misc/mediatek/typec/tcpc/tcpci_typec.c || true
          find drivers/input/touchscreen -name focaltech_config.h -printf '%h\n' 2>/dev/null | while read d; do
            mkdir -p "$d/include/firmware"
            printf '0x00\n' > "$d/include/firmware/fw_sample.i"
            echo "stub firmware -> $d/include/firmware/fw_sample.i"
          done
          grep -rl 'bq2597x_charger.o' --include=Makefile . 2>/dev/null | while read mk; do
            echo 'CFLAGS_REMOVE_bq2597x_charger.o += -mgeneral-regs-only' >> "$mk"
            echo "CFLAGS_REMOVE ditambah ke: $mk"
          done
          echo '== cek sisa =='
          # Revisi ke-17: grep ini dulu TIDAK memakai --exclude-dir, padahal sed
          # di atasnya memakai. Akibatnya hitungan 'tersisa' ikut mencacah file
          # di patch_rejects/ (dan blob di .git/) yang memang sengaja tidak
          # disunting - angkanya jadi > 0 dan menyesatkan pembaca log, seolah
          # pembersihan gagal. Sekarang cakupannya disamakan dengan sed-nya.
          # Revisi ke-23: dulu yang dicetak cuma cacahnya, sehingga "tersisa: 1"
          # tidak bisa diverifikasi pembaca log. Sisa itu selalu
          # include/linux/compiler-clang.h: di sana __no_sanitize_address ditulis
          # DUA BARIS dengan DUA argumen - __attribute__((no_sanitize("address",
          # "hwaddress"))) - sedangkan sed di atas satu baris satu string, jadi
          # tidak mungkin cocok. Aman: itu definisi makro, bukan pemakaian, dan
          # KASAN mati. Catatan: `#define __nocfi __attribute__((no_sanitize("cfi")))`
          # di file yang sama JUSTRU kena sed dan dikosongkan - tidak apa-apa
          # selama CONFIG_CFI_CLANG tidak dipakai (memang tidak ada di
          # rosemary_defconfig). Kalau CFI suatu saat dinyalakan, persempit dulu
          # sed-nya supaya tidak ikut menghapus definisi __nocfi.
          echo '== sisa no_sanitize( (diharapkan hanya include/linux/compiler-clang.h) =='
          grep -rl 'no_sanitize(' --include='*.h' --include='*.c' --exclude-dir=.git --exclude-dir=patch_rejects . 2>/dev/null | sed 's/^/  /'
          echo -n 'no_sanitize( tersisa: '; grep -rl 'no_sanitize(' --include='*.h' --include='*.c' --exclude-dir=.git --exclude-dir=patch_rejects . 2>/dev/null | wc -l

      - name: Setelan memori - swappiness 100 (bisa diubah) + zram lz4 + batas memcg
        working-directory: kernel
        run: |
          # Revisi ke-62 (2026-09-27). Empat penggantian kecil di source
          # rosemary-13, tidak ada yang menyentuh Kconfig:
          #
          # 1. mm/vmscan.c: vm_swappiness 190 -> 100. Commit 3e5265967b6c
          #    ("sysctl: Lock vm_swappiness to 190") memberi get_scan_count()
          #    anon_prio 190 : file_prio 10, jadi reclaim hampir selalu menukar
          #    ke zram dan kswapd terus kompres/dekompres - boros baterai.
          #    100 = anon dan page cache berbobot sama.
          #    Harus lewat default kernel, bukan skrip userspace: memcg v1
          #    (MEMCG dipilih ANDROID_DEFAULT_SETTING) menyalin swappiness
          #    induknya waktu memcg dibuat (mem_cgroup_css_alloc), dan
          #    /dev/memcg/apps + /dev/memcg/system dibuat init.rc saat boot.
          #    Menulis /proc/sys/vm/swappiness sesudah boot cuma mengubah memcg
          #    root; kedua anak itu tetap membawa nilai saat boot.
          # 2. kernel/sysctl.c: /proc/sys/vm/swappiness 0444 -> 0644 (dikunci
          #    oleh commit yang sama). Rentang tetap 0..200 (&two_hundred).
          # 3. mm/memcontrol.c: mem_cgroup_swappiness_write() membungkus cek
          #    `val > 100` dengan `#if 0` (supaya task_profiles Android boleh
          #    menulis 150) tanpa batas pengganti. Nilai apa pun masuk, dan
          #    memory.swappiness milik memcg root langsung menimpa
          #    vm_swappiness - menembus kunci 0444 tadi. Di atas 200,
          #    file_prio = 200 - swappiness terbungkus jadi unsigned raksasa di
          #    get_scan_count(); ap/fp meluap dan `ap + fp + 1` bisa jadi 0,
          #    lalu div64_u64 membagi dengan nol. Batasnya kini 200, sama
          #    dengan sysctl; 150 dari task_profiles tetap lolos.
          # 4. drivers/block/zram/zram_drv.c: default_compressor "zstd" ->
          #    "lz4". CRYPTO_LZ4 ikut ter-build lewat `select CRYPTO_LZ4` di
          #    Kconfig ZRAM (di-assert di step Compile). lz4 jauh lebih ringan
          #    di CPU saat kompres dan dekompres; rasionya lebih kecil, tapi
          #    RAM rosemary 6/8 GB. Kalau ROM menulis
          #    /sys/block/zram0/comp_algorithm sendiri, nilai ROM yang menang.
          # page-cluster tidak disentuh: mm/swap.c pohon ini sudah 0.
          #
          # Tiap penggantian harus mengenai TEPAT satu tempat. Kalau source
          # sudah berisi nilai tujuan, dilewati; kalau anchor hilang atau
          # ganda, step gagal - artinya KERNEL_PIN bergeser, audit ulang.
          python3 - <<'PY'
          import sys

          def ganti(path, lama, baru, label):
              with open(path, encoding="utf-8", newline="") as f:
                  s = f.read()
              n_lama, n_baru = s.count(lama), s.count(baru)
              if n_lama == 0 and n_baru == 1:
                  print(f"[=] {label}: sudah terpasang")
                  return
              if n_lama != 1 or n_baru != 0:
                  sys.exit(f"ERROR: {label}: anchor di {path} cocok {n_lama}x "
                           f"(nilai tujuan {n_baru}x), harus tepat 1x")
              with open(path, "w", encoding="utf-8", newline="") as f:
                  f.write(s.replace(lama, baru))
              print(f"[+] {label}")

          ganti("mm/vmscan.c",
                "int vm_swappiness = 190;\n",
                "int vm_swappiness = 100;\n",
                "vm_swappiness default 190 -> 100")

          blok = ('\t\t.procname\t= "swappiness",\n'
                  '\t\t.data\t\t= &vm_swappiness,\n'
                  '\t\t.maxlen\t\t= sizeof(vm_swappiness),\n'
                  '\t\t.mode\t\t= %s,\n'
                  '\t\t.proc_handler\t= proc_dointvec_minmax,\n'
                  '\t\t.extra1\t\t= &zero,\n'
                  '\t\t.extra2\t\t= &two_hundred,\n')
          ganti("kernel/sysctl.c", blok % "0444", blok % "0644",
                "/proc/sys/vm/swappiness 0444 -> 0644")

          ganti("mm/memcontrol.c",
                "#if 0\n\tif (val > 100)\n\t\treturn -EINVAL;\n#endif\n",
                "\tif (val > 200)\n\t\treturn -EINVAL;\n",
                "memory.swappiness dibatasi 0..200")

          ganti("drivers/block/zram/zram_drv.c",
                'static const char *default_compressor = "zstd";\n',
                'static const char *default_compressor = "lz4";\n',
                "zram default_compressor zstd -> lz4")
          PY

      - name: Tambal CVE-2026-43499 (rtmutex remove_waiter, upstream 3bfdc63936dd + 40a25d59e85b)
        working-directory: kernel
        run: |
          # Revisi ke-100 (2026-10-29, permintaan pemilik): CVE-2026-43499
          # "GhostLock", CVSS 7.8, use-after-free di rtmutex yang dipakai futex
          # PI. remove_waiter() juga dipanggil rt_mutex_start_proxy_lock() dari
          # futex_requeue() (FUTEX_CMP_REQUEUE_PI) untuk task LAIN, tapi tetap
          # memakai `current`: dequeue tanpa pi_lock milik waiter, pi_blocked_on
          # task waiter tidak dikosongkan (pointer menggantung = UAF, exploit
          # root publik ada), dan rantai PI disesuaikan untuk task yang salah.
          # Bug ada sejak 2.6.39, jadi 4.14 kita kena; 4.14 sudah EOL sehingga
          # tidak ada backport stable. Diporting manual:
          #   - torvalds 3bfdc63936dd "rtmutex: Use waiter::task instead of
          #     current in remove_waiter()" (perbaikan inti).
          #   - torvalds 40a25d59e85b "locking/rtmutex: Skip remove_waiter()
          #     when waiter is not enqueued" (Fixes: 3bfdc63936dd). Tanpa ini
          #     perbaikan inti justru membuat NULL deref: saat deadlock langsung
          #     (pemilik lock = task) task_blocks_on_rt_mutex() keluar -EDEADLK
          #     sebelum mengisi waiter->task, dan rt_waiter futex diinisialisasi
          #     task = NULL. Sekalian remove_waiter() hanya untuk ret < 0, bukan
          #     ret == 1 (lock langsung didapat, waiter tidak pernah antre).
          # SENGAJA TIDAK dipakai: torvalds 74e144274af3 (cek self-deadlock di
          # futex_requeue) - di-revert upstream 39def6d250d3 karena membocorkan
          # pi_state; kasusnya sudah tertutup oleh 40a25d59e85b.
          # Beda dengan upstream: scoped_guard() belum ada di 4.14, jadi tetap
          # raw_spin_lock/raw_spin_unlock biasa (urutan kunci sama: wait_lock
          # lalu pi_lock milik task waiter, seperti task_blocks_on_rt_mutex()).
          # Idempoten; anchor yang berubah menghentikan build dengan pesan jelas.
          cat > /tmp/fix_cve_2026_43499.py <<'FIX_CVE_2026_43499_PY'
          #!/usr/bin/env python3
          """
          Port CVE-2026-43499 ke kernel/locking/rtmutex.c 4.14:
          torvalds 3bfdc63936dd + 40a25d59e85b (tanpa 74e144274af3, sudah di-revert).
          """
          import sys

          PATH = 'kernel/locking/rtmutex.c'

          def die(msg):
              sys.exit('cve-2026-43499: ' + msg)

          def fungsi(s, kepala):
              """Kembalikan (awal, akhir) badan fungsi dari kepala sampai '\n}\n'."""
              if s.count(kepala) != 1:
                  die("kepala '%s' ketemu %d kali (harus 1)" % (kepala, s.count(kepala)))
              a = s.index(kepala)
              b = s.index('\n}\n', a) + 3
              return a, b

          def ganti(teks, lama, baru, label):
              c = teks.count(lama)
              if c != 1:
                  die("anchor '%s' ketemu %d kali (harus 1)" % (label, c))
              return teks.replace(lama, baru)

          with open(PATH, encoding='utf-8', errors='surrogateescape') as f:
              s = f.read()

          # ---- 1) remove_waiter(): waiter->task, bukan current (3bfdc63936dd)
          #         + lewati waiter yang tidak pernah antre (40a25d59e85b)
          a, b = fungsi(s, 'static void remove_waiter(struct rt_mutex *lock,')
          rw = s[a:b]
          if 'waiter_task' in rw:
              print('remove_waiter: sudah memakai waiter->task, dilewati')
          else:
              rw = ganti(rw,
                         '\tstruct task_struct *owner = rt_mutex_owner(lock);\n',
                         '\tstruct task_struct *owner = rt_mutex_owner(lock);\n'
                         '\tstruct task_struct *waiter_task = waiter->task;\n',
                         'deklarasi owner')
              rw = ganti(rw,
                         '\traw_spin_lock(&current->pi_lock);\n'
                         '\trt_mutex_dequeue(lock, waiter);\n'
                         '\tcurrent->pi_blocked_on = NULL;\n'
                         '\traw_spin_unlock(&current->pi_lock);\n',
                         '\tif (!waiter_task) /* never enqueued */\n'
                         '\t\treturn;\n'
                         '\n'
                         '\traw_spin_lock(&waiter_task->pi_lock);\n'
                         '\trt_mutex_dequeue(lock, waiter);\n'
                         '\twaiter_task->pi_blocked_on = NULL;\n'
                         '\traw_spin_unlock(&waiter_task->pi_lock);\n',
                         'dequeue memakai current')
              rw = ganti(rw,
                         'next_lock, NULL, current);\n',
                         'next_lock, NULL, waiter_task);\n',
                         'rt_mutex_adjust_prio_chain(..., current)')
              if 'current' in rw:
                  die('remove_waiter masih menyebut current sesudah ditambal')
              s = s[:a] + rw + s[b:]
              s = ganti(s,
                        ' * have just failed to try_to_take_rt_mutex().\n'
                        ' */\n'
                        'static void remove_waiter(',
                        ' * have just failed to try_to_take_rt_mutex().\n'
                        ' *\n'
                        ' * When invoked from rt_mutex_start_proxy_lock() waiter::task != current !\n'
                        ' */\n'
                        'static void remove_waiter(',
                        'komentar remove_waiter')
              print('remove_waiter: memakai waiter->task + guard waiter belum antre')

          # ---- 2) rt_mutex_start_proxy_lock(): remove_waiter hanya untuk ret < 0
          a, b = fungsi(s, 'int rt_mutex_start_proxy_lock(struct rt_mutex *lock,')
          sp = s[a:b]
          if 'if (unlikely(ret < 0))\n\t\tremove_waiter(lock, waiter);' in sp:
              print('rt_mutex_start_proxy_lock: sudah ret < 0, dilewati')
          else:
              sp = ganti(sp,
                         '\tif (unlikely(ret))\n\t\tremove_waiter(lock, waiter);\n',
                         '\tif (unlikely(ret < 0))\n\t\tremove_waiter(lock, waiter);\n',
                         'if (unlikely(ret)) remove_waiter')
              s = s[:a] + sp + s[b:]
              print('rt_mutex_start_proxy_lock: remove_waiter hanya untuk ret < 0')

          with open(PATH, 'w', encoding='utf-8', errors='surrogateescape') as f:
              f.write(s)
          print('cve-2026-43499: selesai')
          FIX_CVE_2026_43499_PY
          python3 /tmp/fix_cve_2026_43499.py

          echo ""
          echo "== Ringkasan CVE-2026-43499 =="
          grep -n 'waiter_task\|ret < 0))' kernel/locking/rtmutex.c || true

      - name: Tambal WARN flush_work di blk-core (upstream 2e3c18d0ada1)
        working-directory: kernel
        run: |
          # Revisi ke-104 (2026-10-31, permintaan pemilik): tiap boot apexd
          # menghapus dm device APEX yang tak terpakai -> dm_destroy ->
          # blk_cleanup_queue -> blk_sync_queue -> cancel_work_sync(&q->timeout_work)
          # -> 28 baris "WARNING kernel/workqueue.c:2929 flush_work". Pohon kernel
          # ini membawa backport torvalds 4d43d395fed1 ("workqueue: Try to catch
          # flush_work() without INIT_WORK()", WARN_ON(!work->func)), tapi tidak
          # membawa pasangannya di block: blk_alloc_queue_node() masih
          # INIT_WORK(&q->timeout_work, NULL), dan queue bio-based (dm) tidak pernah
          # mengisinya ulang. Diporting manual torvalds 2e3c18d0ada1 "block: pass
          # no-op callback to INIT_WORK()". Beda dari upstream: nama fungsi no-op
          # blk_timeout_work_noop, karena di 4.14 blk_timeout_work adalah handler
          # timeout legacy asli (block/blk.h) yang dipasang ulang oleh
          # blk_init_allocated_queue(); blk-mq memasang blk_mq_timeout_work sendiri.
          # Untuk queue bio-based timeout_work tidak pernah dijadwalkan, jadi
          # perilaku tetap sama, hanya WARN yang hilang.
          # Idempoten; anchor yang berubah menghentikan build dengan pesan jelas.
          cat > /tmp/fix_blk_timeout_work.py <<'FIX_BLK_TIMEOUT_WORK_PY'
          #!/usr/bin/env python3
          """
          Port torvalds 2e3c18d0ada1 "block: pass no-op callback to INIT_WORK()" ke
          block/blk-core.c 4.14: q->timeout_work tidak lagi di-INIT_WORK(..., NULL).
          """
          import sys

          PATH = 'block/blk-core.c'
          NOOP = 'blk_timeout_work_noop'

          def die(msg):
              sys.exit('blk-timeout-work: ' + msg)

          def ganti(teks, lama, baru, label):
              c = teks.count(lama)
              if c != 1:
                  die("anchor '%s' ketemu %d kali (harus 1)" % (label, c))
              return teks.replace(lama, baru)

          with open(PATH, encoding='utf-8', errors='surrogateescape', newline='') as f:
              s = f.read()

          if NOOP in s:
              print(PATH + ': sudah ditambal, dilewati')
          elif 'INIT_WORK(&q->timeout_work, NULL);' not in s:
              print(PATH + ': timeout_work tidak lagi di-INIT_WORK NULL (upstream), dilewati')
          else:
              # nama sendiri: blk_timeout_work di 4.14 adalah handler timeout legacy
              # asli (block/blk.h), dipasang ulang oleh blk_init_allocated_queue()
              s = ganti(s,
                        'struct request_queue *blk_alloc_queue_node(',
                        '/*\n'
                        ' * Bio-based queues never run timeout_work, but blk_sync_queue() still\n'
                        ' * cancels it; give it a valid callback so flush_work() does not WARN.\n'
                        ' * Request-based and blk-mq queues re-initialize it with their handler.\n'
                        ' */\n'
                        'static void ' + NOOP + '(struct work_struct *work)\n'
                        '{\n'
                        '}\n'
                        '\n'
                        'struct request_queue *blk_alloc_queue_node(',
                        'blk_alloc_queue_node(')
              s = ganti(s,
                        '\tINIT_WORK(&q->timeout_work, NULL);\n',
                        '\tINIT_WORK(&q->timeout_work, ' + NOOP + ');\n',
                        'INIT_WORK(&q->timeout_work, NULL)')
              with open(PATH, 'w', encoding='utf-8', errors='surrogateescape', newline='') as f:
                  f.write(s)
              print(PATH + ': timeout_work memakai callback no-op (2e3c18d0ada1)')
          FIX_BLK_TIMEOUT_WORK_PY
          python3 /tmp/fix_blk_timeout_work.py

          echo ""
          echo "== Ringkasan timeout_work blk-core =="
          grep -n 'INIT_WORK(&q->timeout_work' block/blk-core.c || true

      - name: Aktifkan xxKSU di defconfig (hook tabel syscall, tanpa SUSFS)
        working-directory: kernel
        run: |
          DEF=arch/arm64/configs/rosemary_defconfig

          # ----- AUDIT STRUKTUR (revisi ke-118, 2026-11-16) -----
          # Dibaca dari KernelSU/kernel/Kconfig pin xxKSU c16b935d0:
          #
          # 1. KSU tristate, default y, depends on SECURITY_SELINUX, select
          #    SECCOMP. Ditulis eksplisit =y supaya tidak pernah jadi modul.
          # 2. KSU_TAMPER_SYSCALL_TABLE bool, default n, depends on ARM/ARM64.
          #    Inilah cara hook build ini (panduan xxKSU untuk 3.0 - 4.14).
          #    KSU_HACK_ARM64_BRANCH_LINK "depends on !KSU_TAMPER_SYSCALL_TABLE"
          #    dan default n untuk KSU=y, jadi keduanya tidak bisa menyala
          #    bersamaan; step Compile tetap meng-assert-nya.
          # 3. KSU_LSM_SECURITY_HOOKS default y - setuid, rename (pelacak
          #    paket), bprm, file_permission lewat LSM. Tidak ditulis di sini;
          #    di-assert di step Compile.
          # 4. Semua opsi lain dibiarkan default upstream (KSU_HOSTSREDIRECT n,
          #    KSU_DISABLE_32BIT_HOOKS n - rosemary menjalankan app 32-bit,
          #    jadi compat_sys_call_table HARUS ikut di-hook).
          #
          # DEBUG_KERNEL, KALLSYMS, KALLSYMS_ALL dulu datang dari fragmen
          # dlagia ksu-susfs_defconfig (SCRIPTS_PIN, dicabut revisi ini).
          # Ketiganya ditulis langsung supaya .config di luar KSU sama dengan
          # titik AD.
          if grep -nE '^(# )?CONFIG_KSU' "$DEF"; then
            echo "ERROR: $DEF sudah berisi baris CONFIG_KSU sebelum step ini."
            exit 1
          fi
          {
            echo ""
            echo "CONFIG_DEBUG_KERNEL=y"
            echo "CONFIG_KALLSYMS=y"
            echo "CONFIG_KALLSYMS_ALL=y"
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_TAMPER_SYSCALL_TABLE=y"
          } >> "$DEF"
          echo "[defconfig] xxKSU: CONFIG_KSU=y + CONFIG_KSU_TAMPER_SYSCALL_TABLE=y (plus DEBUG_KERNEL/KALLSYMS/KALLSYMS_ALL)"

          {
            echo ""
            echo 'CONFIG_LOCALVERSION="-perf"'
            echo "CONFIG_LOCALVERSION_AUTO=n"
            echo ""
          } >> "$DEF"

          # NoMount selalu ikut (revisi ke-11), jadi config-nya tidak kondisional.
          {
            echo ""
            echo "CONFIG_NOMOUNT=y"
          } >> "$DEF"
          echo "[defconfig] CONFIG_NOMOUNT=y ditambahkan"

          # fgetpriority selalu ikut (revisi ke-120), built-in.
          if grep -qE '^(# )?CONFIG_FGETPRIORITY\b' "$DEF"; then
            echo "ERROR: $DEF sudah berisi CONFIG_FGETPRIORITY sebelum step ini."
            exit 1
          fi
          {
            echo ""
            echo "CONFIG_FGETPRIORITY=y"
          } >> "$DEF"
          echo "[defconfig] CONFIG_FGETPRIORITY=y ditambahkan"

          # ----- BBR + fq (revisi ke-12, 2026-09-11) -----
          # Tidak ada patch source sama sekali di sini: tcp_bbr.c dan sch_fq.c
          # SUDAH ada di pohon rosemary-13 (BBRv1 mainline sejak 4.9), cuma tidak
          # pernah dihidupkan karena rosemary_defconfig tidak menyetel satu pun
          # opsi TCP_CONG/NET_SCH.
          #   CONFIG_TCP_CONG_ADVANCED=y  membuka blok `if TCP_CONG_ADVANCED`
          #                               (net/ipv4/Kconfig 488-744); tanpa ini
          #                               TCP_CONG_BBR tidak pernah terlihat.
          #   CONFIG_TCP_CONG_CUBIC=y     jalan pulang: saat ADVANCED=y, definisi
          #                               wajib cubic (`depends on !TCP_CONG_ADVANCED`)
          #                               tidak berlaku lagi, jadi dipasang eksplisit
          #                               supaya bisa balik lewat sysctl tanpa rebuild.
          #   CONFIG_DEFAULT_BBR=y        -> DEFAULT_TCP_CONG jadi "bbr".
          #   CONFIG_NET_SCHED=y          menghidupkan subsistem qdisc (menuconfig,
          #                               default n) - syarat NET_SCH_FQ.
          #   CONFIG_NET_SCH_FQ=y         pacing untuk BBR. Tanpa fq, BBR cuma
          #                               mengandalkan internal pacing dan manfaatnya
          #                               berkurang.
          #   CONFIG_NET_SCH_DEFAULT=y    GERBANG yang terlewat di rev 12 dan
          #                               bikin build 2026-09-11 gagal: choice
          #                               "Default queuing discipline" dan
          #                               `config DEFAULT_NET_SCH` dibungkus
          #                               `if NET_SCH_DEFAULT`, dan simbol itu
          #                               default n. Tanpa baris ini DEFAULT_FQ
          #                               dibuang diam-diam dan DEFAULT_NET_SCH
          #                               tidak muncul sama sekali di .config.
          #                               HARUS sebelum CONFIG_DEFAULT_FQ=y.
          #   CONFIG_DEFAULT_FQ=y         fq jadi qdisc default dari kernel, jadi
          #                               tidak perlu net.core.default_qdisc=fq
          #                               lewat init.d/Magisk.
          {
            echo ""
            echo "CONFIG_TCP_CONG_ADVANCED=y"
            echo "CONFIG_TCP_CONG_CUBIC=y"
            echo "CONFIG_TCP_CONG_BBR=y"
            echo "CONFIG_DEFAULT_BBR=y"
            echo "CONFIG_NET_SCHED=y"
            echo "CONFIG_NET_SCH_FQ=y"
            echo "CONFIG_NET_SCH_DEFAULT=y"
            echo "CONFIG_DEFAULT_FQ=y"
          } >> "$DEF"
          echo "[defconfig] BBR + fq ditambahkan (ADVANCED/CUBIC/BBR/DEFAULT_BBR/NET_SCHED/NET_SCH_FQ/NET_SCH_DEFAULT/DEFAULT_FQ)"

          # Re:Kernel & Baseband-guard sudah dicabut. Kalau CONFIG-nya nyelip dari
          # rosemary_defconfig, buang di
          # sini: CONFIG yang menunjuk driver tak terintegrasi bikin objeknya tidak
          # pernah ada, dan kegagalannya baru terasa jauh di belakang.
          RESIDU_RE='^(CONFIG_REKERNEL|CONFIG_BBG|CONFIG_BASEBAND_GUARD)\b|^# CONFIG_(REKERNEL|BBG|BASEBAND_GUARD) '
          if grep -qE "$RESIDU_RE" "$DEF"; then
            echo "[defconfig] membuang sisa CONFIG Re:Kernel/Baseband-guard:"
            grep -nE "$RESIDU_RE" "$DEF"
            sed -i -E "/$RESIDU_RE/d" "$DEF"
          else
            echo "[defconfig] OK: tidak ada CONFIG Re:Kernel/Baseband-guard"
          fi
          echo "" >> "$DEF"
          tail -30 "$DEF"

      # Revisi ke-75: setiap `uses:` dipin ke SHA commit, versi rilisnya di
      # komentar ujung baris. Tag major (v6/v7) bisa digeser pemilik repo aksi ke
      # commit mana pun tanpa jejak di repo ini - dan aksi itu jalan dengan token
      # job ini. Deskripsi repo menjanjikan "semua sumber dipin SHA"; sebelum
      # revisi ini aksi GitHub satu-satunya pengecualian. preflight.sh [3/4]
      # membandingkan SHA ini dengan rilis terbaru tiap aksi.
      - name: Cache toolchain proton-clang
        id: tc-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: clang-proton
          # Revisi ke-23: key memuat SHA pin, jadi menaikkan pin otomatis jadi
          # cache miss. Sebelumnya 'proton-clang-master-v1' dan sinkronisasinya
          # diserahkan ke ingatan manusia.
          # Revisi ke-31: SHA itu dulu DIKETIK di sini ('proton-clang-9fb011b1'),
          # padahal sejak revisi ke-26 pin sebenarnya tinggal di pins.env. Jadi
          # tombol "Naikkan pin" bisa menaikkan CLANG_PIN tanpa mengubah key -
          # persis kelas kerusakan yang membuat tabel pin preflight.sh basi di
          # revisi ke-26..28. Sekarang key membaca env yang diisi step "Muat
          # pins.env" (step pertama job ini), jadi tidak ada lagi salinan kedua
          # yang harus diingat. Kalau env-nya kosong, key jadi 'proton-clang-'
          # -> cache miss -> clone ulang, dan assert SHA di step bawah tetap
          # menjaga: gagal ke arah aman.
          key: proton-clang-${{ env.CLANG_PIN }}

      - name: Ambil toolchain proton-clang (dipakai penulis kernel ini di b.sh)
        run: |
          # Cache dipakai kalau utuh; kalau tidak, clone ulang. Jangan pernah
          # lanjut dgn toolchain setengah jadi - error-nya akan menyesatkan.
          if [ -x clang-proton/bin/clang ]; then
            echo "Toolchain dari cache."
          else
            echo "Cache kosong/rusak, clone ulang."
            rm -rf clang-proton
            git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang-proton
          fi
          clang-proton/bin/clang --version | head -2

          # Pin toolchain (revisi ke-12). master kdrag0n/proton-clang tidak berubah
          # sejak 2021, tapi clone-nya `--depth=1 master` - kalau pemiliknya push,
          # compiler ikut berubah diam-diam di run berikutnya.
          # CLANG_PIN dari pins.env (revisi ke-26).
          if [ -d clang-proton/.git ]; then
            CLANG_SHA="$(git -C clang-proton rev-parse HEAD)"
            echo "proton-clang commit: $CLANG_SHA"
            # SELF-HEAL (revisi ke-23): pola yang sama dengan step 04. Clone di
            # atas `--depth=1` tanpa -b, jadi yang terbawa cuma HEAD branch
            # default. Begitu kdrag0n mendorong satu commit (atau me-rebase),
            # commit yang di-pin tidak ada di clone dan assert di bawah mati -
            # padahal isinya masih dilayani GitHub lewat fetch-by-sha. --depth=1
            # aman di sini: tidak ada rev-list --count yang bergantung riwayat.
            if [ "$CLANG_SHA" != "$CLANG_PIN" ]; then
              echo "HEAD bukan pin, menarik commit ter-pin langsung: $CLANG_PIN"
              git -C clang-proton fetch --depth=1 origin "$CLANG_PIN" \
                && git -C clang-proton checkout -q FETCH_HEAD || true
              CLANG_SHA="$(git -C clang-proton rev-parse HEAD)"
              echo "proton-clang commit setelah self-heal: $CLANG_SHA"
            fi
            test "$CLANG_SHA" = "$CLANG_PIN" || {
              echo "ERROR: proton-clang bukan commit yang di-pin, self-heal juga gagal."
              echo "  diharapkan: $CLANG_PIN"
              echo "  aktual    : $CLANG_SHA"
              echo "Berarti commit itu benar-benar tidak dilayani lagi oleh remote."
              echo "Kalau update ini disengaja: cukup ganti CLANG_PIN - key cache"
              echo "sudah memuat SHA pin sejak revisi ke-23, jadi ikut berganti sendiri."
              exit 1
            }
            echo "OK: proton-clang ter-pin di $CLANG_PIN"
          else
            # Revisi ke-31: dulu cuma CATATAN lalu lanjut. Itu satu-satunya jalur
            # di seluruh workflow ini yang memakai compiler TANPA membuktikan
            # SHA-nya - compiler menentukan setiap byte Image.gz-dtb, jadi
            # "tidak bisa diverifikasi" setara dengan tidak di-pin. Clone di atas
            # selalu membuat .git dan tidak ada langkah yang menghapusnya (beda
            # dengan AnyKernel3 yang memang di-rm), jadi kalau .git hilang berarti
            # isi cache-nya memang rusak - dan jawabannya membuangnya, bukan
            # memakainya.
            echo "ERROR: clang-proton dipulihkan dari cache TANPA .git, SHA tidak bisa diverifikasi."
            echo "Isi cache rusak. Buang entry-nya lalu jalankan ulang:"
            echo "  gh cache delete proton-clang-\$CLANG_PIN --repo \$GITHUB_REPOSITORY"
            echo "(atau lewat Actions -> Caches di web). Build berikutnya akan clone ulang."
            exit 1
          fi

      - name: Cache ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ccache
          key: ccache-rosemary-${{ github.run_id }}
          restore-keys: |
            ccache-rosemary-

      - name: Compile kernel
        working-directory: kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang-proton/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER=build
          export KBUILD_BUILD_HOST=kernel
          export KBUILD_BUILD_TIMESTAMP="$(date -u)"

          # ccache mempercepat run berikutnya secara signifikan. Kalau binernya
          # tidak ada, jatuh balik ke clang polos supaya build tetap jalan.
          if command -v ccache >/dev/null 2>&1; then
            export CCACHE_DIR="$HOME/.ccache"
            export CCACHE_MAXSIZE=2G
            export CCACHE_COMPILERCHECK=content
            export CCACHE_NOHASHDIR=true
            ccache -M "$CCACHE_MAXSIZE" >/dev/null
            ccache -z >/dev/null
            CC_CMD="ccache clang"
            echo "ccache aktif."
          else
            CC_CMD="clang"
            echo "ccache tidak tersedia, pakai clang polos."
          fi

          # Revisi ke-55: host tool (fixdep, conf, dtc, ...) WAJIB ditautkan
          # ld sistem. PATH mendahulukan clang-proton/bin, jadi tanpa -B gcc
          # memakai ld binutils 2.36.1 milik proton, yang di 24.04 gagal:
          # "unknown type [0x13] section `.relr.dyn'" (glibc 2.39). fixdep
          # sudah dibangun di pemanggilan defconfig ini, jadi HOSTCC harus ada
          # di sini JUGA, bukan cuma di make utama. Image tetap dibuat clang +
          # binutils aarch64 proton; yang berubah cuma alat bantu di host.
          HOST_TOOLS=(HOSTCC="gcc -B/usr/bin/" HOSTCXX="g++ -B/usr/bin/")
          make O=out "${HOST_TOOLS[@]}" rosemary_defconfig

          echo ""
          echo "==================== RESOLVED xxKSU CONFIG ===================="
          grep -E '^(CONFIG_KSU|CONFIG_KALLSYMS)' out/.config || true
          grep -q '^CONFIG_KSU=y$' out/.config || { echo "ERROR: CONFIG_KSU tidak resolve ke y"; exit 1; }
          grep -q '^CONFIG_KALLSYMS=y$' out/.config || { echo "ERROR: CONFIG_KALLSYMS tidak resolve ke y"; exit 1; }
          grep -q '^CONFIG_KALLSYMS_ALL=y$' out/.config || { echo "ERROR: CONFIG_KALLSYMS_ALL tidak resolve ke y"; exit 1; }
          # Revisi ke-118: satu-satunya jalur hook sucompat/ksud di build ini.
          # Tanpa simbol ini xxKSU terkompilasi tapi su tidak pernah terpasang
          # (tidak ada hook manual di source), dan make tetap keluar 0.
          grep -q '^CONFIG_KSU_TAMPER_SYSCALL_TABLE=y$' out/.config || {
            echo "ERROR: CONFIG_KSU_TAMPER_SYSCALL_TABLE tidak resolve ke y - tidak ada hook syscall sama sekali"
            exit 1
          }
          grep -q '^CONFIG_KSU_LSM_SECURITY_HOOKS=y$' out/.config || {
            echo "ERROR: CONFIG_KSU_LSM_SECURITY_HOOKS tidak resolve ke y - hook setuid/rename/bprm tidak terpasang"
            exit 1
          }
          grep -q '^CONFIG_COMPAT=y$' out/.config || {
            echo "ERROR: CONFIG_COMPAT bukan y - andaian hook compat_sys_call_table (app 32-bit) tidak berlaku"
            exit 1
          }
          for opt in CONFIG_KSU_HACK_ARM64_BRANCH_LINK CONFIG_KSU_DISABLE_32BIT_HOOKS CONFIG_KSU_DEBUG CONFIG_KSU_NOPRINTK; do
            if grep -q "^${opt}=y\$" out/.config; then
              echo "ERROR: ${opt}=y aktif - bukan konfigurasi yang diaudit di revisi ke-118."
              exit 1
            fi
          done
          if grep -nE '^CONFIG_KSU_(SUSFS|MANUAL_HOOK|TRACEPOINT_HOOK)' out/.config; then
            echo "ERROR: simbol BakaSU/SUSFS di atas masih ada di .config - integrasi lama belum bersih."
            exit 1
          fi
          echo "OK: xxKSU =y, hook tabel syscall + LSM, tanpa SUSFS."

          # Revisi ke-118: string versi diperiksa SEBELUM sembilan menit
          # kompilasi. scripts/setlocalversion pohon ini menyusun release dari
          # KERNELVERSION + berkas localversion* + CONFIG_LOCALVERSION, lalu
          # menambah versi scm HANYA kalau CONFIG_LOCALVERSION_AUTO=y. Keempat
          # masukan itu diperiksa satu per satu; hasil akhirnya dibuktikan
          # lagi dari kernel.release dan vmlinux sesudah kompilasi.
          echo ""
          echo "==================== masukan kernelrelease ===================="
          grep -n -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION) =' Makefile
          for baris in 'VERSION = 4' 'PATCHLEVEL = 14' 'SUBLEVEL = 186'; do
            if ! grep -qx "$baris" Makefile; then
              echo "ERROR: Makefile tidak berisi baris '$baris' - step 'Samakan SUBLEVEL' tidak jalan?"
              exit 1
            fi
          done
          if ! grep -qxE 'EXTRAVERSION = ?' Makefile; then
            echo "ERROR: EXTRAVERSION di Makefile tidak kosong - uname akan mendapat sufiks."
            exit 1
          fi
          grep -qx 'CONFIG_LOCALVERSION="-perf"' out/.config || {
            echo "ERROR: CONFIG_LOCALVERSION bukan \"-perf\":"
            grep -n '^CONFIG_LOCALVERSION' out/.config || true
            exit 1
          }
          if grep -q '^CONFIG_LOCALVERSION_AUTO=y$' out/.config; then
            echo "ERROR: CONFIG_LOCALVERSION_AUTO=y - uname akan mendapat sufiks scm."
            exit 1
          fi
          # `ls` keluar bukan-nol begitu SATU pola tidak cocok, jadi yang
          # dinilai keluarannya, bukan kode keluarnya.
          ADA_LV="$(ls -d localversion* out/localversion* 2>/dev/null || true)"
          if [ -n "$ADA_LV" ]; then
            echo "ERROR: ada berkas localversion* yang akan menambah sufiks ke uname:"
            printf '%s\n' "$ADA_LV" | sed 's/^/  /'
            exit 1
          fi
          echo "OK: kernelrelease akan menjadi 4.14.186-perf."

          echo ""
          echo "==================== RESOLVED NoMount CONFIG ===================="
          grep -E '^CONFIG_NOMOUNT' out/.config || true
          grep -q '^CONFIG_NOMOUNT=y$' out/.config || { echo "ERROR: CONFIG_NOMOUNT tidak resolve ke y"; exit 1; }

          echo ""
          echo "==================== RESOLVED fgetpriority CONFIG ===================="
          grep -E '^CONFIG_FGETPRIORITY' out/.config || true
          grep -q '^CONFIG_FGETPRIORITY=y$' out/.config || { echo "ERROR: CONFIG_FGETPRIORITY tidak resolve ke y"; exit 1; }
          echo "OK: CONFIG_FGETPRIORITY=y (objek + simbol dicek sesudah kompilasi)"

          echo ""
          echo "==================== RESOLVED BBR + fq CONFIG ===================="
          # Kconfig bisa diam-diam menjatuhkan opsi kalau dependency-nya tidak
          # terpenuhi (mis. NET_SCH_FQ tanpa NET_SCHED). Karena itu hasil RESOLVE
          # yang diperiksa, bukan isi defconfig.
          grep -E '^(CONFIG_TCP_CONG_ADVANCED|CONFIG_TCP_CONG_BBR|CONFIG_TCP_CONG_CUBIC|CONFIG_DEFAULT_BBR|CONFIG_NET_SCHED|CONFIG_NET_SCH_FQ|CONFIG_NET_SCH_DEFAULT|CONFIG_DEFAULT_FQ|CONFIG_DEFAULT_TCP_CONG|CONFIG_DEFAULT_NET_SCH)=' out/.config || true
          for opt in CONFIG_TCP_CONG_ADVANCED CONFIG_TCP_CONG_BBR CONFIG_NET_SCHED CONFIG_NET_SCH_FQ CONFIG_NET_SCH_DEFAULT; do
            grep -q "^${opt}=y$" out/.config || {
              echo "ERROR: ${opt} tidak resolve ke y - BBR/fq tidak akan ikut terbangun."
              exit 1
            }
          done
          grep -q '^CONFIG_DEFAULT_TCP_CONG="bbr"$' out/.config || {
            echo "ERROR: congestion control default bukan bbr:"
            grep -n '^CONFIG_DEFAULT_TCP_CONG=' out/.config || true
            exit 1
          }
          grep -q '^CONFIG_DEFAULT_NET_SCH="fq"$' out/.config || {
            echo "ERROR: qdisc default bukan fq (BBR tanpa fq kehilangan pacing):"
            grep -n '^CONFIG_DEFAULT_NET_SCH=' out/.config || true
            echo "PETUNJUK: kalau grep di atas kosong, DEFAULT_NET_SCH tidak"
            echo "          didefinisikan - artinya CONFIG_NET_SCH_DEFAULT=n,"
            echo "          karena choice qdisc dibungkus \`if NET_SCH_DEFAULT\`."
            grep -n 'NET_SCH_DEFAULT' out/.config || true
            exit 1
          }
          echo "OK: BBR jadi congestion control default, fq jadi qdisc default."

          # Revisi ke-62: step "Setelan memori" mengganti default kompresor zram
          # ke lz4. Tanpa CRYPTO_LZ4 kernel tetap ter-build dan boot, tapi
          # zcomp_create() menolak "lz4" saat disksize ditulis - zram tidak
          # pernah aktif dan tidak ada error di log CI. Jadi di-assert di sini.
          echo ""
          echo "==================== RESOLVED zram CONFIG ===================="
          grep -E '^(CONFIG_SWAP|CONFIG_ZRAM|CONFIG_ZSMALLOC|CONFIG_CRYPTO_LZ4|CONFIG_MEMCG)=' out/.config || true
          for opt in CONFIG_SWAP CONFIG_ZRAM CONFIG_CRYPTO_LZ4; do
            grep -q "^${opt}=y$" out/.config || {
              echo "ERROR: ${opt} tidak resolve ke y - zram lz4 tidak akan bisa dipakai."
              exit 1
            }
          done
          echo "OK: zram + lz4 ter-build di dalam kernel."

          # Revisi ke-40: nama berkas kernel yang dihasilkan ikut di-assert DI
          # SINI, sedetik sesudah Kconfig resolve - bukan sembilan menit kemudian
          # di step "Tentukan file kernel hasil". Dua simbol, dan hanya SATU dari
          # keduanya yang benar-benar tertulis di defconfig:
          #
          #   CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y  -> ada di rosemary_defconfig
          #   CONFIG_BUILD_ARM64_APPENDED_KERNEL_IMAGE_NAME -> TIDAK ada di mana
          #     pun; nilainya datang dari `default "Image.gz-dtb" if IMG_GZ_DTB`
          #     di arch/arm64/Kconfig, alias dari pilihan IMG_GZ_DTB vs IMG_DTB
          #     yang juga tidak ditulis siapa pun.
          #
          # arch/arm64/Makefile memakai simbol kedua itu apa adanya sebagai
          # target `all:`. Jadi kalau yang pertama hilang, atau pilihan itu
          # bergeser ke IMG_DTB, `make` cuma membangun Image.gz (atau Image-dtb)
          # dan TETAP keluar 0 - tidak ada satu pun baris error. Yang di-pin di
          # sini bukan cuma "dtb ikut" tapi nama berkasnya, karena step pengemas
          # menuntut persis Image.gz-dtb.
          grep -q '^CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y$' out/.config || {
            echo "ERROR: CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE bukan y."
            echo "  Tanpa itu dtb tidak di-append ke image; hasilnya ter-flash"
            echo "  mulus lalu bootloop, dan make tetap keluar 0."
            grep -n 'APPENDED_DTB' out/.config || echo "  (simbolnya tidak ada sama sekali)"
            exit 1
          }
          grep -q '^CONFIG_BUILD_ARM64_APPENDED_KERNEL_IMAGE_NAME="Image.gz-dtb"$' out/.config || {
            echo "ERROR: nama image hasil bukan \"Image.gz-dtb\"."
            grep -n 'APPENDED_KERNEL_IMAGE_NAME' out/.config || echo "  (simbolnya kosong/tidak ada)"
            echo "PETUNJUK: nilainya berasal dari pilihan IMG_GZ_DTB vs IMG_DTB di"
            echo "          arch/arm64/Kconfig, yang tidak ditulis di defconfig mana"
            echo "          pun - jadi kalau source kernel bergeser, default-nya"
            echo "          yang bergeser. Step pengemas menuntut Image.gz-dtb."
            exit 1
          }
          echo "OK: hasil compile akan bernama Image.gz-dtb dengan dtb ter-append."

          # Lapis kedua penjamin "tidak ada residu" (revisi ke-11): apa pun yang
          # lolos dari step pembersihan, ketahuan di sini setelah Kconfig
          # me-resolve seluruh dependency - sebelum satu objek pun di-compile.
          echo ""
          echo "==================== Assert add-on yang dicabut ===================="
          if grep -qE '^CONFIG_(REKERNEL|BBG|BASEBAND_GUARD)=' out/.config; then
            echo "ERROR: config add-on yang sudah dicabut masih aktif di .config:"
            grep -nE '^CONFIG_(REKERNEL|BBG|BASEBAND_GUARD)=' out/.config
            exit 1
          fi
          echo "OK: CONFIG_REKERNEL / CONFIG_BBG / CONFIG_BASEBAND_GUARD tidak ada di .config"

          set -o pipefail
          if ! make -k O=out -j"$(nproc)" \
                ARCH=arm64 \
                CC="$CC_CMD" \
                "${HOST_TOOLS[@]}" \
                AR=llvm-ar \
                NM=llvm-nm \
                OBJCOPY=llvm-objcopy \
                OBJDUMP=llvm-objdump \
                STRIP=llvm-strip \
                CROSS_COMPILE=aarch64-linux-gnu- \
                CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                CONFIG_SECTION_MISMATCH_WARN_ONLY=y \
                KCFLAGS="-Wno-error" 2>&1 | tee /tmp/build.log; then
            echo ""
            echo "==================== BARIS ERROR (kirim ini) ===================="
            grep -niE "error:|fatal error|undefined reference|No such file|multiple definition|recipe for target|Error [0-9]" /tmp/build.log | tail -120 || true
            echo "==================== KONTEKS TIAP KEGAGALAN ===================="
            for L in $(grep -n 'Error 1' /tmp/build.log | head -3 | cut -d: -f1); do
              S=$((L-40)); [ $S -lt 1 ] && S=1
              echo "----- konteks baris $S s/d $L -----"
              sed -n "${S},${L}p" /tmp/build.log
            done
            tail -50 /tmp/build.log
            echo ">>> BUILD GAGAL."
            exit 1
          fi
          ls -la out/arch/arm64/boot/

          # Revisi ke-118: dua bukti dari HASIL build, bukan dari .config.
          # (1) banner versi di vmlinux = versi stok; (2) handler tabel syscall
          # xxKSU benar-benar ikut tertaut (unity build: kalau berkas hook-nya
          # tidak ter-include, simbol ini tidak ada dan su tidak akan jalan).
          REL="$(cat out/include/config/kernel.release 2>/dev/null || true)"
          echo "kernel.release: $REL"
          test "$REL" = "4.14.186-perf" || { echo "ERROR: kernel.release bukan 4.14.186-perf"; exit 1; }
          grep -aq 'Linux version 4.14.186-perf ' out/vmlinux || {
            echo "ERROR: banner 'Linux version 4.14.186-perf' tidak ada di out/vmlinux"
            grep -a -o 'Linux version [^ ]*' out/vmlinux | head -3 || true
            exit 1
          }
          for sym in hook_aarch64_execve hook_aarch64_reboot hook_armeabi_execve; do
            grep -qE "^[0-9a-f]+ [Tt] ${sym}\$" out/System.map || {
              echo "ERROR: simbol $sym tidak ada di System.map - hook tabel syscall xxKSU tidak ikut terbangun"
              grep -c 'ksu' out/System.map || true
              exit 1
            }
          done
          echo "OK: banner 4.14.186-perf + handler tabel syscall xxKSU ada di hasil build."

          # fgetpriority: objek + simbol di vmlinux membuktikan ikut dikompilasi
          # DAN ter-link built-in (bukan cuma CONFIG_FGETPRIORITY=y di .config).
          test -f out/drivers/fgetpriority/main.o || {
            echo "ERROR: out/drivers/fgetpriority/main.o tidak terbentuk - fgetpriority tidak ikut dikompilasi"
            exit 1
          }
          grep -qE '^[0-9a-f]+ [Tt] gphook_find_user$' out/System.map || {
            echo "ERROR: simbol gphook_find_user tidak ada di System.map - fgetpriority tidak ter-link ke vmlinux"
            grep -c 'fgetpriority\|gphook' out/System.map || true
            exit 1
          }
          echo "OK: fgetpriority built-in (main.o + gphook_find_user di vmlinux)."
          command -v ccache >/dev/null 2>&1 && ccache -s | head -8 || true

      - name: Compile nm (NoMount userspace CLI, commit sama dgn kernel)
        run: |
          NM_SRC="kernel/NoMount/userspace/src"
          test -d "$NM_SRC" || { echo "ERROR: $NM_SRC tidak ada - step Integrasikan NoMount gagal?"; exit 1; }

          NOMOUNT_COMMIT=$(git -C kernel/NoMount rev-parse --short HEAD)
          echo "NoMount commit dipakai: $NOMOUNT_COMMIT"

          mkdir -p nm-src
          cp "$NM_SRC/nm.c" "$NM_SRC/nm.h" nm-src/
          # Revisi ke-119: sampai bd5e2d11f nm freestanding (_start lewat
          # inline asm di nm.h, tanpa libc). Sejak 1e800826e ("link nm against
          # musl static") ia program libc biasa ber-main(); upstream menautkannya
          # statis ke musl lewat zig cc, di sini statis ke glibc lintas-arsitektur
          # (libc6-dev-arm64-cross, dipasang eksplisit di step dependency).
          # Bentuknya dibaca
          # dari sumber, jadi pin lama tetap terbangun saat mundur. nm tidak
          # ikut masuk zip flash; HP memakai nm bawaan modul NoMount.
          # Polanya ".global _start", bukan "_start" saja: nm.h baru punya
          # deny_start dan data_start_idx.
          if grep -qF '.global _start' nm-src/nm.h; then
            echo "nm: bentuk freestanding (_start di nm.h)"
            NM_FLAGS="-nostdlib -static -Os -fno-builtin -Wl,-e,_start"
          elif grep -qE '^int main\(' nm-src/nm.c; then
            echo "nm: bentuk libc (main di nm.c), ditautkan statis"
            NM_FLAGS="-static -Os"
          else
            echo "ERROR: nm.c/nm.h tidak punya _start maupun main() - bentuk sumber nm berubah"
            exit 1
          fi
          # NM_FLAGS sengaja tanpa kutip: daftar flag, harus terpecah per kata.
          # shellcheck disable=SC2086
          ( cd nm-src && \
            aarch64-linux-gnu-gcc $NM_FLAGS -o nm nm.c && \
            aarch64-linux-gnu-strip nm )
          file nm-src/nm
          file nm-src/nm | grep -q 'ARM aarch64' || { echo "ERROR: nm bukan biner aarch64"; exit 1; }
          file nm-src/nm | grep -q 'statically linked' || { echo "ERROR: nm tidak tertaut statis - tidak akan jalan di Android"; exit 1; }
          test -s nm-src/nm || { echo "ERROR: nm gagal dikompilasi"; exit 1; }

      - name: Tentukan file kernel hasil
        id: kimg
        run: |
          # Revisi ke-40: loop ini dulu menerima Image.gz-dtb, lalu Image.gz,
          # lalu Image - yang pertama ada menang - dan tidak mengatakan apa pun
          # tentang mana yang menang. rosemary (MT6785) butuh dtb yang DI-APPEND
          # ke dalam image; setiap revisi yang terbukti boot memakai
          # Image.gz-dtb. Kalau CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE hilang
          # dari defconfig, target itu tidak dibangun, `make` tetap keluar 0,
          # dan langkah ini diam-diam mengemas Image.gz TANPA dtb: zip-nya
          # ter-flash mulus lalu bootloop - satu siklus flash terbuang untuk
          # kesalahan yang sudah kelihatan di log CI. Cadangannya tetap dideteksi
          # supaya pesan errornya bisa menyebut apa yang sebenarnya ada, tapi
          # sekarang fatal, bukan diterima diam-diam.
          BOOT="kernel/out/arch/arm64/boot"
          IMG="Image.gz-dtb"
          if [ ! -f "$BOOT/$IMG" ]; then
            echo "ERROR: $BOOT/$IMG tidak ada."
            ADA=""
            for f in Image.gz Image; do
              # `[ -f x ] && VAR=...` sebagai perintah terakhir loop akan
              # MEMBUNUH step ini di bawah `bash -e` pada jalur "tidak ada" -
              # jebakan yang sama seperti di pin-watch.yml. Wajib `if` utuh.
              if [ -f "$BOOT/$f" ]; then ADA="$ADA $f"; fi
            done
            if [ -n "$ADA" ]; then
              echo "  yang ada cuma:$ADA - itu image TANPA dtb ter-append."
              echo "  Mengemasnya menghasilkan zip yang ter-flash mulus lalu bootloop."
              echo "PETUNJUK: periksa CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE di out/.config."
              echo "          Tanpa simbol itu target Image.gz-dtb memang tidak dibangun"
              echo "          dan make tetap keluar 0 - jadi kegagalannya tidak"
              echo "          kelihatan di step Compile, hanya di sini."
              grep -n 'APPENDED_DTB' kernel/out/.config \
                || echo "          (simbolnya tidak ada sama sekali di .config)"
            else
              echo "  tidak ada image sama sekali - step Compile lolos tanpa hasil?"
            fi
            ls -la "$BOOT" || true
            exit 1
          fi
          echo "path=$BOOT/$IMG" >> "$GITHUB_OUTPUT"
          echo "name=$IMG" >> "$GITHUB_OUTPUT"
          echo "OK: $IMG ada, $(stat -c%s "$BOOT/$IMG") byte."
          DTBO="$BOOT/dtbo.img"
          if [ -f "$DTBO" ]; then
            echo "dtbo=$DTBO" >> "$GITHUB_OUTPUT"
            echo "dtbo.img ditemukan: $DTBO"
          fi

      - name: Rakit paket AnyKernel3 (template asli fjrXTR -> vlxlxlv)
        run: |
          # PENTING: branch default repo ini adalah 'ruby', bukan 'master'. Tanpa -b
          # isi paket ikut berubah diam-diam kalau pemilik repo ganti default.
          # mt6781 = SoC rosemary. tools/ak3-core.sh identik di kedua branch.
          # Revisi ke-18: URL dipindah dari fjrXTR/ ke vlxlxlv/ (nama pemilik yang
          # SEKARANG). fjrXTR hanya HTTP 301 alias yang sudah ditinggalkan dan bisa
          # didaftarkan ulang orang lain; jangan menggantungkan clone pada redirect
          # milik nama kosong. SHA-nya sama (a9fe54fa, sudah diverifikasi di
          # vlxlxlv/AnyKernel3@mt6781), assert di bawah tidak berubah.
          git clone --depth=1 -b mt6781 https://github.com/vlxlxlv/AnyKernel3.git AnyKernel3
          echo "AnyKernel3 commit: $(git -C AnyKernel3 rev-parse HEAD)"
          # Pin AnyKernel3 (revisi ke-12, URL diperbaiki di revisi ke-18).
          # Isinya tetap diverifikasi lewat SHA, bukan lewat nama repo.
          # AK3_PIN dari pins.env (revisi ke-26).
          AK3_SHA="$(git -C AnyKernel3 rev-parse HEAD)"
          # SELF-HEAL (revisi ke-23), alasan sama dengan proton-clang & step 04:
          # `clone --depth=1 -b mt6781` cuma membawa HEAD branch, jadi satu commit
          # baru dari vlxlxlv sudah cukup membuat pin tak terjangkau di clone.
          if [ "$AK3_SHA" != "$AK3_PIN" ]; then
            echo "HEAD bukan pin, menarik commit ter-pin langsung: $AK3_PIN"
            git -C AnyKernel3 fetch --depth=1 origin "$AK3_PIN" \
              && git -C AnyKernel3 checkout -q FETCH_HEAD || true
            AK3_SHA="$(git -C AnyKernel3 rev-parse HEAD)"
            echo "AnyKernel3 commit setelah self-heal: $AK3_SHA"
          fi
          test "$AK3_SHA" = "$AK3_PIN" || {
            echo "ERROR: AnyKernel3 mt6781 bukan commit yang di-pin, self-heal juga gagal."
            echo "  diharapkan: $AK3_PIN"
            echo "  aktual    : $AK3_SHA"
            echo "Periksa dulu isi repo sebelum menaikkan pin - anykernel.sh di bawah"
            echo "menimpa template-nya, tapi tools/ak3-core.sh datang dari repo ini."
            exit 1
          }
          echo "OK: AnyKernel3 ter-pin di $AK3_PIN"
          test -f AnyKernel3/tools/ak3-core.sh || { echo "ERROR: tools/ak3-core.sh tidak ada di AnyKernel3"; exit 1; }
          rm -rf AnyKernel3/.git

          cat > AnyKernel3/anykernel.sh <<'ANYKERNEL_SH'
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          ### AnyKernel setup
          # begin properties
          properties() { '
          kernel.string=Kernel rosemary 4.14.186-perf: xxKSU + NoMount + BBR (dlagia/test)
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=fleur
          device.name2=miel
          device.name3=sea
          device.name4=ocean
          device.name5=rosemary
          device.name6=secret
          device.name7=maltose
          supported.versions=11.0-14.0
          supported.patchlevels=
          '; } # end properties

          ### AnyKernel install
          # begin attributes
          attributes() {
          set_perm_recursive 0 0 755 644 $ramdisk/*;
          set_perm_recursive 0 0 750 750 $ramdisk/init* $ramdisk/sbin;
          } # end attributes


          ## boot shell variables
          block=/dev/block/by-name/boot;
          # is_slot_device=auto, BUKAN 1. Keluarga MT6781 (rosemary/fleur/sea/...) adalah
          # device A-only: tidak ada ro.boot.slot_suffix maupun androidboot.slot. Dengan
          # is_slot_device=1, tools/ak3-core.sh (setup_ak) menjalankan:
          #     if [ ! "$slot" -a "$is_slot_device" == 1 ]; then
          #       abort "Unable to determine active slot. Aborting...";
          # sehingga zip GAGAL di-flash sebelum menyentuh partisi boot. Nilai "auto"
          # tetap mendeteksi slot kalau memang ada (device A/B), tapi lanjut normal
          # kalau tidak ada - jadi aman untuk kedua jenis device.
          is_slot_device=auto;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          # import functions/variables and setup patching - see for reference (DO NOT REMOVE)
          . tools/ak3-core.sh && attributes;

          # boot install
          dump_boot; # use split_boot to skip ramdisk unpack, e.g. for devices with init_boot ramdisk
          write_boot; # use flash_boot to skip ramdisk repack, e.g. for devices with init_boot ramdisk
          ## end boot install
          ANYKERNEL_SH

          cp "${{ steps.kimg.outputs.path }}" "AnyKernel3/${{ steps.kimg.outputs.name }}"

          ZIP="rosemary-xxksu-nomount-$(date +%Y%m%d-%H%M%S).zip"

          ( cd AnyKernel3 && zip -r9 "../$ZIP" . -x '.git*' )
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          unzip -l "$ZIP" | head -20

      - name: Ringkasan build
        if: always()
        run: |
          {
            echo "## Build kernel Rosemary"
            echo ""
            echo "### Add-on"
            echo "| Add-on | Status |"
            echo "|---|---|"
            echo "| NoMount        | aktif (selalu ikut) |"
            echo "| fgetpriority   | aktif (built-in, hook getpriority/ioprio) |"
            echo "| BBR + fq       | aktif (congestion control default \`bbr\`, qdisc default \`fq\`) |"
            echo "| Re:Kernel      | dicabut permanen (revisi ke-11) |"
            echo "| Baseband-guard | dicabut permanen (revisi ke-11) |"
            echo "| SUSFS          | dicabut (revisi ke-118: xxKSU tidak mendukung SUSFS) |"
            echo ""
            echo "| Komponen | Commit |"
            echo "|---|---|"
            echo "| Kernel (rosemary-13) | \`${KERNEL_SHA:-?}\` |"
            echo "| xxKSU (di-PIN, KSU_VERSION ${KSU_VER:-?}) | \`${KSU_SHA:-?}\` |"
            echo "| NoMount (di-PIN) | \`${NOMOUNT_SHA:-?}\` |"
            echo "| fgetpriority (di-PIN) | \`${FGP_SHA:-?}\` |"
            echo ""
            # Alasan yang sama dengan blok kembarannya di step "Terbitkan
            # Release", dengan satu tambahan: step ini `if: always()`, jadi
            # untuk build yang GAGAL inilah satu-satunya tempat keenam pin
            # tercatat - rilisnya tidak pernah terbit. Sumbernya tetap
            # /tmp/pins.export, bukan daftar nama baru.
            if [ -s /tmp/pins.export ]; then
              echo "<details><summary>Ketujuh pin yang mengunci build ini</summary>"
              echo ""
              echo '```'
              cat /tmp/pins.export
              echo '```'
              echo ""
              echo "Dikompilasi oleh revisi workflow di commit \`${GITHUB_SHA:-?}\`."
              echo "</details>"
            else
              echo "CATATAN: \`/tmp/pins.export\` kosong - step \"Muat pins.env\" belum sempat jalan."
            fi
            echo ""
            echo "Paket: \`${ZIP:-belum terbentuk}\`"
            echo ""
            echo "### Kalau masih STUCK DI LOGO"
            echo "1. Ambil log crash sebenarnya dari HP (ini yang paling menentukan):"
            echo "   masuk fastboot -> \`fastboot oem console\` **atau** setelah reboot"
            echo "   paksa, boot ke sistem lama/TWRP lalu baca pstore:"
            echo '   ```'
            echo "   adb shell su -c 'cat /sys/fs/pstore/console-ramoops-0' > crash.txt"
            echo "   # (atau /proc/last_kmsg pada sebagian device)"
            echo '   ```'
            echo "   Kirim crash.txt - di situ kelihatan panic/hook yang menabrak."
            echo "2. Tersisa satu add-on: NoMount, dan jalur kodenya (d_revalidate +"
            echo "   iterate_dir) aktif sejak filesystem pertama diakses - jadi itu"
            echo "   tersangka pertama. Untuk mengujinya, hapus sementara step"
            echo "   **Integrasikan NoMount**, baris \`CONFIG_NOMOUNT=y\` di step"
            echo "   defconfig, blok verifikasinya di step compile, dan step"
            echo "   **Compile nm**; lalu build ulang sebagai xxKSU murni."
            echo "   - Boot? berarti NoMount penyebabnya."
            echo "   - Masih stuck? akarnya di xxKSU (hook tabel syscall / LSM)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload paket + kernel mentah + dtbo + nm CLI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rosemary-kernel-build
          if-no-files-found: warn
          # Revisi ke-55: tanpa ini kernel/out/.config (berkas tersembunyi)
          # dilewati diam-diam sejak upload-artifact v4.
          include-hidden-files: true
          path: |
            ${{ env.ZIP }}
            ${{ steps.kimg.outputs.path }}
            ${{ steps.kimg.outputs.dtbo }}
            nm-src/nm
            kernel/out/.config

      # actions/upload-artifact SELALU membungkus ulang isinya, jadi yang terunduh
      # di HP adalah zip-berisi-zip: harus dibongkar dulu baru bisa di-flash, dan
      # hangus begitu masa retensi habis. Release menyimpan zip AnyKernel3-nya apa
      # adanya - sekali unduh langsung flashable, tautannya permanen, dan muncul di
      # halaman depan repo alih-alih terkubur di dalam satu run Actions.
      #
      # SATU HAL YANG TIDAK DIKATAKAN REVISI KE-25 DAN BARU KETAHUAN DI REVISI
      # KE-35: repo ini PRIVAT, dan pada repo privat tautan aset menjawab 404
      # untuk sesi yang belum login - bukan 401, bukan 403 - jadi gejalanya
      # terbaca seperti "file tidak ada" padahal asetnya utuh (rilis
      # build-20260915-153241 diperiksa: state=uploaded, 13.858.435 B, unduhan
      # dari browser yang tidak login = 404). "Tautannya permanen" tetap benar;
      # "sekali unduh langsung flashable" hanya benar kalau sesinya punya akses,
      # dan tidak ada satu kata pun di rilis maupun ringkasan build yang
      # mengatakannya. Karena itu catatan rilis sekarang menyebut tiga jalur
      # unduh yang betul-betul jalan pada repo privat.
      # Hanya jalan untuk build yang sukses; `if: failure()` di step berikutnya
      # yang mengurus jalur gagal.
      - name: Terbitkan Release berisi zip siap-flash
        env:
          GH_TOKEN: ${{ github.token }}
          # WAJIB. Job ini tidak pernah `actions/checkout` - semua sumber
          # di-clone ke subfolder - jadi workspace-nya bukan repo git sama
          # sekali. Tanpa GH_REPO, `gh release create` mencoba menebak repo dari
          # remote git dan mati dengan "fatal: not a git repository" (persis yang
          # terjadi di run 34770523128; build-nya sendiri sukses, hanya step ini
          # yang gagal).
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          test -f "$ZIP" || { echo "ERROR: zip tidak ada: $ZIP"; exit 1; }

          TAG="build-$(date -u +%Y%m%d-%H%M%S)"
          {
            printf 'Build otomatis dari commit `%s`.\n\n' "${GITHUB_SHA:0:9}"
            printf -- '| bagian | commit |\n|---|---|\n'
            printf -- '| kernel | `%s` |\n' "$KERNEL_SHA"
            printf -- '| xxKSU (KSU_VERSION %s) | `%s` |\n' "$KSU_VER" "$KSU_SHA"
            printf -- '| NoMount | `%s` |\n' "$NOMOUNT_SHA"
            printf -- '| fgetpriority | `%s` |\n' "$FGP_SHA"
            # Revisi ke-46: KEDELAPAN pin, bukan tiga. Sejak revisi ke-45c
            # pertanyaan "dua rilis ini isinya sama atau tidak?" dijawab persis
            # dua hal - nilai kedelapan SHA DAN revisi workflow yang
            # mengompilasinya - dan sapuan riwayat 2026-09-21 terpaksa menggali
            # keduanya lewat API justru karena halaman Releases cuma menyebut
            # tiga komponen. Ukuran zip tidak bisa dipakai sebagai gantinya:
            # stempel waktu build ikut masuk ke string versi kernel, jadi dua
            # zip berisi kernel yang sama pun beda beberapa ratus byte.
            # Sumbernya /tmp/pins.export - berkas yang ditulis step "Muat
            # pins.env" di job yang sama, sesudah kedelapan nama diverifikasi
            # ada persis satu. SENGAJA bukan daftar nama baru di sini: daftar
            # itu sudah hidup di enam tempat, dan salinan ketujuh persis cara
            # revisi ke-28 membusuk. Dicetak 40 hex penuh, bukan singkatan -
            # inilah yang disalin orang ke pins.env waktu mundur, dan penjaga
            # bentuk di step "Muat pins.env" menolak SHA pendek (revisi ke-37).
            if [ -s /tmp/pins.export ]; then
              printf -- '\n<details><summary>Ketujuh pin yang mengunci build ini</summary>\n\n'
              printf -- '```\n'
              cat /tmp/pins.export
              printf -- '```\n\n'
              printf -- 'Dikompilasi oleh revisi workflow di commit `%s`.\n' "$GITHUB_SHA"
              printf -- 'Dua rilis berisi kernel yang sama HANYA kalau ketujuh baris di\n'
              printf -- 'atas DAN commit itu sama persis. Ukuran zip tidak menentukan apa pun.\n'
              printf -- '</details>\n'
            else
              printf -- '\n> CATATAN: daftar ketujuh pin tidak terbaca (`/tmp/pins.export`\n'
              printf -- '> kosong) - rilis ini tidak bisa dibandingkan isinya dengan rilis lain\n'
              printf -- '> tanpa membuka log run-nya.\n'
            fi
            printf -- '\n- run: %s/%s/actions/runs/%s\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf -- '- `%s` sudah berformat AnyKernel3: flash langsung lewat\n' "$ZIP"
            printf -- '  recovery/KernelSU, tidak perlu dibongkar dulu.\n'
            printf -- '- Kernel ini memakai **xxKSU** (backslashxx/KernelSU), uname\n'
            printf -- '  `4.14.186-perf`, **tanpa SUSFS**. Manager: APK dari halaman rilis\n'
            printf -- '  backslashxx/KernelSU (versi %s); manager BakaSU tidak dikenali.\n' "$KSU_VER"
          } > /tmp/notes.md

          # --target: tanpa repo git lokal, gh akan menempelkan tag ke HEAD
          # branch default. Kunci ke commit yang benar-benar dibangun.
          gh release create "$TAG" "$ZIP" \
            --title "$TAG" --notes-file /tmp/notes.md --target "$GITHUB_SHA"
          # Id numerik aset baru ada SESUDAH rilisnya terbit, dan id itulah yang
          # dipakai untuk mencetak tautan pra-tandatangan. Jadi catatannya
          # dilengkapi lalu ditambal balik dengan `gh release edit`.
          ASET_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
                       --jq '.assets[0].id' 2>/dev/null || true)"
          # Bentuk, bukan "tidak kosong": `gh api` mencetak badan error-nya ke
          # STDOUT dan exit code-nya hilang di dalam $( ) - pelajaran revisi
          # ke-34 - jadi $ASET_ID bisa saja berisi JSON error.
          printf '%s' "$ASET_ID" | grep -qE '^[0-9]+$' || {
            echo "ERROR: id aset tidak terbaca (jawaban: ${ASET_ID:0:80})"
            exit 1
          }

          # Privat atau publik itu setelan yang bisa diubah kapan saja di luar
          # repo ini - pemiliknya membuat repo ini publik beberapa menit sesudah
          # revisi ke-35 terbit - jadi kalimatnya TIDAK boleh dihafal di sini.
          # Ditanyakan saat run. Kalau jawabannya tidak berbentuk true/false,
          # anggap privat: memberi peringatan yang tidak perlu jauh lebih murah
          # daripada menjanjikan unduhan yang menjawab 404.
          PRIVAT="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .private 2>/dev/null || true)"
          printf '%s' "$PRIVAT" | grep -qE '^(true|false)$' || PRIVAT=true
          echo "visibilitas: private=$PRIVAT"

          if [ "$PRIVAT" = "false" ]; then
            {
              printf -- '\n### Cara unduh\n\n'
              printf -- 'Repo ini publik, jadi tautan aset di atas jalan tanpa login -\n'
              printf -- 'buka langsung dari browser HP. Alternatif di PC:\n\n'
              printf -- '```\n'
              printf -- 'gh release download %s --repo %s --pattern "*.zip"\n' \
                "$TAG" "$GITHUB_REPOSITORY"
              printf -- '```\n'
            } >> /tmp/notes.md
          else
            {
              printf -- '\n### Kalau unduhannya 404\n\n'
              printf -- 'Repo ini privat, jadi tautan aset di atas hanya jalan untuk sesi\n'
              printf -- 'yang sudah login dan punya akses. GitHub menjawab **404**, bukan\n'
              printf -- '401, jadi gejalanya menipu - asetnya utuh. Tiga jalur yang jalan:\n\n'
              printf -- '1. **HP** - buka lewat app GitHub, atau browser yang sudah login\n'
              printf -- '   ke akun pemilik repo.\n'
              printf -- '2. **PC** - `gh release download %s --repo %s --pattern "*.zip"`\n' \
                "$TAG" "$GITHUB_REPOSITORY"
              printf -- '3. **Tautan langsung tanpa login** - pra-tandatangan, umurnya\n'
              printf -- '   pendek, jadi cetak saat mau dipakai dan jangan disimpan:\n'
              printf -- '   ```\n'
              printf -- '   gh api repos/%s/releases/assets/%s \\\n' \
                "$GITHUB_REPOSITORY" "$ASET_ID"
              printf -- '     -H "Accept: application/octet-stream" --include --silent \\\n'
              printf -- '     | grep -i "^location:"\n'
              printf -- '   ```\n'
            } >> /tmp/notes.md
          fi
          gh release edit "$TAG" --notes-file /tmp/notes.md

          URL="$(gh release view "$TAG" --json url --jq .url)"
          {
            echo ""
            echo "### Unduh"
            echo "[$ZIP]($URL) - zip AnyKernel3 siap flash (bukan artifact dobel-zip)."
            echo ""
            if [ "$PRIVAT" = "false" ]; then
              echo "Repo publik: tautan di atas jalan tanpa login."
            else
              echo "Repo ini PRIVAT: tautan di atas menjawab 404 kalau sesinya belum"
              echo "login, dan itu terbaca seperti file hilang. Jalur yang jalan ada"
              echo "di badan rilis, bagian \"Kalau unduhannya 404\"."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Kalau build gagal, step "Compile" hanya mencetak ~120 baris error +
      # 3 potongan konteks ke log Actions. /tmp/build.log yang lengkap ikut
      # hilang bersama runner. Step ini menyimpannya supaya bisa diunduh dan
      # ditelusuri penuh. `if: failure()` -> hanya jalan saat ada step gagal,
      # jadi tidak menambah artifact di build yang sukses.
      - name: Upload log build lengkap (hanya saat gagal)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rosemary-build-log
          if-no-files-found: warn
          retention-days: 7
          path: |
            /tmp/build.log
            kernel/out/.config
            kernel/patch_rejects/
