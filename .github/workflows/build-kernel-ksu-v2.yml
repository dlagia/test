name: Test SUSFS 4.14 compatibility - Rosemary

on:
  workflow_dispatch: {}

jobs:
  test-susfs:
    name: Test SUSFS patch against rosemary-13
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Install dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl git

      - name: Clone kernel source rosemary-13
        run: |
          set -eux
          git clone --depth=1 -b rosemary-13 \
            https://github.com/dlagia/android_kernel_xiaomi_rosemary.git kernel

      - name: Show kernel revision
        working-directory: kernel
        run: |
          set -eu
          echo "================ KERNEL REVISION ================"
          git rev-parse HEAD
          git log -1 --oneline --decorate
          echo
          echo "================ KERNEL VERSION ================"
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION) =' Makefile
          echo
          echo "================ STATUS ================"
          git status --short

      - name: Download SUSFS patch and inline hook script
        run: |
          set -eux
          mkdir -p susfs-test

          curl -fL --retry 3 \
            https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/Patch/susfs_patch_to_4.14.patch \
            -o susfs-test/susfs_patch_to_4.14.patch

          curl -fL --retry 3 \
            https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/susfs_inline_hook_patches.sh \
            -o susfs-test/susfs_inline_hook_patches.sh

          chmod +x susfs-test/susfs_inline_hook_patches.sh

          echo "================ PATCH ================"
          ls -lh susfs-test/susfs_patch_to_4.14.patch
          echo "SHA256:"
          sha256sum susfs-test/susfs_patch_to_4.14.patch

          echo
          echo "================ INLINE SCRIPT ================"
          ls -lh susfs-test/susfs_inline_hook_patches.sh
          echo "SHA256:"
          sha256sum susfs-test/susfs_inline_hook_patches.sh

      - name: TEST 1 - git apply --check
        working-directory: kernel
        run: |
          set -o pipefail
          echo "======================================================"
          echo "TEST 1: SUSFS patch compatibility"
          echo "======================================================"
          git apply --check --verbose ../susfs-test/susfs_patch_to_4.14.patch 2>&1 | tee ../susfs-test/git-apply-check.log

          echo
          echo "======================================================"
          echo "RESULT: git apply --check = PASS"
          echo "======================================================"

      - name: TEST 2 - apply patch and verify whitespace
        working-directory: kernel
        run: |
          set -eux
          echo "======================================================"
          echo "TEST 2: Actual patch application"
          echo "======================================================"

          git apply --verbose ../susfs-test/susfs_patch_to_4.14.patch
          git diff --check

          echo
          echo "================ MODIFIED FILES ================"
          git status --short

          echo
          echo "================ DIFF STAT ================"
          git diff --stat

          echo
          echo "======================================================"
          echo "RESULT: SUSFS patch applied successfully"
          echo "======================================================"

      - name: TEST 3 - inspect inline hook script
        working-directory: kernel
        run: |
          set -eu
          echo "======================================================"
          echo "TEST 3: Inline hook script inspection"
          echo "======================================================"

          SCRIPT="../susfs-test/susfs_inline_hook_patches.sh"

          echo "Shell syntax check..."
          bash -n "$SCRIPT"
          echo "OK: bash -n"

          echo
          echo "Script header:"
          sed -n '1,80p' "$SCRIPT"

          echo
          echo "======================================================"
          echo "IMPORTANT: TEST 3 only checks shell syntax."
          echo "The script is NOT executed automatically here because"
          echo "it may perform additional source modifications beyond"
          echo "the .patch file and should be tested separately."
          echo "======================================================"

      - name: Save test report
        if: always()
        run: |
          set +e
          {
            echo "SUSFS 4.14 compatibility test"
            echo "Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo "Kernel repository: https://github.com/dlagia/android_kernel_xiaomi_rosemary"
            echo "Kernel branch: rosemary-13"
            echo "SUSFS repository: https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd"
            echo
            echo "Kernel HEAD:"
            git -C kernel rev-parse HEAD
            echo
            echo "Kernel commit:"
            git -C kernel log -1 --oneline --decorate
            echo
            echo "Kernel version:"
            grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION) =' kernel/Makefile
            echo
            echo "Patch SHA256:"
            sha256sum susfs-test/susfs_patch_to_4.14.patch
            echo
            echo "Inline script SHA256:"
            sha256sum susfs-test/susfs_inline_hook_patches.sh
            echo
            echo "Final kernel status after patch test:"
            git -C kernel status --short
          } | tee susfs-test/report.txt

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: susfs-4.14-test-report
          if-no-files-found: warn
          path: |
            susfs-test/report.txt
            susfs-test/git-apply-check.log
            susfs-test/susfs_patch_to_4.14.patch
            susfs-test/susfs_inline_hook_patches.sh
